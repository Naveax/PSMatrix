name: production-ga-windows-authority-actions-history-resolver

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/ga-windows-authority-actions-history-resolver.yml"
  workflow_dispatch:

concurrency:
  group: production-ga-windows-authority-actions-history-resolver
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  resolve-history:
    name: Resolve recoverable RC3 protected workflow history
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository && github.actor == 'Naveax')
    runs-on: [self-hosted, Windows, X64, psmatrix-hyperv]
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: Naveax/PSMatrix

    steps:
      - name: Verify trusted runner assignment
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_OS -ne 'Windows' -or $env:RUNNER_NAME -ne 'NAVEAX') {
              throw "Expected trusted NAVEAX Windows runner; got $env:RUNNER_NAME / $env:RUNNER_OS"
          }
          Write-Host 'history_resolver_runner_assignment=PASS'

      - name: Resolve workflow history and signing failure class
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version 2.0

          if ([string]::IsNullOrWhiteSpace($env:GH_TOKEN)) {
              throw 'GitHub Actions token is unavailable.'
          }
          $headers = @{
              Accept = 'application/vnd.github+json'
              Authorization = "Bearer $env:GH_TOKEN"
              'X-GitHub-Api-Version' = '2026-03-10'
              'User-Agent' = 'psmatrix-actions-history-resolver'
          }
          $base = "https://api.github.com/repos/$env:REPOSITORY"

          function Get-Json {
              param([Parameter(Mandatory = $true)][string]$Uri)
              return Invoke-RestMethod -Method Get -Uri $Uri -Headers $headers -TimeoutSec 30
          }

          function Resolve-WorkflowHistory {
              param(
                  [Parameter(Mandatory = $true)][string]$WorkflowFile,
                  [Parameter(Mandatory = $true)][string]$ExpectedArtifact
              )
              $workflowUri = "$base/actions/workflows/$WorkflowFile/runs?event=workflow_dispatch&per_page=100"
              $response = Get-Json -Uri $workflowUri
              $runs = @($response.workflow_runs | Where-Object {
                  [string]$_.status -eq 'completed' -and [string]$_.conclusion -eq 'success'
              } | Sort-Object -Property created_at -Descending)
              $matches = @()
              foreach ($run in $runs) {
                  $artifactResponse = Get-Json -Uri "$base/actions/runs/$($run.id)/artifacts?per_page=100"
                  $artifacts = @($artifactResponse.artifacts | Where-Object {
                      [string]$_.name -eq $ExpectedArtifact -and -not [bool]$_.expired
                  })
                  if ($artifacts.Count -ne 1) {
                      continue
                  }
                  $artifact = $artifacts[0]
                  $matches += [pscustomobject][ordered]@{
                      run_id = [int64]$run.id
                      run_attempt = [int]$run.run_attempt
                      head_sha = [string]$run.head_sha
                      created_at = [string]$run.created_at
                      artifact_id = [int64]$artifact.id
                      artifact_name = [string]$artifact.name
                      artifact_digest = [string]$artifact.digest
                      artifact_size = [int64]$artifact.size_in_bytes
                  }
              }
              return @($matches)
          }

          function Resolve-AllSigningRuns {
              $workflowFile = 'ga-windows-authority-release-sign-from-staging.yml'
              $response = Get-Json -Uri "$base/actions/workflows/$workflowFile/runs?event=workflow_dispatch&per_page=100"
              $runs = @($response.workflow_runs | Sort-Object -Property created_at -Descending)
              $items = @()
              foreach ($run in $runs) {
                  $jobsResponse = Get-Json -Uri "$base/actions/runs/$($run.id)/jobs?per_page=100"
                  $jobs = @($jobsResponse.jobs)
                  $stepCount = 0
                  $completedStepCount = 0
                  foreach ($job in $jobs) {
                      $steps = @($job.steps)
                      $stepCount += $steps.Count
                      $completedStepCount += @($steps | Where-Object { [string]$_.status -eq 'completed' }).Count
                  }
                  $items += [pscustomobject][ordered]@{
                      run_id = [int64]$run.id
                      run_attempt = [int]$run.run_attempt
                      status = [string]$run.status
                      conclusion = [string]$run.conclusion
                      head_sha = [string]$run.head_sha
                      created_at = [string]$run.created_at
                      run_started_at = [string]$run.run_started_at
                      job_count = $jobs.Count
                      step_count = $stepCount
                      completed_step_count = $completedStepCount
                      jobs = @($jobs | ForEach-Object {
                          [pscustomobject][ordered]@{
                              name = [string]$_.name
                              status = [string]$_.status
                              conclusion = [string]$_.conclusion
                              started_at = [string]$_.started_at
                              completed_at = [string]$_.completed_at
                              step_count = @($_.steps).Count
                          }
                      })
                  }
              }
              return @($items)
          }

          $targets = @(
              [pscustomobject]@{
                  key = 'staging'
                  workflow = 'ga-windows-authority-rc3-staging-selfhosted.yml'
                  artifact = 'windows-authority-rc3-locked-staging'
              },
              [pscustomobject]@{
                  key = 'protected_release'
                  workflow = 'ga-windows-authority-release-sign-from-staging.yml'
                  artifact = 'psmatrix-2.0.0rc3-protected-release'
              },
              [pscustomobject]@{
                  key = 'operation_package'
                  workflow = 'ga-windows-authority-operation-package-selfhosted.yml'
                  artifact = 'windows-authority-rc3-operation-package'
              }
          )

          $result = [ordered]@{
              schema = 2
              kind = 'psmatrix.windows-authority-actions-history-resolution'
              repository = $env:REPOSITORY
              workflows = [ordered]@{}
              protected_signing_runs = @()
              reads_actions_metadata = $true
              downloads_artifacts = $false
              reads_secrets = $false
              dispatches_workflows = $false
              writes_repository = $false
              writes_ga_root = $false
              creates_virtual_machines = $false
              creates_checkpoints = $false
              authoritative = $false
              ga_eligible = $false
          }

          foreach ($target in $targets) {
              $matches = @(Resolve-WorkflowHistory -WorkflowFile $target.workflow -ExpectedArtifact $target.artifact)
              $result.workflows[$target.key] = [ordered]@{
                  workflow = $target.workflow
                  expected_artifact = $target.artifact
                  recoverable_count = $matches.Count
                  candidates = @($matches)
              }
              Write-Host "history_key=$($target.key) recoverable_count=$($matches.Count)"
              foreach ($match in $matches) {
                  Write-Host "recoverable_$($target.key)_run_id=$($match.run_id) attempt=$($match.run_attempt) artifact_id=$($match.artifact_id)"
              }
          }

          $signingRuns = @(Resolve-AllSigningRuns)
          $result.protected_signing_runs = @($signingRuns)
          Write-Host "protected_signing_total_runs=$($signingRuns.Count)"
          foreach ($run in $signingRuns) {
              Write-Host "protected_signing_run_id=$($run.run_id) attempt=$($run.run_attempt) status=$($run.status) conclusion=$($run.conclusion) jobs=$($run.job_count) steps=$($run.step_count) completed_steps=$($run.completed_step_count)"
              foreach ($job in $run.jobs) {
                  Write-Host "protected_signing_job=$($job.name) status=$($job.status) conclusion=$($job.conclusion) steps=$($job.step_count)"
              }
          }

          $outRoot = Join-Path $env:RUNNER_TEMP 'psmatrix-actions-history-resolution'
          if (Test-Path -LiteralPath $outRoot) {
              Remove-Item -LiteralPath $outRoot -Recurse -Force
          }
          New-Item -ItemType Directory -Path $outRoot -Force | Out-Null
          $outPath = Join-Path $outRoot 'actions-history-resolution.json'
          [System.IO.File]::WriteAllText(
              $outPath,
              (($result | ConvertTo-Json -Depth 12) + [Environment]::NewLine),
              [System.Text.UTF8Encoding]::new($false)
          )
          Write-Host 'actions_history_resolution=PASS'

      - name: Upload sanitized history resolution
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-authority-rc3-actions-history-resolution
          path: ${{ runner.temp }}/psmatrix-actions-history-resolution/actions-history-resolution.json
          if-no-files-found: warn
          retention-days: 14
