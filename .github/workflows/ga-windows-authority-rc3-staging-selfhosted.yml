name: production-ga-windows-authority-rc3-staging-selfhosted

on:
  workflow_dispatch:
    inputs:
      release_commit:
        description: Exact reviewed Windows Authority RC3 commit
        required: true
        default: "34e87c60885001f8dd11744b8bf194a59e51bd1f"
        type: string

concurrency:
  group: production-ga-windows-authority-rc3-staging-selfhosted
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  stage-locked-rc3:
    name: Rebuild and verify locked RC3 staging on NAVEAX
    runs-on: [self-hosted, Windows, X64, psmatrix-hyperv]
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Initialize isolated staging runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:RUNNER_TEMP)) { throw 'RUNNER_TEMP is unavailable.' }
          $stage = Join-Path $env:RUNNER_TEMP 'psmatrix-windows-authority-rc3-staging'
          $venv = Join-Path $env:RUNNER_TEMP 'psmatrix-windows-authority-rc3-build-venv'
          "PSMATRIX_RC3_STAGE=$stage" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PSMATRIX_RC3_VENV=$venv" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "runtime_stage_root=$stage"
          Write-Host "runtime_venv_root=$venv"

      - name: Check out staging controls
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          path: control
          fetch-depth: 1
          persist-credentials: false

      - name: Check out exact reviewed release source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ inputs.release_commit }}
          path: release-source
          fetch-depth: 1
          persist-credentials: false

      - name: Validate self-hosted runner and create isolated Python
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_OS -ne 'Windows') { throw "Expected Windows runner; got $env:RUNNER_OS" }
          if ($env:RUNNER_NAME -ne 'NAVEAX') { throw "Expected NAVEAX runner; got $env:RUNNER_NAME" }
          $version = python -c "import sys; print(f'{sys.version_info.major}.{sys.version_info.minor}')"
          if ($LASTEXITCODE -ne 0 -or $version.Trim() -ne '3.12') { throw "Expected local Python 3.12; got $version" }
          if (Test-Path -LiteralPath $env:PSMATRIX_RC3_VENV) { Remove-Item -LiteralPath $env:PSMATRIX_RC3_VENV -Recurse -Force }
          python -m venv $env:PSMATRIX_RC3_VENV
          if ($LASTEXITCODE -ne 0) { throw 'Isolated Python venv creation failed.' }
          $python = Join-Path $env:PSMATRIX_RC3_VENV 'Scripts\python.exe'
          if (-not (Test-Path -LiteralPath $python -PathType Leaf)) { throw 'Isolated Python executable is missing.' }
          "PSMATRIX_RC3_PYTHON=$python" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Lock non-secret build backend
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & $env:PSMATRIX_RC3_PYTHON -m pip install --disable-pip-version-check --no-input "pip==26.1.2" "setuptools==83.0.0"
          if ($LASTEXITCODE -ne 0) { throw 'Locked build backend installation failed.' }
          & $env:PSMATRIX_RC3_PYTHON --version
          & $env:PSMATRIX_RC3_PYTHON -m pip --version
          & $env:PSMATRIX_RC3_PYTHON -c "import setuptools; print('setuptools =', setuptools.__version__)"

      - name: Validate dispatch against reviewed release lock
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $lock = Get-Content -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'control\ga-packs\03-authoritative-windows\rc3-release-lock.json') -Raw | ConvertFrom-Json
          $requested = '${{ inputs.release_commit }}'.ToLowerInvariant()
          if ($requested -notmatch '^[0-9a-f]{40}$') { throw 'release_commit must be 40 lowercase hex characters.' }
          if ([string]$lock.release_commit -ne $requested) { throw 'release_commit does not match the reviewed RC3 release lock.' }
          $releaseSource = Join-Path $env:GITHUB_WORKSPACE 'release-source'
          $actual = (git -C $releaseSource rev-parse HEAD).Trim().ToLowerInvariant()
          if ($actual -ne $requested) { throw 'Release-source checkout does not match release_commit.' }
          if (-not [string]::IsNullOrWhiteSpace(((git -C $releaseSource status --porcelain) -join [Environment]::NewLine))) { throw 'Release-source checkout is not clean.' }
          if ([string]$lock.version -ne '2.0.0rc3') { throw 'Reviewed release lock version is not 2.0.0rc3.' }

      - name: Deterministically rebuild unsigned RC3 staging
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (Test-Path -LiteralPath $env:PSMATRIX_RC3_STAGE) { Remove-Item -LiteralPath $env:PSMATRIX_RC3_STAGE -Recurse -Force }
          & $env:PSMATRIX_RC3_PYTHON `
            (Join-Path $env:GITHUB_WORKSPACE 'release-source\scripts\ga\build_windows_authority_release_candidate.py') `
            --expected-head '${{ inputs.release_commit }}' `
            --output-root $env:PSMATRIX_RC3_STAGE
          if ($LASTEXITCODE -ne 0) { throw 'Deterministic RC3 staging rebuild failed.' }

      - name: Enforce exact reviewed artifact lock
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $lock = Get-Content -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'control\ga-packs\03-authoritative-windows\rc3-release-lock.json') -Raw | ConvertFrom-Json
          $report = Get-Content -LiteralPath (Join-Path $env:PSMATRIX_RC3_STAGE 'psmatrix-2.0.0rc3-windows-authority-staging.json') -Raw | ConvertFrom-Json
          if ($report.status -ne 'READY_FOR_PROTECTED_SIGNING' -or $report.release_commit -ne $lock.release_commit -or $report.version -ne $lock.version) { throw 'Staging identity/status differs from release lock.' }
          foreach ($field in @('private_key_read','signed_release_manifest_written','downloads_files','extracts_existing_operation_package','authoritative','ga_eligible')) {
              if ([bool]$report.$field) { throw "Unsafe staging field is true: $field" }
          }
          if (@($report.artifacts).Count -ne @($lock.artifacts).Count) { throw 'Staging artifact count differs from release lock.' }
          foreach ($expected in @($lock.artifacts)) {
              $matchingEntries = @($report.artifacts | Where-Object { $_.name -eq $expected.name })
              if ($matchingEntries.Count -ne 1) { throw "Staging report does not contain exactly one locked artifact: $($expected.name)" }
              $observed = $matchingEntries[0]
              if ($observed.sha256 -ne $expected.sha256 -or [int64]$observed.size -ne [int64]$expected.size) { throw "Staging report metadata differs from release lock: $($expected.name)" }
              $path = Join-Path $env:PSMATRIX_RC3_STAGE $expected.name
              if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw "Locked artifact is missing: $($expected.name)" }
              $actualHash = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
              $actualSize = (Get-Item -LiteralPath $path).Length
              if ($actualHash -ne $expected.sha256 -or [int64]$actualSize -ne [int64]$expected.size) { throw "Locked artifact bytes differ from reviewed evidence: $($expected.name)" }
          }
          Write-Host 'self_hosted_locked_rc3_artifact_set=PASS'

      - name: Upload exact locked unsigned staging
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-authority-rc3-locked-staging
          path: ${{ runner.temp }}\psmatrix-windows-authority-rc3-staging
          if-no-files-found: error
          retention-days: 30

      - name: Remove isolated build environment
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          if (Test-Path -LiteralPath $env:PSMATRIX_RC3_VENV) { Remove-Item -LiteralPath $env:PSMATRIX_RC3_VENV -Recurse -Force -ErrorAction SilentlyContinue }
