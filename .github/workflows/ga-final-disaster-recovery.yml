name: production-ga-final-disaster-recovery

on:
  workflow_dispatch:

concurrency:
  group: production-ga-final-disaster-recovery
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  run-recovery-campaign:
    name: Run bounded exact final recovery campaign
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    env:
      FINAL_RELEASE_COMMIT: 02cef95d40cf524ce00f9d917188343dc49e6f2c

    steps:
      - name: Check out exact disaster-recovery producer controls
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1
        with:
          path: control
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.2.0
        with:
          python-version: "3.12"

      - name: Validate exact recovery campaign control source
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=control/src python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          head=subprocess.check_output(['git','-C','control','rev-parse','HEAD'],text=True).strip().lower()
          if head!=os.environ['GITHUB_SHA'].lower():
              raise SystemExit('disaster-recovery control checkout is not exact GITHUB_SHA')
          if subprocess.check_output(['git','-C','control','status','--porcelain'],text=True).strip():
              raise SystemExit('disaster-recovery control checkout is dirty')
          contract=json.loads(Path('control/ga-packs/03-authoritative-windows/final-disaster-recovery-evidence-producer-contract.json').read_text(encoding='utf-8'))
          producer=contract.get('producer') or {}
          if producer.get('workflow')!='production-ga-final-disaster-recovery' or producer.get('authority')!='recovery':
              raise SystemExit('disaster-recovery producer identity mismatch')
          if producer.get('production_state_mutation_allowed') is not False or producer.get('private_key_allowed_in_campaign_job') is not False:
              raise SystemExit('disaster-recovery campaign boundary is unsafe')
          print('disaster_recovery_control_identity=PASS')
          PY

      - name: Discover unique successful protected final release at exact control head
        id: final_release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import urllib.request

          head=os.environ['GITHUB_SHA'].lower()
          headers={
              'Accept':'application/vnd.github+json',
              'Authorization':f'Bearer {os.environ["GH_TOKEN"]}',
              'X-GitHub-Api-Version':'2026-03-10',
              'User-Agent':'psmatrix-final-disaster-recovery',
          }
          def fetch(path):
              request=urllib.request.Request(f'https://api.github.com/repos/Naveax/PSMatrix/{path}',headers=headers)
              with urllib.request.urlopen(request,timeout=30) as response:
                  return json.load(response)
          runs=fetch('actions/workflows/ga-windows-authority-final-release-sign-from-lock.yml/runs?event=workflow_dispatch&status=success&per_page=100').get('workflow_runs',[])
          candidates=[]
          for run in runs:
              if run.get('name')!='production-ga-windows-authority-final-release-sign-from-lock':
                  continue
              if run.get('status')!='completed' or run.get('conclusion')!='success' or (run.get('head_sha') or '').lower()!=head:
                  continue
              run_id=str(run.get('id') or '')
              artifacts=fetch(f'actions/runs/{run_id}/artifacts?per_page=100').get('artifacts',[])
              matches=[item for item in artifacts if item.get('name')=='psmatrix-2.0.0-protected-release' and not item.get('expired')]
              if len(matches)==1:
                  candidates.append((run_id,int(matches[0]['id'])))
          if len(candidates)!=1:
              raise SystemExit(f'exact-head disaster recovery requires exactly one successful protected final release; found {len(candidates)}')
          run_id,artifact_id=candidates[0]
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as stream:
              stream.write(f'run_id={run_id}\n')
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as stream:
              stream.write(f'PSMATRIX_FINAL_RECOVERY_SIGNING_RUN_ID={run_id}\n')
          print(f'disaster_recovery_release_provenance=PASS run_id={run_id} artifact_id={artifact_id}')
          PY

      - name: Download exact protected final release
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: psmatrix-2.0.0-protected-release
          path: signed-release
          repository: Naveax/PSMatrix
          run-id: ${{ steps.final_release.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Bootstrap-verify protected release and install exact recovery runtime wheel
        shell: bash
        run: |
          set -euo pipefail
          runtime="$RUNNER_TEMP/psmatrix-final-recovery-runtime"
          wheel_path_file="$RUNNER_TEMP/psmatrix-final-recovery-wheel-path.txt"
          rm -rf "$runtime"
          rm -f "$wheel_path_file"
          mkdir -p "$runtime"
          PSMATRIX_RECOVERY_WHEEL_PATH_FILE="$wheel_path_file" PYTHONPATH=control/src python - <<'PY'
          import json
          import os
          from pathlib import Path
          from psmatrix.release import verify_release_manifest
          from psmatrix.util import sha256_file

          release=Path('signed-release')
          manifest=release/'psmatrix-2.0.0-release.json'
          public=release/'psmatrix-2.0.0-release-public.pem'
          status_path=release/'psmatrix-2.0.0-protected-release-signing-status.json'
          verified=verify_release_manifest(manifest,release,signing_public_key=public)
          if verified.get('valid') is not True or verified.get('version')!='2.0.0':
              raise SystemExit('protected final release verification failed before recovery campaign')
          status=json.loads(status_path.read_text(encoding='utf-8'))
          if status.get('release_artifacts_signed') is not True or status.get('version')!='2.0.0' or status.get('release_commit')!=os.environ['FINAL_RELEASE_COMMIT']:
              raise SystemExit('protected final release signing status is not exact final/signed')
          root=json.loads(manifest.read_text(encoding='utf-8'))
          body=root.get('manifest') if isinstance(root,dict) else None
          artifacts=body.get('artifacts') if isinstance(body,dict) else None
          wheels=[item for item in artifacts or [] if isinstance(item,dict) and str(item.get('name') or '').endswith('.whl')]
          if len(wheels)!=1:
              raise SystemExit(f'signed final release must declare exactly one wheel; found {len(wheels)}')
          wheel=wheels[0]
          path=release/str(wheel.get('name') or '')
          if not path.is_file() or path.is_symlink():
              raise SystemExit('declared final recovery wheel is missing or unsafe')
          digest=sha256_file(path)
          if int(wheel.get('size') or 0)!=path.stat().st_size or str(wheel.get('sha256') or '').lower()!=digest:
              raise SystemExit('declared final recovery wheel identity differs from verified bytes')
          Path(os.environ['PSMATRIX_RECOVERY_WHEEL_PATH_FILE']).write_text(str(path.resolve())+'\n',encoding='utf-8')
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as stream:
              stream.write(f'PSMATRIX_FINAL_RECOVERY_MANIFEST_SHA256={sha256_file(manifest)}\n')
              stream.write(f'PSMATRIX_FINAL_RECOVERY_WHEEL_NAME={path.name}\n')
              stream.write(f'PSMATRIX_FINAL_RECOVERY_WHEEL_SHA256={digest}\n')
              stream.write(f'PSMATRIX_FINAL_RECOVERY_WHEEL_SIZE={path.stat().st_size}\n')
          print(f'disaster_recovery_release_pre_campaign=PASS wheel={path.name} sha256={digest}')
          PY
          wheel_path="$(cat "$wheel_path_file")"
          [[ -n "$wheel_path" && -f "$wheel_path" ]] || { echo 'verified final recovery wheel path was not materialized' >&2; exit 1; }
          python -m pip install --disable-pip-version-check --no-index --no-deps --target "$runtime" "$wheel_path"
          PSMATRIX_EXPECTED_RUNTIME_ROOT="$runtime" PYTHONPATH="$runtime" python - <<'PY'
          import importlib.metadata
          import os
          from pathlib import Path
          import psmatrix
          import psmatrix.recovery
          import psmatrix.signing

          root=Path(os.environ['PSMATRIX_EXPECTED_RUNTIME_ROOT']).resolve()
          paths=(
              Path(psmatrix.__file__).resolve(),
              Path(psmatrix.recovery.__file__).resolve(),
              Path(psmatrix.signing.__file__).resolve(),
              Path(importlib.metadata.distribution('psmatrix').locate_file('')).resolve(),
          )
          for path in paths:
              try:
                  path.relative_to(root)
              except ValueError as exc:
                  raise SystemExit(f'disaster-recovery runtime escaped exact final wheel target: {path}') from exc
          version=importlib.metadata.version('psmatrix')
          if version!='2.0.0':
              raise SystemExit(f'exact final recovery runtime version mismatch: {version!r}')
          print(f'disaster_recovery_exact_wheel_runtime=PASS version={version}')
          PY
          rm -f "$wheel_path_file"
          echo "PSMATRIX_FINAL_RECOVERY_RUNTIME=$runtime" >> "$GITHUB_ENV"
          echo 'disaster_recovery_checkout_source_execution=false'
          echo 'disaster_recovery_wheel_install_mode=offline-no-index-no-deps'

      - name: Execute unsigned bounded recovery campaign
        shell: bash
        run: |
          set -euo pipefail
          home="$RUNNER_TEMP/psmatrix-final-recovery-home"
          output="$RUNNER_TEMP/psmatrix-final-recovery-unsigned"
          rm -rf "$home" "$output"
          mkdir -p "$home" "$output"
          PSMATRIX_HOME="$home" PYTHONPATH="$PSMATRIX_FINAL_RECOVERY_RUNTIME" python -m psmatrix.cli recovery run \
            --report-json "$output/recovery-report.json"
          PSMATRIX_RECOVERY_UNSIGNED="$output" PYTHONPATH="$PSMATRIX_FINAL_RECOVERY_RUNTIME" python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          from psmatrix.recovery import list_recovery_cases
          from psmatrix.signing import canonical_json_bytes
          root=Path(os.environ['PSMATRIX_RECOVERY_UNSIGNED'])
          report_path=root/'recovery-report.json'
          report=json.loads(report_path.read_text(encoding='utf-8'))
          expected=[item['id'] for item in list_recovery_cases()]
          cases=report.get('cases') if isinstance(report.get('cases'),list) else []
          actual=[str(item.get('id')) for item in cases if isinstance(item,dict)]
          if report.get('schema')!=1 or report.get('kind')!='psmatrix.recovery-campaign' or report.get('tool_version')!='2.0.0' or report.get('status')!='PASS':
              raise SystemExit('unsigned final recovery campaign identity/status mismatch')
          if actual!=expected or len(cases)!=10 or any(item.get('status')!='PASS' for item in cases):
              raise SystemExit('unsigned final recovery campaign exact case set is not 10/10 PASS')
          summary=report.get('summary') or {}
          if int(summary.get('total') or 0)!=10 or int(summary.get('passed') or 0)!=10 or int(summary.get('failed') or 0)!=0:
              raise SystemExit('unsigned final recovery campaign summary mismatch')
          declared=str(report.get('report_sha256') or '')
          body={key:value for key,value in report.items() if key!='report_sha256'}
          computed=hashlib.sha256(canonical_json_bytes(body)).hexdigest()
          if declared!=computed:
              raise SystemExit('unsigned final recovery campaign self-digest mismatch')
          report.pop('report_sha256',None)
          report['release_binding']={
              'version':'2.0.0',
              'release_commit':os.environ['FINAL_RELEASE_COMMIT'],
              'release_signing_run_id':os.environ['PSMATRIX_FINAL_RECOVERY_SIGNING_RUN_ID'],
              'release_manifest_sha256':os.environ['PSMATRIX_FINAL_RECOVERY_MANIFEST_SHA256'],
              'wheel':{
                  'name':os.environ['PSMATRIX_FINAL_RECOVERY_WHEEL_NAME'],
                  'sha256':os.environ['PSMATRIX_FINAL_RECOVERY_WHEEL_SHA256'],
                  'size':int(os.environ['PSMATRIX_FINAL_RECOVERY_WHEEL_SIZE']),
              },
              'exact_release_wheel_runtime':True,
              'wheel_install_mode':'offline-no-index-no-deps',
          }
          report['report_sha256']=hashlib.sha256(canonical_json_bytes(report)).hexdigest()
          report_path.write_text(json.dumps(report,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          print(f'unsigned_disaster_recovery=PASS cases={len(cases)} report_sha256={report["report_sha256"]} exact_release_wheel=true')
          PY
          rm -rf "$home"
          echo "PSMATRIX_RECOVERY_UNSIGNED=$output" >> "$GITHUB_ENV"

      - name: Upload unsigned bounded recovery report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: psmatrix-2.0.0-final-disaster-recovery-unsigned
          path: ${{ env.PSMATRIX_RECOVERY_UNSIGNED }}/recovery-report.json
          if-no-files-found: error
          retention-days: 30

  sign-recovery-campaign:
    name: Sign exact recovery report with protected recovery authority
    needs: run-recovery-campaign
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production-ga-recovery-signing
    permissions:
      contents: read

    steps:
      - name: Check out exact disaster-recovery producer controls
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1
        with:
          path: control
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.2.0
        with:
          python-version: "3.12"

      - name: Download exact unsigned report from this workflow run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: psmatrix-2.0.0-final-disaster-recovery-unsigned
          path: unsigned

      - name: Revalidate exact unsigned report before recovery-key access
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=control/src python - <<'PY'
          import hashlib, json, os, re, subprocess
          from pathlib import Path
          from psmatrix.recovery import list_recovery_cases
          from psmatrix.signing import canonical_json_bytes
          head=subprocess.check_output(['git','-C','control','rev-parse','HEAD'],text=True).strip().lower()
          if head!=os.environ['GITHUB_SHA'].lower():
              raise SystemExit('recovery signing control checkout is not exact GITHUB_SHA')
          report=json.loads(Path('unsigned/recovery-report.json').read_text(encoding='utf-8'))
          expected=[item['id'] for item in list_recovery_cases()]
          cases=report.get('cases') if isinstance(report.get('cases'),list) else []
          if [str(item.get('id')) for item in cases]!=expected or any(item.get('status')!='PASS' for item in cases):
              raise SystemExit('recovery report changed before protected signing')
          binding=report.get('release_binding') if isinstance(report.get('release_binding'),dict) else {}
          wheel=binding.get('wheel') if isinstance(binding.get('wheel'),dict) else {}
          if binding.get('version')!='2.0.0' or binding.get('release_commit')!='02cef95d40cf524ce00f9d917188343dc49e6f2c' or binding.get('exact_release_wheel_runtime') is not True or binding.get('wheel_install_mode')!='offline-no-index-no-deps':
              raise SystemExit('recovery report exact-release runtime binding is missing')
          if not str(binding.get('release_signing_run_id') or '').isdecimal():
              raise SystemExit('recovery report release signing run ID is invalid')
          if not re.fullmatch(r'[0-9a-f]{64}',str(binding.get('release_manifest_sha256') or '')) or not re.fullmatch(r'[0-9a-f]{64}',str(wheel.get('sha256') or '')):
              raise SystemExit('recovery report release/wheel digest binding is invalid')
          if not str(wheel.get('name') or '').endswith('.whl') or int(wheel.get('size') or 0)<=0:
              raise SystemExit('recovery report wheel identity is invalid')
          body={key:value for key,value in report.items() if key!='report_sha256'}
          computed=hashlib.sha256(canonical_json_bytes(body)).hexdigest()
          if str(report.get('report_sha256') or '')!=computed:
              raise SystemExit('recovery report self-digest failed before protected signing')
          print(f'disaster_recovery_pre_secret=PASS cases={len(cases)} report_sha256={computed} exact_release_wheel=true')
          PY

      - name: Materialize recovery authority, sign exact report, verify, and remove private key
        shell: bash
        env:
          RECOVERY_PRIVATE_KEY: ${{ secrets.PSMATRIX_GA_RECOVERY_PRIVATE_KEY }}
          RECOVERY_PUBLIC_KEY: ${{ secrets.PSMATRIX_GA_RECOVERY_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          [[ -n "$RECOVERY_PRIVATE_KEY" ]] || { echo 'PSMATRIX_GA_RECOVERY_PRIVATE_KEY is missing from production-ga-recovery-signing.' >&2; exit 1; }
          [[ "$RECOVERY_PUBLIC_KEY" == *'-----BEGIN PUBLIC KEY-----'* ]] || { echo 'PSMATRIX_GA_RECOVERY_PUBLIC_KEY is missing from production-ga-recovery-signing.' >&2; exit 1; }
          key_root="$RUNNER_TEMP/psmatrix-final-recovery-keys"
          output="$RUNNER_TEMP/psmatrix-2.0.0-final-disaster-recovery"
          rm -rf "$key_root" "$output"
          install -d -m 0700 "$key_root" "$output"
          printf '%s\n' "$RECOVERY_PRIVATE_KEY" > "$key_root/recovery.private.pem"
          printf '%s\n' "$RECOVERY_PUBLIC_KEY" > "$key_root/recovery.public.pem"
          chmod 0600 "$key_root/recovery.private.pem"
          cleanup() {
            shred -u "$key_root/recovery.private.pem" 2>/dev/null || rm -f "$key_root/recovery.private.pem"
            rm -f "$key_root/recovery.public.pem"
            rmdir "$key_root" 2>/dev/null || true
          }
          trap cleanup EXIT
          cp unsigned/recovery-report.json "$output/recovery-report.json"
          PSMATRIX_RECOVERY_OUTPUT="$output" PSMATRIX_RECOVERY_PRIVATE="$key_root/recovery.private.pem" PSMATRIX_RECOVERY_PUBLIC="$key_root/recovery.public.pem" PYTHONPATH=control/src python - <<'PY'
          import os
          from pathlib import Path
          from psmatrix.recovery import list_recovery_cases, sign_recovery_report, verify_recovery_report
          from psmatrix.signing import public_key_id
          from psmatrix.util import atomic_write_json, read_json, sha256_file
          root=Path(os.environ['PSMATRIX_RECOVERY_OUTPUT'])
          private=Path(os.environ['PSMATRIX_RECOVERY_PRIVATE'])
          public=Path(os.environ['PSMATRIX_RECOVERY_PUBLIC'])
          report=read_json(root/'recovery-report.json')
          envelope=sign_recovery_report(report,private,public)
          atomic_write_json(root/'recovery.dsse.json',envelope)
          (root/'recovery-public.pem').write_bytes(public.read_bytes())
          verified=verify_recovery_report(read_json(root/'recovery.dsse.json'),root/'recovery-public.pem')
          signed=verified.get('report')
          if verified.get('valid') is not True or not isinstance(signed,dict):
              raise SystemExit('signed disaster-recovery attestation verification failed')
          expected=[item['id'] for item in list_recovery_cases()]
          cases=signed.get('cases') if isinstance(signed.get('cases'),list) else []
          if [str(item.get('id')) for item in cases]!=expected or any(item.get('status')!='PASS' for item in cases):
              raise SystemExit('signed disaster-recovery attestation is not exact 10/10 PASS')
          binding=signed.get('release_binding') if isinstance(signed.get('release_binding'),dict) else {}
          if binding.get('version')!='2.0.0' or binding.get('release_commit')!='02cef95d40cf524ce00f9d917188343dc49e6f2c' or binding.get('exact_release_wheel_runtime') is not True:
              raise SystemExit('signed disaster-recovery attestation lost exact final release binding')
          key_id=public_key_id(root/'recovery-public.pem')
          if set(verified.get('key_ids') or [])!={key_id}:
              raise SystemExit('disaster-recovery attestation is not signed exclusively by recovery authority')
          status={'schema':1,'kind':'psmatrix.final-disaster-recovery-producer-status','status':'PASS','version':'2.0.0','cases':len(cases),'report_sha256':signed.get('report_sha256'),'attestation_sha256':sha256_file(root/'recovery.dsse.json'),'recovery_key_id':key_id,'recovery_public_key_sha256':sha256_file(root/'recovery-public.pem'),'release_binding':binding,'proof_verified':True,'exact_release_wheel_runtime':True,'production_state_mutated':False,'recovery_private_key_copied_to_output':False,'final_ga_evaluator_invoked':False,'ga_eligible':False}
          atomic_write_json(root/'disaster-recovery-producer-status.json',status)
          markers=(b'-----BEGIN PRIVATE KEY-----',b'-----BEGIN RSA PRIVATE KEY-----',b'-----BEGIN EC PRIVATE KEY-----',b'-----BEGIN OPENSSH PRIVATE KEY-----',b'-----BEGIN ED25519 PRIVATE KEY-----')
          for path in root.rglob('*'):
              if path.is_file() and any(marker in path.read_bytes() for marker in markers):
                  raise SystemExit(f'private-key material found in disaster-recovery output: {path.name}')
          print(f'signed_disaster_recovery=PASS cases={len(cases)} key_id={key_id} exact_release_wheel=true')
          print('production_state_mutated=false')
          print('final_ga_evaluator_invoked=false')
          print('ga_eligible=false')
          PY
          echo "PSMATRIX_RECOVERY_OUTPUT=$output" >> "$GITHUB_ENV"

      - name: Upload final recovery-authority disaster-recovery proof
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: psmatrix-2.0.0-final-disaster-recovery
          path: ${{ env.PSMATRIX_RECOVERY_OUTPUT }}
          if-no-files-found: error
          retention-days: 30
