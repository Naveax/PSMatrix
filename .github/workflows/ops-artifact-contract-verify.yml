name: ops-artifact-contract-verify

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/*.yml'
  workflow_dispatch:

concurrency:
  group: ops-artifact-contract-verify-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      STATE_ISSUE: '262'
    steps:
      - name: Check out exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Validate literal artifact producer-consumer contracts
        id: contract
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/artifact-contract-verify"
          rm -rf "$root"
          mkdir -p "$root"
          VERIFY_ROOT="$root" ruby <<'RUBY'
          require 'yaml'
          require 'fileutils'

          root = ENV.fetch('VERIFY_ROOT')
          errors = []
          files = Dir['.github/workflows/*.yml'].sort
          docs = {}
          producers = Hash.new { |h, k| h[k] = [] }
          upload_refs = 0
          download_refs = 0
          literal_downloads = 0
          cross_run_downloads = 0

          files.each do |path|
            begin
              doc = YAML.load_file(path, aliases: true)
            rescue => e
              errors << "#{path}: YAML parse failed: #{e.class}: #{e.message}"
              next
            end
            docs[path] = doc if doc.is_a?(Hash)
          end

          docs.each do |path, doc|
            jobs = doc['jobs']
            next unless jobs.is_a?(Hash)
            jobs.each_value do |job|
              next unless job.is_a?(Hash)
              Array(job['steps']).each do |step|
                next unless step.is_a?(Hash)
                uses = step['uses'].to_s
                next unless uses.start_with?('actions/upload-artifact@')
                upload_refs += 1
                with = step['with']
                next unless with.is_a?(Hash)
                name = with['name'].to_s.strip
                next if name.empty? || name.include?('${{')
                producers[name] << path
              end
            end
          end

          docs.each do |path, doc|
            trigger = doc['on'] || doc[true]
            workflow_run_trigger = trigger.is_a?(Hash) && trigger['workflow_run'].is_a?(Hash)
            jobs = doc['jobs']
            next unless jobs.is_a?(Hash)
            jobs.each do |job_name, job|
              next unless job.is_a?(Hash)
              Array(job['steps']).each_with_index do |step, index|
                next unless step.is_a?(Hash)
                uses = step['uses'].to_s
                next unless uses.start_with?('actions/download-artifact@')
                download_refs += 1
                with = step['with']
                unless with.is_a?(Hash)
                  errors << "#{path}: job #{job_name} step #{index} download-artifact missing with mapping"
                  next
                end

                name = with['name'].to_s.strip
                if !name.empty? && !name.include?('${{')
                  literal_downloads += 1
                  unless producers.key?(name)
                    errors << "#{path}: literal artifact download has no literal upload producer: #{name}"
                  end
                end

                if workflow_run_trigger
                  cross_run_downloads += 1
                  run_id = with['run-id'].to_s.strip
                  token = with['github-token'].to_s.strip
                  if run_id.empty?
                    errors << "#{path}: workflow_run download-artifact must bind source run-id"
                  end
                  if token.empty?
                    errors << "#{path}: workflow_run download-artifact must provide github-token for cross-run access"
                  end
                end
              end
            end
          end

          counts = "workflows=#{docs.length} upload_refs=#{upload_refs} download_refs=#{download_refs} literal_downloads=#{literal_downloads} cross_run_downloads=#{cross_run_downloads} literal_artifact_names=#{producers.length}"
          File.write(File.join(root, 'counts.txt'), counts + "\n")
          File.write(File.join(root, 'errors.txt'), errors.join("\n") + (errors.empty? ? '' : "\n"))
          puts "artifact_contract_scan #{counts}"
          unless errors.empty?
            warn errors.join("\n")
            exit 1
          end
          RUBY

      - name: Publish artifact-contract verification result idempotently
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/artifact-contract-verify"
          outcome='${{ steps.contract.outcome }}'
          if [[ "$outcome" == success ]]; then status=PASS; else status=FAIL; fi
          counts=$(cat "$root/counts.txt" 2>/dev/null || echo 'counts=unavailable')
          marker="OPS_ARTIFACT_CONTRACT_VERIFY head=$GITHUB_SHA "
          body="${marker}status=$status $counts"
          comment_id=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$STATE_ISSUE/comments" \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id" \
            | tail -n 1)
          if [[ -n "$comment_id" ]]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$comment_id" -f body="$body" >/dev/null
          else
            gh issue comment "$STATE_ISSUE" --repo "$GITHUB_REPOSITORY" --body "$body"
          fi
          echo "$body"
          if [[ "$status" != PASS ]]; then
            echo '--- artifact contract errors ---'
            cat "$root/errors.txt" || true
            exit 1
          fi
