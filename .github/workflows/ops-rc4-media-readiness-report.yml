name: ops-rc4-media-readiness-report

on:
  workflow_run:
    workflows: [production-ga-windows-authority-rc4-media-readiness-selfhosted]
    types: [completed]

concurrency:
  group: ops-rc4-media-readiness-report-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
  issues: write

jobs:
  report:
    if: github.event.workflow_run.event == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_ID: ${{ github.event.workflow_run.id }}
      RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
      RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
      STATE_ISSUE: '261'
    steps:
      - name: Download non-secret media readiness evidence
        if: env.RUN_CONCLUSION == 'success' || env.RUN_CONCLUSION == 'failure'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-authority-rc4-media-readiness
          path: evidence
          repository: Naveax/PSMatrix
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Publish boundary-aware result idempotently
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          status='UNKNOWN'
          selection='unknown'
          missing='unknown'
          if [[ -d evidence ]]; then
            file="$(find evidence -maxdepth 2 -type f -name '*.json' | head -n1 || true)"
            if [[ -n "$file" ]]; then
              status="$(jq -r '.status // "UNKNOWN"' "$file" 2>/dev/null || echo UNKNOWN)"
              selection="$(jq -r '.selection_present // .ready_for_provisioning_manifest_materialization // "unknown"' "$file" 2>/dev/null || echo unknown)"
              missing="$(jq -c '.missing_media_roles // []' "$file" 2>/dev/null || echo '[]')"
            fi
          fi

          marker="RC4_MEDIA_READINESS_RESULT run_id=$RUN_ID"
          body=$(printf '%s\n\n### RC4 media-readiness result\n\nRun: `%s`\nAttempt: `%s`\nConclusion: `%s`\nWorkflow status: `%s`\nSelection/manifest readiness: `%s`\nMissing media roles: `%s`\n\nNo automatic provisioning was dispatched from this reporter. Operator-selection boundary remains enforced.' "$marker" "$RUN_ID" "$RUN_ATTEMPT" "$RUN_CONCLUSION" "$status" "$selection" "$missing")

          comment_id=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$STATE_ISSUE/comments" \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id" \
            | tail -n 1)
          if [[ -n "$comment_id" ]]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$comment_id" -f body="$body" >/dev/null
            echo "rc4_media_readiness_report=updated run_id=$RUN_ID comment_id=$comment_id"
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$STATE_ISSUE/comments" -f body="$body" >/dev/null
            echo "rc4_media_readiness_report=created run_id=$RUN_ID"
          fi
