name: ga-rc3-chain-state-reader-once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ga-rc3-chain-state-reader-once.yml"

permissions:
  contents: read
  actions: read
  issues: write

jobs:
  read-state:
    name: Read RC3 execution chain state
    runs-on: [self-hosted, Windows, X64, psmatrix-hyperv]
    timeout-minutes: 10
    environment: production-ga-windows-lab
    env:
      GH_TOKEN: ${{ github.token }}
      PSMATRIX_WPS40_ADMIN_PASSWORD: ${{ secrets.PSMATRIX_WPS40_ADMIN_PASSWORD }}
      PSMATRIX_WPS50_ADMIN_PASSWORD: ${{ secrets.PSMATRIX_WPS50_ADMIN_PASSWORD }}
      PSMATRIX_WPS51_ADMIN_PASSWORD: ${{ secrets.PSMATRIX_WPS51_ADMIN_PASSWORD }}

    steps:
      - name: Query latest chain runs and publish sanitized state
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $headers = @{
              Accept = 'application/vnd.github+json'
              Authorization = "Bearer $env:GH_TOKEN"
              'X-GitHub-Api-Version' = '2026-03-10'
              'User-Agent' = 'psmatrix-rc3-state-reader'
          }
          $base = 'https://api.github.com/repos/Naveax/PSMatrix'
          function Get-Json([string]$path) {
              return Invoke-RestMethod -Method Get -Uri "$base/$path" -Headers $headers -TimeoutSec 30
          }
          $workflows = [ordered]@{
              signing = 'ga-windows-authority-release-sign-from-staging.yml'
              intake = 'ga-windows-authority-release-intake-selfhosted.yml'
              media = 'ga-windows-authority-media-readiness-selfhosted.yml'
              manifest = 'ga-windows-authority-provisioning-manifest-selfhosted.yml'
              operation = 'ga-windows-authority-operation-package-selfhosted.yml'
              provision = 'ga-windows-authority-provision-selfhosted.yml'
          }
          $lines = @('RC3_CHAIN_STATE_V1')
          foreach ($entry in $workflows.GetEnumerator()) {
              $runs = Get-Json "actions/workflows/$($entry.Value)/runs?event=workflow_dispatch&per_page=5"
              $latest = @($runs.workflow_runs | Sort-Object created_at -Descending | Select-Object -First 1)
              if ($latest.Count -eq 0) {
                  $lines += "$($entry.Key)=NO_RUN"
                  continue
              }
              $run = $latest[0]
              $jobs = Get-Json "actions/runs/$($run.id)/jobs?per_page=100"
              $jobCount = @($jobs.jobs).Count
              $stepCount = 0
              foreach ($job in @($jobs.jobs)) { $stepCount += @($job.steps).Count }
              $lines += "$($entry.Key)=run:$($run.id);attempt:$($run.run_attempt);status:$($run.status);conclusion:$($run.conclusion);jobs:$jobCount;steps:$stepCount;head:$($run.head_sha)"
          }
          foreach ($name in @('PSMATRIX_WPS40_ADMIN_PASSWORD','PSMATRIX_WPS50_ADMIN_PASSWORD','PSMATRIX_WPS51_ADMIN_PASSWORD')) {
              $present = -not [string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))
              $lines += "$name=$present"
          }
          $gaRoot = 'C:\ProgramData\PSMatrix\ProductionGA'
          $lines += "canonical_ga_root=$(Test-Path -LiteralPath $gaRoot -PathType Container)"
          $lines += "release_root=$(Test-Path -LiteralPath (Join-Path $gaRoot 'media\release\2.0.0rc3') -PathType Container)"
          $lines += "intake_report=$(Test-Path -LiteralPath (Join-Path $gaRoot 'windows-authority-protected-release-intake.json') -PathType Leaf)"
          $lines += "selection=$(Test-Path -LiteralPath (Join-Path $gaRoot 'config\windows-authority-media-selection.json') -PathType Leaf)"
          $lines += "provisioning_manifest=$(Test-Path -LiteralPath (Join-Path $gaRoot 'config\windows-lab-media.json') -PathType Leaf)"
          $body = "``````text`n" + ($lines -join "`n") + "`n``````"
          $payload = @{ body = $body } | ConvertTo-Json -Compress
          Invoke-RestMethod -Method Post -Uri "$base/issues/2/comments" -Headers $headers -ContentType 'application/json' -Body $payload -TimeoutSec 30 | Out-Null
          $lines | ForEach-Object { Write-Host $_ }
