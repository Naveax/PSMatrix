name: ga-hosted-scheduler-probe-2

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/ga-hosted-scheduler-probe-2.yml"

permissions:
  contents: read

jobs:
  probe:
    name: Current GitHub-hosted scheduler probe
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Prove hosted runner scheduling
        shell: bash
        run: |
          set -euo pipefail
          echo 'github_hosted_scheduler=PASS'
          echo "runner_os=$RUNNER_OS"
