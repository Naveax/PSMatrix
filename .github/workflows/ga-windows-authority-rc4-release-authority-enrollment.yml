name: production-ga-windows-authority-rc4-release-authority-enrollment

on:
  workflow_dispatch:
    inputs:
      candidate_commit:
        description: Exact reviewed PSMatrix 2.0.0rc4 candidate commit; must equal this control head
        required: true
        type: string

concurrency:
  group: production-ga-windows-authority-rc4-release-authority-enrollment
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  enroll-release-authority:
    name: Enroll protected RC4 release authority for public review
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production-ga-release-signing
    permissions:
      contents: read
    env:
      CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}

    steps:
      - name: Initialize isolated enrollment paths
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${RUNNER_TEMP:-}" ]] || { echo 'RUNNER_TEMP is unavailable.' >&2; exit 1; }
          {
            echo "PSMATRIX_RC4_KEY_ROOT=$RUNNER_TEMP/psmatrix-rc4-release-authority-key"
            echo "PSMATRIX_RC4_ENROLLMENT=$RUNNER_TEMP/psmatrix-2.0.0rc4-release-authority-enrollment"
          } >> "$GITHUB_ENV"

      - name: Validate dispatch identity
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo 'candidate_commit must be 40 lowercase hex characters.' >&2; exit 1; }
          [[ "$CANDIDATE_COMMIT" == "${GITHUB_SHA,,}" ]] || { echo "candidate_commit must equal exact workflow control head ${GITHUB_SHA,,}." >&2; exit 1; }

      - name: Check out exact RC4 candidate
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ inputs.candidate_commit }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Verify exact clean RC4 checkout
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          [[ "$actual" == "$CANDIDATE_COMMIT" ]] || { echo "candidate checkout mismatch: $actual" >&2; exit 1; }
          [[ -z "$(git status --porcelain)" ]] || { echo 'candidate checkout is dirty' >&2; exit 1; }
          PYTHONPATH=src python - <<'PY'
          import tomllib
          from pathlib import Path
          import psmatrix
          value = tomllib.loads(Path('pyproject.toml').read_text(encoding='utf-8'))
          if value['project']['version'] != '2.0.0rc4':
              raise SystemExit('candidate package version is not 2.0.0rc4')
          if psmatrix.__version__ != '2.0.0rc4':
              raise SystemExit('candidate package __version__ is not 2.0.0rc4')
          print('rc4_candidate_identity=PASS')
          PY

      - name: Materialize protected private key only in hosted temp
        shell: bash
        env:
          RELEASE_PRIVATE_KEY: ${{ secrets.PSMATRIX_RELEASE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          [[ -n "$RELEASE_PRIVATE_KEY" ]] || { echo 'PSMATRIX_RELEASE_PRIVATE_KEY is missing from production-ga-release-signing.' >&2; exit 1; }
          rm -rf "$PSMATRIX_RC4_KEY_ROOT" "$PSMATRIX_RC4_ENROLLMENT"
          install -d -m 0700 "$PSMATRIX_RC4_KEY_ROOT" "$PSMATRIX_RC4_ENROLLMENT"
          printf '%s\n' "$RELEASE_PRIVATE_KEY" > "$PSMATRIX_RC4_KEY_ROOT/release.private.pem"
          chmod 0600 "$PSMATRIX_RC4_KEY_ROOT/release.private.pem"
          echo 'private_key_materialized_in_runner_temp=true'

      - name: Enroll new candidate authority without signing release artifacts
        shell: bash
        run: |
          set -euo pipefail
          python scripts/ga/enroll_windows_authority_release_authority.py \
            --private-key "$PSMATRIX_RC4_KEY_ROOT/release.private.pem" \
            --previous-public-key release-assets/2.0.0rc2/psmatrix-2.0.0rc2-release-public.pem \
            --output-root "$PSMATRIX_RC4_ENROLLMENT" \
            --version 2.0.0rc4 \
            --candidate-commit "$CANDIDATE_COMMIT" \
            --rotation-reason lost_previous_private_authority

      - name: Remove protected private key
        if: always()
        shell: bash
        run: |
          set +e
          shred -u "$PSMATRIX_RC4_KEY_ROOT/release.private.pem" 2>/dev/null || rm -f "$PSMATRIX_RC4_KEY_ROOT/release.private.pem"
          rmdir "$PSMATRIX_RC4_KEY_ROOT" 2>/dev/null || true

      - name: Enforce private-key-free enrollment artifact
        shell: bash
        run: |
          set -euo pipefail
          [[ ! -e "$PSMATRIX_RC4_KEY_ROOT/release.private.pem" ]] || { echo 'private key still exists after enrollment' >&2; exit 1; }
          python - "$PSMATRIX_RC4_ENROLLMENT" "$CANDIDATE_COMMIT" <<'PY'
          import json
          import sys
          from pathlib import Path
          root = Path(sys.argv[1]).resolve()
          commit = sys.argv[2]
          markers = (
              b'-----BEGIN PRIVATE KEY-----',
              b'-----BEGIN RSA PRIVATE KEY-----',
              b'-----BEGIN EC PRIVATE KEY-----',
              b'-----BEGIN OPENSSH PRIVATE KEY-----',
          )
          files = [path for path in root.rglob('*') if path.is_file()]
          for path in files:
              data = path.read_bytes()
              if any(marker in data for marker in markers):
                  raise SystemExit(f'private-key material found in enrollment output: {path.name}')
          report = json.loads((root / 'psmatrix-2.0.0rc4-release-authority-enrollment.json').read_text(encoding='utf-8'))
          if report.get('status') != 'READY_FOR_PUBLIC_AUTHORITY_REVIEW':
              raise SystemExit('RC4 authority enrollment is not ready for public review')
          if report.get('candidate_commit') != commit:
              raise SystemExit('RC4 authority enrollment candidate binding mismatch')
          if report.get('rotation_reason') != 'lost_previous_private_authority':
              raise SystemExit('RC4 authority enrollment rotation reason mismatch')
          if report.get('private_key_published') is not False or report.get('release_artifacts_signed') is not False:
              raise SystemExit('RC4 authority enrollment violated private/signing boundary')
          public_files = sorted(root.glob('*.pem'))
          if len(public_files) != 1:
              raise SystemExit(f'expected exactly one public PEM, found {len(public_files)}')
          print('private_key_free_rc4_authority_enrollment=PASS')
          PY

      - name: Upload public RC4 authority enrollment for review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: psmatrix-2.0.0rc4-release-authority-enrollment
          path: ${{ env.PSMATRIX_RC4_ENROLLMENT }}
          if-no-files-found: error
          retention-days: 30
