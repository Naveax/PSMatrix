name: tmp-251-source-equivalence-patch

on:
  push:
    branches: ["codex/250-hermetic-ci-frozen-source-equivalence"]
    paths: [".github/workflows/tmp-251-source-equivalence-patch.yml"]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TARGET_BRANCH: codex/250-hermetic-ci-frozen-source-equivalence
    steps:
      - name: Native exact branch checkout
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init repo
          cd repo
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          basic="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $basic" fetch --no-tags --prune origin "+refs/heads/*:refs/remotes/origin/*"
          git checkout -B "$TARGET_BRANCH" "origin/$TARGET_BRANCH"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"

      - name: Apply fail-closed frozen-anchor and hermetic-CI patch
        working-directory: repo
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_exact(path: str, old: str, new: str, *, count: int = 1) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              observed = text.count(old)
              if observed != count:
                  raise SystemExit(f"{path}: expected {count} exact match(es), found {observed}")
              p.write_text(text.replace(old, new), encoding="utf-8")

          token_expr = "$" + "{{ github.token }}"
          checkout_old = '''      - name: Check out exact revision
                uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1
                with:
                  fetch-depth: 1
                  persist-credentials: false
          '''
          checkout_new = f'''      - name: Check out exact revision with native git and frozen branch objects
                shell: pwsh
                env:
                  PSMATRIX_CI_TOKEN: {token_expr}
                run: |
                  $ErrorActionPreference = 'Stop'
                  $expected = ([string]$env:GITHUB_SHA).ToLowerInvariant()
                  $eventRef = [string]$env:GITHUB_REF
                  if ($expected -cnotmatch '^[0-9a-f]{{40}}$') {{
                      throw 'GITHUB_SHA is not an exact lowercase 40-hex commit.'
                  }}
                  if ([string]::IsNullOrWhiteSpace($eventRef) -or $eventRef -notmatch '^refs/(heads|pull)/') {{
                      throw "Unsupported CI event ref: $eventRef"
                  }}
                  if ([string]::IsNullOrWhiteSpace($env:PSMATRIX_CI_TOKEN)) {{
                      throw 'GitHub token is unavailable for exact native checkout.'
                  }}
                  Push-Location $env:GITHUB_WORKSPACE
                  try {{
                      Get-ChildItem -Force | Remove-Item -Recurse -Force -ErrorAction Stop
                      & git init .
                      if ($LASTEXITCODE -ne 0) {{ throw "git init failed: $LASTEXITCODE" }}
                      & git remote add origin "https://github.com/$env:GITHUB_REPOSITORY.git"
                      if ($LASTEXITCODE -ne 0) {{ throw "git remote add failed: $LASTEXITCODE" }}
                      $basic = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes("x-access-token:$env:PSMATRIX_CI_TOKEN"))
                      $env:GIT_CONFIG_COUNT = '1'
                      $env:GIT_CONFIG_KEY_0 = 'http.https://github.com/.extraheader'
                      $env:GIT_CONFIG_VALUE_0 = "AUTHORIZATION: basic $basic"
                      try {{
                          & git fetch --no-tags --prune origin '+refs/heads/*:refs/remotes/origin/*'
                          if ($LASTEXITCODE -ne 0) {{ throw "Frozen branch-object fetch failed: $LASTEXITCODE" }}
                          & git fetch --no-tags origin $eventRef
                          if ($LASTEXITCODE -ne 0) {{ throw "Exact event-ref fetch failed: $LASTEXITCODE" }}
                      }}
                      finally {{
                          Remove-Item Env:GIT_CONFIG_COUNT -ErrorAction SilentlyContinue
                          Remove-Item Env:GIT_CONFIG_KEY_0 -ErrorAction SilentlyContinue
                          Remove-Item Env:GIT_CONFIG_VALUE_0 -ErrorAction SilentlyContinue
                          $basic = $null
                      }}
                      $fetched = (git rev-parse FETCH_HEAD).Trim().ToLowerInvariant()
                      if ($LASTEXITCODE -ne 0 -or $fetched -cnotmatch '^[0-9a-f]{{40}}$') {{ throw 'Unable to resolve fetched event revision.' }}
                      if ($fetched -ne $expected) {{ throw "Fetched event revision $fetched does not match GITHUB_SHA $expected." }}
                      & git checkout --detach --force $expected
                      if ($LASTEXITCODE -ne 0) {{ throw "Exact detached checkout failed: $LASTEXITCODE" }}
                      & git clean -ffdx
                      if ($LASTEXITCODE -ne 0) {{ throw "Unable to clean exact native checkout: $LASTEXITCODE" }}
                      if (-not [string]::IsNullOrWhiteSpace((git status --porcelain --untracked-files=all))) {{ throw 'Native CI checkout is not clean.' }}
                      Write-Host "native_checkout=PASS event_ref=$eventRef head=$expected frozen_branch_objects=true"
                  }}
                  finally {{ Pop-Location }}
          '''
          replace_exact('.github/workflows/ci.yml', checkout_old, checkout_new, count=2)
          replace_exact(
              '.github/workflows/ci.yml',
              "          Write-Host 'ci_input_policy=tracked-files-only-explicit-workspace-clean'\n",
              "          Write-Host 'ci_checkout_policy=native-git-exact-event-ref-all-heads-no-codeload-action'\n          Write-Host 'ci_input_policy=tracked-files-only-explicit-workspace-clean'\n",
          )

          replace_exact(
              'scripts/ga/rebind_windows_authority_final_release.py',
              '''    windows = value.get("windows_authority") if isinstance(value.get("windows_authority"), dict) else {}\n''',
              '''    equivalence = value.get("source_equivalence") if isinstance(value.get("source_equivalence"), dict) else {}\n    if equivalence.get("comparison_mode") != "independent-frozen-anchors":\n        raise RuntimeError("Final rebind source-equivalence mode mismatch")\n    if equivalence.get("frozen_release_anchors_must_exist") is not True:\n        raise RuntimeError("Final rebind must require both frozen release anchors")\n    if equivalence.get("rc4_must_be_ancestor_of_final") is not False:\n        raise RuntimeError("Final rebind must not claim ancestry between independent frozen release anchors")\n    if equivalence.get("normalized_init_must_match") is not True or equivalence.get("normalized_pyproject_must_match") is not True:\n        raise RuntimeError("Final rebind normalized source-equivalence requirements are incomplete")\n    windows = value.get("windows_authority") if isinstance(value.get("windows_authority"), dict) else {}\n''',
          )
          replace_exact(
              'scripts/ga/rebind_windows_authority_final_release.py',
              '''    ancestor = subprocess.run(\n        ["git", "-C", str(final_source), "merge-base", "--is-ancestor", rc4_commit, final_commit],\n        stdout=subprocess.PIPE,\n        stderr=subprocess.PIPE,\n        text=True,\n        check=False,\n    )\n    if ancestor.returncode != 0:\n        raise RuntimeError("Frozen RC4 release commit is not an ancestor of the final release commit")\n\n''',
              '''    equivalence = contract["source_equivalence"]\n    if equivalence.get("comparison_mode") != "independent-frozen-anchors":\n        raise RuntimeError("Frozen release source-equivalence mode is not independent-frozen-anchors")\n    if equivalence.get("frozen_release_anchors_must_exist") is not True or equivalence.get("rc4_must_be_ancestor_of_final") is not False:\n        raise RuntimeError("Frozen release anchor topology contract mismatch")\n    for label, commit in (("RC4", rc4_commit), ("final", final_commit)):\n        try:\n            _git(final_source, "cat-file", "-e", f"{commit}^{{commit}}")\n        except RuntimeError as exc:\n            raise RuntimeError(f"Frozen {label} release commit is unavailable in the source object store: {commit}") from exc\n\n''',
          )
          replace_exact(
              'scripts/ga/rebind_windows_authority_final_release.py',
              '''        "rc4_is_ancestor_of_final": True,\n        "runtime_changed_paths": runtime_changed,\n''',
              '''        "comparison_mode": "independent-frozen-anchors",\n        "frozen_release_anchors_available": True,\n        "rc4_is_ancestor_of_final": False,\n        "runtime_changed_paths": runtime_changed,\n''',
          )

          replace_exact(
              'tests/test_windows_authority_final_windows_evidence_rebind.py',
              '''        self.assertTrue(equivalence["rc4_must_be_ancestor_of_final"])\n        self.assertEqual(equivalence["runtime_changed_paths"], ["src/psmatrix/__init__.py"])\n        self.assertEqual(equivalence["authoritative_fixture_changed_paths"], [])\n        self.assertTrue(equivalence["normalized_init_must_match"])\n''',
              '''        self.assertEqual(equivalence["comparison_mode"], "independent-frozen-anchors")\n        self.assertTrue(equivalence["frozen_release_anchors_must_exist"])\n        self.assertFalse(equivalence["rc4_must_be_ancestor_of_final"])\n        self.assertEqual(equivalence["runtime_changed_paths"], ["src/psmatrix/__init__.py"])\n        self.assertEqual(equivalence["authoritative_fixture_changed_paths"], [])\n        self.assertTrue(equivalence["normalized_init_must_match"])\n        self.assertTrue(equivalence["normalized_pyproject_must_match"])\n''',
          )
          replace_exact(
              'tests/test_windows_authority_final_windows_evidence_rebind.py',
              '''        self.assertTrue(result["rc4_is_ancestor_of_final"])\n        self.assertEqual(result["runtime_changed_paths"], ["src/psmatrix/__init__.py"])\n''',
              '''        self.assertEqual(result["comparison_mode"], "independent-frozen-anchors")\n        self.assertTrue(result["frozen_release_anchors_available"])\n        self.assertFalse(result["rc4_is_ancestor_of_final"])\n        self.assertEqual(result["runtime_changed_paths"], ["src/psmatrix/__init__.py"])\n''',
          )

          replace_exact(
              '.github/workflows/ga-windows-authority-final-windows-evidence-rebind-source-preflight.yml',
              '''          git merge-base --is-ancestor $env:RC4_RELEASE_COMMIT $env:FINAL_RELEASE_COMMIT\n          if ($LASTEXITCODE -ne 0) { throw 'RC4 release source is not an ancestor of final source.' }\n\n          $contract = Get-Content 'ga-packs\\03-authoritative-windows\\final-windows-evidence-rebind-control-contract.json' -Raw | ConvertFrom-Json\n''',
              '''          $contract = Get-Content 'ga-packs\\03-authoritative-windows\\final-windows-evidence-rebind-control-contract.json' -Raw | ConvertFrom-Json\n          if ([string]$contract.source_equivalence.comparison_mode -ne 'independent-frozen-anchors' -or [bool]$contract.source_equivalence.frozen_release_anchors_must_exist -ne $true -or [bool]$contract.source_equivalence.rc4_must_be_ancestor_of_final -ne $false) { throw 'Final Windows rebind frozen-source topology contract mismatch.' }\n''',
          )
          replace_exact(
              '.github/workflows/ga-windows-authority-final-windows-evidence-rebind-source-preflight.yml',
              "          Write-Host 'authoritative_fixture_changes=0'\n",
              "          Write-Host 'authoritative_fixture_changes=0'\n          Write-Host 'rc4_final_source_equivalence=PASS comparison_mode=independent-frozen-anchors'\n",
          )

          replace_exact(
              '.github/workflows/ga-windows-authority-final-windows-evidence-rebind.yml',
              '      - name: Verify active final lock, exact source lineage, and RC4 control ancestry\n',
              '      - name: Verify active release locks and frozen source equivalence\n',
          )
          replace_exact(
              '.github/workflows/ga-windows-authority-final-windows-evidence-rebind.yml',
              '''          git -C $finalSource merge-base --is-ancestor $env:RC4_RELEASE_COMMIT $env:FINAL_RELEASE_COMMIT\n          if ($LASTEXITCODE -ne 0) { throw 'RC4 release source is not an ancestor of final release source.' }\n          Write-Host 'active_release_locks=PASS'\n          Write-Host 'rc4_final_source_lineage=PASS'\n''',
              '''          $rebindContract = Get-Content (Join-Path $control 'ga-packs\\03-authoritative-windows\\final-windows-evidence-rebind-control-contract.json') -Raw | ConvertFrom-Json\n          if ([string]$rebindContract.source_equivalence.comparison_mode -ne 'independent-frozen-anchors' -or [bool]$rebindContract.source_equivalence.frozen_release_anchors_must_exist -ne $true -or [bool]$rebindContract.source_equivalence.rc4_must_be_ancestor_of_final -ne $false) { throw 'Final Windows rebind frozen-source topology contract mismatch.' }\n          foreach ($sha in @($env:RC4_RELEASE_COMMIT,$env:FINAL_RELEASE_COMMIT)) {\n              git -C $finalSource cat-file -e "$sha^{commit}"\n              if ($LASTEXITCODE -ne 0) { throw "Frozen release source commit is unavailable: $sha" }\n          }\n          $runtimeChanges = @((git -C $finalSource diff --name-only "$env:RC4_RELEASE_COMMIT..$env:FINAL_RELEASE_COMMIT" -- src/psmatrix) | ForEach-Object { $_.Trim().Replace('\\','/') } | Where-Object { $_ })\n          if ($runtimeChanges.Count -ne 1 -or $runtimeChanges[0] -ne 'src/psmatrix/__init__.py') { throw "RC4/final runtime-source equivalence changed: $($runtimeChanges -join ',')" }\n          $fixtureChanges = @((git -C $finalSource diff --name-only "$env:RC4_RELEASE_COMMIT..$env:FINAL_RELEASE_COMMIT" -- fixtures/windows-authoritative) | Where-Object { $_ })\n          if ($fixtureChanges.Count -ne 0) { throw "Authoritative Windows fixtures changed between RC4 and final: $($fixtureChanges -join ',')" }\n          Write-Host 'active_release_locks=PASS'\n          Write-Host 'rc4_final_source_equivalence=PASS comparison_mode=independent-frozen-anchors'\n''',
          )

          changed = [
              '.github/workflows/ci.yml',
              '.github/workflows/ga-windows-authority-final-windows-evidence-rebind-source-preflight.yml',
              '.github/workflows/ga-windows-authority-final-windows-evidence-rebind.yml',
              'scripts/ga/rebind_windows_authority_final_release.py',
              'tests/test_windows_authority_final_windows_evidence_rebind.py',
          ]
          print('patched_files=' + ','.join(changed))
          PY

      - name: Validate patched controls
        working-directory: repo
        run: |
          set -euo pipefail
          python -m py_compile scripts/ga/rebind_windows_authority_final_release.py tests/test_windows_authority_final_windows_evidence_rebind.py
          PYTHONPATH=src python -m unittest -v tests.test_windows_authority_final_windows_evidence_rebind
          grep -q "native-git-exact-event-ref-all-heads-no-codeload-action" .github/workflows/ci.yml
          grep -q "comparison_mode=independent-frozen-anchors" .github/workflows/ga-windows-authority-final-windows-evidence-rebind.yml
          if git grep -n "RC4 release source is not an ancestor of final" -- .github scripts tests; then
            echo 'stale ancestry assertion remains' >&2
            exit 1
          fi
          git diff --check

      - name: Commit and push exact patch
        working-directory: repo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            .github/workflows/ci.yml \
            .github/workflows/ga-windows-authority-final-windows-evidence-rebind-source-preflight.yml \
            .github/workflows/ga-windows-authority-final-windows-evidence-rebind.yml \
            scripts/ga/rebind_windows_authority_final_release.py \
            tests/test_windows_authority_final_windows_evidence_rebind.py
          test -n "$(git diff --cached --name-only)"
          git commit -m "ci: harden frozen source equivalence checkout"
          basic="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $basic" push origin "HEAD:refs/heads/$TARGET_BRANCH"
