name: ops-windows-lab-prereq-audit

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ops-windows-lab-prereq-audit.yml
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: ops-windows-lab-prereq-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: [self-hosted, Windows, X64, psmatrix-hyperv]
    timeout-minutes: 10
    environment: production-ga-windows-lab
    env:
      GH_TOKEN: ${{ github.token }}
      PSMATRIX_WINDOWS_GA_ROOT: ${{ vars.PSMATRIX_WINDOWS_GA_ROOT }}
      PSMATRIX_WPS40_ADMIN_PASSWORD: ${{ secrets.PSMATRIX_WPS40_ADMIN_PASSWORD }}
      PSMATRIX_WPS50_ADMIN_PASSWORD: ${{ secrets.PSMATRIX_WPS50_ADMIN_PASSWORD }}
      PSMATRIX_WPS51_ADMIN_PASSWORD: ${{ secrets.PSMATRIX_WPS51_ADMIN_PASSWORD }}
    steps:
      - name: Audit value-free Windows lab prerequisites
        id: audit
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          function Test-PathWithinRoot {
            param(
              [Parameter(Mandatory)] [string]$Candidate,
              [Parameter(Mandatory)] [string]$Root
            )

            $candidateFull = [IO.Path]::GetFullPath($Candidate).TrimEnd('\', '/')
            $rootBase = [IO.Path]::GetFullPath($Root).TrimEnd('\', '/')
            if ($candidateFull.Equals($rootBase, [StringComparison]::OrdinalIgnoreCase)) {
              return $true
            }
            $rootPrefix = $rootBase + [IO.Path]::DirectorySeparatorChar
            return $candidateFull.StartsWith($rootPrefix, [StringComparison]::OrdinalIgnoreCase)
          }

          function Test-NoLinkOrReparsePath {
            param([Parameter(Mandatory)] [string]$Path)

            try {
              $current = Get-Item -LiteralPath $Path -Force -ErrorAction Stop
              while ($null -ne $current) {
                $linkProperty = $current.PSObject.Properties['LinkType']
                $linkType = if ($null -ne $linkProperty) { [string]$linkProperty.Value } else { '' }
                $isReparsePoint = (($current.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0)
                if ($isReparsePoint -or -not [string]::IsNullOrWhiteSpace($linkType)) {
                  return $false
                }

                if ($current -is [IO.FileInfo]) { $current = $current.Directory }
                elseif ($current -is [IO.DirectoryInfo]) { $current = $current.Parent }
                else { break }
              }
              return $true
            }
            catch {
              return $false
            }
          }

          $rootConfigured = -not [string]::IsNullOrWhiteSpace($env:PSMATRIX_WINDOWS_GA_ROOT)
          $rootAbsolute = $false
          $rootExists = $false
          $rootRepositoryDisjoint = $false
          $rootNoReparsePoints = $false
          $layoutNoReparsePoints = $false
          $mediaExternalExists = $false
          $isoCount = 0
          $configExists = $false
          $hypervCmd = $null -ne (Get-Command Get-VM -ErrorAction SilentlyContinue)
          $vmmsRunning = $false

          if ($rootConfigured) {
            $rootAbsolute = [System.IO.Path]::IsPathRooted($env:PSMATRIX_WINDOWS_GA_ROOT)
          }
          if ($rootConfigured -and $rootAbsolute) {
            $root = [System.IO.Path]::GetFullPath($env:PSMATRIX_WINDOWS_GA_ROOT)
            $rootExists = Test-Path -LiteralPath $root -PathType Container
            if ($rootExists) {
              if (-not [string]::IsNullOrWhiteSpace($env:GITHUB_WORKSPACE)) {
                $workspace = [IO.Path]::GetFullPath($env:GITHUB_WORKSPACE)
                $rootRepositoryDisjoint = -not (Test-PathWithinRoot -Candidate $root -Root $workspace) -and -not (Test-PathWithinRoot -Candidate $workspace -Root $root)
              }
              $rootNoReparsePoints = Test-NoLinkOrReparsePath -Path $root

              $external = Join-Path $root 'media\external'
              $config = Join-Path $root 'config'
              $mediaExternalExists = Test-Path -LiteralPath $external -PathType Container
              $configExists = Test-Path -LiteralPath $config -PathType Container
              if ($mediaExternalExists -and $configExists) {
                $layoutNoReparsePoints = (Test-NoLinkOrReparsePath -Path $external) -and (Test-NoLinkOrReparsePath -Path $config)
              }
              if ($mediaExternalExists) {
                $isoCount = @(Get-ChildItem -LiteralPath $external -File -Filter '*.iso' -ErrorAction SilentlyContinue).Count
              }
            }
          }

          $svc = Get-Service -Name vmms -ErrorAction SilentlyContinue
          if ($null -ne $svc -and $svc.Status -eq 'Running') { $vmmsRunning = $true }

          $wps40 = -not [string]::IsNullOrWhiteSpace($env:PSMATRIX_WPS40_ADMIN_PASSWORD)
          $wps50 = -not [string]::IsNullOrWhiteSpace($env:PSMATRIX_WPS50_ADMIN_PASSWORD)
          $wps51 = -not [string]::IsNullOrWhiteSpace($env:PSMATRIX_WPS51_ADMIN_PASSWORD)
          $runnerExact = ($env:RUNNER_NAME -eq 'NAVEAX') -and ($env:RUNNER_OS -eq 'Windows')
          $runnerArchX64 = ($env:RUNNER_ARCH -eq 'X64')

          $required = @(
            [pscustomobject]@{ Name = 'runner_exact_naveax'; Value = $runnerExact }
            [pscustomobject]@{ Name = 'runner_arch_x64'; Value = $runnerArchX64 }
            [pscustomobject]@{ Name = 'ga_root_configured'; Value = $rootConfigured }
            [pscustomobject]@{ Name = 'ga_root_absolute'; Value = $rootAbsolute }
            [pscustomobject]@{ Name = 'ga_root_exists'; Value = $rootExists }
            [pscustomobject]@{ Name = 'ga_root_repository_disjoint'; Value = $rootRepositoryDisjoint }
            [pscustomobject]@{ Name = 'ga_root_no_reparse_points'; Value = $rootNoReparsePoints }
            [pscustomobject]@{ Name = 'ga_config_dir_exists'; Value = $configExists }
            [pscustomobject]@{ Name = 'media_external_dir_exists'; Value = $mediaExternalExists }
            [pscustomobject]@{ Name = 'ga_layout_no_reparse_points'; Value = $layoutNoReparsePoints }
            [pscustomobject]@{ Name = 'hyperv_cmd_available'; Value = $hypervCmd }
            [pscustomobject]@{ Name = 'vmms_running'; Value = $vmmsRunning }
            [pscustomobject]@{ Name = 'wps40_admin_secret_present'; Value = $wps40 }
            [pscustomobject]@{ Name = 'wps50_admin_secret_present'; Value = $wps50 }
            [pscustomobject]@{ Name = 'wps51_admin_secret_present'; Value = $wps51 }
          )
          $failed = @($required | Where-Object { -not [bool]$_.Value } | ForEach-Object { [string]$_.Name })
          $auditPass = ($failed.Count -eq 0)

          $rows = [ordered]@{
            schema = 2
            kind = 'psmatrix.windows-lab-prerequisite-audit'
            audit_pass = $auditPass
            runner_exact_naveax = $runnerExact
            runner_arch_x64 = $runnerArchX64
            ga_root_configured = $rootConfigured
            ga_root_absolute = $rootAbsolute
            ga_root_exists = $rootExists
            ga_root_repository_disjoint = $rootRepositoryDisjoint
            ga_root_no_reparse_points = $rootNoReparsePoints
            ga_config_dir_exists = $configExists
            media_external_dir_exists = $mediaExternalExists
            ga_layout_no_reparse_points = $layoutNoReparsePoints
            external_iso_count = $isoCount
            external_iso_count_gate = $false
            hyperv_cmd_available = $hypervCmd
            vmms_running = $vmmsRunning
            wps40_admin_secret_present = $wps40
            wps50_admin_secret_present = $wps50
            wps51_admin_secret_present = $wps51
            failed_required_checks = $failed
          }

          $json = $rows | ConvertTo-Json -Compress -Depth 4
          "AUDIT_JSON=$json" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          $status = if ($auditPass) { 'PASS' } else { 'FAIL' }
          Write-Host ('windows_lab_prereq_audit=OBSERVED status={0} required_failed={1} iso_count_informational={2}' -f $status,$failed.Count,$isoCount)
          Write-Host 'secret_values_logged=false'
          Write-Host 'secret_hashes_logged=false'
          Write-Host 'secret_lengths_logged=false'

      - name: Publish value-free audit to issue 261
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:AUDIT_JSON)) {
            throw 'Windows-lab prerequisite audit state was not materialized.'
          }
          $v = $env:AUDIT_JSON | ConvertFrom-Json
          $failed = @($v.failed_required_checks)
          $failedText = if ($failed.Count -eq 0) { 'none' } else { $failed -join ', ' }
          $gateStatus = if ([bool]$v.audit_pass) { 'PASS' } else { 'FAIL' }
          $body = @"
          ### Windows-lab prerequisite audit

          Run: $env:GITHUB_RUN_ID
          Attempt: $env:GITHUB_RUN_ATTEMPT
          Head: $env:GITHUB_SHA
          Gate status: $gateStatus
          Failed required checks: $failedText
          Runner exact NAVEAX/Windows: $($v.runner_exact_naveax)
          Runner architecture X64: $($v.runner_arch_x64)
          GA root configured: $($v.ga_root_configured)
          GA root absolute: $($v.ga_root_absolute)
          GA root exists: $($v.ga_root_exists)
          GA root/repository disjoint: $($v.ga_root_repository_disjoint)
          GA root has no links/reparse points: $($v.ga_root_no_reparse_points)
          GA config directory exists: $($v.ga_config_dir_exists)
          External media directory exists: $($v.media_external_dir_exists)
          GA layout has no links/reparse points: $($v.ga_layout_no_reparse_points)
          External ISO count (informational, not a prerequisite gate): $($v.external_iso_count)
          Hyper-V cmdlets available: $($v.hyperv_cmd_available)
          VMMS running: $($v.vmms_running)
          WinPS 4.0 admin secret present: $($v.wps40_admin_secret_present)
          WinPS 5.0 admin secret present: $($v.wps50_admin_secret_present)
          WinPS 5.1 admin secret present: $($v.wps51_admin_secret_present)

          The raw ISO count is intentionally informational; canonical RC4 media completeness is enforced later by the reviewed media inventory/selection workflow.
          No secret values, hashes, lengths, or configured paths were emitted.
          "@

          $commentId = @(
            gh api --paginate "repos/$env:GITHUB_REPOSITORY/issues/261/comments?per_page=100" --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("### Windows-lab prerequisite audit"))) | .id'
          ) | Select-Object -Last 1
          if ($LASTEXITCODE -ne 0) { throw 'Failed to locate existing Windows-lab prerequisite audit comment.' }

          if (-not [string]::IsNullOrWhiteSpace([string]$commentId)) {
            gh api "repos/$env:GITHUB_REPOSITORY/issues/comments/$commentId" --method PATCH -f body="$body" | Out-Null
            if ($LASTEXITCODE -ne 0) { throw 'Failed to update Windows-lab prerequisite audit comment.' }
            Write-Host "windows_lab_prereq_audit_comment=updated id=$commentId"
          }
          else {
            gh api "repos/$env:GITHUB_REPOSITORY/issues/261/comments" --method POST -f body="$body" | Out-Null
            if ($LASTEXITCODE -ne 0) { throw 'Failed to publish Windows-lab prerequisite audit comment.' }
            Write-Host 'windows_lab_prereq_audit_comment=created'
          }
          Write-Host 'audit_comment_idempotent=true'

      - name: Enforce required Windows lab prerequisites
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:AUDIT_JSON)) {
            throw 'Windows-lab prerequisite audit state is unavailable for enforcement.'
          }
          $v = $env:AUDIT_JSON | ConvertFrom-Json
          $failed = @($v.failed_required_checks)
          if (-not [bool]$v.audit_pass -or $failed.Count -ne 0) {
            $failedText = if ($failed.Count -eq 0) { '<unknown>' } else { $failed -join ', ' }
            throw "Windows-lab prerequisite audit failed required checks: $failedText"
          }
          Write-Host 'windows_lab_prereq_audit=PASS fail_closed=true'
          Write-Host 'external_iso_count_gate=false'
          Write-Host 'secret_values_logged=false'
