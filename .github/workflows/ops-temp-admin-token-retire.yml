name: ops-temp-admin-token-retire

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ops-temp-admin-token-retire.yml'
  workflow_dispatch:

concurrency:
  group: ops-temp-admin-token-retire
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  retire:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      RETIRE_TOKEN: ${{ secrets.PSMATRIX_TEMP_ADMIN_TOKEN }}
      STATE_ISSUE: '262'
      SECRET_NAME: PSMATRIX_TEMP_ADMIN_TOKEN
    steps:
      - name: Diagnose and retire temporary repository admin secret safely
        id: retire
        shell: bash
        run: |
          set -euo pipefail
          outcome='already_absent'
          http_status='000'

          if [[ -n "$RETIRE_TOKEN" ]]; then
            endpoint="https://api.github.com/repos/$GITHUB_REPOSITORY/actions/secrets/$SECRET_NAME"
            http_status=$(curl --silent --show-error \
              --output "$RUNNER_TEMP/retire-response.json" \
              --write-out '%{http_code}' \
              --request DELETE \
              --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              --header "Authorization: Bearer $RETIRE_TOKEN" \
              "$endpoint" || true)

            case "$http_status" in
              204) outcome='deleted' ;;
              401) outcome='delete_failed_unauthorized' ;;
              403) outcome='delete_failed_forbidden' ;;
              404) outcome='delete_failed_not_found_or_scope_hidden' ;;
              *) outcome='delete_failed' ;;
            esac
          fi

          echo "outcome=$outcome" >> "$GITHUB_OUTPUT"
          echo "http_status=$http_status" >> "$GITHUB_OUTPUT"
          echo "temporary_admin_secret_retire=$outcome"
          echo "retire_http_status=$http_status"
          echo 'response_body_logged=false'
          echo 'secret_value_logged=false'

      - name: Publish retirement result
        shell: bash
        env:
          OUTCOME: ${{ steps.retire.outputs.outcome }}
          HTTP_STATUS: ${{ steps.retire.outputs.http_status }}
        run: |
          set -euo pipefail
          body="OPS_TEMP_ADMIN_TOKEN_RETIRE status=$OUTCOME http_status=$HTTP_STATUS secret_name=$SECRET_NAME response_body_logged=false secret_value_logged=false"
          gh issue comment "$STATE_ISSUE" --repo "$GITHUB_REPOSITORY" --body "$body"
          case "$OUTCOME" in
            deleted|already_absent) ;;
            *)
              echo "Temporary admin secret retirement failed with HTTP status $HTTP_STATUS." >&2
              exit 1
              ;;
          esac
          echo "$body"
