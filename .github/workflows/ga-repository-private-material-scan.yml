name: production-ga-repository-private-material-scan

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  tracked-private-material-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Scan git-tracked repository for private material
        run: >-
          python scripts/ga/scan_repository_private_material.py
          --root .
          --expected-head "${GITHUB_SHA}"
          --output "${RUNNER_TEMP}/repository-private-material-scan.json"

      - name: Upload scan receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: psmatrix-2.0.0-repository-private-material-scan-${{ github.run_id }}
          path: ${{ runner.temp }}/repository-private-material-scan.json
          if-no-files-found: warn
          retention-days: 14
