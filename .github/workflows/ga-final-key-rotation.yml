name: production-ga-final-key-rotation

on:
  workflow_dispatch:
    inputs:
      release_signing_run_id:
        description: Successful protected final 2.0.0 signing workflow run ID from this exact control head
        required: true
        type: string

concurrency:
  group: production-ga-final-key-rotation
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  produce-key-rotation:
    name: Run bounded rotation/revocation drill and sign with exact release authority
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production-ga-release-signing
    permissions:
      contents: read
      actions: read
    env:
      RELEASE_SIGNING_RUN_ID: ${{ inputs.release_signing_run_id }}

    steps:
      - name: Validate key-rotation dispatch identity
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_SIGNING_RUN_ID" =~ ^[0-9]+$ ]] || { echo 'release_signing_run_id must contain only decimal digits.' >&2; exit 1; }
          [[ "$RELEASE_SIGNING_RUN_ID" != "$GITHUB_RUN_ID" ]] || { echo 'release signing and key-rotation run IDs must be distinct.' >&2; exit 1; }
          echo 'key_rotation_dispatch_identity=PASS'

      - name: Check out exact operations/release producer controls
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1
        with:
          path: control
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.2.0
        with:
          python-version: "3.12"

      - name: Validate exact protected final release run before release-key access
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PYTHONPATH=control/src python - <<'PY'
          import json, os, subprocess, urllib.request
          from pathlib import Path
          head=subprocess.check_output(['git','-C','control','rev-parse','HEAD'],text=True).strip().lower()
          if head!=os.environ['GITHUB_SHA'].lower():
              raise SystemExit('key-rotation control checkout is not exact GITHUB_SHA')
          if subprocess.check_output(['git','-C','control','status','--porcelain'],text=True).strip():
              raise SystemExit('key-rotation control checkout is dirty')
          contract=json.loads(Path('control/ga-packs/03-authoritative-windows/final-operations-release-evidence-producer-contract.json').read_text(encoding='utf-8'))
          rotation=contract.get('key_rotation') or {}
          if rotation.get('workflow')!='production-ga-final-key-rotation' or rotation.get('authority')!='release':
              raise SystemExit('key-rotation workflow/authority contract mismatch')
          if rotation.get('actual_release_authority_rotation_allowed') is not False:
              raise SystemExit('key-rotation contract must forbid actual release authority rotation')
          run_id=os.environ['RELEASE_SIGNING_RUN_ID']
          headers={'Accept':'application/vnd.github+json','Authorization':f'Bearer {os.environ["GH_TOKEN"]}','X-GitHub-Api-Version':'2026-03-10','User-Agent':'psmatrix-final-key-rotation'}
          def fetch(path):
              request=urllib.request.Request(f'https://api.github.com/repos/Naveax/PSMatrix/{path}',headers=headers)
              with urllib.request.urlopen(request,timeout=30) as response:
                  return json.load(response)
          run=fetch(f'actions/runs/{run_id}')
          if run.get('name')!='production-ga-windows-authority-final-release-sign-from-lock' or run.get('event')!='workflow_dispatch':
              raise SystemExit('key-rotation final-signing workflow provenance mismatch')
          if run.get('status')!='completed' or run.get('conclusion')!='success':
              raise SystemExit('key-rotation final-signing run is not completed successfully')
          if (run.get('head_sha') or '').lower()!=head:
              raise SystemExit('key-rotation final-signing run does not share exact control head')
          artifacts=fetch(f'actions/runs/{run_id}/artifacts?per_page=100').get('artifacts',[])
          matches=[item for item in artifacts if item.get('name')=='psmatrix-2.0.0-protected-release' and not item.get('expired')]
          if len(matches)!=1:
              raise SystemExit(f'expected exactly one non-expired protected final release artifact; found {len(matches)}')
          print(f'key_rotation_release_provenance=PASS run_id={run_id} artifact_id={matches[0].get("id")}')
          PY

      - name: Download exact protected final release
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: psmatrix-2.0.0-protected-release
          path: signed-release
          repository: Naveax/PSMatrix
          run-id: ${{ inputs.release_signing_run_id }}
          github-token: ${{ github.token }}

      - name: Revalidate release authority and install exact final wheel before private-key access
        shell: bash
        run: |
          set -euo pipefail
          runtime="$RUNNER_TEMP/psmatrix-final-key-rotation-runtime"
          wheel_path_file="$RUNNER_TEMP/psmatrix-final-key-rotation-wheel-path.txt"
          rm -rf "$runtime"
          rm -f "$wheel_path_file"
          mkdir -p "$runtime"
          PSMATRIX_ROTATION_WHEEL_PATH_FILE="$wheel_path_file" PYTHONPATH=control/src python - <<'PY'
          import json, os
          from pathlib import Path
          from psmatrix.release import verify_release_manifest
          from psmatrix.signing import public_key_id
          from psmatrix.util import sha256_file

          release=Path('signed-release')
          manifest=release/'psmatrix-2.0.0-release.json'
          public=release/'psmatrix-2.0.0-release-public.pem'
          status_path=release/'psmatrix-2.0.0-protected-release-signing-status.json'
          verified=verify_release_manifest(manifest,release,signing_public_key=public)
          if verified.get('valid') is not True or verified.get('version')!='2.0.0':
              raise SystemExit('protected final release verification failed before key-rotation drill')
          status=json.loads(status_path.read_text(encoding='utf-8'))
          if status.get('release_artifacts_signed') is not True or status.get('version')!='2.0.0' or status.get('release_commit')!='02cef95d40cf524ce00f9d917188343dc49e6f2c':
              raise SystemExit('protected final release signing status is not exact final/signed')
          root=json.loads(manifest.read_text(encoding='utf-8'))
          body=root.get('manifest') if isinstance(root,dict) else None
          artifacts=body.get('artifacts') if isinstance(body,dict) else None
          wheels=[item for item in artifacts or [] if isinstance(item,dict) and str(item.get('name') or '').endswith('.whl')]
          if len(wheels)!=1:
              raise SystemExit(f'signed final release must declare exactly one wheel; found {len(wheels)}')
          wheel=wheels[0]
          path=release/str(wheel.get('name') or '')
          if not path.is_file() or path.is_symlink():
              raise SystemExit('declared final release wheel is missing or unsafe')
          digest=sha256_file(path)
          if int(wheel.get('size') or 0)!=path.stat().st_size or str(wheel.get('sha256') or '').lower()!=digest:
              raise SystemExit('declared final release wheel identity differs from verified bytes')
          Path(os.environ['PSMATRIX_ROTATION_WHEEL_PATH_FILE']).write_text(str(path.resolve())+'\n',encoding='utf-8')
          key_id=public_key_id(public)
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as stream:
              stream.write(f'EXPECTED_RELEASE_KEY_ID={key_id}\n')
              stream.write(f'EXPECTED_RELEASE_PUBLIC_SHA256={sha256_file(public)}\n')
              stream.write(f'PSMATRIX_FINAL_ROTATION_WHEEL_SHA256={digest}\n')
          print(f'key_rotation_release_pre_secret=PASS key_id={key_id} wheel={path.name} sha256={digest}')
          PY
          wheel_path="$(cat "$wheel_path_file")"
          [[ -n "$wheel_path" && -f "$wheel_path" ]] || { echo 'verified final key-rotation wheel path was not materialized' >&2; exit 1; }
          python -m pip install --disable-pip-version-check --no-index --no-deps --target "$runtime" "$wheel_path"
          PSMATRIX_EXPECTED_RUNTIME_ROOT="$runtime" PYTHONPATH="$runtime" python - <<'PY'
          import importlib.metadata
          import os
          from pathlib import Path
          import psmatrix
          import psmatrix.ga
          import psmatrix.signing

          root=Path(os.environ['PSMATRIX_EXPECTED_RUNTIME_ROOT']).resolve()
          paths=(
              Path(psmatrix.__file__).resolve(),
              Path(psmatrix.ga.__file__).resolve(),
              Path(psmatrix.signing.__file__).resolve(),
              Path(importlib.metadata.distribution('psmatrix').locate_file('')).resolve(),
          )
          for path in paths:
              try:
                  path.relative_to(root)
              except ValueError as exc:
                  raise SystemExit(f'key-rotation runtime escaped exact final wheel target: {path}') from exc
          version=importlib.metadata.version('psmatrix')
          if version!='2.0.0':
              raise SystemExit(f'exact final key-rotation runtime version mismatch: {version!r}')
          print(f'key_rotation_exact_wheel_runtime=PASS version={version}')
          PY
          rm -f "$wheel_path_file"
          echo "PSMATRIX_FINAL_ROTATION_RUNTIME=$runtime" >> "$GITHUB_ENV"
          echo 'key_rotation_checkout_source_execution=false'
          echo 'key_rotation_wheel_install_mode=offline-no-index-no-deps'

      - name: Materialize exact release private authority, run bounded drill, verify, and remove private key
        shell: bash
        env:
          RELEASE_PRIVATE_KEY: ${{ secrets.PSMATRIX_RELEASE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          [[ -n "$RELEASE_PRIVATE_KEY" ]] || { echo 'PSMATRIX_RELEASE_PRIVATE_KEY is missing from production-ga-release-signing.' >&2; exit 1; }
          key_root="$RUNNER_TEMP/psmatrix-final-key-rotation-release-key"
          output="$RUNNER_TEMP/psmatrix-2.0.0-final-key-rotation"
          rm -rf "$key_root" "$output"
          install -d -m 0700 "$key_root" "$output"
          printf '%s\n' "$RELEASE_PRIVATE_KEY" > "$key_root/release.private.pem"
          chmod 0600 "$key_root/release.private.pem"
          cleanup() {
            shred -u "$key_root/release.private.pem" 2>/dev/null || rm -f "$key_root/release.private.pem"
            rmdir "$key_root" 2>/dev/null || true
          }
          trap cleanup EXIT
          cp signed-release/psmatrix-2.0.0-release-public.pem "$output/release-public.pem"
          PYTHONPATH="$PSMATRIX_FINAL_ROTATION_RUNTIME" python -m psmatrix.cli ga key-rotation-drill \
            --private-key "$key_root/release.private.pem" \
            --public-key "$output/release-public.pem" \
            --output "$output/key-rotation.dsse.json"
          PYTHONPATH="$PSMATRIX_FINAL_ROTATION_RUNTIME" python -m psmatrix.cli ga proof-verify \
            --type key-rotation \
            --attestation "$output/key-rotation.dsse.json" \
            --public-key "$output/release-public.pem" >/dev/null
          PSMATRIX_ROTATION_OUTPUT="$output" PYTHONPATH="$PSMATRIX_FINAL_ROTATION_RUNTIME" python - <<'PY'
          import importlib.metadata
          import os
          from pathlib import Path
          from psmatrix.ga import verify_ga_proof
          from psmatrix.signing import public_key_id
          from psmatrix.util import atomic_write_json, read_json, sha256_file

          if importlib.metadata.version('psmatrix')!='2.0.0':
              raise SystemExit('key-rotation proof verification is not running from final 2.0.0 runtime')
          root=Path(os.environ['PSMATRIX_ROTATION_OUTPUT'])
          public=root/'release-public.pem'
          if public_key_id(public)!=os.environ['EXPECTED_RELEASE_KEY_ID'] or sha256_file(public)!=os.environ['EXPECTED_RELEASE_PUBLIC_SHA256']:
              raise SystemExit('key-rotation output release authority differs from protected final release authority')
          verified=verify_ga_proof(read_json(root/'key-rotation.dsse.json'),public_key=public,expected_type='key-rotation')
          result=verified.get('result')
          if not isinstance(result,dict):
              raise SystemExit('verified key-rotation result payload is missing')
          assertions=result.get('assertions') if isinstance(result.get('assertions'),dict) else {}
          required=('old_signature_rejected','new_signature_accepted','old_key_retired','revocation_enforced')
          if verified.get('valid') is not True or any(assertions.get(name) is not True for name in required):
              raise SystemExit('bounded key-rotation drill lacks required PASS assertions')
          if int(assertions.get('trust_generation') or 0)<2:
              raise SystemExit('bounded key-rotation drill did not advance trust generation')
          if set(verified.get('key_ids') or [])!={os.environ['EXPECTED_RELEASE_KEY_ID']}:
              raise SystemExit('key-rotation proof was not signed exclusively by exact release authority')
          status={'schema':1,'kind':'psmatrix.final-key-rotation-producer-status','status':'PASS','version':'2.0.0','release_key_id':os.environ['EXPECTED_RELEASE_KEY_ID'],'release_public_key_sha256':os.environ['EXPECTED_RELEASE_PUBLIC_SHA256'],'release_wheel_sha256':os.environ['PSMATRIX_FINAL_ROTATION_WHEEL_SHA256'],'exact_release_wheel_runtime':True,'proof_verified':True,'bounded_temporary_trust_drill':True,'actual_release_authority_rotated':False,'release_private_key_copied_to_output':False,'final_ga_evaluator_invoked':False,'ga_eligible':False}
          atomic_write_json(root/'key-rotation-producer-status.json',status)
          markers=(b'-----BEGIN PRIVATE KEY-----',b'-----BEGIN RSA PRIVATE KEY-----',b'-----BEGIN EC PRIVATE KEY-----',b'-----BEGIN OPENSSH PRIVATE KEY-----',b'-----BEGIN ED25519 PRIVATE KEY-----')
          for path in root.rglob('*'):
              if path.is_file() and any(marker in path.read_bytes() for marker in markers):
                  raise SystemExit(f'private-key material found in key-rotation output: {path.name}')
          print('signed_key_rotation=PASS exact_release_authority=true exact_release_wheel=true actual_release_authority_rotated=false')
          print('final_ga_evaluator_invoked=false')
          print('ga_eligible=false')
          PY
          echo "PSMATRIX_ROTATION_OUTPUT=$output" >> "$GITHUB_ENV"

      - name: Upload final release-authority key-rotation proof
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: psmatrix-2.0.0-final-key-rotation
          path: ${{ env.PSMATRIX_ROTATION_OUTPUT }}
          if-no-files-found: error
          retention-days: 30
