name: ops-external22-ready-to-fresh-readiness

on:
  issue_comment:
    types: [created]

concurrency:
  group: ops-external22-ready-to-fresh-readiness
  cancel-in-progress: false

permissions:
  contents: read
  actions: write
  issues: write

jobs:
  audit-and-dispatch:
    if: >-
      github.event.issue.number == 261 &&
      github.event.comment.user.login == 'Naveax' &&
      github.event.comment.author_association == 'OWNER' &&
      github.event.comment.body == 'EXTERNAL22 MATERIAL READY'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      READINESS_BRANCH: final/2.0.0-production-control-plane-publication-anchor
      READINESS_HEAD: 3ffc6b6d7cd58d64224f780aa819b50f50f72491
      FINAL_ACTIVE_BRANCH: release/2.0.0-final-active-lock
      STATE_ISSUE: '262'
      EXTERNAL_ISSUE: '261'
    steps:
      - name: Require and revalidate final signed-release and reviewer-packet prerequisites
        shell: bash
        run: |
          set -euo pipefail
          final_head=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$FINAL_ACTIVE_BRANCH" --jq '.object.sha')
          [[ "$final_head" =~ ^[0-9a-f]{40}$ ]] || { echo 'Final active-lock branch is not ready.' >&2; exit 1; }
          gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$STATE_ISSUE/comments" --jq '.[] | select(.user.login == "github-actions[bot]") | .body' > "$RUNNER_TEMP/state.txt"

          eval "$(FINAL_HEAD="$final_head" python - <<'PY'
          import os,re,shlex
          from pathlib import Path
          lines=Path(os.environ['RUNNER_TEMP'],'state.txt').read_text(encoding='utf-8').splitlines()
          head=os.environ['FINAL_HEAD']
          signed=re.compile(r'^FINAL_GATE_STATE gate=signed_release run_id=([1-9][0-9]*) attempt=([1-9][0-9]*) control_head=([0-9a-f]{40})$')
          packet=re.compile(r'^RC4_CHAIN_STATE stage=security_review_packet run_id=([1-9][0-9]*) attempt=([1-9][0-9]*) control_head=([0-9a-f]{40})$')
          s=[m.groups() for line in lines if (m:=signed.fullmatch(line.strip())) and m.group(3)==head]
          p=[m.groups() for line in lines if (m:=packet.fullmatch(line.strip())) and m.group(3)==head]
          if not s: raise SystemExit('successful protected final signing state is missing')
          if not p: raise SystemExit('successful final security-review packet state is missing')
          if len({x[0] for x in s}) != 1: raise SystemExit('protected final signing ledger is ambiguous for active control head')
          if len({x[0] for x in p}) != 1: raise SystemExit('security-review packet ledger is ambiguous for active control head')
          values={
            'SIGNING_RUN_ID':s[-1][0],
            'SIGNING_ATTEMPT':s[-1][1],
            'PACKET_RUN_ID':p[-1][0],
            'PACKET_ATTEMPT':p[-1][1],
          }
          for key,value in values.items(): print(f'{key}={shlex.quote(value)}')
          PY
          )"

          [[ "$SIGNING_RUN_ID" =~ ^[1-9][0-9]*$ && "$SIGNING_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          [[ "$PACKET_RUN_ID" =~ ^[1-9][0-9]*$ && "$PACKET_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          [[ "$SIGNING_RUN_ID" != "$PACKET_RUN_ID" ]] || { echo 'Signing and security-review packet run IDs must be distinct.' >&2; exit 1; }

          signing=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SIGNING_RUN_ID")
          [[ "$(jq -r '.name' <<<"$signing")" == 'production-ga-windows-authority-final-release-sign-from-lock' ]] || { echo 'Ledger signing run is not canonical protected final signing.' >&2; exit 1; }
          [[ "$(jq -r '.path' <<<"$signing")" == '.github/workflows/ga-windows-authority-final-release-sign-from-lock.yml' ]] || { echo 'Protected final signing workflow path mismatch.' >&2; exit 1; }
          [[ "$(jq -r '.event' <<<"$signing")" == 'workflow_dispatch' ]] || { echo 'Protected final signing event mismatch.' >&2; exit 1; }
          [[ "$(jq -r '.status' <<<"$signing")" == 'completed' && "$(jq -r '.conclusion' <<<"$signing")" == 'success' ]] || { echo 'Protected final signing run is not successful.' >&2; exit 1; }
          [[ "$(jq -r '.head_branch' <<<"$signing")" == "$FINAL_ACTIVE_BRANCH" && "$(jq -r '.head_sha' <<<"$signing")" == "$final_head" ]] || { echo 'Protected final signing branch/head mismatch.' >&2; exit 1; }
          [[ "$(jq -r '.run_attempt' <<<"$signing")" == "$SIGNING_ATTEMPT" ]] || { echo 'Protected final signing attempt does not match ledger.' >&2; exit 1; }
          [[ "$(jq -r '.actor.login' <<<"$signing")" == 'github-actions[bot]' && "$(jq -r '.triggering_actor.login' <<<"$signing")" == 'github-actions[bot]' ]] || { echo 'Protected final signing was not created by the canonical automation chain.' >&2; exit 1; }
          signing_artifacts=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SIGNING_RUN_ID/artifacts?per_page=100" \
            --jq '[.artifacts[] | select(.name == "psmatrix-2.0.0-protected-release" and (.expired|not))] | length')
          [[ "$signing_artifacts" == '1' ]] || { echo "Protected final signing artifact cardinality mismatch: $signing_artifacts" >&2; exit 1; }

          packet=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PACKET_RUN_ID")
          [[ "$(jq -r '.name' <<<"$packet")" == 'production-ga-final-security-review-packet' ]] || { echo 'Ledger packet run is not canonical final security-review packet producer.' >&2; exit 1; }
          [[ "$(jq -r '.path' <<<"$packet")" == '.github/workflows/ga-final-security-review-packet.yml' ]] || { echo 'Final security-review packet workflow path mismatch.' >&2; exit 1; }
          [[ "$(jq -r '.event' <<<"$packet")" == 'workflow_dispatch' ]] || { echo 'Final security-review packet event mismatch.' >&2; exit 1; }
          [[ "$(jq -r '.status' <<<"$packet")" == 'completed' && "$(jq -r '.conclusion' <<<"$packet")" == 'success' ]] || { echo 'Final security-review packet run is not successful.' >&2; exit 1; }
          [[ "$(jq -r '.head_branch' <<<"$packet")" == "$FINAL_ACTIVE_BRANCH" && "$(jq -r '.head_sha' <<<"$packet")" == "$final_head" ]] || { echo 'Final security-review packet branch/head mismatch.' >&2; exit 1; }
          [[ "$(jq -r '.run_attempt' <<<"$packet")" == "$PACKET_ATTEMPT" ]] || { echo 'Final security-review packet attempt does not match ledger.' >&2; exit 1; }
          [[ "$(jq -r '.actor.login' <<<"$packet")" == 'github-actions[bot]' && "$(jq -r '.triggering_actor.login' <<<"$packet")" == 'github-actions[bot]' ]] || { echo 'Final security-review packet was not created by the canonical automation chain.' >&2; exit 1; }
          packet_artifacts=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PACKET_RUN_ID/artifacts?per_page=100" \
            --jq '[.artifacts[] | select(.name == "psmatrix-2.0.0-final-security-review-packet" and (.expired|not))] | length')
          [[ "$packet_artifacts" == '1' ]] || { echo "Final security-review packet artifact cardinality mismatch: $packet_artifacts" >&2; exit 1; }

          echo "external22_final_prerequisites=PASS signing_run=$SIGNING_RUN_ID packet_run=$PACKET_RUN_ID control_head=$final_head provenance=revalidated automated_dispatch=true"

      - name: Revalidate frozen readiness anchor and dispatch one fresh post-external22 readiness run
        shell: bash
        run: |
          set -euo pipefail
          readiness_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$READINESS_BRANCH" --jq '.object.sha')
          [[ "$readiness_sha" == "$READINESS_HEAD" ]] || { echo "Readiness anchor moved: $readiness_sha != $READINESS_HEAD" >&2; exit 1; }

          ready_comments=$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/issues/$EXTERNAL_ISSUE/comments?per_page=100" --jq 'add')
          ready_at=$(jq -r '[.[] | select(.user.login == "Naveax" and .author_association == "OWNER" and .body == "EXTERNAL22 MATERIAL READY") | .created_at] | sort | .[0] // empty' <<<"$ready_comments")
          [[ "$ready_at" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T ]] || { echo 'Canonical EXTERNAL22 MATERIAL READY event timestamp cannot be resolved.' >&2; exit 1; }

          runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ga-final-production-readiness.yml/runs?branch=$READINESS_BRANCH&event=workflow_dispatch&per_page=100")
          existing=$(jq -r --arg head "$READINESS_HEAD" --arg ready "$ready_at" '
            [.workflow_runs[] | select(.head_sha == $head and .created_at >= $ready and .actor.login == "github-actions[bot]" and .triggering_actor.login == "github-actions[bot]")] | sort_by(.created_at) | .[0].id // empty
          ' <<<"$runs")
          noncanonical_active=$(jq -r --arg head "$READINESS_HEAD" --arg ready "$ready_at" '
            [.workflow_runs[] | select(.head_sha == $head and .created_at >= $ready and (.actor.login != "github-actions[bot]" or .triggering_actor.login != "github-actions[bot]") and (.status != "completed"))] | length
          ' <<<"$runs")

          marker="EXTERNAL22_FRESH_READINESS_DISPATCH head=$READINESS_HEAD"
          marker_exists=false
          if jq -r '.[] | select(.user.login == "github-actions[bot]") | .body' <<<"$ready_comments" | grep -Fxq "$marker"; then
            marker_exists=true
          fi

          if [[ -n "$existing" ]]; then
            if [[ "$marker_exists" != true ]]; then
              gh issue comment "$EXTERNAL_ISSUE" --repo "$GITHUB_REPOSITORY" --body "$marker"
            fi
            echo "fresh_production_readiness_duplicate_suppressed=true existing_run_id=$existing source=canonical_bot_actions"
            echo 'external_producers_dispatched=false'
            echo 'ga_eligible=false'
            exit 0
          fi

          if [[ "$marker_exists" == true ]]; then
            echo 'Fresh-readiness ledger marker exists but no matching canonical post-external22 bot run exists; failing closed.' >&2
            exit 1
          fi

          if [[ "$noncanonical_active" -gt 0 ]]; then
            echo "A noncanonical post-external22 readiness run is active on the frozen head; refusing concurrent canonical dispatch. active_runs=$noncanonical_active" >&2
            exit 1
          fi

          gh workflow run ga-final-production-readiness.yml --repo "$GITHUB_REPOSITORY" --ref "$READINESS_BRANCH"
          gh issue comment "$EXTERNAL_ISSUE" --repo "$GITHUB_REPOSITORY" --body "$marker"
          gh issue comment "$EXTERNAL_ISSUE" --repo "$GITHUB_REPOSITORY" --body "External22 operator readiness signal accepted after final signing/packet prerequisites. Fresh canonical Production GA readiness dispatched from \`$READINESS_HEAD\`. The canonical readiness workflow remains responsible for exact environment-name/cardinality validation; external proof producers remain blocked until that fresh readiness run is fully \`12/12 PASS\`."
          echo 'external22_operator_signal_accepted=true'
          echo 'fresh_production_readiness_dispatched=true'
          echo 'external_producers_dispatched=false'
          echo 'ga_eligible=false'
