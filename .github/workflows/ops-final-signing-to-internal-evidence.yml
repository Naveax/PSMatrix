name: ops-final-signing-to-internal-evidence

on:
  workflow_run:
    workflows: [production-ga-windows-authority-final-release-sign-from-lock]
    types: [completed]

concurrency:
  group: ops-final-signing-to-internal-evidence
  cancel-in-progress: false

permissions:
  contents: read
  actions: write
  issues: write

jobs:
  dispatch-internal-evidence:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'workflow_dispatch' &&
      github.event.workflow_run.head_branch == 'release/2.0.0-final-active-lock' &&
      github.event.workflow_run.actor.login == 'github-actions[bot]' &&
      github.event.workflow_run.triggering_actor.login == 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      FINAL_SIGNING_RUN_ID: ${{ github.event.workflow_run.id }}
      FINAL_SIGNING_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
      FINAL_CONTROL_HEAD: ${{ github.event.workflow_run.head_sha }}
      FINAL_ACTIVE_BRANCH: release/2.0.0-final-active-lock
      STATE_ISSUE: '262'
    steps:
      - name: Verify exact final active control and signed artifact
        shell: bash
        run: |
          set -euo pipefail
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$FINAL_ACTIVE_BRANCH" --jq '.object.sha')
          [[ "$current" == "$FINAL_CONTROL_HEAD" ]] || { echo "Final active control moved: $current != $FINAL_CONTROL_HEAD" >&2; exit 1; }
          python - <<'PY'
          import json,os,urllib.request
          repo=os.environ['GITHUB_REPOSITORY']; run_id=os.environ['FINAL_SIGNING_RUN_ID']; head=os.environ['FINAL_CONTROL_HEAD']
          headers={'Accept':'application/vnd.github+json','Authorization':f"Bearer {os.environ['GH_TOKEN']}",'X-GitHub-Api-Version':'2022-11-28','User-Agent':'psmatrix-internal-evidence-dispatch'}
          def fetch(path):
              req=urllib.request.Request(f'https://api.github.com/repos/{repo}/{path}',headers=headers)
              with urllib.request.urlopen(req,timeout=30) as r:return json.load(r)
          run=fetch(f'actions/runs/{run_id}')
          if run.get('name')!='production-ga-windows-authority-final-release-sign-from-lock' or run.get('event')!='workflow_dispatch' or run.get('status')!='completed' or run.get('conclusion')!='success':
              raise SystemExit('protected final signing provenance mismatch')
          if (run.get('head_sha') or '').lower()!=head: raise SystemExit('protected final signing head mismatch')
          if (run.get('actor') or {}).get('login')!='github-actions[bot]' or (run.get('triggering_actor') or {}).get('login')!='github-actions[bot]':
              raise SystemExit('protected final signing was not created by the reviewed-lock merge automation')
          arts=fetch(f'actions/runs/{run_id}/artifacts?per_page=100').get('artifacts',[])
          matches=[a for a in arts if a.get('name')=='psmatrix-2.0.0-protected-release' and not a.get('expired')]
          if len(matches)!=1: raise SystemExit(f'expected exactly one protected final release artifact; found {len(matches)}')
          print(f'internal_evidence_signed_release=PASS artifact_id={matches[0].get("id")} automated_dispatch=true')
          PY

      - name: Dispatch internal evaluator gates once
        shell: bash
        run: |
          set -euo pipefail

          existing_count() {
            local workflow="$1"
            gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs?branch=$FINAL_ACTIVE_BRANCH&event=workflow_dispatch&per_page=100" \
              --jq ".workflow_runs | map(select(.head_sha == \"$FINAL_CONTROL_HEAD\")) | length"
          }

          assert_final_head() {
            local current
            current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$FINAL_ACTIVE_BRANCH" --jq '.object.sha')
            [[ "$current" == "$FINAL_CONTROL_HEAD" ]] || { echo "Final active control moved before internal evidence dispatch: $current != $FINAL_CONTROL_HEAD" >&2; return 1; }
          }

          dispatch_once() {
            local workflow="$1"
            shift
            if [[ "$(existing_count "$workflow")" -eq 0 ]]; then
              assert_final_head
              gh workflow run "$workflow" --repo "$GITHUB_REPOSITORY" --ref "$FINAL_ACTIVE_BRANCH" "$@"
              dispatched=$((dispatched+1))
              echo "internal_evidence_dispatched workflow=$workflow"
            else
              suppressed=$((suppressed+1))
              echo "internal_evidence_duplicate_suppressed workflow=$workflow"
            fi
          }

          dispatched=0
          suppressed=0
          dispatch_once ga-final-validation-summary.yml -f release_signing_run_id="$FINAL_SIGNING_RUN_ID"
          dispatch_once ga-final-full-runtime-matrix.yml -f release_signing_run_id="$FINAL_SIGNING_RUN_ID"
          dispatch_once ga-final-key-rotation.yml -f release_signing_run_id="$FINAL_SIGNING_RUN_ID"
          dispatch_once ga-final-disaster-recovery.yml
          dispatch_once ga-final-vulnerability-scan.yml -f release_signing_run_id="$FINAL_SIGNING_RUN_ID"

          marker="RC4_CHAIN_STATE stage=final_signing_internal_dispatch run_id=$FINAL_SIGNING_RUN_ID attempt=$FINAL_SIGNING_RUN_ATTEMPT control_head=$FINAL_CONTROL_HEAD"
          if ! gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$STATE_ISSUE/comments" --jq '.[] | select(.user.login == "github-actions[bot]") | .body' | grep -Fxq "$marker"; then
            gh issue comment "$STATE_ISSUE" --repo "$GITHUB_REPOSITORY" --body "$marker"
          fi

          echo "internal_final_evidence_dispatch=PASS dispatched=$dispatched suppressed=$suppressed expected=5"
          echo 'public_oauth_dispatched=false'
          echo 'public_mtls_dispatched=false'
          echo 'external_otlp_dispatched=false'
          echo 'independent_security_review_dispatched=false'
          echo 'ga_eligible=false'
