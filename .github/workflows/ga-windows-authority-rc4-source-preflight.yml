name: production-ga-windows-authority-rc4-source-preflight

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "release/**"
    paths:
      - ".github/workflows/ga-windows-authority-rc4-source-preflight.yml"
      - ".github/workflows/ga-windows-authority-rc4-release-authority-enrollment.yml"
      - ".github/workflows/ga-windows-authority-rc4-staging-candidate-selfhosted.yml"
      - ".github/workflows/ga-windows-authority-rc4-release-lock-review.yml"
      - ".github/workflows/ga-windows-authority-rc4-release-lock-promotion.yml"
      - ".github/workflows/ga-windows-authority-rc4-release-sign-from-lock.yml"
      - ".github/workflows/ga-windows-authority-rc4-release-intake-selfhosted.yml"
      - ".github/workflows/ga-windows-authority-rc4-media-readiness-selfhosted.yml"
      - ".github/workflows/ga-windows-authority-rc4-provisioning-manifest-selfhosted.yml"
      - "scripts/ga/enroll_windows_authority_release_authority.py"
      - "scripts/ga/build_windows_authority_release_candidate.py"
      - "scripts/ga/build_windows_authority_release_lock_draft.py"
      - "scripts/ga/promote_windows_authority_rc4_release_lock.py"
      - "scripts/ga/sign_windows_authority_release_candidate.py"
      - "scripts/ga/import_windows_authority_protected_release.py"
      - "scripts/ga/Invoke-PSMatrixWindowsAuthorityProtectedReleaseIntakeV2.ps1"
      - "scripts/ga/New-PSMatrixWindowsAuthorityMediaManifest.ps1"
      - "scripts/ga/New-PSMatrixWindowsAuthorityProvisioningManifest.ps1"
      - "scripts/ga/build_windows_authority_provisioning_manifest.py"
      - "ga-packs/03-authoritative-windows/rc3-release-lock.json"
      - "ga-packs/03-authoritative-windows/rc4-release-lock.json"
      - "ga-packs/03-authoritative-windows/provisioning-manifest-contract.json"
      - "ga-packs/03-authoritative-windows/rc4-provisioning-manifest-contract.json"
      - "release-assets/2.0.0rc4/psmatrix-2.0.0rc4-release-public.pem"
      - "pyproject.toml"
      - "src/psmatrix/__init__.py"
      - "tests/test_windows_authority_release_candidate_builder.py"
      - "tests/test_windows_authority_rc4_authority_rotation.py"
      - "tests/test_windows_authority_rc4_authority_rotation_runtime.py"
      - "tests/test_windows_authority_rc4_lock_promotion_signing.py"
      - "tests/test_windows_authority_protected_release_import.py"
      - "tests/test_windows_authority_rc4_protected_release_intake.py"
      - "tests/test_windows_authority_rc4_media_readiness.py"
      - "tests/test_windows_authority_provisioning_manifest_workflow.py"
      - "tests/test_windows_authority_rc4_provisioning_manifest.py"
  pull_request:
    branches:
      - main
      - "release/**"
    paths:
      - ".github/workflows/ga-windows-authority-rc4-source-preflight.yml"
      - ".github/workflows/ga-windows-authority-rc4-release-authority-enrollment.yml"
      - ".github/workflows/ga-windows-authority-rc4-staging-candidate-selfhosted.yml"
      - ".github/workflows/ga-windows-authority-rc4-release-lock-review.yml"
      - ".github/workflows/ga-windows-authority-rc4-release-lock-promotion.yml"
      - ".github/workflows/ga-windows-authority-rc4-release-sign-from-lock.yml"
      - ".github/workflows/ga-windows-authority-rc4-release-intake-selfhosted.yml"
      - ".github/workflows/ga-windows-authority-rc4-media-readiness-selfhosted.yml"
      - ".github/workflows/ga-windows-authority-rc4-provisioning-manifest-selfhosted.yml"
      - "scripts/ga/enroll_windows_authority_release_authority.py"
      - "scripts/ga/build_windows_authority_release_candidate.py"
      - "scripts/ga/build_windows_authority_release_lock_draft.py"
      - "scripts/ga/promote_windows_authority_rc4_release_lock.py"
      - "scripts/ga/sign_windows_authority_release_candidate.py"
      - "scripts/ga/import_windows_authority_protected_release.py"
      - "scripts/ga/Invoke-PSMatrixWindowsAuthorityProtectedReleaseIntakeV2.ps1"
      - "scripts/ga/New-PSMatrixWindowsAuthorityMediaManifest.ps1"
      - "scripts/ga/New-PSMatrixWindowsAuthorityProvisioningManifest.ps1"
      - "scripts/ga/build_windows_authority_provisioning_manifest.py"
      - "ga-packs/03-authoritative-windows/rc3-release-lock.json"
      - "ga-packs/03-authoritative-windows/rc4-release-lock.json"
      - "ga-packs/03-authoritative-windows/provisioning-manifest-contract.json"
      - "ga-packs/03-authoritative-windows/rc4-provisioning-manifest-contract.json"
      - "release-assets/2.0.0rc4/psmatrix-2.0.0rc4-release-public.pem"
      - "pyproject.toml"
      - "src/psmatrix/__init__.py"
      - "tests/test_windows_authority_release_candidate_builder.py"
      - "tests/test_windows_authority_rc4_authority_rotation.py"
      - "tests/test_windows_authority_rc4_authority_rotation_runtime.py"
      - "tests/test_windows_authority_rc4_lock_promotion_signing.py"
      - "tests/test_windows_authority_protected_release_import.py"
      - "tests/test_windows_authority_rc4_protected_release_intake.py"
      - "tests/test_windows_authority_rc4_media_readiness.py"
      - "tests/test_windows_authority_provisioning_manifest_workflow.py"
      - "tests/test_windows_authority_rc4_provisioning_manifest.py"

concurrency:
  group: production-ga-windows-authority-rc4-source-preflight-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  rc4-source-preflight:
    name: RC4 release-authority rotation source contract
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Windows, X64, psmatrix-hyperv]
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      PYTHONPATH: ${{ github.workspace }}\src
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Verify trusted runner assignment
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_OS -ne 'Windows' -or $env:RUNNER_NAME -ne 'NAVEAX') { throw "Expected NAVEAX Windows runner; got $env:RUNNER_NAME / $env:RUNNER_OS" }
          Write-Host 'rc4_source_runner=PASS'

      - name: Check out exact source revision
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact clean source and RC4 identity
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:EXPECTED_HEAD -cnotmatch '^[0-9a-f]{40}$') { throw 'Expected RC4 source head is not a full lowercase Git SHA.' }
          $head = (git rev-parse HEAD).Trim().ToLowerInvariant()
          if ($LASTEXITCODE -ne 0 -or $head -cnotmatch '^[0-9a-f]{40}$' -or $head -ne $env:EXPECTED_HEAD.ToLowerInvariant()) { throw "RC4 source-preflight checkout is not the exact expected branch head: actual=$head expected=$env:EXPECTED_HEAD" }
          if (-not [string]::IsNullOrWhiteSpace((git status --porcelain))) { throw 'RC4 source-preflight checkout is dirty.' }
          $project = (python -c "import tomllib, pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text(encoding='utf-8'))['project']['version'])").Trim()
          $package = (python -c "import psmatrix; print(psmatrix.__version__)").Trim()
          if ($project -ne '2.0.0rc4' -or $package -ne '2.0.0rc4') { throw "Expected exact RC4 package identity; project=$project package=$package" }
          Write-Host "rc4_source_head=$head"
          Write-Host "rc4_event_sha=$env:GITHUB_SHA"
          Write-Host 'rc4_version_identity=PASS'

      - name: Enforce preparation branch has no active RC4 lock
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($path in @('ga-packs\03-authoritative-windows\rc4-release-lock.json','release-assets\2.0.0rc4\psmatrix-2.0.0rc4-release-public.pem')) {
              if (Test-Path -LiteralPath (Join-Path $env:GITHUB_WORKSPACE $path) -PathType Leaf) { throw "RC4 source-preparation branch must not contain active authority material: $path" }
          }
          Write-Host 'active_rc4_lock_present=false'
          Write-Host 'active_rc4_public_authority_present=false'

      - name: Parse RC4 PowerShell control surfaces
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($relative in @(
              'scripts\ga\Invoke-PSMatrixWindowsAuthorityProtectedReleaseIntakeV2.ps1',
              'scripts\ga\New-PSMatrixWindowsAuthorityProvisioningManifest.ps1'
          )) {
              $path = Join-Path $env:GITHUB_WORKSPACE $relative
              $tokens = $null; $errors = $null
              [void][System.Management.Automation.Language.Parser]::ParseFile($path,[ref]$tokens,[ref]$errors)
              if (@($errors).Count -ne 0) { throw ("RC4 PowerShell parse failed for $relative: " + (@($errors | ForEach-Object { $_.Message }) -join '; ')) }
          }
          Write-Host 'rc4_powershell_controls_parse=PASS'

      - name: Compile RC4 release-control Python
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & python -m py_compile `
              scripts/ga/enroll_windows_authority_release_authority.py `
              scripts/ga/build_windows_authority_release_candidate.py `
              scripts/ga/build_windows_authority_release_lock_draft.py `
              scripts/ga/promote_windows_authority_rc4_release_lock.py `
              scripts/ga/sign_windows_authority_release_candidate.py `
              scripts/ga/import_windows_authority_protected_release.py `
              scripts/ga/build_windows_authority_provisioning_manifest.py `
              tests/test_windows_authority_release_candidate_builder.py `
              tests/test_windows_authority_rc4_authority_rotation.py `
              tests/test_windows_authority_rc4_authority_rotation_runtime.py `
              tests/test_windows_authority_rc4_lock_promotion_signing.py `
              tests/test_windows_authority_protected_release_import.py `
              tests/test_windows_authority_rc4_protected_release_intake.py `
              tests/test_windows_authority_rc4_media_readiness.py `
              tests/test_windows_authority_provisioning_manifest_workflow.py `
              tests/test_windows_authority_rc4_provisioning_manifest.py
          if ($LASTEXITCODE -ne 0) { throw 'RC4 release-control Python compile failed.' }
          Write-Host 'rc4_python_compile=PASS'

      - name: Run RC4 authority through provisioning-manifest contracts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & python -m unittest -v `
              tests.test_windows_authority_release_candidate_builder `
              tests.test_windows_authority_rc4_authority_rotation `
              tests.test_windows_authority_rc4_authority_rotation_runtime `
              tests.test_windows_authority_rc4_lock_promotion_signing `
              tests.test_windows_authority_protected_release_import `
              tests.test_windows_authority_rc4_protected_release_intake `
              tests.test_windows_authority_rc4_media_readiness `
              tests.test_windows_authority_provisioning_manifest_workflow `
              tests.test_windows_authority_rc4_provisioning_manifest
          if ($LASTEXITCODE -ne 0) { throw 'RC4 authority-through-provisioning-manifest contract tests failed.' }
          Write-Host 'rc4_authority_rotation_contracts=PASS'
          Write-Host 'rc4_authority_rotation_runtime=PASS'
          Write-Host 'rc4_lock_promotion_contract=PASS'
          Write-Host 'rc4_protected_signer_runtime=PASS'
          Write-Host 'rc4_protected_release_import_contract=PASS'
          Write-Host 'rc4_protected_release_intake_contract=PASS'
          Write-Host 'rc4_media_readiness_contract=PASS'
          Write-Host 'historical_rc3_provisioning_contract=PASS'
          Write-Host 'rc4_provisioning_manifest_contract=PASS'

      - name: Enforce no tracked private authority material
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $markers = @('-----BEGIN PRIVATE KEY-----','-----BEGIN RSA PRIVATE KEY-----','-----BEGIN EC PRIVATE KEY-----','-----BEGIN OPENSSH PRIVATE KEY-----')
          $tracked = @(git ls-files)
          if ($LASTEXITCODE -ne 0 -or $tracked.Count -eq 0) { throw 'Unable to enumerate tracked repository files.' }
          foreach ($relative in $tracked) {
              $path = Join-Path $env:GITHUB_WORKSPACE $relative
              if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { continue }
              $file = Get-Item -LiteralPath $path
              if ($file.Length -gt 1048576) { continue }
              try { $text = [System.IO.File]::ReadAllText($file.FullName) } catch { continue }
              foreach ($marker in $markers) {
                  if ([regex]::IsMatch($text,'(?m)^'+[regex]::Escape($marker)+'\r?$')) { throw "Tracked private-key PEM material detected: $relative" }
              }
          }
          Write-Host "repository_private_authority_absence=PASS tracked_files=$($tracked.Count)"

      - name: Emit RC4 source-preflight summary
        shell: pwsh
        run: |
          Write-Host "validated_exact_rc4_head=$env:EXPECTED_HEAD"
          Write-Host 'rc4_candidate=2.0.0rc4'
          Write-Host 'rc3_lock_mutated=false'
          Write-Host 'historical_rc3_provisioning_contract_mutated=false'
          Write-Host 'private_key_generated=false'
          Write-Host 'active_rc4_lock_written=false'
          Write-Host 'release_artifacts_signed=false'
          Write-Host 'production_inputs_mutated=false'
          Write-Host 'protected_release_intake_mutated=false'
          Write-Host 'media_manifest_materialized=false'
          Write-Host 'provisioning_manifest_materialized=false'
          Write-Host 'operation_package_built=false'
          Write-Host 'hyper_v_state_mutated=false'
          Write-Host 'authoritative=false'
          Write-Host 'ga_eligible=false'
