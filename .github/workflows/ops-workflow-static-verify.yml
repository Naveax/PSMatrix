name: ops-workflow-static-verify

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ops-*.yml'
  workflow_dispatch:

concurrency:
  group: ops-workflow-static-verify-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      STATE_ISSUE: '262'
    steps:
      - name: Check out exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Parse YAML, cross-workflow contracts, and extract Bash blocks
        id: parse
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/ops-workflow-verify"
          mkdir -p "$RUNNER_TEMP/ops-workflow-verify/bash"
          VERIFY_ROOT="$RUNNER_TEMP/ops-workflow-verify" ruby <<'RUBY'
          require 'yaml'
          require 'fileutils'

          root = ENV.fetch('VERIFY_ROOT')
          errors = []
          all_files = Dir['.github/workflows/*.yml'].sort
          ops_files = Dir['.github/workflows/ops-*.yml'].sort
          errors << 'no workflows found' if all_files.empty?
          errors << 'no ops workflows found' if ops_files.empty?
          script_index = 0
          contract_refs = 0
          dispatch_targets_checked = 0
          explicit_dispatch_refs_checked = 0
          dispatch_input_refs = 0
          required_dispatch_inputs_checked = 0
          docs = {}
          names = Hash.new { |h, k| h[k] = [] }

          all_files.each do |path|
            begin
              doc = YAML.load_file(path, aliases: true)
            rescue => e
              errors << "#{path}: YAML parse failed: #{e.class}: #{e.message}"
              next
            end
            unless doc.is_a?(Hash)
              errors << "#{path}: top-level YAML is not a mapping"
              next
            end
            docs[path] = doc
            workflow_name = doc['name'].to_s.strip
            errors << "#{path}: workflow name missing" if workflow_name.empty?
            names[workflow_name] << path unless workflow_name.empty?
          end

          names.each do |workflow_name, paths|
            if paths.length > 1
              errors << "duplicate workflow name #{workflow_name.inspect}: #{paths.join(', ')}"
            end
          end

          ops_files.each do |path|
            doc = docs[path]
            next unless doc.is_a?(Hash)

            concurrency = doc['concurrency']
            unless concurrency.is_a?(Hash)
              errors << "#{path}: top-level concurrency mapping is missing"
            else
              errors << "#{path}: concurrency.group missing" if concurrency['group'].to_s.empty?
              errors << "#{path}: concurrency.cancel-in-progress missing" unless concurrency.key?('cancel-in-progress')
            end

            trigger = doc['on'] || doc[true]
            if trigger.is_a?(Hash)
              workflow_run = trigger['workflow_run']
              if workflow_run.is_a?(Hash)
                Array(workflow_run['workflows']).each do |target|
                  target = target.to_s.strip
                  next if target.empty?
                  contract_refs += 1
                  matches = names[target]
                  if matches.empty?
                    errors << "#{path}: workflow_run target name does not exist: #{target}"
                  elsif matches.length > 1
                    errors << "#{path}: workflow_run target name is ambiguous (#{matches.join(', ')}): #{target}"
                  end
                end
              end
            end

            jobs = doc['jobs']
            unless jobs.is_a?(Hash) && !jobs.empty?
              errors << "#{path}: jobs mapping missing/empty"
              next
            end

            jobs.each do |job_name, job|
              next unless job.is_a?(Hash)

              reusable = job['uses'].to_s.strip
              if reusable.start_with?('./.github/workflows/')
                contract_refs += 1
                target = reusable.split('@', 2).first
                errors << "#{path}: reusable workflow target missing: #{target}" unless File.file?(target)
              end

              steps = job['steps']
              next unless steps.is_a?(Array)
              steps.each_with_index do |step, idx|
                next unless step.is_a?(Hash)

                local_use = step['uses'].to_s.strip
                if local_use.start_with?('./.github/workflows/')
                  contract_refs += 1
                  target = local_use.split('@', 2).first
                  errors << "#{path}: local workflow target missing: #{target}" unless File.file?(target)
                end

                run = step['run']
                if run.is_a?(String)
                  lines = run.lines
                  line_index = 0
                  while line_index < lines.length
                    line = lines[line_index].rstrip
                    match = line.match(/\bgh\s+workflow\s+run\s+([A-Za-z0-9._-]+\.ya?ml)\b/)
                    if match
                      target_name = match[1]
                      command = line.dup
                      while command.rstrip.end_with?('\\') && line_index + 1 < lines.length
                        command = command.rstrip.sub(/\\\z/, '')
                        line_index += 1
                        command << ' ' << lines[line_index].strip
                      end

                      contract_refs += 1
                      dispatch_targets_checked += 1
                      if command.match?(/(?:^|\s)--ref(?:=|\s+)/)
                        explicit_dispatch_refs_checked += 1
                      else
                        errors << "#{path}: gh workflow run #{target_name} omits explicit --ref"
                      end

                      target = File.join('.github', 'workflows', target_name)
                      unless File.file?(target)
                        errors << "#{path}: gh workflow run target missing: #{target_name}"
                      else
                        target_doc = docs[target]
                        target_trigger = target_doc.is_a?(Hash) ? (target_doc['on'] || target_doc[true]) : nil
                        unless target_trigger.is_a?(Hash) && target_trigger.key?('workflow_dispatch')
                          errors << "#{path}: gh workflow run target is not workflow_dispatch enabled: #{target_name}"
                        end
                        target_dispatch = target_trigger.is_a?(Hash) ? target_trigger['workflow_dispatch'] : nil
                        target_input_specs = if target_dispatch.is_a?(Hash) && target_dispatch['inputs'].is_a?(Hash)
                                               target_dispatch['inputs']
                                             else
                                               {}
                                             end
                        target_inputs = target_input_specs.keys.map(&:to_s)
                        passed_inputs = command.scan(/(?:^|\s)-f\s+([A-Za-z0-9_-]+)=/).flatten.uniq
                        dispatch_input_refs += passed_inputs.length

                        passed_inputs.each do |input_name|
                          unless target_inputs.include?(input_name)
                            errors << "#{path}: gh workflow run #{target_name} passes unknown input: #{input_name}"
                          end
                        end

                        target_input_specs.each do |input_name, spec|
                          next unless spec.is_a?(Hash)
                          required = spec['required'] == true
                          has_default = spec.key?('default')
                          next unless required && !has_default
                          required_dispatch_inputs_checked += 1
                          unless passed_inputs.include?(input_name.to_s)
                            errors << "#{path}: gh workflow run #{target_name} omits required input without default: #{input_name}"
                          end
                        end
                      end
                    end
                    line_index += 1
                  end
                end

                next unless step['shell'].to_s.strip == 'bash'
                unless run.is_a?(String) && !run.empty?
                  errors << "#{path}: job #{job_name} step #{idx} declares bash without run text"
                  next
                end
                script_index += 1
                target = File.join(root, 'bash', format('%04d.sh', script_index))
                File.write(target, run)
              end
            end
          end

          File.write(File.join(root, 'yaml-errors.txt'), errors.join("\n") + (errors.empty? ? '' : "\n"))
          File.write(File.join(root, 'counts.txt'), "workflows=#{ops_files.length}\nbash_blocks=#{script_index}\ncontract_refs=#{contract_refs}\ndispatch_targets_checked=#{dispatch_targets_checked}\nexplicit_dispatch_refs_checked=#{explicit_dispatch_refs_checked}\ndispatch_input_refs=#{dispatch_input_refs}\nrequired_dispatch_inputs_checked=#{required_dispatch_inputs_checked}\n")
          exit(errors.empty? ? 0 : 1)
          RUBY

      - name: Validate extracted Bash syntax
        id: bash
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/ops-workflow-verify"
          : > "$root/bash-errors.txt"
          failed=0
          while IFS= read -r -d '' script; do
            if ! bash -n "$script" 2>>"$root/bash-errors.txt"; then
              echo "bash syntax failure: $script" >> "$root/bash-errors.txt"
              failed=1
            fi
          done < <(find "$root/bash" -type f -name '*.sh' -print0 | sort -z)
          exit "$failed"

      - name: Publish static verification result
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/ops-workflow-verify"
          parse='${{ steps.parse.outcome }}'
          bash_result='${{ steps.bash.outcome }}'
          counts=$(tr '\n' ' ' < "$root/counts.txt" | sed -E 's/[[:space:]]+$//')
          if [[ "$parse" == success && "$bash_result" == success ]]; then
            status=PASS
          else
            status=FAIL
          fi
          body="OPS_WORKFLOW_STATIC_VERIFY status=$status head=$GITHUB_SHA parse=$parse bash=$bash_result $counts"
          gh issue comment "$STATE_ISSUE" --repo "$GITHUB_REPOSITORY" --body "$body"
          if [[ "$status" != PASS ]]; then
            echo '--- YAML / contract errors ---'
            cat "$root/yaml-errors.txt" || true
            echo '--- Bash errors ---'
            cat "$root/bash-errors.txt" || true
            exit 1
          fi
          echo "$body"
