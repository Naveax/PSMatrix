name: ga-windows-authority-production-prereq-once

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/ga-windows-authority-production-prereq-once.yml"

permissions:
  contents: read

jobs:
  preflight:
    name: Verify RC3 production prerequisites without mutation
    runs-on: [self-hosted, Windows, X64, psmatrix-hyperv]
    timeout-minutes: 10
    environment: production-ga-windows-lab
    env:
      PSMATRIX_WPS40_ADMIN_PASSWORD: ${{ secrets.PSMATRIX_WPS40_ADMIN_PASSWORD }}
      PSMATRIX_WPS50_ADMIN_PASSWORD: ${{ secrets.PSMATRIX_WPS50_ADMIN_PASSWORD }}
      PSMATRIX_WPS51_ADMIN_PASSWORD: ${{ secrets.PSMATRIX_WPS51_ADMIN_PASSWORD }}

    steps:
      - name: Verify controller and protected prerequisites
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $gaRoot = 'C:\ProgramData\PSMatrix\ProductionGA'
          if ($env:RUNNER_OS -ne 'Windows' -or $env:RUNNER_NAME -ne 'NAVEAX') {
              throw "Expected NAVEAX Windows runner; got $env:RUNNER_NAME / $env:RUNNER_OS"
          }
          if (-not (Test-Path -LiteralPath $gaRoot -PathType Container)) {
              throw 'Canonical GA root is missing.'
          }
          foreach ($relative in @('media\release','media\external','operation','config','trust-home')) {
              if (-not (Test-Path -LiteralPath (Join-Path $gaRoot $relative) -PathType Container)) {
                  throw "Canonical GA directory is missing: $relative"
              }
          }
          $templates = @(Get-ChildItem -LiteralPath (Join-Path $gaRoot 'config') -File -Filter '*.example.json')
          if ($templates.Count -lt 6) {
              throw "Expected at least six bootstrap templates; found $($templates.Count)."
          }
          foreach ($name in @('PSMATRIX_WPS40_ADMIN_PASSWORD','PSMATRIX_WPS50_ADMIN_PASSWORD','PSMATRIX_WPS51_ADMIN_PASSWORD')) {
              $present = -not [string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))
              Write-Host "secret_presence_${name}=$present"
              if (-not $present) { throw "Required protected provisioning secret is missing: $name" }
          }
          $vmms = Get-Service -Name vmms -ErrorAction Stop
          if ($vmms.Status -ne 'Running') { throw 'VMMS is not running.' }
          foreach ($cmd in @('Get-VM','Get-VMSnapshot','New-VM','Checkpoint-VM')) {
              if (-not (Get-Command $cmd -ErrorAction SilentlyContinue)) { throw "Required Hyper-V command missing: $cmd" }
          }
          $names = @(
              'PSMatrix-Windows-PowerShell-4.0',
              'PSMatrix-Windows-PowerShell-5.0',
              'PSMatrix-Windows-PowerShell-5.1'
          )
          $vmCount = 0
          $checkpointCount = 0
          foreach ($name in $names) {
              $vm = Get-VM -Name $name -ErrorAction SilentlyContinue
              if ($null -ne $vm) {
                  $vmCount += 1
                  $checkpointCount += @(Get-VMSnapshot -VM $vm -Name 'psmatrix-clean' -ErrorAction SilentlyContinue).Count
              }
          }
          $releaseRoot = Join-Path $gaRoot 'media\release\2.0.0rc3'
          $intake = Join-Path $gaRoot 'windows-authority-protected-release-intake.json'
          $selection = Join-Path $gaRoot 'config\windows-authority-media-selection.json'
          $manifest = Join-Path $gaRoot 'config\windows-lab-media.json'
          Write-Host 'production_prereq_controller=PASS'
          Write-Host "canonical_ga_root_exists=true"
          Write-Host "release_root_present=$(Test-Path -LiteralPath $releaseRoot -PathType Container)"
          Write-Host "protected_intake_present=$(Test-Path -LiteralPath $intake -PathType Leaf)"
          Write-Host "reviewed_selection_present=$(Test-Path -LiteralPath $selection -PathType Leaf)"
          Write-Host "provisioning_manifest_present=$(Test-Path -LiteralPath $manifest -PathType Leaf)"
          Write-Host "canonical_vm_count=$vmCount"
          Write-Host "psmatrix_clean_checkpoint_count=$checkpointCount"
          Write-Host 'mutates_ga_root=false'
          Write-Host 'creates_vms=false'
          Write-Host 'creates_checkpoints=false'
