name: production-ga-windows-authority-infrastructure-preflight

on:
  workflow_dispatch:
    inputs:
      release_commit:
        description: Exact reviewed Windows Authority RC3 release commit
        required: true
        default: "34e87c60885001f8dd11744b8bf194a59e51bd1f"
        type: string
      operation_run_id:
        description: Successful RC3 operation-package workflow run ID
        required: true
        type: string
      operation_run_attempt:
        description: Successful RC3 operation-package workflow run attempt
        required: true
        default: "1"
        type: string
      worker_timeout_seconds:
        description: Per-worker authoritative health timeout, 5-120 seconds
        required: true
        default: "30"
        type: string

concurrency:
  group: production-ga-windows-authority-infrastructure-preflight
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  authority-infrastructure:
    name: Protected Hyper-V authority infrastructure
    runs-on: [self-hosted, Windows, X64, psmatrix-hyperv]
    environment: production-ga-windows-lab
    timeout-minutes: 35
    permissions:
      actions: read
      contents: read
    env:
      PSMATRIX_WINDOWS_GA_ROOT: ${{ vars.PSMATRIX_WINDOWS_GA_ROOT }}
      RELEASE_COMMIT: ${{ inputs.release_commit }}
      OPERATION_RUN_ID: ${{ inputs.operation_run_id }}
      OPERATION_RUN_ATTEMPT: ${{ inputs.operation_run_attempt }}
      WORKER_TIMEOUT_SECONDS: ${{ inputs.worker_timeout_seconds }}

    steps:
      - name: Initialize fail-closed infrastructure evidence and exact paths
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $outputRoot = Join-Path $env:RUNNER_TEMP 'psmatrix-windows-authority-infrastructure'
          if (Test-Path -LiteralPath $outputRoot) {
              Remove-Item -LiteralPath $outputRoot -Recurse -Force
          }
          New-Item -ItemType Directory -Path $outputRoot -Force | Out-Null
          "PSMATRIX_WINDOWS_INFRA_EVIDENCE=$outputRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          if ([string]::IsNullOrWhiteSpace($env:PSMATRIX_WINDOWS_GA_ROOT)) {
              throw 'PSMATRIX_WINDOWS_GA_ROOT is missing from the protected environment.'
          }
          if (-not [System.IO.Path]::IsPathRooted($env:PSMATRIX_WINDOWS_GA_ROOT)) {
              throw 'PSMATRIX_WINDOWS_GA_ROOT must be an absolute path.'
          }
          $gaRoot = [System.IO.Path]::GetFullPath($env:PSMATRIX_WINDOWS_GA_ROOT)
          if (-not (Test-Path -LiteralPath $gaRoot -PathType Container)) {
              throw "PSMATRIX_WINDOWS_GA_ROOT does not exist: $gaRoot"
          }
          if ($env:RELEASE_COMMIT -cnotmatch '^[0-9a-f]{40}$') {
              throw 'release_commit must contain exactly 40 lowercase hexadecimal characters.'
          }
          if ($env:OPERATION_RUN_ID -notmatch '^[0-9]+$' -or $env:OPERATION_RUN_ATTEMPT -notmatch '^[1-9][0-9]*$') {
              throw 'operation_run_id and operation_run_attempt must contain decimal digits.'
          }
          $timeout = 0
          if (-not [int]::TryParse($env:WORKER_TIMEOUT_SECONDS, [ref]$timeout)) {
              throw 'worker_timeout_seconds must be an integer.'
          }
          if ($timeout -lt 5 -or $timeout -gt 120) {
              throw "worker_timeout_seconds must be between 5 and 120; received $timeout."
          }

          $releaseRoot = Join-Path $gaRoot 'media\release\2.0.0rc3'
          $operationRoot = Join-Path $gaRoot ('operation\2.0.0rc3\run-{0}-attempt-{1}' -f $env:OPERATION_RUN_ID, $env:OPERATION_RUN_ATTEMPT)
          $metadata = Join-Path $operationRoot 'psmatrix-2.0.0rc3-windows-authoritative-operation-package.json'
          $binding = Join-Path $operationRoot 'windows-authority-operation-package-binding.json'
          $publicKey = Join-Path $releaseRoot 'psmatrix-2.0.0rc3-release-public.pem'
          $wheel = Join-Path $releaseRoot 'psmatrix-2.0.0rc3-py3-none-any.whl'
          foreach ($path in @($releaseRoot, $operationRoot)) {
              if (-not (Test-Path -LiteralPath $path -PathType Container)) {
                  throw "Required protected RC3 directory is missing: $path"
              }
          }
          foreach ($path in @($metadata, $binding, $publicKey, $wheel)) {
              if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
                  throw "Required protected RC3 file is missing: $path"
              }
          }

          "PSMATRIX_WINDOWS_INFRA_TIMEOUT=$timeout" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PSMATRIX_WINDOWS_RELEASE_ROOT=$releaseRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PSMATRIX_WINDOWS_OPERATION_ROOT=$operationRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PSMATRIX_WINDOWS_OPERATION_METADATA=$metadata" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PSMATRIX_WINDOWS_OPERATION_BINDING=$binding" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PSMATRIX_WINDOWS_RELEASE_PUBLIC_KEY=$publicKey" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PSMATRIX_WINDOWS_RELEASE_WHEEL=$wheel" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Check out current infrastructure controls
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1
        with:
          path: control
          fetch-depth: 1
          persist-credentials: false

      - name: Check out exact RC3 release source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1
        with:
          ref: ${{ inputs.release_commit }}
          path: release-source
          fetch-depth: 1
          persist-credentials: false

      - name: Set up controller Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.2.0
        with:
          python-version: "3.13"

      - name: Validate control head, exact release source and RC3 lock
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $controlRoot = Join-Path $env:GITHUB_WORKSPACE 'control'
          $releaseSource = Join-Path $env:GITHUB_WORKSPACE 'release-source'
          $controlHead = (git -C $controlRoot rev-parse HEAD).Trim().ToLowerInvariant()
          $releaseHead = (git -C $releaseSource rev-parse HEAD).Trim().ToLowerInvariant()
          if ($LASTEXITCODE -ne 0) { throw 'Could not resolve release-source head.' }
          if ($controlHead -cnotmatch '^[0-9a-f]{40}$') { throw 'Current control head is invalid.' }
          if ($releaseHead -ne $env:RELEASE_COMMIT) { throw "Release-source head mismatch: $releaseHead" }
          if (-not [string]::IsNullOrWhiteSpace((git -C $controlRoot status --porcelain))) { throw 'Current control checkout is not clean.' }
          if (-not [string]::IsNullOrWhiteSpace((git -C $releaseSource status --porcelain))) { throw 'Release-source checkout is not clean.' }

          $lockPath = Join-Path $controlRoot 'ga-packs\03-authoritative-windows\rc3-release-lock.json'
          $lock = Get-Content -LiteralPath $lockPath -Raw | ConvertFrom-Json
          if ([int]$lock.schema -ne 1 -or [string]$lock.kind -ne 'psmatrix.windows-authority-release-staging-lock') { throw 'RC3 release lock identity is invalid.' }
          if ([string]$lock.version -ne '2.0.0rc3' -or [string]$lock.release_commit -ne $env:RELEASE_COMMIT) { throw 'RC3 release lock does not match requested release commit.' }

          $publicKeySha = (Get-FileHash -LiteralPath $env:PSMATRIX_WINDOWS_RELEASE_PUBLIC_KEY -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($publicKeySha -ne [string]$lock.release_public_key.sha256) { throw 'Imported RC3 release public key does not match reviewed lock.' }
          $wheelLock = @($lock.artifacts | Where-Object { [string]$_.name -eq 'psmatrix-2.0.0rc3-py3-none-any.whl' })
          if ($wheelLock.Count -ne 1) { throw 'RC3 wheel is not uniquely locked.' }
          $wheelSha = (Get-FileHash -LiteralPath $env:PSMATRIX_WINDOWS_RELEASE_WHEEL -Algorithm SHA256).Hash.ToLowerInvariant()
          $wheelSize = [int64](Get-Item -LiteralPath $env:PSMATRIX_WINDOWS_RELEASE_WHEEL).Length
          if ($wheelSha -ne [string]$wheelLock[0].sha256 -or $wheelSize -ne [int64]$wheelLock[0].size) { throw 'Imported RC3 wheel does not match reviewed lock.' }

          "PSMATRIX_WINDOWS_CONTROL_ROOT=$controlRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PSMATRIX_WINDOWS_RELEASE_SOURCE=$releaseSource" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PSMATRIX_WINDOWS_CONTROL_HEAD=$controlHead" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "control_head=$controlHead"
          Write-Host "release_source_head=$releaseHead"

      - name: Download exact operation-package workflow audit evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: windows-authority-rc3-operation-package
          path: ${{ runner.temp }}\psmatrix-operation-run-audit
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.operation_run_id }}

      - name: Verify exact operation-package workflow run authority
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:GH_TOKEN)) { throw 'GitHub Actions token is unavailable for operation-run verification.' }
          if ($env:GITHUB_REPOSITORY -ne 'Naveax/PSMatrix') { throw "Operation-run authority is frozen to Naveax/PSMatrix; observed $env:GITHUB_REPOSITORY" }

          $runId = [int64]$env:OPERATION_RUN_ID
          $runAttempt = [int]$env:OPERATION_RUN_ATTEMPT
          $expectedWorkflow = '.github/workflows/ga-windows-authority-operation-package-selfhosted.yml'
          $expectedWorkflowName = 'production-ga-windows-authority-operation-package-selfhosted'
          $expectedArtifact = 'windows-authority-rc3-operation-package'
          $headers = @{
              Accept = 'application/vnd.github+json'
              Authorization = "Bearer $env:GH_TOKEN"
              'X-GitHub-Api-Version' = '2022-11-28'
          }
          $runUri = "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/actions/runs/$runId"
          $run = Invoke-RestMethod -Method Get -Uri $runUri -Headers $headers
          if ([int64]$run.id -ne $runId) { throw 'Operation-package workflow run ID mismatch.' }
          if ([string]$run.name -ne $expectedWorkflowName -or [string]$run.path -ne $expectedWorkflow) { throw 'Operation-package workflow identity mismatch.' }
          if ([string]$run.event -ne 'workflow_dispatch' -or [string]$run.status -ne 'completed' -or [string]$run.conclusion -ne 'success') { throw 'Operation-package run must be a successful completed workflow_dispatch.' }
          if ([int]$run.run_attempt -ne $runAttempt) { throw 'Operation-package workflow run-attempt mismatch.' }
          if ([string]$run.head_branch -ne 'main') { throw 'Operation-package workflow run must be anchored to main.' }
          $runHead = ([string]$run.head_sha).ToLowerInvariant()
          if ($runHead -cnotmatch '^[0-9a-f]{40}$' -or $runHead -ne $env:PSMATRIX_WINDOWS_CONTROL_HEAD) { throw 'Operation-package workflow run head does not match the exact infrastructure control head.' }

          $artifactListing = Invoke-RestMethod -Method Get -Uri "$runUri/artifacts?per_page=100" -Headers $headers
          $artifacts = @($artifactListing.artifacts | Where-Object { [string]$_.name -eq $expectedArtifact -and [bool]$_.expired -eq $false })
          if ($artifacts.Count -ne 1) { throw "Expected exactly one nonexpired $expectedArtifact artifact; observed $($artifacts.Count)." }
          $artifact = $artifacts[0]
          $artifactId = [int64]$artifact.id
          if ($artifactId -le 0) { throw 'Operation-package workflow artifact ID is invalid.' }

          $extract = Join-Path $env:RUNNER_TEMP 'psmatrix-operation-run-audit'
          if (-not (Test-Path -LiteralPath $extract -PathType Container)) { throw 'Downloaded operation-package workflow audit evidence is missing.' }
          $statusFiles = @(Get-ChildItem -LiteralPath $extract -File -Recurse | Where-Object { $_.Name -eq 'operation-package-status.json' })
          if ($statusFiles.Count -ne 1) { throw "Expected exactly one operation-package-status.json in workflow evidence; observed $($statusFiles.Count)." }
          $status = Get-Content -LiteralPath $statusFiles[0].FullName -Raw | ConvertFrom-Json
          $metadata = Get-Content -LiteralPath $env:PSMATRIX_WINDOWS_OPERATION_METADATA -Raw | ConvertFrom-Json
          if ([int]$status.schema -ne 1 -or [string]$status.kind -ne 'psmatrix.windows-authority-operation-package-workflow-status' -or [string]$status.status -ne 'READY_FOR_WINDOWS_HOST') { throw 'Operation-package workflow status identity is invalid.' }
          if ([string]$status.release_version -ne '2.0.0rc3' -or [string]$status.release_commit -ne $env:RELEASE_COMMIT) { throw 'Operation-package workflow status release identity mismatch.' }
          if ([string]$status.operation_output -ne $env:PSMATRIX_WINDOWS_OPERATION_ROOT) { throw 'Operation-package workflow status does not name the selected protected operation root.' }
          if ([string]$status.operation_zip_name -ne [string]$metadata.artifact.name -or [string]$status.operation_zip_sha256 -ne [string]$metadata.artifact.sha256 -or [int64]$status.operation_zip_size -ne [int64]$metadata.artifact.size) { throw 'Operation-package workflow evidence does not bind the selected local operation artifact.' }
          if ([string]$status.release_binding_sha256 -ne [string]$metadata.release_binding.binding_sha256 -or [string]$status.release_manifest_sha256 -ne [string]$metadata.release_binding.release_manifest_sha256) { throw 'Operation-package workflow evidence does not bind the selected release closure.' }
          if ([bool]$status.deterministic_rebuild -ne $true -or [string]$status.private_key_scan -ne 'PASS' -or [bool]$status.authoritative -ne $false -or [bool]$status.ga_eligible -ne $false) { throw 'Operation-package workflow evidence violates the non-authoritative deterministic package contract.' }

          $receipt = [ordered]@{
              schema = 1
              kind = 'psmatrix.windows-authority-operation-run-api-verification'
              status = 'PASS'
              repository = $env:GITHUB_REPOSITORY
              workflow = $expectedWorkflow
              workflow_name = $expectedWorkflowName
              event = 'workflow_dispatch'
              run_id = $runId
              run_attempt = $runAttempt
              run_conclusion = 'success'
              exact_head = $runHead
              immutable_ref = 'main'
              artifact = $expectedArtifact
              artifact_id = $artifactId
              artifact_nonexpired = $true
              artifact_status_bound_to_local_package = $true
              release_commit = $env:RELEASE_COMMIT
              release_version = '2.0.0rc3'
              authoritative = $false
              ga_eligible = $false
          }
          $receiptPath = Join-Path $env:PSMATRIX_WINDOWS_INFRA_EVIDENCE 'operation-run-api-verification.json'
          [System.IO.File]::WriteAllText(
              $receiptPath,
              (($receipt | ConvertTo-Json -Depth 8) + [Environment]::NewLine),
              [System.Text.UTF8Encoding]::new($false)
          )
          "PSMATRIX_WINDOWS_OPERATION_RUN_HEAD=$runHead" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PSMATRIX_WINDOWS_OPERATION_RUN_ARTIFACT_ID=$artifactId" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PSMATRIX_WINDOWS_OPERATION_RUN_VERIFICATION=$receiptPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "operation_run_api_verification=PASS run=$runId attempt=$runAttempt artifact=$artifactId"

      - name: Install exact signed RC3 controller package offline
        shell: pwsh
        env:
          PIP_NO_INDEX: "1"
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install --no-index --no-deps --force-reinstall "$env:PSMATRIX_WINDOWS_RELEASE_WHEEL"
          if ($LASTEXITCODE -ne 0) {
              throw "Exact signed RC3 wheel installation failed: $LASTEXITCODE"
          }
          $observed = (python -c "import psmatrix; print(psmatrix.__version__)").Trim()
          if ($LASTEXITCODE -ne 0 -or $observed -ne '2.0.0rc3') {
              throw "Installed controller package is not PSMatrix 2.0.0rc3: $observed"
          }
          Write-Host "installed_psmatrix=$observed"

      - name: Revalidate exact operation package binding
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $report = Join-Path $env:PSMATRIX_WINDOWS_INFRA_EVIDENCE 'operation-binding-recheck.json'
          & "$env:PSMATRIX_WINDOWS_CONTROL_ROOT\scripts\ga\Test-PSMatrixWindowsAuthorityOperationPackageBinding.ps1" `
              -SourceRoot $env:PSMATRIX_WINDOWS_CONTROL_ROOT `
              -GaRoot $env:PSMATRIX_WINDOWS_GA_ROOT `
              -CanonicalInventoryPath (Join-Path $env:PSMATRIX_WINDOWS_GA_ROOT 'windows-authority-media-inventory.canonical.json') `
              -OperationPackageMetadataPath $env:PSMATRIX_WINDOWS_OPERATION_METADATA `
              -OutputPath $report
          if ($LASTEXITCODE -ne 0) { throw 'Operation-package binding recheck failed to execute.' }
          $value = Get-Content -LiteralPath $report -Raw | ConvertFrom-Json
          if ([string]$value.status -ne 'PASS' -or [bool]$value.ready_for_release_artifact_recovery -ne $true) {
              throw 'Operation-package binding recheck is not PASS/ready.'
          }
          if ([string]$value.operation_package.release_commit -ne $env:RELEASE_COMMIT) { throw 'Operation-package release commit mismatch.' }
          if ([bool]$value.operation_package.release_manifest_matches_canonical -ne $true -or [bool]$value.operation_package.embedded_release_artifacts_match_binding -ne $true) {
              throw 'Operation-package RC3 release binding is incomplete.'
          }
          "PSMATRIX_WINDOWS_OPERATION_BINDING_RECHECK=$report" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Validate protected Windows authority infrastructure
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $outputRoot = $env:PSMATRIX_WINDOWS_INFRA_EVIDENCE
          $report = Join-Path $outputRoot 'infrastructure-preflight.json'
          $log = Join-Path $outputRoot 'validator.log'

          & python "$env:PSMATRIX_WINDOWS_CONTROL_ROOT\scripts\ga\validate_windows_authority_infrastructure.py" `
              --source-root $env:PSMATRIX_WINDOWS_RELEASE_SOURCE `
              --ga-root $env:PSMATRIX_WINDOWS_GA_ROOT `
              --release-dir $env:PSMATRIX_WINDOWS_RELEASE_ROOT `
              --release-commit $env:RELEASE_COMMIT `
              --release-public-key $env:PSMATRIX_WINDOWS_RELEASE_PUBLIC_KEY `
              --operation-package-metadata $env:PSMATRIX_WINDOWS_OPERATION_METADATA `
              --operation-binding-report $env:PSMATRIX_WINDOWS_OPERATION_BINDING_RECHECK `
              --timeout $env:PSMATRIX_WINDOWS_INFRA_TIMEOUT `
              --output $report 2>&1 | Tee-Object -FilePath $log
          $code = $LASTEXITCODE
          [System.IO.File]::WriteAllText(
              (Join-Path $outputRoot 'validator-exit-code.txt'),
              ([string]$code + [Environment]::NewLine),
              [System.Text.UTF8Encoding]::new($false)
          )
          if (Test-Path -LiteralPath $report) {
              Get-Content -LiteralPath $report -Raw
          }
          if ($code -ne 0) {
              throw "Windows authority infrastructure is not ready; validator exit code $code."
          }
          $value = Get-Content -LiteralPath $report -Raw | ConvertFrom-Json
          if ([string]$value.status -ne 'PASS' -or [bool]$value.ready -ne $true) { throw 'Infrastructure report is not PASS/ready.' }
          if ([string]$value.release_commit -ne $env:RELEASE_COMMIT -or [string]$value.release_version -ne '2.0.0rc3') { throw 'Infrastructure release identity mismatch.' }
          if ([bool]$value.ga_eligible -ne $false) { throw 'Infrastructure preflight improperly claims GA eligibility.' }

      - name: Record infrastructure controller context
        if: success()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $context = [ordered]@{
              schema = 1
              kind = 'psmatrix.windows-authority-infrastructure-controller-context'
              status = 'PASS'
              release_commit = $env:RELEASE_COMMIT
              release_version = '2.0.0rc3'
              control_head = $env:PSMATRIX_WINDOWS_CONTROL_HEAD
              operation_run_id = [int64]$env:OPERATION_RUN_ID
              operation_run_attempt = [int]$env:OPERATION_RUN_ATTEMPT
              operation_run_api_verified = $true
              operation_run_workflow = '.github/workflows/ga-windows-authority-operation-package-selfhosted.yml'
              operation_run_head = $env:PSMATRIX_WINDOWS_OPERATION_RUN_HEAD
              operation_run_artifact = 'windows-authority-rc3-operation-package'
              operation_run_artifact_id = [int64]$env:PSMATRIX_WINDOWS_OPERATION_RUN_ARTIFACT_ID
              operation_run_artifact_nonexpired = $true
              operation_run_artifact_status_bound_to_local_package = $true
              worker_timeout_seconds = [int]$env:PSMATRIX_WINDOWS_INFRA_TIMEOUT
              release_public_key_source = 'verified-protected-rc3-bundle'
              release_public_key_secret_used = $false
              exact_release_wheel_installed_offline = $true
              runner_name = $env:RUNNER_NAME
              runner_os = $env:RUNNER_OS
              runner_arch = $env:RUNNER_ARCH
              authoritative_campaign_evidence = $false
              ga_eligible = $false
          }
          [System.IO.File]::WriteAllText(
              (Join-Path $env:PSMATRIX_WINDOWS_INFRA_EVIDENCE 'controller-context.json'),
              (($context | ConvertTo-Json -Depth 8) + [Environment]::NewLine),
              [System.Text.UTF8Encoding]::new($false)
          )

      - name: Record fail-closed infrastructure state
        if: failure()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $outputRoot = $env:PSMATRIX_WINDOWS_INFRA_EVIDENCE
          if ([string]::IsNullOrWhiteSpace($outputRoot)) {
              $outputRoot = Join-Path $env:RUNNER_TEMP 'psmatrix-windows-authority-infrastructure'
          }
          New-Item -ItemType Directory -Path $outputRoot -Force | Out-Null
          $failure = [ordered]@{
              schema = 1
              kind = 'psmatrix.windows-authority-infrastructure-preflight'
              status = 'FAIL'
              ready = $false
              release_commit = $env:RELEASE_COMMIT
              operation_run_id = $env:OPERATION_RUN_ID
              operation_run_attempt = $env:OPERATION_RUN_ATTEMPT
              operation_run_api_verified = $false
              runner_name = $env:RUNNER_NAME
              authority_level = 'protected-infrastructure-preflight'
              authoritative_campaign_evidence = $false
              ga_eligible = $false
          }
          [System.IO.File]::WriteAllText(
              (Join-Path $outputRoot 'preflight-failure.json'),
              (($failure | ConvertTo-Json -Depth 8) + [Environment]::NewLine),
              [System.Text.UTF8Encoding]::new($false)
          )

      - name: Upload infrastructure preflight evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: production-ga-windows-authority-infrastructure-preflight
          path: ${{ runner.temp }}\psmatrix-windows-authority-infrastructure
          if-no-files-found: error
          retention-days: 30
