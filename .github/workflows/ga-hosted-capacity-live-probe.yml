name: ga-hosted-capacity-live-probe

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/ga-hosted-capacity-live-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    name: GitHub-hosted capacity live probe
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Prove hosted runner scheduling
        shell: bash
        run: |
          set -euo pipefail
          echo 'github_hosted_scheduler=PASS'
          echo "runner_os=$RUNNER_OS"
