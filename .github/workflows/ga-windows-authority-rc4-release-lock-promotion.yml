name: production-ga-windows-authority-rc4-release-lock-promotion

on:
  workflow_dispatch:
    inputs:
      candidate_commit:
        description: Exact reviewed RC4 candidate commit from enrollment/staging/review
        required: true
        type: string
      review_run_id:
        description: Successful RC4 release-lock review workflow run ID
        required: true
        type: string
      reviewed_draft_sha256:
        description: Human-reviewed SHA-256 of rc4-release-lock.review-draft.json
        required: true
        type: string
      reviewed_public_key_sha256:
        description: Human-reviewed SHA-256 of the proposed RC4 release public key
        required: true
        type: string
      recover_failed_automated_run_id:
        description: Optional exact failed bot-dispatched promotion run ID to recover; leave empty for normal promotion
        required: false
        default: ''
        type: string

concurrency:
  group: production-ga-windows-authority-rc4-release-lock-promotion
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
  issues: read

jobs:
  recover-failed-automated-dispatch:
    name: Recover exact failed automated RC4 promotion dispatch
    if: inputs.recover_failed_automated_run_id != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
      issues: read
    env:
      GH_TOKEN: ${{ github.token }}
      PROMOTION_WORKFLOW: ga-windows-authority-rc4-release-lock-promotion.yml
      FAILED_PROMOTION_RUN_ID: ${{ inputs.recover_failed_automated_run_id }}
      EXPECTED_FAILED_PROMOTION_RUN_ID: '37004497727'
      FAILED_PROMOTION_CONTROL_HEAD: b3ce3fe44ca2e4f446257e806f67fd9d93a4147d
      FIX_VALIDATION_RUN_ID: '37008295113'
      FIX_VALIDATION_CONTROL_HEAD: c73f288d490080feb679570dd8fad3bf03b4474b
      FIX_VALIDATION_ARTIFACT_DIGEST: sha256:55bc5c833c7118d3198b89a626cfda54dcb40d72d4cff2d8c8279aa8883a154c
      APPROVAL_COMMENT_ID: '5951919294'
      CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
      REVIEW_RUN_ID: ${{ inputs.review_run_id }}
      REVIEWED_DRAFT_SHA256: ${{ inputs.reviewed_draft_sha256 }}
      REVIEWED_PUBLIC_KEY_SHA256: ${{ inputs.reviewed_public_key_sha256 }}
    steps:
      - name: Validate exact one-shot recovery request
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_ACTOR" == 'Naveax' ]] || { echo 'RC4 recovery must be explicitly started by repository owner Naveax.' >&2; exit 1; }
          [[ "$GITHUB_REF_NAME" == 'main' ]] || { echo 'RC4 recovery must run from main.' >&2; exit 1; }
          [[ "$FAILED_PROMOTION_RUN_ID" == "$EXPECTED_FAILED_PROMOTION_RUN_ID" ]] || { echo 'Unexpected failed promotion run ID.' >&2; exit 1; }
          [[ "$CANDIDATE_COMMIT" == '0b4e77d5e5cf142e2cdb47f5cc4b8dd81353ae63' ]] || { echo 'RC4 recovery candidate mismatch.' >&2; exit 1; }
          [[ "$REVIEW_RUN_ID" == '36851144641' ]] || { echo 'RC4 recovery review run mismatch.' >&2; exit 1; }
          [[ "$REVIEWED_DRAFT_SHA256" == 'f609e5ab5968fd6f1d569a78921ede0fd61bfa991c50bcb831bf15e3a450e2da' ]] || { echo 'RC4 recovery reviewed draft mismatch.' >&2; exit 1; }
          [[ "$REVIEWED_PUBLIC_KEY_SHA256" == 'ece4d7087449cb42cde9183b0b1e2b82db610d4ffffd726e6737d2ba09578a08' ]] || { echo 'RC4 recovery reviewed public key mismatch.' >&2; exit 1; }
          echo 'rc4_recovery_request_identity=PASS'

      - name: Revalidate failed bot run, fixed manual validation, approval, and source closure
        shell: bash
        run: |
          set -euo pipefail
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          [[ "$current" == "$GITHUB_SHA" ]] || { echo "main moved before RC4 recovery: $current != $GITHUB_SHA" >&2; exit 1; }

          failed=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$FAILED_PROMOTION_RUN_ID")
          [[ "$(jq -r '.name' <<<"$failed")" == 'production-ga-windows-authority-rc4-release-lock-promotion' ]] || { echo 'Failed promotion workflow name mismatch.' >&2; exit 1; }
          [[ "$(jq -r '.path' <<<"$failed")" == '.github/workflows/ga-windows-authority-rc4-release-lock-promotion.yml' ]] || { echo 'Failed promotion workflow path mismatch.' >&2; exit 1; }
          [[ "$(jq -r '.event' <<<"$failed")" == 'workflow_dispatch' ]] || { echo 'Failed promotion event mismatch.' >&2; exit 1; }
          [[ "$(jq -r '.status' <<<"$failed")" == 'completed' && "$(jq -r '.conclusion' <<<"$failed")" == 'failure' ]] || { echo 'Bound failed promotion is not completed/failure.' >&2; exit 1; }
          [[ "$(jq -r '.run_attempt' <<<"$failed")" == '1' ]] || { echo 'Bound failed promotion was rerun; recovery is no longer valid.' >&2; exit 1; }
          [[ "$(jq -r '.head_sha' <<<"$failed")" == "$FAILED_PROMOTION_CONTROL_HEAD" ]] || { echo 'Bound failed promotion control head mismatch.' >&2; exit 1; }
          [[ "$(jq -r '.head_branch' <<<"$failed")" == 'main' ]] || { echo 'Bound failed promotion branch mismatch.' >&2; exit 1; }
          [[ "$(jq -r '.actor.login' <<<"$failed")" == 'github-actions[bot]' && "$(jq -r '.triggering_actor.login' <<<"$failed")" == 'github-actions[bot]' ]] || { echo 'Bound failed promotion was not canonical bot dispatch.' >&2; exit 1; }

          validation=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$FIX_VALIDATION_RUN_ID")
          [[ "$(jq -r '.name' <<<"$validation")" == 'production-ga-windows-authority-rc4-release-lock-promotion' ]] || { echo 'Fix validation workflow name mismatch.' >&2; exit 1; }
          [[ "$(jq -r '.event' <<<"$validation")" == 'workflow_dispatch' ]] || { echo 'Fix validation event mismatch.' >&2; exit 1; }
          [[ "$(jq -r '.status' <<<"$validation")" == 'completed' && "$(jq -r '.conclusion' <<<"$validation")" == 'success' ]] || { echo 'Fix validation run is not completed/success.' >&2; exit 1; }
          [[ "$(jq -r '.run_attempt' <<<"$validation")" == '1' ]] || { echo 'Fix validation run attempt mismatch.' >&2; exit 1; }
          [[ "$(jq -r '.head_sha' <<<"$validation")" == "$FIX_VALIDATION_CONTROL_HEAD" ]] || { echo 'Fix validation control head mismatch.' >&2; exit 1; }
          [[ "$(jq -r '.actor.login' <<<"$validation")" == 'Naveax' && "$(jq -r '.triggering_actor.login' <<<"$validation")" == 'Naveax' ]] || { echo 'Fix validation actor mismatch.' >&2; exit 1; }

          artifacts=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$FIX_VALIDATION_RUN_ID/artifacts?per_page=100")
          artifact_count=$(jq --arg digest "$FIX_VALIDATION_ARTIFACT_DIGEST" '[.artifacts[] | select(.name == "psmatrix-2.0.0rc4-release-lock-promotion-candidate" and .expired == false and .digest == $digest)] | length' <<<"$artifacts")
          [[ "$artifact_count" == '1' ]] || { echo 'Expected exactly one live fixed-validation promotion artifact.' >&2; exit 1; }

          review=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$REVIEW_RUN_ID")
          [[ "$(jq -r '.name' <<<"$review")" == 'production-ga-windows-authority-rc4-release-lock-review' ]] || { echo 'Bound RC4 review workflow name mismatch.' >&2; exit 1; }
          [[ "$(jq -r '.head_sha' <<<"$review")" == "$CANDIDATE_COMMIT" ]] || { echo 'Bound RC4 review candidate mismatch.' >&2; exit 1; }
          [[ "$(jq -r '.status' <<<"$review")" == 'completed' && "$(jq -r '.conclusion' <<<"$review")" == 'success' ]] || { echo 'Bound RC4 review is not completed/success.' >&2; exit 1; }

          approval=$(gh api "repos/$GITHUB_REPOSITORY/issues/comments/$APPROVAL_COMMENT_ID")
          expected_approval="RC4 HUMAN REVIEW APPROVED: $CANDIDATE_COMMIT"
          [[ "$(jq -r '.user.login' <<<"$approval")" == 'Naveax' ]] || { echo 'Bound approval actor mismatch.' >&2; exit 1; }
          [[ "$(jq -r '.author_association' <<<"$approval")" == 'OWNER' ]] || { echo 'Bound approval owner association mismatch.' >&2; exit 1; }
          [[ "$(jq -r '.body' <<<"$approval")" == "$expected_approval" ]] || { echo 'Bound approval body mismatch.' >&2; exit 1; }
          approval_at=$(jq -r '.created_at' <<<"$approval")
          review_updated_at=$(jq -r '.updated_at' <<<"$review")
          [[ "$approval_at" == "$review_updated_at" || "$approval_at" > "$review_updated_at" ]] || { echo 'Bound approval predates review completion.' >&2; exit 1; }

          compare=$(gh api "repos/$GITHUB_REPOSITORY/compare/$FIX_VALIDATION_CONTROL_HEAD...$GITHUB_SHA")
          [[ "$(jq -r '.status' <<<"$compare")" == 'ahead' && "$(jq -r '.ahead_by' <<<"$compare")" == '1' ]] || { echo 'Recovery control head is not exactly one commit ahead of the validated timestamp fix.' >&2; exit 1; }
          mapfile -t changed < <(jq -r '.files[].filename' <<<"$compare" | sort)
          expected=(
            '.github/workflows/ga-windows-authority-rc4-release-lock-promotion.yml'
            'tests/test_windows_authority_rc4_lock_promotion_signing.py'
          )
          [[ "${#changed[@]}" -eq 2 && "${changed[0]}" == "${expected[0]}" && "${changed[1]}" == "${expected[1]}" ]] || {
            printf 'Unexpected RC4 recovery source closure:\n%s\n' "${changed[*]}" >&2
            exit 1
          }

          if gh api "repos/$GITHUB_REPOSITORY/git/trees/$GITHUB_SHA?recursive=1" --jq '.tree[].path' | grep -Fxq 'ga-packs/03-authoritative-windows/rc4-release-lock.json'; then
            echo 'An active RC4 lock already exists; recovery redispatch is forbidden.' >&2
            exit 1
          fi

          runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$PROMOTION_WORKFLOW/runs?branch=main&event=workflow_dispatch&per_page=100")
          bot_on_current=$(jq --arg head "$GITHUB_SHA" --arg current "$GITHUB_RUN_ID" '[.workflow_runs[] | select((.id|tostring) != $current and .head_sha == $head and .actor.login == "github-actions[bot]")] | length' <<<"$runs")
          [[ "$bot_on_current" == '0' ]] || { echo 'A bot-dispatched RC4 promotion already exists on the recovery control head; refusing duplicate dispatch.' >&2; exit 1; }

          echo 'rc4_recovery_provenance=PASS'
          echo 'repository_mutated=false'
          echo 'release_artifacts_signed=false'
          echo 'authoritative=false'
          echo 'ga_eligible=false'

      - name: Redispatch canonical RC4 promotion through GitHub Actions identity
        shell: bash
        run: |
          set -euo pipefail
          dispatched_after=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          gh workflow run "$PROMOTION_WORKFLOW"             --repo "$GITHUB_REPOSITORY"             --ref main             -f candidate_commit="$CANDIDATE_COMMIT"             -f review_run_id="$REVIEW_RUN_ID"             -f reviewed_draft_sha256="$REVIEWED_DRAFT_SHA256"             -f reviewed_public_key_sha256="$REVIEWED_PUBLIC_KEY_SHA256"

          child_id=''
          for _ in $(seq 1 15); do
            runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$PROMOTION_WORKFLOW/runs?branch=main&event=workflow_dispatch&per_page=100")
            mapfile -t matches < <(jq -r --arg head "$GITHUB_SHA" --arg after "$dispatched_after" --arg current "$GITHUB_RUN_ID" '
              [.workflow_runs[]
                | select((.id|tostring) != $current
                    and .head_sha == $head
                    and .actor.login == "github-actions[bot]"
                    and .triggering_actor.login == "github-actions[bot]"
                    and .created_at >= $after)
                | .id] | .[]' <<<"$runs")
            if [[ "${#matches[@]}" -gt 1 ]]; then
              echo 'Multiple repaired bot promotion runs appeared; refusing ambiguous provenance.' >&2
              exit 1
            fi
            if [[ "${#matches[@]}" -eq 1 ]]; then
              child_id="${matches[0]}"
              break
            fi
            sleep 2
          done
          [[ "$child_id" =~ ^[1-9][0-9]*$ ]] || { echo 'Repaired bot promotion dispatch was not observed.' >&2; exit 1; }
          echo "rc4_recovery_bot_dispatch=PASS child_run_id=$child_id"
          echo 'human_review_reused=true'
          echo 'human_approval_created=false'
          echo 'repository_mutated=false'
          echo 'release_artifacts_signed=false'
          echo 'authoritative=false'
          echo 'ga_eligible=false'

  promote-lock-candidate:
    if: inputs.recover_failed_automated_run_id == ''
    name: Build exact RC4 active-lock repository commit candidate
    runs-on: [self-hosted, Windows, X64, psmatrix-hyperv]
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      issues: read
    env:
      CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
      REVIEW_RUN_ID: ${{ inputs.review_run_id }}
      REVIEWED_DRAFT_SHA256: ${{ inputs.reviewed_draft_sha256 }}
      REVIEWED_PUBLIC_KEY_SHA256: ${{ inputs.reviewed_public_key_sha256 }}
      PROMOTION_RUN_ID: ${{ github.run_id }}

    steps:
      - name: Validate promotion dispatch inputs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_OS -ne 'Windows' -or $env:RUNNER_NAME -ne 'NAVEAX') {
              throw "Expected NAVEAX Windows runner; got $env:RUNNER_NAME / $env:RUNNER_OS"
          }
          if ($env:CANDIDATE_COMMIT -cnotmatch '^[0-9a-f]{40}$') { throw 'candidate_commit must be 40 lowercase hex characters.' }
          foreach ($name in @('REVIEW_RUN_ID','PROMOTION_RUN_ID')) {
              $value = [Environment]::GetEnvironmentVariable($name)
              if ($value -cnotmatch '^[0-9]+$') { throw "$name must contain only decimal digits." }
          }
          if ($env:REVIEW_RUN_ID -eq $env:PROMOTION_RUN_ID) { throw 'Review and promotion run IDs must be distinct.' }
          foreach ($name in @('REVIEWED_DRAFT_SHA256','REVIEWED_PUBLIC_KEY_SHA256')) {
              $value = [Environment]::GetEnvironmentVariable($name)
              if ($value -cnotmatch '^[0-9a-f]{64}$') { throw "$name must contain exactly 64 lowercase hexadecimal characters." }
          }
          Write-Host 'promotion_dispatch_identity=PASS'

      - name: Check out promotion controls
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1
        with:
          path: control
          fetch-depth: 1
          persist-credentials: false

      - name: Verify clean control head and absence of an already active RC4 lock
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $control = Join-Path $env:GITHUB_WORKSPACE 'control'
          $head = (git -C $control rev-parse HEAD).Trim().ToLowerInvariant()
          if ($LASTEXITCODE -ne 0 -or $head -cnotmatch '^[0-9a-f]{40}$' -or $head -ne $env:GITHUB_SHA.ToLowerInvariant()) { throw 'Promotion control checkout is not the exact workflow control head.' }
          if (-not [string]::IsNullOrWhiteSpace((git -C $control status --porcelain))) { throw 'Promotion control checkout is dirty.' }
          $activeLock = Join-Path $control 'ga-packs\03-authoritative-windows\rc4-release-lock.json'
          if (Test-Path -LiteralPath $activeLock -PathType Leaf) {
              throw 'An active RC4 release lock already exists; promotion candidate generation is no longer allowed from this workflow.'
          }
          "PSMATRIX_RC4_PROMOTION_CONTROL_HEAD=$head" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "promotion_control_head=$head"
          Write-Host 'preexisting_active_rc4_lock=false'

      - name: Validate review provenance and exact owner approval before download
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          import hashlib
          import json
          import os
          import urllib.request
          from datetime import datetime, timezone

          repo = 'Naveax/PSMatrix'
          run_id = os.environ['REVIEW_RUN_ID']
          candidate = os.environ['CANDIDATE_COMMIT'].lower()
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {os.environ["GH_TOKEN"]}',
              'X-GitHub-Api-Version': '2026-03-10',
              'User-Agent': 'psmatrix-rc4-lock-promotion',
          }

          def fetch(path):
              request = urllib.request.Request(f'https://api.github.com/repos/{repo}/{path}', headers=headers)
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)

          def parse_timestamp(value, name):
              if not isinstance(value, str) or not value:
                  raise SystemExit(f'{name} is missing')
              try:
                  parsed = datetime.fromisoformat(value[:-1] + '+00:00' if value.endswith('Z') else value)
              except ValueError as exc:
                  raise SystemExit(f'{name} is invalid: {value!r}') from exc
              if parsed.tzinfo is None or parsed.utcoffset() is None:
                  raise SystemExit(f'{name} is not timezone-aware')
              return parsed.astimezone(timezone.utc)

          run = fetch(f'actions/runs/{run_id}')
          if run.get('name') != 'production-ga-windows-authority-rc4-release-lock-review':
              raise SystemExit(f'unexpected review workflow name: {run.get("name")!r}')
          if run.get('event') != 'workflow_dispatch':
              raise SystemExit('RC4 lock-review run is not workflow_dispatch')
          if run.get('status') != 'completed' or run.get('conclusion') != 'success':
              raise SystemExit('RC4 lock-review run is not completed successfully')
          if (run.get('head_sha') or '').lower() != candidate:
              raise SystemExit('RC4 lock-review run did not execute from the exact reviewed candidate head')
          review_run_updated_at = run.get('updated_at')
          review_run_updated = parse_timestamp(review_run_updated_at, 'review workflow updated_at')
          artifacts = fetch(f'actions/runs/{run_id}/artifacts?per_page=100').get('artifacts', [])
          matches = [item for item in artifacts if item.get('name') == 'psmatrix-2.0.0rc4-release-lock-review' and not item.get('expired')]
          if len(matches) != 1:
              raise SystemExit(f'expected exactly one non-expired RC4 lock-review artifact; found {len(matches)}')

          marker = f'RC4 HUMAN REVIEW APPROVED: {candidate}'
          valid = []
          for page in range(1, 101):
              page_items = fetch(f'issues/260/comments?per_page=100&page={page}')
              if not isinstance(page_items, list):
                  raise SystemExit('issue #260 comments response is not a list')
              for item in page_items:
                  user = item.get('user') or {}
                  if user.get('login') != 'Naveax' or item.get('author_association') != 'OWNER' or item.get('body') != marker:
                      continue
                  created_at = item.get('created_at')
                  created = parse_timestamp(created_at, 'approval comment created_at')
                  comment_id = item.get('id')
                  if not isinstance(comment_id, int) or comment_id <= 0:
                      raise SystemExit('matching RC4 approval comment has an invalid ID')
                  if created >= review_run_updated:
                      valid.append((created, comment_id, created_at))
              if len(page_items) < 100:
                  break
          if not valid:
              raise SystemExit('exact OWNER RC4 approval on issue #260 after review completion/update is missing')
          valid.sort(key=lambda item: (item[0], item[1]))
          _, comment_id, approval_created_at = valid[0]
          approval_body_sha256 = hashlib.sha256(marker.encode('utf-8')).hexdigest()

          env_values = {
              'PSMATRIX_RC4_REVIEW_RUN_UPDATED_AT': review_run_updated_at,
              'PSMATRIX_RC4_APPROVAL_COMMENT_ID': str(comment_id),
              'PSMATRIX_RC4_APPROVAL_CREATED_AT': approval_created_at,
              'PSMATRIX_RC4_APPROVAL_ACTOR': 'Naveax',
              'PSMATRIX_RC4_APPROVAL_ASSOCIATION': 'OWNER',
              'PSMATRIX_RC4_APPROVAL_BODY_SHA256': approval_body_sha256,
          }
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as handle:
              for key, value in env_values.items():
                  handle.write(f'{key}={value}\n')
          print(f'review_run_provenance=PASS run_id={run_id} artifact_id={matches[0].get("id")}')
          print(f'human_review_provenance=PASS issue=260 comment_id={comment_id} review_updated_at={review_run_updated_at} approval_created_at={approval_created_at}')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'RC4 lock-review provenance/owner-approval validation failed.' }

      - name: Download exact reviewed RC4 lock bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: psmatrix-2.0.0rc4-release-lock-review
          path: review
          repository: Naveax/PSMatrix
          run-id: ${{ inputs.review_run_id }}
          github-token: ${{ github.token }}

      - name: Materialize exact repository-commit candidate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $output = Join-Path $env:RUNNER_TEMP 'psmatrix-2.0.0rc4-release-lock-promotion'
          if (Test-Path -LiteralPath $output) { Remove-Item -LiteralPath $output -Recurse -Force }
          & python `
              (Join-Path $env:GITHUB_WORKSPACE 'control\scripts\ga\promote_windows_authority_rc4_release_lock.py') `
              --review-root (Join-Path $env:GITHUB_WORKSPACE 'review') `
              --output-root $output `
              --candidate-commit $env:CANDIDATE_COMMIT `
              --promotion-control-head $env:PSMATRIX_RC4_PROMOTION_CONTROL_HEAD `
              --promotion-run-id $env:PROMOTION_RUN_ID `
              --review-run-id $env:REVIEW_RUN_ID `
              --reviewed-draft-sha256 $env:REVIEWED_DRAFT_SHA256 `
              --reviewed-public-key-sha256 $env:REVIEWED_PUBLIC_KEY_SHA256 `
              --review-run-updated-at $env:PSMATRIX_RC4_REVIEW_RUN_UPDATED_AT `
              --approval-comment-id $env:PSMATRIX_RC4_APPROVAL_COMMENT_ID `
              --approval-created-at $env:PSMATRIX_RC4_APPROVAL_CREATED_AT `
              --approval-actor $env:PSMATRIX_RC4_APPROVAL_ACTOR `
              --approval-author-association $env:PSMATRIX_RC4_APPROVAL_ASSOCIATION `
              --approval-body-sha256 $env:PSMATRIX_RC4_APPROVAL_BODY_SHA256
          if ($LASTEXITCODE -ne 0) { throw 'RC4 release-lock promotion candidate build failed.' }
          "PSMATRIX_RC4_PROMOTION=$output" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Enforce promotion candidate boundary
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $reportPath = Join-Path $env:PSMATRIX_RC4_PROMOTION 'rc4-release-lock-promotion.json'
          $lockPath = Join-Path $env:PSMATRIX_RC4_PROMOTION 'ga-packs\03-authoritative-windows\rc4-release-lock.json'
          $publicPath = Join-Path $env:PSMATRIX_RC4_PROMOTION 'release-assets\2.0.0rc4\psmatrix-2.0.0rc4-release-public.pem'
          foreach ($path in @($reportPath,$lockPath,$publicPath)) {
              if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw "RC4 promotion output is missing: $path" }
          }
          $report = Get-Content -LiteralPath $reportPath -Raw | ConvertFrom-Json -DateKind String
          $lock = Get-Content -LiteralPath $lockPath -Raw | ConvertFrom-Json -DateKind String
          if ([string]$report.status -ne 'READY_FOR_EXACT_REPOSITORY_COMMIT') { throw 'RC4 promotion report status mismatch.' }
          if ([string]$report.candidate_commit -ne $env:CANDIDATE_COMMIT) { throw 'RC4 promotion report candidate mismatch.' }
          if ([string]$report.promotion_control_head -ne $env:PSMATRIX_RC4_PROMOTION_CONTROL_HEAD) { throw 'RC4 promotion control-head mismatch.' }
          if ([string]$report.promotion_run_id -ne $env:PROMOTION_RUN_ID -or [string]$report.review_run_id -ne $env:REVIEW_RUN_ID) { throw 'RC4 promotion run provenance mismatch.' }
          if ([bool]$report.human_review_bound -ne $true -or [bool]$report.repository_commit_required -ne $true) { throw 'RC4 promotion report is missing human-review/repository-commit boundaries.' }
          if ([int64]$report.human_review.comment_id -ne [int64]$env:PSMATRIX_RC4_APPROVAL_COMMENT_ID -or [int]$report.human_review.issue_number -ne 260) { throw 'RC4 promotion report approval comment binding mismatch.' }
          if ([string]$report.human_review.actor -ne 'Naveax' -or [string]$report.human_review.author_association -ne 'OWNER') { throw 'RC4 promotion report approval actor/association mismatch.' }
          if ([string]$report.human_review.created_at -ne $env:PSMATRIX_RC4_APPROVAL_CREATED_AT -or [string]$report.human_review.review_run_updated_at -ne $env:PSMATRIX_RC4_REVIEW_RUN_UPDATED_AT -or [string]$report.human_review.approval_body_sha256 -ne $env:PSMATRIX_RC4_APPROVAL_BODY_SHA256) { throw 'RC4 promotion report approval provenance mismatch.' }
          if ([bool]$report.human_review.approval_not_before_review_run_update -ne $true) { throw 'RC4 promotion report approval time boundary is missing.' }
          if ([bool]$report.repository_mutated -or [bool]$report.release_artifacts_signed -or [bool]$report.authoritative -or [bool]$report.ga_eligible) { throw 'RC4 promotion report improperly claims mutation/signing/authority.' }
          if ([string]$lock.promotion_state -ne 'READY_FOR_EXACT_REPOSITORY_COMMIT') { throw 'Promoted RC4 lock is not repository-commit-ready.' }
          if ([string]$lock.release_commit -ne $env:CANDIDATE_COMMIT -or [string]$lock.version -ne '2.0.0rc4') { throw 'Promoted RC4 lock identity mismatch.' }
          if ([bool]$lock.release_artifacts_signed -or [bool]$lock.authoritative -or [bool]$lock.ga_eligible) { throw 'Promoted RC4 lock improperly claims signed/authority state.' }
          if ([string]$lock.promotion_evidence.promotion_run_id -ne $env:PROMOTION_RUN_ID -or [string]$lock.promotion_evidence.review_run_id -ne $env:REVIEW_RUN_ID -or [string]$lock.promotion_evidence.promotion_control_head -ne $env:PSMATRIX_RC4_PROMOTION_CONTROL_HEAD) { throw 'Promoted RC4 lock provenance mismatch.' }
          if ([bool]$lock.promotion_evidence.human_review_bound -ne $true -or [bool]$lock.promotion_evidence.repository_commit_required -ne $true) { throw 'Promoted RC4 lock is missing review/commit boundaries.' }
          if ([int64]$lock.promotion_evidence.human_review.comment_id -ne [int64]$env:PSMATRIX_RC4_APPROVAL_COMMENT_ID -or [string]$lock.promotion_evidence.human_review.approval_body_sha256 -ne $env:PSMATRIX_RC4_APPROVAL_BODY_SHA256) { throw 'Promoted RC4 lock human-review proof mismatch.' }

          $privateMarkers = @('-----BEGIN PRIVATE KEY-----','-----BEGIN RSA PRIVATE KEY-----','-----BEGIN EC PRIVATE KEY-----','-----BEGIN OPENSSH PRIVATE KEY-----')
          foreach ($file in Get-ChildItem -LiteralPath $env:PSMATRIX_RC4_PROMOTION -Recurse -File) {
              $text = [System.Text.Encoding]::UTF8.GetString([System.IO.File]::ReadAllBytes($file.FullName))
              foreach ($marker in $privateMarkers) {
                  if ($text.Contains($marker)) { throw "Private-key material found in RC4 promotion output: $($file.Name)" }
              }
          }
          Write-Host 'rc4_lock_promotion_candidate=PASS'
          Write-Host 'human_review_bound=true'
          Write-Host 'repository_mutated=false'
          Write-Host 'release_artifacts_signed=false'

      - name: Upload exact RC4 lock repository-commit candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: psmatrix-2.0.0rc4-release-lock-promotion-candidate
          path: ${{ env.PSMATRIX_RC4_PROMOTION }}
          if-no-files-found: error
          retention-days: 30
