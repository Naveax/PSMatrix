name: ops-final-security-review-packet-handoff

on:
  workflow_run:
    workflows: [production-ga-final-security-review-packet]
    types: [completed]

concurrency:
  group: ops-final-security-review-packet-handoff
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
  issues: write

jobs:
  publish-handoff:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'workflow_dispatch' &&
      github.event.workflow_run.head_branch == 'release/2.0.0-final-active-lock' &&
      github.event.workflow_run.actor.login == 'github-actions[bot]' &&
      github.event.workflow_run.triggering_actor.login == 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      PACKET_RUN_ID: ${{ github.event.workflow_run.id }}
      PACKET_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
      CONTROL_HEAD: ${{ github.event.workflow_run.head_sha }}
      FINAL_ACTIVE_BRANCH: release/2.0.0-final-active-lock
      STATE_ISSUE: '262'
      EXTERNAL_ISSUE: '261'
    steps:
      - name: Validate exact automated packet run and artifact
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          [[ "$PACKET_RUN_ID" =~ ^[1-9][0-9]*$ && "$PACKET_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ && "$CONTROL_HEAD" =~ ^[0-9a-f]{40}$ ]]
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$FINAL_ACTIVE_BRANCH" --jq '.object.sha')
          [[ "$current" == "$CONTROL_HEAD" ]] || { echo 'Final active control moved before review-packet handoff.' >&2; exit 1; }
          run=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PACKET_RUN_ID")
          [[ "$(jq -r '.name' <<<"$run")" == 'production-ga-final-security-review-packet' ]] || { echo 'Security-review packet workflow name mismatch.' >&2; exit 1; }
          [[ "$(jq -r '.path' <<<"$run")" == '.github/workflows/ga-final-security-review-packet.yml' ]] || { echo 'Security-review packet workflow path mismatch.' >&2; exit 1; }
          [[ "$(jq -r '.event' <<<"$run")" == 'workflow_dispatch' ]] || { echo 'Security-review packet event mismatch.' >&2; exit 1; }
          [[ "$(jq -r '.status' <<<"$run")" == 'completed' && "$(jq -r '.conclusion' <<<"$run")" == 'success' ]] || { echo 'Security-review packet run is not completed/success.' >&2; exit 1; }
          [[ "$(jq -r '.head_branch' <<<"$run")" == "$FINAL_ACTIVE_BRANCH" && "$(jq -r '.head_sha' <<<"$run")" == "$CONTROL_HEAD" ]] || { echo 'Security-review packet control provenance mismatch.' >&2; exit 1; }
          [[ "$(jq -r '.run_attempt' <<<"$run")" == "$PACKET_RUN_ATTEMPT" ]] || { echo 'Security-review packet attempt mismatch.' >&2; exit 1; }
          [[ "$(jq -r '.actor.login' <<<"$run")" == 'github-actions[bot]' && "$(jq -r '.triggering_actor.login' <<<"$run")" == 'github-actions[bot]' ]] || { echo 'Security-review packet was not dispatched by final-signing automation.' >&2; exit 1; }
          artifact_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PACKET_RUN_ID/artifacts?per_page=100" \
            --jq '[.artifacts[] | select(.name == "psmatrix-2.0.0-final-security-review-packet" and (.expired|not))] | if length == 1 then .[0].id else error("expected exactly one live final security-review packet artifact") end')
          [[ "$artifact_id" =~ ^[1-9][0-9]*$ ]] || { echo 'Review packet artifact ID is invalid.' >&2; exit 1; }
          echo "artifact_id=$artifact_id" >> "$GITHUB_OUTPUT"
          echo "final_security_review_packet=PASS artifact_id=$artifact_id automated_dispatch=true"

      - name: Record packet and publish independent-review handoff idempotently
        env:
          ARTIFACT_ID: ${{ steps.artifact.outputs.artifact_id }}
        shell: bash
        run: |
          set -euo pipefail
          state_marker="RC4_CHAIN_STATE stage=security_review_packet run_id=$PACKET_RUN_ID attempt=$PACKET_RUN_ATTEMPT control_head=$CONTROL_HEAD"
          handoff_marker="SECURITY_REVIEW_HANDOFF packet_run=$PACKET_RUN_ID artifact_id=$ARTIFACT_ID control_head=$CONTROL_HEAD"

          external_seen=false
          if gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$EXTERNAL_ISSUE/comments" --jq '.[] | select(.user.login == "github-actions[bot]") | .body' | grep -Fq "$handoff_marker"; then
            external_seen=true
          fi
          if [[ "$external_seen" != true ]]; then
            gh issue comment "$EXTERNAL_ISSUE" --repo "$GITHUB_REPOSITORY" --body "Final independent security-review packet is ready. Canonical packet run: \`$PACKET_RUN_ID\`, artifact ID: \`$ARTIFACT_ID\`, exact control head: \`$CONTROL_HEAD\`. Reviewer must use this exact packet and must remain independent. Do not post the completed report or reviewer private key in this issue; provision the validated report through \`PSMATRIX_GA_SECURITY_REVIEW_REPORT_JSON\` in \`production-ga-security-review-signing\`. \`ga_eligible=false\` until the final evaluator passes.\n\n$handoff_marker"
          else
            echo 'security_review_handoff_duplicate_suppressed=true'
          fi

          if ! gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$STATE_ISSUE/comments" --jq '.[] | select(.user.login == "github-actions[bot]") | .body' | grep -Fxq "$state_marker"; then
            gh issue comment "$STATE_ISSUE" --repo "$GITHUB_REPOSITORY" --body "$state_marker"
          else
            echo 'security_review_packet_state_duplicate_suppressed=true'
          fi
          echo 'independent_review_handoff_published=true'
