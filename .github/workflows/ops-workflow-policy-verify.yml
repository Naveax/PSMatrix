name: ops-workflow-policy-verify

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/*.yml'
  workflow_dispatch:

concurrency:
  group: ops-workflow-policy-verify-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      STATE_ISSUE: '262'
    steps:
      - name: Check out exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Validate workflow supply-chain, permissions, retired credentials, owner gates, and source artifacts
        shell: bash
        run: |
          set -euo pipefail
          ruby <<'RUBY'
          require 'yaml'

          errors = []
          all_workflows = Dir['.github/workflows/*.yml'].sort
          files = (Dir['.github/workflows/ops-*.yml'] + Dir['.github/workflows/ga-*.yml']).uniq.sort
          action_refs = 0
          permissions_checked = 0
          job_permissions_checked = 0
          retired_credential = ['PSMATRIX','TEMP','ADMIN','TOKEN'].join('_')
          retired_credential_refs = 0
          owner_gate_contracts_checked = 0
          issue_comment_triggers_checked = 0
          pull_request_target_refs = 0
          source_run_bindings_checked = 0
          source_artifact_bindings_checked = 0
          expression_prefix = '$' + '{{'
          workflow_docs = {}
          workflow_paths_by_name = Hash.new { |h, k| h[k] = [] }

          allowed_issue_comment_workflows = [
            '.github/workflows/ops-rc4-human-approval-promotion-dispatch.yml',
            '.github/workflows/ops-final-human-approval-promotion-dispatch.yml',
            '.github/workflows/ops-external22-ready-to-fresh-readiness.yml',
          ].sort

          all_workflows.each do |path|
            raw = File.read(path, encoding: 'utf-8')
            if raw.include?(retired_credential)
              retired_credential_refs += 1
              errors << "#{path}: retired temporary admin credential reference is forbidden"
            end

            begin
              gate_doc = YAML.safe_load(raw, aliases: true)
            rescue => e
              errors << "#{path}: YAML parse failed during trigger-policy scan: #{e.class}: #{e.message}"
              next
            end
            next unless gate_doc.is_a?(Hash)
            workflow_docs[path] = gate_doc
            workflow_name = gate_doc['name'].to_s.strip
            workflow_paths_by_name[workflow_name] << path unless workflow_name.empty?

            trigger = gate_doc['on'] || gate_doc[true]
            next unless trigger.is_a?(Hash)
            if trigger.key?('pull_request_target')
              pull_request_target_refs += 1
              errors << "#{path}: pull_request_target is forbidden in repository workflows"
            end
            if trigger.key?('issue_comment')
              issue_comment_triggers_checked += 1
              unless allowed_issue_comment_workflows.include?(path)
                errors << "#{path}: issue_comment trigger is not an approved owner-only release gate"
              end
            end
          end

          observed_issue_comment = workflow_docs.select do |_path, doc|
            trigger = doc['on'] || doc[true]
            trigger.is_a?(Hash) && trigger.key?('issue_comment')
          end.keys.sort
          if observed_issue_comment != allowed_issue_comment_workflows
            errors << "issue_comment trigger set mismatch: observed=#{observed_issue_comment.inspect} expected=#{allowed_issue_comment_workflows.inspect}"
          end

          literal_uploads_by_path = Hash.new { |h, k| h[k] = [] }
          workflow_docs.each do |path, doc|
            jobs = doc['jobs']
            next unless jobs.is_a?(Hash)
            jobs.each_value do |job|
              next unless job.is_a?(Hash)
              Array(job['steps']).each do |step|
                next unless step.is_a?(Hash)
                next unless step['uses'].to_s.start_with?('actions/upload-artifact@')
                with = step['with']
                next unless with.is_a?(Hash)
                name = with['name'].to_s.strip
                next if name.empty? || name.include?(expression_prefix)
                literal_uploads_by_path[path] << name unless literal_uploads_by_path[path].include?(name)
              end
            end
          end

          workflow_docs.each do |path, doc|
            trigger = doc['on'] || doc[true]
            workflow_run = trigger.is_a?(Hash) ? trigger['workflow_run'] : nil
            next unless workflow_run.is_a?(Hash)
            source_names = Array(workflow_run['workflows']).map { |v| v.to_s.strip }.reject(&:empty?)
            source_paths = source_names.flat_map { |name| workflow_paths_by_name[name] }.uniq
            jobs = doc['jobs']
            next unless jobs.is_a?(Hash)
            jobs.each do |job_name, job|
              next unless job.is_a?(Hash)
              Array(job['steps']).each_with_index do |step, index|
                next unless step.is_a?(Hash)
                next unless step['uses'].to_s.start_with?('actions/download-artifact@')
                with = step['with']
                next unless with.is_a?(Hash)
                run_id = with['run-id'].to_s.strip
                unless run_id.include?('github.event.workflow_run.id')
                  errors << "#{path}: job #{job_name} step #{index} workflow_run artifact download is not bound to the triggering workflow_run.id"
                  next
                end
                source_run_bindings_checked += 1
                name = with['name'].to_s.strip
                next if name.empty? || name.include?(expression_prefix)
                matching_sources = source_paths.select { |source_path| literal_uploads_by_path[source_path].include?(name) }
                if matching_sources.empty?
                  errors << "#{path}: workflow_run artifact #{name.inspect} is not literally uploaded by any declared source workflow #{source_names.inspect}"
                else
                  source_artifact_bindings_checked += 1
                end
              end
            end
          end

          owner_gate_requirements = {
            '.github/workflows/ops-rc4-human-approval-promotion-dispatch.yml' => [
              'issue_comment:',
              'types: [created]',
              'github.event.issue.number == 260',
              "github.event.comment.user.login == 'Naveax'",
              "github.event.comment.author_association == 'OWNER'",
              "github.event.comment.body == 'RC4 HUMAN REVIEW APPROVED: 0b4e77d5e5cf142e2cdb47f5cc4b8dd81353ae63'",
            ],
            '.github/workflows/ops-final-human-approval-promotion-dispatch.yml' => [
              'issue_comment:',
              'types: [created]',
              'github.event.issue.number == 263',
              "github.event.comment.user.login == 'Naveax'",
              "github.event.comment.author_association == 'OWNER'",
              "startsWith(github.event.comment.body, 'FINAL HUMAN REVIEW APPROVED: ')",
              'approval comment does not exactly match the published human-review binding',
            ],
            '.github/workflows/ops-external22-ready-to-fresh-readiness.yml' => [
              'issue_comment:',
              'types: [created]',
              'github.event.issue.number == 261',
              "github.event.comment.user.login == 'Naveax'",
              "github.event.comment.author_association == 'OWNER'",
              "github.event.comment.body == 'EXTERNAL22 MATERIAL READY'",
            ],
          }

          owner_gate_requirements.each do |path, fragments|
            unless File.file?(path)
              errors << "#{path}: required owner-only release gate workflow is missing"
              next
            end
            raw = File.read(path, encoding: 'utf-8')
            fragments.each do |fragment|
              errors << "#{path}: owner-only release gate invariant missing: #{fragment}" unless raw.include?(fragment)
            end
            owner_gate_contracts_checked += 1
          end

          files.each do |path|
            raw = File.read(path, encoding: 'utf-8')
            begin
              doc = YAML.safe_load(raw, aliases: true)
            rescue => e
              errors << "#{path}: YAML parse failed: #{e.class}: #{e.message}"
              next
            end
            next unless doc.is_a?(Hash)

            permissions = doc['permissions']
            unless permissions.is_a?(Hash)
              errors << "#{path}: top-level permissions must be an explicit mapping"
            else
              permissions_checked += 1
              permissions.each do |scope, level|
                errors << "#{path}: unsupported top-level permission #{scope}=#{level.inspect}" unless %w[read write none].include?(level.to_s)
              end
            end

            jobs = doc['jobs']
            next unless jobs.is_a?(Hash)
            jobs.each do |job_name, job|
              next unless job.is_a?(Hash)
              if job.key?('permissions')
                job_permissions = job['permissions']
                unless job_permissions.is_a?(Hash)
                  errors << "#{path}: job #{job_name} permissions must be an explicit mapping"
                else
                  job_permissions_checked += 1
                  job_permissions.each do |scope, level|
                    errors << "#{path}: job #{job_name} unsupported permission #{scope}=#{level.inspect}" unless %w[read write none].include?(level.to_s)
                  end
                end
              end

              refs = []
              refs << job['uses'] if job['uses'].is_a?(String)
              Array(job['steps']).each { |step| refs << step['uses'] if step.is_a?(Hash) && step['uses'].is_a?(String) }
              refs.compact.each do |ref|
                next if ref.start_with?('./') || ref.start_with?('docker://')
                action_refs += 1
                unless ref.match?(/\A[^@\s]+@[0-9a-fA-F]{40}\z/)
                  errors << "#{path}: external action/reusable workflow is not pinned to a 40-hex commit SHA: #{ref}"
                end
              end
            end
          end

          puts "release_workflow_policy_scan workflow_files=#{all_workflows.length} critical_workflows=#{files.length} action_refs=#{action_refs} top_permissions=#{permissions_checked} job_permissions=#{job_permissions_checked} retired_credential_refs=#{retired_credential_refs} owner_gate_contracts_checked=#{owner_gate_contracts_checked} issue_comment_triggers=#{issue_comment_triggers_checked} pull_request_target_refs=#{pull_request_target_refs} source_run_bindings_checked=#{source_run_bindings_checked} source_artifact_bindings_checked=#{source_artifact_bindings_checked}"
          unless errors.empty?
            warn errors.join("\n")
            exit 1
          end
          RUBY

      - name: Publish policy verification result idempotently
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ job.status }}" == success ]]; then status=PASS; else status=FAIL; fi
          marker="OPS_WORKFLOW_POLICY_VERIFY head=$GITHUB_SHA "
          body="${marker}status=$status scope=all-retired-credential+ops+ga-policy retired_temp_admin_refs=0 owner_gate_contracts=3 issue_comment_gate_set=3 pull_request_target_refs=0 source_artifact_binding=enabled"
          comment_id=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$STATE_ISSUE/comments" \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id" \
            | tail -n 1)
          if [[ -n "$comment_id" ]]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$comment_id" -f body="$body" >/dev/null
            echo "workflow_policy_comment=updated head=$GITHUB_SHA comment_id=$comment_id"
          else
            gh issue comment "$STATE_ISSUE" --repo "$GITHUB_REPOSITORY" --body "$body"
            echo "workflow_policy_comment=created head=$GITHUB_SHA"
          fi
          echo "$body"
          [[ "$status" == PASS ]]
