name: ops-workflow-policy-verify

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/*.yml'
  workflow_dispatch:

concurrency:
  group: ops-workflow-policy-verify-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      STATE_ISSUE: '262'
    steps:
      - name: Check out exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Validate ops workflow supply-chain and permissions policy
        shell: bash
        run: |
          set -euo pipefail
          ruby <<'RUBY'
          require 'yaml'

          errors = []
          files = Dir['.github/workflows/ops-*.yml'].sort
          action_refs = 0
          permissions_checked = 0
          job_permissions_checked = 0

          files.each do |path|
            begin
              doc = YAML.load_file(path, aliases: true)
            rescue => e
              errors << "#{path}: YAML parse failed: #{e.class}: #{e.message}"
              next
            end
            next unless doc.is_a?(Hash)

            permissions = doc['permissions']
            unless permissions.is_a?(Hash)
              errors << "#{path}: top-level permissions must be an explicit mapping"
            else
              permissions_checked += 1
              permissions.each do |scope, level|
                unless %w[read write none].include?(level.to_s)
                  errors << "#{path}: unsupported top-level permission #{scope}=#{level.inspect}"
                end
              end
            end

            jobs = doc['jobs']
            next unless jobs.is_a?(Hash)
            jobs.each do |job_name, job|
              next unless job.is_a?(Hash)
              if job.key?('permissions')
                job_permissions = job['permissions']
                unless job_permissions.is_a?(Hash)
                  errors << "#{path}: job #{job_name} permissions must be an explicit mapping"
                else
                  job_permissions_checked += 1
                  job_permissions.each do |scope, level|
                    unless %w[read write none].include?(level.to_s)
                      errors << "#{path}: job #{job_name} unsupported permission #{scope}=#{level.inspect}"
                    end
                  end
                end
              end

              refs = []
              refs << job['uses'] if job['uses'].is_a?(String)
              Array(job['steps']).each do |step|
                refs << step['uses'] if step.is_a?(Hash) && step['uses'].is_a?(String)
              end

              refs.compact.each do |ref|
                next if ref.start_with?('./') || ref.start_with?('docker://')
                action_refs += 1
                unless ref.match?(/\A[^@\s]+@[0-9a-fA-F]{40}\z/)
                  errors << "#{path}: external action/reusable workflow is not pinned to a 40-hex commit SHA: #{ref}"
                end
              end
            end
          end

          puts "ops_workflow_policy_scan workflows=#{files.length} action_refs=#{action_refs} top_permissions=#{permissions_checked} job_permissions=#{job_permissions_checked}"
          unless errors.empty?
            warn errors.join("\n")
            exit 1
          end
          RUBY

      - name: Publish policy verification result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ job.status }}" == success ]]; then
            status=PASS
          else
            status=FAIL
          fi
          body="OPS_WORKFLOW_POLICY_VERIFY status=$status head=$GITHUB_SHA"
          gh issue comment "$STATE_ISSUE" --repo "$GITHUB_REPOSITORY" --body "$body"
          [[ "$status" == PASS ]]
