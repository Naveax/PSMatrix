name: ops-workflow-policy-verify

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/*.yml'
  workflow_dispatch:

concurrency:
  group: ops-workflow-policy-verify-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      STATE_ISSUE: '262'
    steps:
      - name: Check out exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Validate workflow supply-chain, permissions, retired credentials, owner gates, and source artifacts
        shell: bash
        run: |
          set -euo pipefail
          ruby <<'RUBY'
          require 'yaml'

          errors = []
          all_workflows = Dir['.github/workflows/*.yml'].sort
          files = (Dir['.github/workflows/ops-*.yml'] + Dir['.github/workflows/ga-*.yml']).uniq.sort
          action_refs = 0
          permissions_checked = 0
          job_permissions_checked = 0
          retired_credential = ['PSMATRIX','TEMP','ADMIN','TOKEN'].join('_')
          retired_credential_refs = 0
          owner_gate_contracts_checked = 0
          final_review_publisher_contracts_checked = 0
          promotion_pr_human_gate_contracts_checked = 0
          promotion_merge_contracts_checked = 0
          second_human_gate_contracts_checked = 0
          issue_comment_triggers_checked = 0
          pull_request_target_refs = 0
          source_run_bindings_checked = 0
          source_artifact_bindings_checked = 0
          privileged_source_event_guards_checked = 0
          mutation_source_guards_checked = 0
          automated_mutation_source_guards_checked = 0
          expression_prefix = '$' + '{{'
          workflow_docs = {}
          workflow_paths_by_name = Hash.new { |h, k| h[k] = [] }

          allowed_issue_comment_workflows = [
            '.github/workflows/ops-rc4-human-approval-promotion-dispatch.yml',
            '.github/workflows/ops-final-human-approval-promotion-dispatch.yml',
            '.github/workflows/ops-external22-ready-to-fresh-readiness.yml',
          ].sort

          authoritative_issue_mutation_workflows = [
            '.github/workflows/ops-final-evaluator-verified-closure.yml',
            '.github/workflows/ops-final-lock-review-human-gate.yml',
            '.github/workflows/ops-final-security-review-packet-handoff.yml',
          ].sort

          all_workflows.each do |path|
            raw = File.read(path, encoding: 'utf-8')
            if raw.include?(retired_credential)
              retired_credential_refs += 1
              errors << "#{path}: retired temporary admin credential reference is forbidden"
            end

            begin
              gate_doc = YAML.safe_load(raw, aliases: true)
            rescue => e
              errors << "#{path}: YAML parse failed during trigger-policy scan: #{e.class}: #{e.message}"
              next
            end
            next unless gate_doc.is_a?(Hash)
            workflow_docs[path] = gate_doc
            workflow_name = gate_doc['name'].to_s.strip
            workflow_paths_by_name[workflow_name] << path unless workflow_name.empty?

            trigger = gate_doc['on'] || gate_doc[true]
            next unless trigger.is_a?(Hash)
            if trigger.key?('pull_request_target')
              pull_request_target_refs += 1
              errors << "#{path}: pull_request_target is forbidden in repository workflows"
            end
            if trigger.key?('issue_comment')
              issue_comment_triggers_checked += 1
              unless allowed_issue_comment_workflows.include?(path)
                errors << "#{path}: issue_comment trigger is not an approved owner-only release gate"
              end
            end
          end

          observed_issue_comment = workflow_docs.select do |_path, doc|
            trigger = doc['on'] || doc[true]
            trigger.is_a?(Hash) && trigger.key?('issue_comment')
          end.keys.sort
          if observed_issue_comment != allowed_issue_comment_workflows
            errors << "issue_comment trigger set mismatch: observed=#{observed_issue_comment.inspect} expected=#{allowed_issue_comment_workflows.inspect}"
          end

          literal_uploads_by_path = Hash.new { |h, k| h[k] = [] }
          workflow_docs.each do |path, doc|
            jobs = doc['jobs']
            next unless jobs.is_a?(Hash)
            jobs.each_value do |job|
              next unless job.is_a?(Hash)
              Array(job['steps']).each do |step|
                next unless step.is_a?(Hash)
                next unless step['uses'].to_s.start_with?('actions/upload-artifact@')
                with = step['with']
                next unless with.is_a?(Hash)
                name = with['name'].to_s.strip
                next if name.empty? || name.include?(expression_prefix)
                literal_uploads_by_path[path] << name unless literal_uploads_by_path[path].include?(name)
              end
            end
          end

          workflow_docs.each do |path, doc|
            trigger = doc['on'] || doc[true]
            workflow_run = trigger.is_a?(Hash) ? trigger['workflow_run'] : nil
            next unless workflow_run.is_a?(Hash)
            source_names = Array(workflow_run['workflows']).map { |v| v.to_s.strip }.reject(&:empty?)
            source_paths = source_names.flat_map { |name| workflow_paths_by_name[name] }.uniq
            jobs = doc['jobs']
            next unless jobs.is_a?(Hash)
            top_permissions = doc['permissions'].is_a?(Hash) ? doc['permissions'] : {}

            jobs.each do |job_name, job|
              next unless job.is_a?(Hash)
              effective_permissions = job['permissions'].is_a?(Hash) ? job['permissions'] : top_permissions
              write_capable = effective_permissions.any? { |_scope, level| level.to_s == 'write' }
              release_mutation_capable = %w[actions contents pull-requests].any? { |scope| effective_permissions[scope].to_s == 'write' } || authoritative_issue_mutation_workflows.include?(path)
              cross_run_artifact_job = false

              Array(job['steps']).each_with_index do |step, index|
                next unless step.is_a?(Hash)
                next unless step['uses'].to_s.start_with?('actions/download-artifact@')
                with = step['with']
                next unless with.is_a?(Hash)
                run_id = with['run-id'].to_s.strip
                unless run_id.include?('github.event.workflow_run.id')
                  errors << "#{path}: job #{job_name} step #{index} workflow_run artifact download is not bound to the triggering workflow_run.id"
                  next
                end
                source_run_bindings_checked += 1
                cross_run_artifact_job = true
                name = with['name'].to_s.strip
                next if name.empty? || name.include?(expression_prefix)
                matching_sources = source_paths.select { |source_path| literal_uploads_by_path[source_path].include?(name) }
                if matching_sources.empty?
                  errors << "#{path}: workflow_run artifact #{name.inspect} is not literally uploaded by any declared source workflow #{source_names.inspect}"
                else
                  source_artifact_bindings_checked += 1
                end
              end

              job_if = job['if'].to_s
              trusted_source_event = job_if.match?(/github\.event\.workflow_run\.event\s*==\s*['\"](?:workflow_dispatch|push)['\"]/)

              if cross_run_artifact_job && write_capable
                unless trusted_source_event
                  errors << "#{path}: privileged workflow_run artifact consumer job #{job_name} must require source event == workflow_dispatch or push"
                else
                  privileged_source_event_guards_checked += 1
                end
              end

              next unless release_mutation_capable
              successful_source = job_if.match?(/github\.event\.workflow_run\.conclusion\s*==\s*['\"]success['\"]/)
              trusted_actor = job_if.match?(/github\.event\.workflow_run\.actor\.login\s*==\s*['\"]github-actions\[bot\]['\"]/) 
              trusted_triggering_actor = job_if.match?(/github\.event\.workflow_run\.triggering_actor\.login\s*==\s*['\"]github-actions\[bot\]['\"]/) 
              unless trusted_source_event && successful_source
                errors << "#{path}: workflow_run release-mutation job #{job_name} must require trusted source event and conclusion == success"
                next
              end
              mutation_source_guards_checked += 1
              unless trusted_actor && trusted_triggering_actor
                errors << "#{path}: workflow_run release-mutation job #{job_name} must require github-actions[bot] actor and triggering_actor"
                next
              end
              automated_mutation_source_guards_checked += 1
            end
          end

          owner_gate_requirements = {
            '.github/workflows/ops-rc4-human-approval-promotion-dispatch.yml' => [
              'issue_comment:',
              'types: [created]',
              'github.event.issue.number == 260',
              "github.event.comment.user.login == 'Naveax'",
              "github.event.comment.author_association == 'OWNER'",
              "github.event.comment.body == 'RC4 HUMAN REVIEW APPROVED: 0b4e77d5e5cf142e2cdb47f5cc4b8dd81353ae63'",
              "REVIEW_RUN_ATTEMPT: '1'",
              '.github/workflows/ga-windows-authority-rc4-release-lock-review.yml',
              'review run attempt mismatch',
              'review run was not created by the canonical automation chain',
              'expected exactly one live review artifact',
              'rc4_human_review_artifact_binding=PASS',
            ],
            '.github/workflows/ops-final-human-approval-promotion-dispatch.yml' => [
              'issue_comment:',
              'types: [created]',
              'github.event.issue.number == 263',
              "github.event.comment.user.login == 'Naveax'",
              "github.event.comment.author_association == 'OWNER'",
              "startsWith(github.event.comment.body, 'FINAL HUMAN REVIEW APPROVED: ')",
              'approval comment does not exactly match the published human-review binding',
              'REVIEW_ATTEMPT:',
              '.github/workflows/ga-windows-authority-final-release-lock-review.yml',
              'final review run attempt mismatch',
              'final review run was not created by the canonical automation chain',
              'expected exactly one live final review artifact',
              'final_human_review_artifact_binding=PASS',
            ],
            '.github/workflows/ops-external22-ready-to-fresh-readiness.yml' => [
              'issue_comment:',
              'types: [created]',
              'github.event.issue.number == 261',
              "github.event.comment.user.login == 'Naveax'",
              "github.event.comment.author_association == 'OWNER'",
              "github.event.comment.body == 'EXTERNAL22 MATERIAL READY'",
              'Protected final signing artifact cardinality mismatch',
              'Final security-review packet artifact cardinality mismatch',
              'production-ga-windows-authority-final-release-sign-from-lock',
              '.github/workflows/ga-windows-authority-final-release-sign-from-lock.yml',
              'Protected final signing was not created by the canonical automation chain.',
              'production-ga-final-security-review-packet',
              '.github/workflows/ga-final-security-review-packet.yml',
              'Final security-review packet was not created by the canonical automation chain.',
              'source=canonical_bot_actions',
              'noncanonical_active',
            ],
          }

          owner_gate_requirements.each do |path, fragments|
            unless File.file?(path)
              errors << "#{path}: required owner-only release gate workflow is missing"
              next
            end
            raw = File.read(path, encoding: 'utf-8')
            fragments.each do |fragment|
              errors << "#{path}: owner-only release gate invariant missing: #{fragment}" unless raw.include?(fragment)
            end
            owner_gate_contracts_checked += 1
          end

          final_review_publisher_requirements = {
            '.github/workflows/ops-final-lock-review-human-gate.yml' => [
              "github.event.workflow_run.actor.login == 'github-actions[bot]'",
              "github.event.workflow_run.triggering_actor.login == 'github-actions[bot]'",
              '.github/workflows/ga-windows-authority-final-release-lock-review.yml',
              'Final lock-review artifact cardinality mismatch: expected 1 live artifact',
              'final_lock_review_source_provenance=PASS automated_dispatch=true artifact_count=1',
              'human_approval_created=false',
            ],
          }

          final_review_publisher_requirements.each do |path, fragments|
            unless File.file?(path)
              errors << "#{path}: required final human-review publisher workflow is missing"
              next
            end
            raw = File.read(path, encoding: 'utf-8')
            fragments.each do |fragment|
              errors << "#{path}: final human-review publisher provenance invariant missing: #{fragment}" unless raw.include?(fragment)
            end
            final_review_publisher_contracts_checked += 1
          end

          promotion_pr_gate_requirements = {
            '.github/workflows/ops-rc4-promotion-to-reviewed-pr.yml' => [
              "HUMAN_GATE_ISSUE: '260'",
              "github.event.workflow_run.actor.login == 'github-actions[bot]'",
              "github.event.workflow_run.triggering_actor.login == 'github-actions[bot]'",
              'production-ga-windows-authority-rc4-release-lock-promotion',
              '.github/workflows/ga-windows-authority-rc4-release-lock-promotion.yml',
              'RC4 HUMAN REVIEW APPROVED:',
              'Exact RC4 owner approval is missing.',
              'RC4 promotion predates owner approval:',
              'rc4_first_human_gate_provenance=PASS',
              'Existing RC4 promotion PR is not the same-repository materializer-bot PR.',
              'main moved before RC4 promotion PR recovery/create:',
              'Orphan RC4 promotion branch is not a single commit directly on the promotion control head:',
              'rc4_promotion_orphan_branch_recovered=PASS',
            ],
            '.github/workflows/ops-final-promotion-to-reviewed-pr.yml' => [
              "HUMAN_GATE_ISSUE: '263'",
              "github.event.workflow_run.actor.login == 'github-actions[bot]'",
              "github.event.workflow_run.triggering_actor.login == 'github-actions[bot]'",
              'production-ga-windows-authority-final-release-lock-promotion',
              '.github/workflows/ga-windows-authority-final-release-lock-promotion.yml',
              'FINAL_REVIEW_BINDING',
              'FINAL HUMAN REVIEW APPROVED:',
              'Exact final owner approval is missing.',
              'Final promotion predates owner approval:',
              'final_first_human_gate_provenance=PASS',
              'Existing final promotion PR is not the same-repository materializer-bot PR.',
              'Orphan final promotion branch is not a single commit directly on the frozen promotion control head:',
              'final_promotion_orphan_branch_recovered=PASS',
            ],
          }

          promotion_pr_gate_requirements.each do |path, fragments|
            unless File.file?(path)
              errors << "#{path}: required promotion-to-reviewed-PR workflow is missing"
              next
            end
            raw = File.read(path, encoding: 'utf-8')
            fragments.each do |fragment|
              errors << "#{path}: first-human-gate promotion provenance invariant missing: #{fragment}" unless raw.include?(fragment)
            end
            promotion_pr_human_gate_contracts_checked += 1
          end

          promotion_merge_requirements = {
            '.github/workflows/ops-rc4-reviewed-lock-merge-to-signing.yml' => [
              'github.event.pull_request.head.repo.full_name == github.repository',
              "github.event.pull_request.user.login == 'github-actions[bot]'",
              'HEAD_REPOSITORY:',
              'PR_AUTHOR:',
              'production-ga-windows-authority-rc4-release-lock-promotion',
              '.github/workflows/ga-windows-authority-rc4-release-lock-promotion.yml',
              'psmatrix-2.0.0rc4-release-lock-promotion-candidate',
              'RC4 promotion artifact cardinality mismatch:',
              'Merged RC4 release-lock bytes differ from canonical promotion artifact.',
              'Merged RC4 public-key bytes differ from canonical promotion artifact.',
              'exact_bytes=true',
              'canonical_bot_runs=',
              'active_noncanonical_runs=0',
              'rc4_promotion_merge_provenance=PASS',
            ],
            '.github/workflows/ops-final-reviewed-lock-merge-to-signing.yml' => [
              'github.event.pull_request.head.repo.full_name == github.repository',
              "github.event.pull_request.user.login == 'github-actions[bot]'",
              'HEAD_REPOSITORY:',
              'PR_AUTHOR:',
              'production-ga-windows-authority-final-release-lock-promotion',
              '.github/workflows/ga-windows-authority-final-release-lock-promotion.yml',
              'psmatrix-2.0.0-final-release-lock-promotion-candidate',
              'Final promotion artifact cardinality mismatch:',
              'Merged final release-lock bytes differ from canonical promotion artifact.',
              'Merged final public-key bytes differ from canonical promotion artifact.',
              'exact_bytes=true',
              'canonical_bot_runs=',
              'active_noncanonical_runs=0',
              'final_promotion_merge_provenance=PASS',
            ],
          }

          promotion_merge_requirements.each do |path, fragments|
            unless File.file?(path)
              errors << "#{path}: required reviewed-lock merge consumer is missing"
              next
            end
            raw = File.read(path, encoding: 'utf-8')
            fragments.each do |fragment|
              errors << "#{path}: reviewed-lock merge provenance invariant missing: #{fragment}" unless raw.include?(fragment)
            end
            promotion_merge_contracts_checked += 1
          end

          second_human_gate_requirements = {
            '.github/workflows/ops-rc4-reviewed-lock-merge-to-signing.yml' => [
              "github.event.pull_request.merged_by.login == 'Naveax'",
              'PR_HEAD_SHA:',
              'MERGED_BY:',
              '.author_association == "OWNER"',
              '.commit_id == $sha',
              '.state == "APPROVED"',
              'Latest decisive Naveax review for exact RC4 head is not APPROVED:',
              'rc4_second_human_gate=PASS',
            ],
            '.github/workflows/ops-final-reviewed-lock-merge-to-signing.yml' => [
              "github.event.pull_request.merged_by.login == 'Naveax'",
              'PR_HEAD_SHA:',
              'MERGED_BY:',
              '.author_association == "OWNER"',
              '.commit_id == $sha',
              '.state == "APPROVED"',
              'Latest decisive Naveax review for exact final head is not APPROVED:',
              'final_second_human_gate=PASS',
            ],
          }

          second_human_gate_requirements.each do |path, fragments|
            unless File.file?(path)
              errors << "#{path}: required second-human-gate merge consumer is missing"
              next
            end
            raw = File.read(path, encoding: 'utf-8')
            fragments.each do |fragment|
              errors << "#{path}: exact-head second human review invariant missing: #{fragment}" unless raw.include?(fragment)
            end
            second_human_gate_contracts_checked += 1
          end

          files.each do |path|
            raw = File.read(path, encoding: 'utf-8')
            begin
              doc = YAML.safe_load(raw, aliases: true)
            rescue => e
              errors << "#{path}: YAML parse failed: #{e.class}: #{e.message}"
              next
            end
            next unless doc.is_a?(Hash)

            permissions = doc['permissions']
            unless permissions.is_a?(Hash)
              errors << "#{path}: top-level permissions must be an explicit mapping"
            else
              permissions_checked += 1
              permissions.each do |scope, level|
                errors << "#{path}: unsupported top-level permission #{scope}=#{level.inspect}" unless %w[read write none].include?(level.to_s)
              end
            end

            jobs = doc['jobs']
            next unless jobs.is_a?(Hash)
            jobs.each do |job_name, job|
              next unless job.is_a?(Hash)
              if job.key?('permissions')
                job_permissions = job['permissions']
                unless job_permissions.is_a?(Hash)
                  errors << "#{path}: job #{job_name} permissions must be an explicit mapping"
                else
                  job_permissions_checked += 1
                  job_permissions.each do |scope, level|
                    errors << "#{path}: job #{job_name} unsupported permission #{scope}=#{level.inspect}" unless %w[read write none].include?(level.to_s)
                  end
                end
              end

              refs = []
              refs << job['uses'] if job['uses'].is_a?(String)
              Array(job['steps']).each { |step| refs << step['uses'] if step.is_a?(Hash) && step['uses'].is_a?(String) }
              refs.compact.each do |ref|
                next if ref.start_with?('./') || ref.start_with?('docker://')
                action_refs += 1
                unless ref.match?(/\A[^@\s]+@[0-9a-fA-F]{40}\z/)
                  errors << "#{path}: external action/reusable workflow is not pinned to a 40-hex commit SHA: #{ref}"
                end
              end
            end
          end

          puts "release_workflow_policy_scan workflow_files=#{all_workflows.length} critical_workflows=#{files.length} action_refs=#{action_refs} top_permissions=#{permissions_checked} job_permissions=#{job_permissions_checked} retired_credential_refs=#{retired_credential_refs} owner_gate_contracts_checked=#{owner_gate_contracts_checked} final_review_publisher_contracts_checked=#{final_review_publisher_contracts_checked} promotion_pr_human_gate_contracts_checked=#{promotion_pr_human_gate_contracts_checked} promotion_merge_contracts_checked=#{promotion_merge_contracts_checked} second_human_gate_contracts_checked=#{second_human_gate_contracts_checked} issue_comment_triggers=#{issue_comment_triggers_checked} pull_request_target_refs=#{pull_request_target_refs} source_run_bindings_checked=#{source_run_bindings_checked} source_artifact_bindings_checked=#{source_artifact_bindings_checked} privileged_source_event_guards_checked=#{privileged_source_event_guards_checked} mutation_source_guards_checked=#{mutation_source_guards_checked} automated_mutation_source_guards_checked=#{automated_mutation_source_guards_checked}"
          unless errors.empty?
            warn errors.join("\n")
            exit 1
          end
          RUBY

      - name: Publish policy verification result idempotently
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ job.status }}" == success ]]; then status=PASS; else status=FAIL; fi
          marker="OPS_WORKFLOW_POLICY_VERIFY head=$GITHUB_SHA "
          body="${marker}status=$status scope=all-retired-credential+ops+ga-policy retired_temp_admin_refs=0 owner_gate_contracts=3 final_review_publisher_contracts=1 promotion_pr_human_gate_contracts=2 promotion_merge_contracts=2 second_human_gate_contracts=2 issue_comment_gate_set=3 pull_request_target_refs=0 source_artifact_binding=enabled privileged_source_event_guard=enabled mutation_source_guard=enabled automated_mutation_source_guard=enabled human_gate_attempt_binding=enabled first_human_gate_runtime_provenance=enabled final_review_publisher_provenance=enabled reviewed_merge_promotion_provenance=enabled promotion_merge_exact_bytes=enabled promotion_orphan_parent_binding=enabled canonical_dispatch_dedupe=enabled same_repo_bot_promotion_pr=enabled second_human_gate_exact_head_review=enabled external22_prerequisite_provenance=enabled"
          comment_id=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$STATE_ISSUE/comments" \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id" \
            | tail -n 1)
          if [[ -n "$comment_id" ]]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$comment_id" -f body="$body" >/dev/null
            echo "workflow_policy_comment=updated head=$GITHUB_SHA comment_id=$comment_id"
          else
            gh issue comment "$STATE_ISSUE" --repo "$GITHUB_REPOSITORY" --body "$body"
            echo "workflow_policy_comment=created head=$GITHUB_SHA"
          fi
          echo "$body"
          [[ "$status" == PASS ]]
