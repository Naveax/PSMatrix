name: production-ga-final-production-readiness

on:
  workflow_dispatch:

concurrency:
  group: production-ga-final-production-readiness
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-signing:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production-ga-release-signing
    steps:
      - name: Emit release-signing receipt
        shell: bash
        env:
          CHECK_SECRET_1: ${{ secrets.PSMATRIX_RELEASE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/readiness"
          python - <<'PY'
          import json, os
          from datetime import UTC, datetime
          from pathlib import Path
          checks=[{"name":"PSMATRIX_RELEASE_PRIVATE_KEY","source":"secret","present":bool(os.environ.get("CHECK_SECRET_1"))}]
          status="PASS" if all(item["present"] for item in checks) else "FAIL"
          Path(os.environ["RUNNER_TEMP"],"readiness","production-ga-release-signing.json").write_text(json.dumps({"schema":1,"kind":"psmatrix.production-readiness-receipt","environment":"production-ga-release-signing","status":status,"checked_at":datetime.now(UTC).isoformat(),"checks":checks},sort_keys=True)+"\n",encoding="utf-8")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: psmatrix-readiness-release-signing
          path: ${{ runner.temp }}/readiness/production-ga-release-signing.json
          if-no-files-found: error
          retention-days: 7

  windows-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production-ga-windows-lab
    steps:
      - name: Emit Windows-lab receipt
        shell: bash
        env:
          CHECK_SECRET_1: ${{ secrets.PSMATRIX_WINDOWS_LAB_PRIVATE_KEY }}
          CHECK_SECRET_2: ${{ secrets.PSMATRIX_WINDOWS_LAB_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/readiness"
          python - <<'PY'
          import json, os
          from datetime import UTC, datetime
          from pathlib import Path
          checks=[{"name":"PSMATRIX_WINDOWS_LAB_PRIVATE_KEY","source":"secret","present":bool(os.environ.get("CHECK_SECRET_1"))},{"name":"PSMATRIX_WINDOWS_LAB_PUBLIC_KEY","source":"secret","present":bool(os.environ.get("CHECK_SECRET_2"))}]
          status="PASS" if all(item["present"] for item in checks) else "FAIL"
          Path(os.environ["RUNNER_TEMP"],"readiness","production-ga-windows-lab.json").write_text(json.dumps({"schema":1,"kind":"psmatrix.production-readiness-receipt","environment":"production-ga-windows-lab","status":status,"checked_at":datetime.now(UTC).isoformat(),"checks":checks},sort_keys=True)+"\n",encoding="utf-8")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: psmatrix-readiness-windows-lab
          path: ${{ runner.temp }}/readiness/production-ga-windows-lab.json
          if-no-files-found: error
          retention-days: 7

