name: production-ga-final-production-readiness

on:
  workflow_dispatch:

concurrency:
  group: production-ga-final-production-readiness
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-signing:
    name: Check release-signing environment readiness
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production-ga-release-signing
    steps:
      - name: Emit release-signing boolean receipt
        shell: bash
        env:
          CHECK_SECRET_1: ${{ secrets.PSMATRIX_RELEASE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/readiness"
          python - <<'PY'
          import json, os
          from datetime import UTC, datetime
          from pathlib import Path
          checks=[{"name":"PSMATRIX_RELEASE_PRIVATE_KEY","source":"secret","present":bool(os.environ.get("CHECK_SECRET_1"))}]
          status="PASS" if all(item["present"] for item in checks) else "FAIL"
          value={"schema":1,"kind":"psmatrix.production-readiness-receipt","environment":"production-ga-release-signing","status":status,"checked_at":datetime.now(UTC).isoformat(),"checks":checks}
          Path(os.environ["RUNNER_TEMP"],"readiness","production-ga-release-signing.json").write_text(json.dumps(value,sort_keys=True)+"\n",encoding="utf-8")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: psmatrix-readiness-release-signing
          path: ${{ runner.temp }}/readiness/production-ga-release-signing.json
          if-no-files-found: error
          retention-days: 7

  windows-lab:
    name: Check Windows-lab environment readiness
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production-ga-windows-lab
    steps:
      - name: Emit Windows-lab boolean receipt
        shell: bash
        env:
          CHECK_SECRET_1: ${{ secrets.PSMATRIX_WINDOWS_LAB_PRIVATE_KEY }}
          CHECK_SECRET_2: ${{ secrets.PSMATRIX_WINDOWS_LAB_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/readiness"
          python - <<'PY'
          import json, os
          from datetime import UTC, datetime
          from pathlib import Path
          checks=[
            {"name":"PSMATRIX_WINDOWS_LAB_PRIVATE_KEY","source":"secret","present":bool(os.environ.get("CHECK_SECRET_1"))},
            {"name":"PSMATRIX_WINDOWS_LAB_PUBLIC_KEY","source":"secret","present":bool(os.environ.get("CHECK_SECRET_2"))},
          ]
          status="PASS" if all(item["present"] for item in checks) else "FAIL"
          value={"schema":1,"kind":"psmatrix.production-readiness-receipt","environment":"production-ga-windows-lab","status":status,"checked_at":datetime.now(UTC).isoformat(),"checks":checks}
          Path(os.environ["RUNNER_TEMP"],"readiness","production-ga-windows-lab.json").write_text(json.dumps(value,sort_keys=True)+"\n",encoding="utf-8")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: psmatrix-readiness-windows-lab
          path: ${{ runner.temp }}/readiness/production-ga-windows-lab.json
          if-no-files-found: error
          retention-days: 7

  ci-signing:
    name: Check CI-signing environment readiness
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production-ga-ci-signing
    steps:
      - name: Emit CI-signing boolean receipt
        shell: bash
        env:
          CHECK_SECRET_1: ${{ secrets.PSMATRIX_GA_CI_PRIVATE_KEY }}
          CHECK_SECRET_2: ${{ secrets.PSMATRIX_GA_CI_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/readiness"
          python - <<'PY'
          import json, os
          from datetime import UTC, datetime
          from pathlib import Path
          checks=[
            {"name":"PSMATRIX_GA_CI_PRIVATE_KEY","source":"secret","present":bool(os.environ.get("CHECK_SECRET_1"))},
            {"name":"PSMATRIX_GA_CI_PUBLIC_KEY","source":"secret","present":bool(os.environ.get("CHECK_SECRET_2"))},
          ]
          status="PASS" if all(item["present"] for item in checks) else "FAIL"
          value={"schema":1,"kind":"psmatrix.production-readiness-receipt","environment":"production-ga-ci-signing","status":status,"checked_at":datetime.now(UTC).isoformat(),"checks":checks}
          Path(os.environ["RUNNER_TEMP"],"readiness","production-ga-ci-signing.json").write_text(json.dumps(value,sort_keys=True)+"\n",encoding="utf-8")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: psmatrix-readiness-ci-signing
          path: ${{ runner.temp }}/readiness/production-ga-ci-signing.json
          if-no-files-found: error
          retention-days: 7

  full-matrix:
    name: Check full-matrix environment readiness on NAVEAX
    runs-on: [self-hosted, Windows, X64, psmatrix-hyperv]
    timeout-minutes: 5
    environment: production-ga-full-matrix
    env:
      CHECK_VAR_1: ${{ vars.PSMATRIX_FULL_MATRIX_ENDPOINT_ROOT }}
      CHECK_VAR_2: ${{ vars.PSMATRIX_FULL_MATRIX_HOME }}
    steps:
      - name: Emit full-matrix boolean/path receipt
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_OS -ne 'Windows' -or $env:RUNNER_NAME -ne 'NAVEAX') { throw "Expected NAVEAX Windows runner; got $env:RUNNER_NAME / $env:RUNNER_OS" }
          $root = Join-Path $env:RUNNER_TEMP 'readiness'
          New-Item -ItemType Directory -Path $root -Force | Out-Null
          @'
          import json, os
          from datetime import UTC, datetime
          from pathlib import Path
          rows=[]
          for name, env_name in (("PSMATRIX_FULL_MATRIX_ENDPOINT_ROOT","CHECK_VAR_1"),("PSMATRIX_FULL_MATRIX_HOME","CHECK_VAR_2")):
              raw=os.environ.get(env_name,"")
              rows.append({"name":name,"source":"var","present":bool(raw),"path_exists":bool(raw) and Path(raw).is_dir()})
          status="PASS" if all(item["present"] and item["path_exists"] for item in rows) else "FAIL"
          value={"schema":1,"kind":"psmatrix.production-readiness-receipt","environment":"production-ga-full-matrix","status":status,"checked_at":datetime.now(UTC).isoformat(),"checks":rows}
          Path(os.environ["RUNNER_TEMP"],"readiness","production-ga-full-matrix.json").write_text(json.dumps(value,sort_keys=True)+"\n",encoding="utf-8")
          '@ | python -
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: psmatrix-readiness-full-matrix
          path: ${{ runner.temp }}\readiness\production-ga-full-matrix.json
          if-no-files-found: error
          retention-days: 7

  public-auth-probe:
    name: Check public-auth probe environment readiness
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production-ga-public-auth-probe
    env:
      CHECK_SECRET_1: ${{ secrets.PSMATRIX_OAUTH_VALID_TOKEN }}
      CHECK_SECRET_2: ${{ secrets.PSMATRIX_OAUTH_EXPIRED_TOKEN }}
      CHECK_SECRET_3: ${{ secrets.PSMATRIX_OAUTH_WRONG_AUDIENCE_TOKEN }}
      CHECK_SECRET_4: ${{ secrets.PSMATRIX_OAUTH_MISSING_SCOPE_TOKEN }}
      CHECK_SECRET_5: ${{ secrets.PSMATRIX_OAUTH_REPLAY_TOKEN }}
      CHECK_SECRET_6: ${{ secrets.PSMATRIX_OAUTH_RATE_LIMIT_TOKEN }}
      CHECK_SECRET_7: ${{ secrets.PSMATRIX_MTLS_CURRENT_CERT }}
      CHECK_SECRET_8: ${{ secrets.PSMATRIX_MTLS_CURRENT_KEY }}
      CHECK_SECRET_9: ${{ secrets.PSMATRIX_MTLS_ROTATION_CERT }}
      CHECK_SECRET_10: ${{ secrets.PSMATRIX_MTLS_ROTATION_KEY }}
      CHECK_SECRET_11: ${{ secrets.PSMATRIX_MTLS_UNTRUSTED_CERT }}
      CHECK_SECRET_12: ${{ secrets.PSMATRIX_MTLS_UNTRUSTED_KEY }}
      CHECK_SECRET_13: ${{ secrets.PSMATRIX_MTLS_REVOKED_CERT }}
      CHECK_SECRET_14: ${{ secrets.PSMATRIX_MTLS_REVOKED_KEY }}
      CHECK_VAR_1: ${{ vars.PSMATRIX_OAUTH_PUBLIC_ENDPOINT }}
      CHECK_VAR_2: ${{ vars.PSMATRIX_OAUTH_DISCOVERY_URL }}
      CHECK_VAR_3: ${{ vars.PSMATRIX_OAUTH_EXPECTED_ISSUER }}
      CHECK_VAR_4: ${{ vars.PSMATRIX_OAUTH_EXPECTED_AUDIENCE }}
      CHECK_VAR_5: ${{ vars.PSMATRIX_OAUTH_REQUIRED_SCOPE }}
      CHECK_VAR_6: ${{ vars.PSMATRIX_OAUTH_RATE_LIMIT_ATTEMPTS }}
      CHECK_VAR_7: ${{ vars.PSMATRIX_MTLS_PUBLIC_ENDPOINT }}
      CHECK_VAR_8: ${{ vars.PSMATRIX_MTLS_CERT_FINGERPRINT_HEADER }}
    steps:
      - name: Emit public-auth boolean receipt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/readiness"
          python - <<'PY'
          import json, os
          from datetime import UTC, datetime
          from pathlib import Path
          secret_names=["PSMATRIX_OAUTH_VALID_TOKEN","PSMATRIX_OAUTH_EXPIRED_TOKEN","PSMATRIX_OAUTH_WRONG_AUDIENCE_TOKEN","PSMATRIX_OAUTH_MISSING_SCOPE_TOKEN","PSMATRIX_OAUTH_REPLAY_TOKEN","PSMATRIX_OAUTH_RATE_LIMIT_TOKEN","PSMATRIX_MTLS_CURRENT_CERT","PSMATRIX_MTLS_CURRENT_KEY","PSMATRIX_MTLS_ROTATION_CERT","PSMATRIX_MTLS_ROTATION_KEY","PSMATRIX_MTLS_UNTRUSTED_CERT","PSMATRIX_MTLS_UNTRUSTED_KEY","PSMATRIX_MTLS_REVOKED_CERT","PSMATRIX_MTLS_REVOKED_KEY"]
          var_names=["PSMATRIX_OAUTH_PUBLIC_ENDPOINT","PSMATRIX_OAUTH_DISCOVERY_URL","PSMATRIX_OAUTH_EXPECTED_ISSUER","PSMATRIX_OAUTH_EXPECTED_AUDIENCE","PSMATRIX_OAUTH_REQUIRED_SCOPE","PSMATRIX_OAUTH_RATE_LIMIT_ATTEMPTS","PSMATRIX_MTLS_PUBLIC_ENDPOINT","PSMATRIX_MTLS_CERT_FINGERPRINT_HEADER"]
          rows=[]
          for index,name in enumerate(secret_names,1): rows.append({"name":name,"source":"secret","present":bool(os.environ.get(f"CHECK_SECRET_{index}"))})
          for index,name in enumerate(var_names,1): rows.append({"name":name,"source":"var","present":bool(os.environ.get(f"CHECK_VAR_{index}"))})
          status="PASS" if all(item["present"] for item in rows) else "FAIL"
          value={"schema":1,"kind":"psmatrix.production-readiness-receipt","environment":"production-ga-public-auth-probe","status":status,"checked_at":datetime.now(UTC).isoformat(),"checks":rows}
          Path(os.environ["RUNNER_TEMP"],"readiness","production-ga-public-auth-probe.json").write_text(json.dumps(value,sort_keys=True)+"\n",encoding="utf-8")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: psmatrix-readiness-public-auth-probe
          path: ${{ runner.temp }}/readiness/production-ga-public-auth-probe.json
          if-no-files-found: error
          retention-days: 7

