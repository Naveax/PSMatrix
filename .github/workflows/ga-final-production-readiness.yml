  summarize-readiness:
    name: Assemble all twelve production environment readiness receipts
    needs:
      - release-signing
      - windows-lab
      - ci-signing
      - full-matrix
      - public-auth-probe
      - deployment-signing
      - external-otlp-probe
      - operations-signing
      - recovery-signing
      - security-review-signing
      - vulnerability-scanner-signing
      - root-signing
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out exact readiness controls
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          path: control
          fetch-depth: 1
          persist-credentials: false

      - name: Download all boolean readiness receipts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: psmatrix-readiness-*
          path: receipts
          merge-multiple: true

      - name: Assemble fail-closed production environment readiness summary
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/psmatrix-2.0.0-production-readiness"
          rm -rf "$output"
          mkdir -p "$output"
          set +e
          PYTHONPATH=control/src python control/scripts/ga/assemble_final_production_readiness.py \
            --contract control/ga-packs/03-authoritative-windows/final-production-readiness-contract.json \
            --receipts-dir receipts \
            --output "$output/production-readiness-summary.json" \
            --require-pass
          rc=$?
          set -e
          [[ -f "$output/production-readiness-summary.json" ]] || { echo 'production readiness summary was not written.' >&2; exit 1; }
          PSMATRIX_READINESS_OUTPUT="$output" PYTHONPATH=control/src python - <<'PY'
          import json, os
          from pathlib import Path
          root=Path(os.environ['PSMATRIX_READINESS_OUTPUT'])
          value=json.loads((root/'production-readiness-summary.json').read_text(encoding='utf-8'))
          if value.get('producer_source_coverage')!=11 or value.get('environment_count')!=12:
              raise SystemExit('production readiness summary cardinality mismatch')
          if any(value.get(name) is not False for name in ('secret_values_observed','secret_hashes_observed','secret_lengths_observed','production_evidence_runs_complete','production_evaluator_ready','final_ga_evaluator_invoked','ga_eligible')):
              raise SystemExit('production readiness summary crossed a forbidden GA/evidence boundary')
          print(f'production_environment_readiness={value.get("status")} passed={value.get("environment_passed")}/12')
          print('production_evidence_runs_complete=false')
          print('production_evaluator_ready=false')
          print('ga_eligible=false')
          PY
          echo "PSMATRIX_READINESS_OUTPUT=$output" >> "$GITHUB_ENV"
          echo "PSMATRIX_READINESS_RC=$rc" >> "$GITHUB_ENV"

      - name: Upload production environment readiness summary
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: psmatrix-2.0.0-production-readiness
          path: ${{ env.PSMATRIX_READINESS_OUTPUT }}
          if-no-files-found: error
          retention-days: 30

      - name: Fail workflow if any required environment configuration is absent
        shell: bash
        run: |
          set -euo pipefail
          [[ "$PSMATRIX_READINESS_RC" == "0" ]] || { echo 'One or more Production GA environment prerequisites are not ready. See production-readiness-summary.json.' >&2; exit 1; }
          echo 'production_environment_readiness=PASS'
