name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  source-and-core:
    name: Trusted self-hosted source and core gate
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository && github.actor == 'Naveax')
    runs-on: [self-hosted, Windows, X64, psmatrix-hyperv]
    timeout-minutes: 45
    env:
      PYTHONPATH: ${{ github.workspace }}\src

    steps:
      - name: Verify trusted runner assignment
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_OS -ne 'Windows') {
              throw "Expected Windows self-hosted runner; got $env:RUNNER_OS"
          }
          if ($env:RUNNER_NAME -ne 'NAVEAX') {
              throw "Expected NAVEAX runner; got $env:RUNNER_NAME"
          }
          Write-Host 'runner_assignment=PASS'
          Write-Host "runner_name=$env:RUNNER_NAME"

      - name: Check out exact revision
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact clean checkout and Python runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $head = (git rev-parse HEAD).Trim().ToLowerInvariant()
          if ($LASTEXITCODE -ne 0 -or $head -cnotmatch '^[0-9a-f]{40}$') {
              throw 'Unable to resolve exact checkout head.'
          }
          if ($head -ne $env:GITHUB_SHA.ToLowerInvariant()) {
              throw "Checkout head $head does not match GITHUB_SHA $env:GITHUB_SHA."
          }
          if (-not [string]::IsNullOrWhiteSpace((git status --porcelain))) {
              throw 'CI checkout is not clean.'
          }
          $python = (python -c "import platform; print(platform.python_version())").Trim()
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($python)) {
              throw 'Python is unavailable on the trusted self-hosted runner.'
          }
          Write-Host "control_head=$head"
          Write-Host "python_version=$python"

      - name: Compile Python source and tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & python -m compileall -q src tests
          if ($LASTEXITCODE -ne 0) {
              throw "compileall failed: $LASTEXITCODE"
          }
          Write-Host 'python_compile=PASS'

      - name: Parse repository PowerShell source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $parseFailures = @()
          $files = @(
              Get-ChildItem -LiteralPath $env:GITHUB_WORKSPACE -Recurse -File -Filter '*.ps1' |
                  Where-Object {
                      $_.FullName -notmatch '[\\/]\.git[\\/]' -and
                      $_.FullName -notmatch '[\\/]\.venv[\\/]'
                  }
          )
          foreach ($file in $files) {
              $tokens = $null
              $errors = $null
              [void][System.Management.Automation.Language.Parser]::ParseFile(
                  $file.FullName,
                  [ref]$tokens,
                  [ref]$errors
              )
              if ($errors.Count -ne 0) {
                  foreach ($error in $errors) {
                      $parseFailures += "${($file.FullName)}: $($error.Message)"
                  }
              }
          }
          if ($parseFailures.Count -ne 0) {
              throw ($parseFailures -join [Environment]::NewLine)
          }
          Write-Host "powershell_parse=PASS files=$($files.Count)"

      - name: Run core test modules in isolated processes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(Get-ChildItem -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'tests') -File -Filter 'test_*.py' | Sort-Object Name)
          foreach ($file in $files) {
              $module = 'tests.' + [System.IO.Path]::GetFileNameWithoutExtension($file.Name)
              Write-Host "::group::$module"
              if ($file.Name -eq 'test_oci.py') {
                  foreach ($testName in @(
                      'test_image_reference_validation',
                      'test_install_pins_digest_and_probes_exact_version',
                      'test_mutable_local_tag_requires_explicit_trust',
                      'test_version_mismatch_is_rejected',
                      'test_cli_executes_registered_oci_runtime'
                  )) {
                      & python -m unittest "tests.test_oci.OciRuntimeTests.$testName" -v
                      if ($LASTEXITCODE -ne 0) {
                          throw "Core OCI unit test failed: $testName"
                      }
                  }
              }
              else {
                  & python -m unittest $module -v
                  if ($LASTEXITCODE -ne 0) {
                      throw "Core test module failed: $module"
                  }
              }
              Write-Host '::endgroup::'
          }
          Write-Host "core_tests=PASS modules=$($files.Count)"

      - name: Run product doctor
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & python -m psmatrix.cli doctor
          if ($LASTEXITCODE -ne 0) {
              throw "psmatrix doctor failed: $LASTEXITCODE"
          }
          Write-Host 'doctor=PASS'

      - name: Require canonical complete-matrix contract
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP "psmatrix-ci-full-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          if (Test-Path -LiteralPath $root) {
              Remove-Item -LiteralPath $root -Recurse -Force
          }
          New-Item -ItemType Directory -Path $root -Force | Out-Null
          $spec = Join-Path $root 'psmatrix.full.json'
          $plan = Join-Path $root 'plan.json'
          $home = Join-Path $root 'home'

          & python -m psmatrix.cli full init --output $spec
          if ($LASTEXITCODE -ne 0) {
              throw "full init failed: $LASTEXITCODE"
          }

          & python -m psmatrix.cli --home $home full plan --spec $spec --output $plan
          $planExit = $LASTEXITCODE
          if ($planExit -ne 1) {
              throw "Expected incomplete full-plan exit code 1; got $planExit"
          }

          $env:PSMATRIX_CI_SPEC = $spec
          $env:PSMATRIX_CI_PLAN = $plan
          @'
          import json
          import os
          from pathlib import Path
          spec = json.loads(Path(os.environ['PSMATRIX_CI_SPEC']).read_text(encoding='utf-8'))
          plan = json.loads(Path(os.environ['PSMATRIX_CI_PLAN']).read_text(encoding='utf-8'))
          assert len(spec['targets']) == 25
          assert sum(item['kind'] == 'remote' for item in spec['targets']) == 13
          assert plan['status'] == 'INCOMPLETE'
          assert plan['coverage']['required'] == 23
          assert plan['coverage']['missing_required']
          print('complete_matrix_contract=PASS')
          '@ | python -
          if ($LASTEXITCODE -ne 0) {
              throw 'Canonical complete-matrix contract validation failed.'
          }

      - name: Emit gate summary
        if: always()
        shell: pwsh
        run: |
          Write-Host 'ci_policy=trusted-self-hosted-pr-and-main-source-gate'
          Write-Host 'heavy_integration_policy=manual-full-workflow'
          Write-Host "run_id=$env:GITHUB_RUN_ID"
          Write-Host "run_attempt=$env:GITHUB_RUN_ATTEMPT"
