name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  source-and-core:
    name: Trusted self-hosted source and core gate
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository && github.actor == 'Naveax')
    runs-on: [self-hosted, Windows, X64, psmatrix-hyperv]
    timeout-minutes: 45
    env:
      PYTHONPATH: ${{ github.workspace }}\src

    steps:
      - name: Verify trusted runner assignment
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_OS -ne 'Windows') {
              throw "Expected Windows self-hosted runner; got $env:RUNNER_OS"
          }
          if ($env:RUNNER_NAME -ne 'NAVEAX') {
              throw "Expected NAVEAX runner; got $env:RUNNER_NAME"
          }
          Write-Host 'runner_assignment=PASS'
          Write-Host "runner_name=$env:RUNNER_NAME"

      - name: Check out exact revision
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact clean checkout and Python runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $head = (git rev-parse HEAD).Trim().ToLowerInvariant()
          if ($LASTEXITCODE -ne 0 -or $head -cnotmatch '^[0-9a-f]{40}$') {
              throw 'Unable to resolve exact checkout head.'
          }
          if ($head -ne $env:GITHUB_SHA.ToLowerInvariant()) {
              throw "Checkout head $head does not match GITHUB_SHA $env:GITHUB_SHA."
          }
          if (-not [string]::IsNullOrWhiteSpace((git status --porcelain))) {
              throw 'CI checkout is not clean.'
          }
          $python = (python -c "import platform; print(platform.python_version())").Trim()
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($python)) {
              throw 'Python is unavailable on the trusted self-hosted runner.'
          }
          Write-Host "control_head=$head"
          Write-Host "python_version=$python"

      - name: Compile Python source and tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & python -m compileall -q src tests
          if ($LASTEXITCODE -ne 0) {
              throw "compileall failed: $LASTEXITCODE"
          }
          Write-Host 'python_compile=PASS'

      - name: Parse repository PowerShell source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $parseFailures = @()
          $files = @(
              Get-ChildItem -LiteralPath $env:GITHUB_WORKSPACE -Recurse -File -Filter '*.ps1' |
                  Where-Object {
                      $_.FullName -notmatch '[\\/]\.git[\\/]' -and
                      $_.FullName -notmatch '[\\/]\.venv[\\/]'
                  }
          )
          foreach ($file in $files) {
              $tokens = $null
              $errors = $null
              [void][System.Management.Automation.Language.Parser]::ParseFile(
                  $file.FullName,
                  [ref]$tokens,
                  [ref]$errors
              )
              if ($errors.Count -ne 0) {
                  foreach ($error in $errors) {
                      $parseFailures += "${($file.FullName)}: $($error.Message)"
                  }
              }
          }
          if ($parseFailures.Count -ne 0) {
              throw ($parseFailures -join [Environment]::NewLine)
          }
          Write-Host "powershell_parse=PASS files=$($files.Count)"

      - name: Run platform-neutral core test modules in isolated processes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(Get-ChildItem -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'tests') -File -Filter 'test_*.py' | Sort-Object Name)
          $linuxNativeModules = @(
              'test_integration.py'
          )
          $executedModules = 0
          $deferredModules = @()
          foreach ($file in $files) {
              if ($linuxNativeModules -contains $file.Name) {
                  $deferredModules += $file.Name
                  Write-Host "deferred_to_manual_linux_integration=$($file.Name)"
                  continue
              }
              $module = 'tests.' + [System.IO.Path]::GetFileNameWithoutExtension($file.Name)
              Write-Host "::group::$module"
              if ($file.Name -eq 'test_oci.py') {
                  & python -m unittest "tests.test_oci.OciRuntimeTests.test_image_reference_validation" -v
                  if ($LASTEXITCODE -ne 0) {
                      throw 'Platform-neutral OCI reference validation failed.'
                  }
                  Write-Host 'deferred_to_manual_linux_integration=test_oci.py::fake-engine-install-probe-execution'
              }
              else {
                  & python -m unittest $module -v
                  if ($LASTEXITCODE -ne 0) {
                      throw "Core test module failed: $module"
                  }
              }
              $executedModules += 1
              Write-Host '::endgroup::'
          }
          if ($deferredModules -notcontains 'test_integration.py') {
              throw 'Linux-native integration fixture was not explicitly deferred.'
          }
          Write-Host "core_tests=PASS modules=$executedModules"
          Write-Host "manual_linux_modules=$($deferredModules -join ','),test_oci.py::integration-cases"

      - name: Run product doctor
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & python -m psmatrix.cli doctor
          if ($LASTEXITCODE -ne 0) {
              throw "psmatrix doctor failed: $LASTEXITCODE"
          }
          Write-Host 'doctor=PASS'

      - name: Emit source/core gate summary
        if: always()
        shell: pwsh
        run: |
          Write-Host 'ci_policy=trusted-self-hosted-pr-and-main-platform-neutral-core-gate'
          Write-Host 'heavy_integration_policy=manual-full-workflow'
          Write-Host 'linux_native_fixture_policy=manual-linux-integration'
          Write-Host "run_id=$env:GITHUB_RUN_ID"
          Write-Host "run_attempt=$env:GITHUB_RUN_ATTEMPT"

  canonical-matrix:
    name: Canonical 25-target matrix contract
    needs: source-and-core
    if: needs.source-and-core.result == 'success'
    runs-on: [self-hosted, Windows, X64, psmatrix-hyperv]
    timeout-minutes: 10
    env:
      PYTHONPATH: ${{ github.workspace }}\src

    steps:
      - name: Verify trusted runner assignment
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_OS -ne 'Windows' -or $env:RUNNER_NAME -ne 'NAVEAX') {
              throw "Expected NAVEAX Windows runner; got $env:RUNNER_NAME / $env:RUNNER_OS"
          }
          Write-Host 'matrix_runner_assignment=PASS'

      - name: Check out exact revision
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Materialize and diagnose canonical matrix contract
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP "psmatrix-ci-matrix-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          if (Test-Path -LiteralPath $root) {
              Remove-Item -LiteralPath $root -Recurse -Force
          }
          New-Item -ItemType Directory -Path $root -Force | Out-Null
          $spec = Join-Path $root 'psmatrix.full.json'
          $plan = Join-Path $root 'plan.json'
          $psmatrixHome = Join-Path $root 'home'

          & python -m psmatrix.cli full init --output $spec
          if ($LASTEXITCODE -ne 0) {
              throw "full init failed: $LASTEXITCODE"
          }

          & python -m psmatrix.cli --home $psmatrixHome full plan --spec $spec --output $plan
          $planExit = $LASTEXITCODE
          if (-not (Test-Path -LiteralPath $plan -PathType Leaf)) {
              throw 'full plan did not materialize plan.json'
          }

          $specValue = Get-Content -LiteralPath $spec -Raw | ConvertFrom-Json
          $planValue = Get-Content -LiteralPath $plan -Raw | ConvertFrom-Json
          $targetCount = @($specValue.targets).Count
          $remoteCount = @($specValue.targets | Where-Object { [string]$_.kind -eq 'remote' }).Count
          $required = [int]$planValue.coverage.required
          $missingRequired = @($planValue.coverage.missing_required).Count

          Write-Host "canonical_matrix_exit=$planExit"
          Write-Host "canonical_matrix_spec_targets=$targetCount"
          Write-Host "canonical_matrix_remote_targets=$remoteCount"
          Write-Host "canonical_matrix_status=$($planValue.status)"
          Write-Host "canonical_matrix_required=$required"
          Write-Host "canonical_matrix_missing_required=$missingRequired"

          if ($planExit -ne 1) {
              throw "Expected incomplete full-plan exit code 1; got $planExit"
          }
          if ($targetCount -ne 25) {
              throw "Expected exactly 25 canonical targets; got $targetCount"
          }
          if ($remoteCount -ne 13) {
              throw "Expected exactly 13 remote canonical targets; got $remoteCount"
          }
          if ([string]$planValue.status -ne 'INCOMPLETE') {
              throw "Expected canonical plan INCOMPLETE; got $($planValue.status)"
          }
          if ($required -ne 23) {
              throw "Expected canonical required coverage 23; got $required"
          }
          if ($missingRequired -lt 1) {
              throw 'Expected at least one missing required canonical target before worker provisioning.'
          }
          Write-Host 'complete_matrix_contract=PASS'
