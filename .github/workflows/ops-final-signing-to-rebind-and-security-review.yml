name: ops-final-signing-to-rebind-and-security-review

on:
  workflow_run:
    workflows: [production-ga-windows-authority-final-release-sign-from-lock]
    types: [completed]

concurrency:
  group: ops-final-signing-to-rebind-and-security-review
  cancel-in-progress: false

permissions:
  contents: read
  actions: write
  issues: write

jobs:
  dispatch-downstream:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'workflow_dispatch' &&
      github.event.workflow_run.head_branch == 'release/2.0.0-final-active-lock'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      FINAL_SIGNING_RUN_ID: ${{ github.event.workflow_run.id }}
      FINAL_SIGNING_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
      FINAL_CONTROL_HEAD: ${{ github.event.workflow_run.head_sha }}
      FINAL_ACTIVE_BRANCH: release/2.0.0-final-active-lock
      RC4_ACTIVE_BRANCH: release/2.0.0rc4-active-lock
      STATE_ISSUE: '262'
    steps:
      - name: Validate exact protected final release artifact
        shell: bash
        run: |
          set -euo pipefail
          [[ "$FINAL_SIGNING_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$FINAL_CONTROL_HEAD" =~ ^[0-9a-f]{40}$ ]]
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$FINAL_ACTIVE_BRANCH" --jq '.object.sha')
          [[ "$current" == "$FINAL_CONTROL_HEAD" ]] || { echo "Final active-lock branch moved: $current != $FINAL_CONTROL_HEAD" >&2; exit 1; }
          python - <<'PY'
          import json,os,urllib.request
          repo=os.environ['GITHUB_REPOSITORY']; run_id=os.environ['FINAL_SIGNING_RUN_ID']; head=os.environ['FINAL_CONTROL_HEAD']
          headers={'Accept':'application/vnd.github+json','Authorization':f"Bearer {os.environ['GH_TOKEN']}",'X-GitHub-Api-Version':'2022-11-28','User-Agent':'psmatrix-final-signing-downstream'}
          def fetch(path):
              req=urllib.request.Request(f'https://api.github.com/repos/{repo}/{path}',headers=headers)
              with urllib.request.urlopen(req,timeout=30) as r:return json.load(r)
          run=fetch(f'actions/runs/{run_id}')
          if run.get('name')!='production-ga-windows-authority-final-release-sign-from-lock' or run.get('event')!='workflow_dispatch' or run.get('status')!='completed' or run.get('conclusion')!='success':
              raise SystemExit('final signing run identity/status mismatch')
          if (run.get('head_sha') or '').lower()!=head: raise SystemExit('final signing control head mismatch')
          artifacts=fetch(f'actions/runs/{run_id}/artifacts?per_page=100').get('artifacts',[])
          matches=[a for a in artifacts if a.get('name')=='psmatrix-2.0.0-protected-release' and not a.get('expired')]
          if len(matches)!=1: raise SystemExit(f'expected exactly one live protected final release artifact; found {len(matches)}')
          print(f'protected_final_release=PASS artifact_id={matches[0].get("id")}')
          PY

      - name: Recover exact RC4 campaign and closure provenance
        id: rc4
        shell: bash
        run: |
          set -euo pipefail
          rc4_head=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$RC4_ACTIVE_BRANCH" --jq '.object.sha')
          [[ "$rc4_head" =~ ^[0-9a-f]{40}$ ]] || { echo 'RC4 active-lock head cannot be resolved.' >&2; exit 1; }
          gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$STATE_ISSUE/comments" --jq '.[] | select(.user.login == "github-actions[bot]") | .body' > "$RUNNER_TEMP/rc4-chain-state.txt"
          RC4_HEAD="$rc4_head" python - <<'PY'
          import os,re
          from pathlib import Path
          lines=Path(os.environ['RUNNER_TEMP'],'rc4-chain-state.txt').read_text(encoding='utf-8').splitlines()
          rc4_head=os.environ['RC4_HEAD']
          def latest(stage):
              pat=re.compile(rf'^RC4_CHAIN_STATE stage={re.escape(stage)} run_id=([1-9][0-9]*) attempt=([1-9][0-9]*) control_head=([0-9a-f]{{40}})$')
              rows=[]
              for line in lines:
                  m=pat.fullmatch(line.strip())
                  if m: rows.append(m.groups())
              if not rows: raise SystemExit(f'missing RC4 chain state: {stage}')
              return rows[-1]
          campaign=latest('campaign')
          closure=latest('closure')
          if campaign[2]!=rc4_head or closure[2]!=rc4_head:
              raise SystemExit('RC4 campaign/closure state is not bound to current active RC4 control head')
          if campaign[0]==closure[0]: raise SystemExit('RC4 campaign and closure run IDs must differ')
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as out:
              out.write(f'rc4_control_head={rc4_head}\n')
              out.write(f'campaign_run_id={campaign[0]}\n')
              out.write(f'closure_run_id={closure[0]}\n')
          print(f'rc4_final_rebind_provenance=PASS campaign={campaign[0]} closure={closure[0]} control={rc4_head}')
          PY

      - name: Record final signing and dispatch exact downstream work once
        env:
          RC4_CONTROL_HEAD: ${{ steps.rc4.outputs.rc4_control_head }}
          RC4_CAMPAIGN_RUN_ID: ${{ steps.rc4.outputs.campaign_run_id }}
          RC4_CLOSURE_RUN_ID: ${{ steps.rc4.outputs.closure_run_id }}
        shell: bash
        run: |
          set -euo pipefail

          marker="RC4_CHAIN_STATE stage=final_signing run_id=$FINAL_SIGNING_RUN_ID attempt=$FINAL_SIGNING_RUN_ATTEMPT control_head=$FINAL_CONTROL_HEAD"
          if ! gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$STATE_ISSUE/comments" --jq '.[] | select(.user.login == "github-actions[bot]") | .body' | grep -Fxq "$marker"; then
            gh issue comment "$STATE_ISSUE" --repo "$GITHUB_REPOSITORY" --body "$marker"
          fi

          existing_count() {
            local workflow="$1"
            gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs?branch=$FINAL_ACTIVE_BRANCH&event=workflow_dispatch&per_page=100" \
              --jq ".workflow_runs | map(select(.head_sha == \"$FINAL_CONTROL_HEAD\")) | length"
          }

          assert_final_head() {
            local current
            current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$FINAL_ACTIVE_BRANCH" --jq '.object.sha')
            [[ "$current" == "$FINAL_CONTROL_HEAD" ]] || { echo "Final active control moved before downstream dispatch: $current != $FINAL_CONTROL_HEAD" >&2; return 1; }
          }

          assert_rc4_head() {
            local current
            current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$RC4_ACTIVE_BRANCH" --jq '.object.sha')
            [[ "$current" == "$RC4_CONTROL_HEAD" ]] || { echo "RC4 active control moved before final Windows rebind dispatch: $current != $RC4_CONTROL_HEAD" >&2; return 1; }
          }

          dispatched=0
          suppressed=0

          if [[ "$(existing_count ga-windows-authority-final-windows-evidence-rebind.yml)" -eq 0 ]]; then
            assert_final_head
            assert_rc4_head
            gh workflow run ga-windows-authority-final-windows-evidence-rebind.yml \
              --repo "$GITHUB_REPOSITORY" --ref "$FINAL_ACTIVE_BRANCH" \
              -f rc4_control_head="$RC4_CONTROL_HEAD" \
              -f rc4_closure_run_id="$RC4_CLOSURE_RUN_ID" \
              -f rc4_campaign_run_id="$RC4_CAMPAIGN_RUN_ID" \
              -f final_signing_run_id="$FINAL_SIGNING_RUN_ID"
            dispatched=$((dispatched+1))
            echo 'final_windows_evidence_rebind_dispatched=true'
          else
            suppressed=$((suppressed+1))
            echo 'final_windows_evidence_rebind_duplicate_suppressed=true'
          fi

          if [[ "$(existing_count ga-final-security-review-packet.yml)" -eq 0 ]]; then
            assert_final_head
            gh workflow run ga-final-security-review-packet.yml \
              --repo "$GITHUB_REPOSITORY" --ref "$FINAL_ACTIVE_BRANCH" \
              -f release_signing_run_id="$FINAL_SIGNING_RUN_ID"
            dispatched=$((dispatched+1))
            echo 'final_security_review_packet_dispatched=true'
          else
            suppressed=$((suppressed+1))
            echo 'final_security_review_packet_duplicate_suppressed=true'
          fi

          echo "final_signing_downstream_dispatch=PASS dispatched=$dispatched suppressed=$suppressed"
          echo 'independent_review_completed=false'
          echo 'ga_eligible=false'
