name: production-ga-pack04-source-preflight

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ga-pack04-source-preflight.yml"
      - ".github/workflows/ga-public-auth-deployment-preflight.yml"
      - ".github/workflows/ga-public-auth-external.yml"
      - "ga-packs/04-public-auth/**"
      - "scripts/ga/bind_public_auth_release.py"
      - "scripts/ga/enforce_public_auth_report.py"
      - "scripts/ga/probe_public_auth.py"
      - "scripts/ga/public_auth_deployment_kit.py"
      - "src/psmatrix/ga.py"
      - "tests/test_ga.py"
      - "tests/test_public_auth_ga_contract.py"
      - "tests/test_public_auth_deployment_kit.py"

concurrency:
  group: production-ga-pack04-source-preflight-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  source-preflight:
    name: Pack 04 source, deployment and GA evaluator
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.2.0
        with:
          python-version: "3.13"

      - name: Initialize fail-closed evidence directory
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/psmatrix-pack04-source-preflight"
          rm -rf "$evidence"
          install -d -m 0700 "$evidence"
          {
            echo "PYTHONPATH=$GITHUB_WORKSPACE/src"
            echo "PSMATRIX_PACK04_EVIDENCE=$evidence"
          } >> "$GITHUB_ENV"
          {
            echo "workflow=production-ga-pack04-source-preflight"
            echo "runner_environment=${RUNNER_ENVIRONMENT:-unknown}"
            echo "python=$(python --version 2>&1)"
          } > "$evidence/controller-context.txt"

      - name: Verify source controller
        shell: bash
        run: |
          set -euo pipefail
          {
            head="$(git rev-parse HEAD | tr '[:upper:]' '[:lower:]')"
            [[ "$head" =~ ^[0-9a-f]{40}$ ]] || { echo 'checked-out head is invalid' >&2; exit 1; }
            [[ -z "$(git status --porcelain)" ]] || { echo 'source checkout is not clean' >&2; exit 1; }
            echo "release_commit=$head"
            echo "python=$(python --version 2>&1)"
          } 2>&1 | tee "$PSMATRIX_PACK04_EVIDENCE/source-controller.log"

      - name: Verify exact source package metadata
        shell: bash
        run: |
          set -uo pipefail
          log="$PSMATRIX_PACK04_EVIDENCE/source-package.log"
          set +e
          python - "$GITHUB_WORKSPACE" >"$log" 2>&1 <<'PY'
          import json
          import sys
          import tomllib
          from pathlib import Path

          root = Path(sys.argv[1]).resolve()
          expected_root = (root / "src" / "psmatrix").resolve()
          with (root / "pyproject.toml").open("rb") as handle:
              project = tomllib.load(handle)["project"]

          import psmatrix

          source_file = Path(psmatrix.__file__).resolve()
          try:
              source_file.relative_to(expected_root)
          except ValueError as exc:
              raise SystemExit(f"psmatrix imported outside exact source tree: {source_file}") from exc

          expected_version = str(project["version"])
          actual_version = str(psmatrix.__version__)
          if actual_version != expected_version:
              raise SystemExit(
                  f"source version mismatch: {actual_version} != {expected_version}"
              )

          result = {
              "schema": 1,
              "kind": "psmatrix.pack04-source-package-verification",
              "status": "PASS",
              "version": actual_version,
              "source": source_file.relative_to(root).as_posix(),
              "backend_install_required": False,
          }
          print(json.dumps(result, indent=2, sort_keys=True))
          PY
          status=$?
          set -e
          cat "$log"
          exit "$status"

      - name: Compile Pack 04 Python sources
        shell: bash
        run: |
          set -euo pipefail
          {
            python -m py_compile \
              scripts/ga/probe_public_auth.py \
              scripts/ga/bind_public_auth_release.py \
              scripts/ga/enforce_public_auth_report.py \
              scripts/ga/public_auth_deployment_kit.py \
              src/psmatrix/ga.py \
              tests/test_ga.py \
              tests/test_public_auth_ga_contract.py \
              tests/test_public_auth_deployment_kit.py
            echo "py_compile=PASS"
          } 2>&1 | tee "$PSMATRIX_PACK04_EVIDENCE/py-compile.log"

      - name: Run final GA evaluator tests
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest -v tests.test_ga \
            2>&1 | tee "$PSMATRIX_PACK04_EVIDENCE/test-ga.log"

      - name: Run Pack 04 authority contract tests
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest -v tests.test_public_auth_ga_contract \
            2>&1 | tee "$PSMATRIX_PACK04_EVIDENCE/test-public-auth-ga-contract.log"

      - name: Run deployment kit functional tests
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest -v tests.test_public_auth_deployment_kit \
            2>&1 | tee "$PSMATRIX_PACK04_EVIDENCE/test-public-auth-deployment-kit.log"

      - name: Enforce Pack 04 source preflight result
        shell: bash
        run: |
          set -euo pipefail
          python - "$PSMATRIX_PACK04_EVIDENCE" "$(git rev-parse HEAD | tr '[:upper:]' '[:lower:]')" <<'PY'
          import hashlib
          import json
          import sys
          from pathlib import Path

          root = Path(sys.argv[1]).resolve()
          commit = sys.argv[2]
          required = (
              "controller-context.txt",
              "source-controller.log",
              "source-package.log",
              "py-compile.log",
              "test-ga.log",
              "test-public-auth-ga-contract.log",
              "test-public-auth-deployment-kit.log",
          )
          files = []
          for name in required:
              path = root / name
              if not path.is_file() or path.stat().st_size <= 0:
                  raise SystemExit(f"required Pack 04 evidence is missing: {name}")
              data = path.read_bytes()
              files.append({
                  "name": name,
                  "sha256": hashlib.sha256(data).hexdigest(),
                  "size": len(data),
              })
          value = {
              "schema": 1,
              "kind": "psmatrix.pack04-source-preflight-status",
              "status": "PASS",
              "release_commit": commit,
              "python": "3.13",
              "source_import": "exact-checkout",
              "backend_install_required": False,
              "compiled": True,
              "ga_evaluator_tests": "PASS",
              "authority_contract_tests": "PASS",
              "deployment_kit_tests": "PASS",
              "ga_eligible": False,
              "files": files,
          }
          (root / "preflight-status.json").write_text(
              json.dumps(value, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(value, indent=2, sort_keys=True))
          PY

      - name: Record fail-closed preflight state
        if: failure()
        shell: bash
        run: |
          set +e
          evidence="${PSMATRIX_PACK04_EVIDENCE:-$RUNNER_TEMP/psmatrix-pack04-source-preflight}"
          install -d -m 0700 "$evidence"
          python - "$evidence" "${GITHUB_SHA,,}" <<'PY'
          import json
          import sys
          from pathlib import Path

          root = Path(sys.argv[1]).resolve()
          value = {
              "schema": 1,
              "kind": "psmatrix.pack04-source-preflight-status",
              "status": "FAIL",
              "release_commit": sys.argv[2],
              "ga_eligible": False,
              "note": "Inspect the retained step logs for the first failing command.",
          }
          (root / "preflight-failure.json").write_text(
              json.dumps(value, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload Pack 04 source preflight evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: production-ga-pack04-source-preflight
          path: ${{ runner.temp }}/psmatrix-pack04-source-preflight
          if-no-files-found: error
          retention-days: 30
