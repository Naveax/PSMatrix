name: production-ga-final-external-otlp

on:
  workflow_dispatch:
    inputs:
      release_signing_run_id:
        description: Successful protected final 2.0.0 signing workflow run ID from this exact control head
        required: true
        type: string

concurrency:
  group: production-ga-final-external-otlp
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  probe-external-otlp:
    name: Execute bounded external OTLP live probe
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production-ga-external-otlp-probe
    permissions:
      contents: read
      actions: read
    env:
      RELEASE_SIGNING_RUN_ID: ${{ inputs.release_signing_run_id }}
      FINAL_RELEASE_COMMIT: 02cef95d40cf524ce00f9d917188343dc49e6f2c
      OTLP_ENDPOINT: ${{ vars.PSMATRIX_GA_EXTERNAL_OTLP_ENDPOINT }}
      OTLP_TIMEOUT: ${{ vars.PSMATRIX_GA_EXTERNAL_OTLP_TIMEOUT_SECONDS }}

    steps:
      - name: Validate OTLP probe dispatch identity
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_SIGNING_RUN_ID" =~ ^[0-9]+$ ]] || { echo 'release_signing_run_id must contain only decimal digits.' >&2; exit 1; }
          [[ "$RELEASE_SIGNING_RUN_ID" != "$GITHUB_RUN_ID" ]] || { echo 'release signing and OTLP producer run IDs must be distinct.' >&2; exit 1; }
          [[ -n "$OTLP_ENDPOINT" ]] || { echo 'PSMATRIX_GA_EXTERNAL_OTLP_ENDPOINT is missing from production-ga-external-otlp-probe.' >&2; exit 1; }
          timeout="${OTLP_TIMEOUT:-10}"
          [[ "$timeout" =~ ^[0-9]+$ ]] && (( timeout >= 1 && timeout <= 30 )) || { echo 'PSMATRIX_GA_EXTERNAL_OTLP_TIMEOUT_SECONDS must be 1..30.' >&2; exit 1; }
          echo "OTLP_TIMEOUT=$timeout" >> "$GITHUB_ENV"
          echo 'external_otlp_dispatch_identity=PASS'

      - name: Check out exact operations/release producer controls
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1
        with:
          path: control
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.2.0
        with:
          python-version: "3.12"

      - name: Validate exact protected final release run before probe-secret access
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PYTHONPATH=control/src python - <<'PY'
          import json, os, subprocess, urllib.request
          from pathlib import Path
          head=subprocess.check_output(['git','-C','control','rev-parse','HEAD'],text=True).strip().lower()
          if head != os.environ['GITHUB_SHA'].lower():
              raise SystemExit('external OTLP control checkout is not exact GITHUB_SHA')
          if subprocess.check_output(['git','-C','control','status','--porcelain'],text=True).strip():
              raise SystemExit('external OTLP control checkout is dirty')
          contract=json.loads(Path('control/ga-packs/03-authoritative-windows/final-operations-release-evidence-producer-contract.json').read_text(encoding='utf-8'))
          if contract['external_otlp']['workflow']!='production-ga-final-external-otlp':
              raise SystemExit('external OTLP workflow contract mismatch')
          if contract['deployment_producer_anchor']!='2dcf33a91c118b62f0aa4364bccdbb13bc89942c':
              raise SystemExit('external OTLP deployment anchor mismatch')
          run_id=os.environ['RELEASE_SIGNING_RUN_ID']
          headers={'Accept':'application/vnd.github+json','Authorization':f'Bearer {os.environ["GH_TOKEN"]}','X-GitHub-Api-Version':'2026-03-10','User-Agent':'psmatrix-final-external-otlp'}
          def fetch(path):
              request=urllib.request.Request(f'https://api.github.com/repos/Naveax/PSMatrix/{path}',headers=headers)
              with urllib.request.urlopen(request,timeout=30) as response:
                  return json.load(response)
          run=fetch(f'actions/runs/{run_id}')
          if run.get('name')!='production-ga-windows-authority-final-release-sign-from-lock' or run.get('event')!='workflow_dispatch':
              raise SystemExit('external OTLP final-signing workflow provenance mismatch')
          if run.get('status')!='completed' or run.get('conclusion')!='success':
              raise SystemExit('external OTLP final-signing run is not completed successfully')
          if (run.get('head_sha') or '').lower()!=head:
              raise SystemExit('external OTLP final-signing run does not share exact control head')
          artifacts=fetch(f'actions/runs/{run_id}/artifacts?per_page=100').get('artifacts',[])
          matches=[item for item in artifacts if item.get('name')=='psmatrix-2.0.0-protected-release' and not item.get('expired')]
          if len(matches)!=1:
              raise SystemExit(f'expected exactly one non-expired protected final release artifact; found {len(matches)}')
          print(f'external_otlp_release_provenance=PASS run_id={run_id} artifact_id={matches[0].get("id")}')
          PY

      - name: Download exact protected final release
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: psmatrix-2.0.0-protected-release
          path: signed-release
          repository: Naveax/PSMatrix
          run-id: ${{ inputs.release_signing_run_id }}
          github-token: ${{ github.token }}

      - name: Revalidate signed release bytes before OTLP credential access
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=control/src python - <<'PY'
          import json, os
          from pathlib import Path
          from psmatrix.release import verify_release_manifest
          release=Path('signed-release')
          manifest=release/'psmatrix-2.0.0-release.json'
          public=release/'psmatrix-2.0.0-release-public.pem'
          status=release/'psmatrix-2.0.0-protected-release-signing-status.json'
          verified=verify_release_manifest(manifest,release,signing_public_key=public)
          if verified.get('valid') is not True or verified.get('version')!='2.0.0':
              raise SystemExit('protected final release verification failed before OTLP probe')
          state=json.loads(status.read_text(encoding='utf-8'))
          if state.get('release_artifacts_signed') is not True or state.get('version')!='2.0.0':
              raise SystemExit('protected final release signing status is not final/signed')
          print('external_otlp_release_pre_secret=PASS')
          PY

      - name: Materialize bounded OTLP credentials, execute live probe, and remove secrets
        shell: bash
        env:
          OTLP_HEADERS_JSON: ${{ secrets.PSMATRIX_GA_EXTERNAL_OTLP_HEADERS_JSON }}
        run: |
          set -euo pipefail
          [[ -n "$OTLP_HEADERS_JSON" ]] || { echo 'PSMATRIX_GA_EXTERNAL_OTLP_HEADERS_JSON is missing from production-ga-external-otlp-probe.' >&2; exit 1; }
          secret_root="$RUNNER_TEMP/psmatrix-final-otlp-probe-secrets"
          output="$RUNNER_TEMP/psmatrix-final-otlp-live"
          home="$RUNNER_TEMP/psmatrix-final-otlp-home"
          rm -rf "$secret_root" "$output" "$home"
          install -d -m 0700 "$secret_root" "$output" "$home"
          printf '%s' "$OTLP_HEADERS_JSON" > "$secret_root/headers.json"
          chmod 0600 "$secret_root/headers.json"
          cleanup() {
            shred -u "$secret_root/headers.json" 2>/dev/null || rm -f "$secret_root/headers.json"
            rmdir "$secret_root" 2>/dev/null || true
            rm -rf "$home"
          }
          trap cleanup EXIT
          PYTHONPATH=control/src python control/scripts/ga/probe_final_external_otlp.py run \
            --endpoint "$OTLP_ENDPOINT" \
            --headers-json "$secret_root/headers.json" \
            --release-dir signed-release \
            --release-commit "$FINAL_RELEASE_COMMIT" \
            --release-signing-run-id "$RELEASE_SIGNING_RUN_ID" \
            --home "$home" \
            --timeout "$OTLP_TIMEOUT" \
            --output "$output/external-otlp-live-report.json"
          PSMATRIX_OTLP_LIVE="$output" PYTHONPATH=control/src python - <<'PY'
          import json, os
          from pathlib import Path
          report=Path(os.environ['PSMATRIX_OTLP_LIVE'])/'external-otlp-live-report.json'
          value=json.loads(report.read_text(encoding='utf-8'))
          if value.get('status')!='PASS' or value.get('kind')!='psmatrix.external-otlp-live-report':
              raise SystemExit('external OTLP live report is not PASS')
          if any(value.get(key) is not False for key in ('secrets_in_report','private_keys_in_report','metrics_payload_in_report','absolute_paths_in_report')):
              raise SystemExit('external OTLP live report leak boundary is not clean')
          otlp=value.get('otlp') or {}
          if int(otlp.get('successful_exports') or 0)!=2 or int(otlp.get('unauthenticated_status_code') or 0) not in (401,403):
              raise SystemExit('external OTLP bounded export/authentication observations are incomplete')
          print('external_otlp_live_report=PASS secret_material_absent=true')
          PY
          echo "PSMATRIX_OTLP_LIVE=$output" >> "$GITHUB_ENV"

      - name: Upload unsigned external OTLP live report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: psmatrix-2.0.0-final-external-otlp-live-report
          path: ${{ env.PSMATRIX_OTLP_LIVE }}/external-otlp-live-report.json
          if-no-files-found: error
          retention-days: 30

  sign-external-otlp:
    name: Sign exact external OTLP proof with operations authority
    needs: probe-external-otlp
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: production-ga-operations-signing
    permissions:
      contents: read
      actions: read
    env:
      RELEASE_SIGNING_RUN_ID: ${{ inputs.release_signing_run_id }}

    steps:
      - name: Check out exact operations/release producer controls
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1
        with:
          path: control
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.2.0
        with:
          python-version: "3.12"

      - name: Download exact live report from this workflow run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: psmatrix-2.0.0-final-external-otlp-live-report
          path: live

      - name: Download exact protected final release for authority-independence validation
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: psmatrix-2.0.0-protected-release
          path: signed-release
          repository: Naveax/PSMatrix
          run-id: ${{ inputs.release_signing_run_id }}
          github-token: ${{ github.token }}

      - name: Build and validate unsigned OTLP proof before operations-key access
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/psmatrix-final-otlp-unsigned"
          rm -rf "$output"
          mkdir -p "$output"
          PYTHONPATH=control/src python control/scripts/ga/probe_final_external_otlp.py proof-result \
            --report live/external-otlp-live-report.json \
            --output "$output/external-otlp-result.json"
          PSMATRIX_OTLP_UNSIGNED="$output" PYTHONPATH=control/src python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          from psmatrix.release import verify_release_manifest
          from psmatrix.util import sha256_file
          head=subprocess.check_output(['git','-C','control','rev-parse','HEAD'],text=True).strip().lower()
          if head!=os.environ['GITHUB_SHA'].lower():
              raise SystemExit('OTLP signing control checkout is not exact GITHUB_SHA')
          report=Path('live/external-otlp-live-report.json')
          live=json.loads(report.read_text(encoding='utf-8'))
          result=json.loads((Path(os.environ['PSMATRIX_OTLP_UNSIGNED'])/'external-otlp-result.json').read_text(encoding='utf-8'))
          artifacts=result.get('artifacts') or []
          if len(artifacts)!=1 or artifacts[0].get('name')!='external-otlp-live-report.json' or artifacts[0].get('sha256')!=sha256_file(report):
              raise SystemExit('unsigned external OTLP proof does not bind exact live report')
          release=Path('signed-release')
          verified=verify_release_manifest(release/'psmatrix-2.0.0-release.json',release,signing_public_key=release/'psmatrix-2.0.0-release-public.pem')
          if verified.get('valid') is not True or verified.get('version')!='2.0.0':
              raise SystemExit('signed release failed revalidation before operations-key access')
          if (live.get('release') or {}).get('manifest_sha256')!=sha256_file(release/'psmatrix-2.0.0-release.json'):
              raise SystemExit('OTLP live report does not bind downloaded signed release manifest')
          print('external_otlp_unsigned_pre_secret=PASS')
          PY
          echo "PSMATRIX_OTLP_UNSIGNED=$output" >> "$GITHUB_ENV"

      - name: Materialize operations authority, sign OTLP proof, verify, and remove private key
        shell: bash
        env:
          OPERATIONS_PRIVATE_KEY: ${{ secrets.PSMATRIX_GA_OPERATIONS_PRIVATE_KEY }}
          OPERATIONS_PUBLIC_KEY: ${{ secrets.PSMATRIX_GA_OPERATIONS_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          [[ -n "$OPERATIONS_PRIVATE_KEY" ]] || { echo 'PSMATRIX_GA_OPERATIONS_PRIVATE_KEY is missing from production-ga-operations-signing.' >&2; exit 1; }
          [[ "$OPERATIONS_PUBLIC_KEY" == *'-----BEGIN PUBLIC KEY-----'* ]] || { echo 'PSMATRIX_GA_OPERATIONS_PUBLIC_KEY is missing from production-ga-operations-signing.' >&2; exit 1; }
          key_root="$RUNNER_TEMP/psmatrix-final-operations-keys"
          output="$RUNNER_TEMP/psmatrix-2.0.0-final-external-otlp"
          rm -rf "$key_root" "$output"
          install -d -m 0700 "$key_root" "$output"
          printf '%s\n' "$OPERATIONS_PRIVATE_KEY" > "$key_root/operations.private.pem"
          printf '%s\n' "$OPERATIONS_PUBLIC_KEY" > "$key_root/operations.public.pem"
          chmod 0600 "$key_root/operations.private.pem"
          cleanup() {
            shred -u "$key_root/operations.private.pem" 2>/dev/null || rm -f "$key_root/operations.private.pem"
            rm -f "$key_root/operations.public.pem"
            rmdir "$key_root" 2>/dev/null || true
          }
          trap cleanup EXIT
          cp "$PSMATRIX_OTLP_UNSIGNED/external-otlp-result.json" "$output/external-otlp-result.json"
          cp live/external-otlp-live-report.json "$output/external-otlp-live-report.json"
          PYTHONPATH=control/src python -m psmatrix.cli ga proof-create \
            --type external-otlp \
            --input "$output/external-otlp-result.json" \
            --private-key "$key_root/operations.private.pem" \
            --public-key "$key_root/operations.public.pem" \
            --output "$output/external-otlp.dsse.json"
          PYTHONPATH=control/src python -m psmatrix.cli ga proof-verify \
            --type external-otlp \
            --attestation "$output/external-otlp.dsse.json" \
            --public-key "$key_root/operations.public.pem" >/dev/null
          cp "$key_root/operations.public.pem" "$output/operations-public.pem"
          PSMATRIX_OTLP_SIGNED="$output" PYTHONPATH=control/src python - <<'PY'
          import os
          from pathlib import Path
          from psmatrix.ga import verify_ga_proof
          from psmatrix.signing import public_key_id
          from psmatrix.util import atomic_write_json, read_json, sha256_file
          root=Path(os.environ['PSMATRIX_OTLP_SIGNED'])
          verified=verify_ga_proof(read_json(root/'external-otlp.dsse.json'),public_key=root/'operations-public.pem',expected_type='external-otlp')
          result=verified.get('result')
          if not isinstance(result,dict):
              raise SystemExit('verified external OTLP result payload is missing')
          assertions=result.get('assertions') if isinstance(result.get('assertions'),dict) else {}
          artifacts=result.get('artifacts') if isinstance(result.get('artifacts'),list) else []
          live_sha=sha256_file(root/'external-otlp-live-report.json')
          if verified.get('valid') is not True or len(artifacts)!=1 or artifacts[0].get('sha256')!=live_sha:
              raise SystemExit('signed external OTLP proof subject mismatch')
          required=('external_probe','public_dns','public_tls','collector_external','authenticated_tls','unauthenticated_request_rejected','credential_leak_absent','private_key_leak_absent','source_body_leak_absent','absolute_path_leak_absent','release_commit_bound')
          if any(assertions.get(name) is not True for name in required):
              raise SystemExit('signed external OTLP proof lacks required PASS assertions')
          if assertions.get('request_path')!='/v1/metrics' or not 200<=int(assertions.get('status_code') or 0)<300 or int(assertions.get('successful_exports') or 0)<2:
              raise SystemExit('signed external OTLP proof request/status/export count mismatch')
          release_public=Path('signed-release/psmatrix-2.0.0-release-public.pem')
          if public_key_id(root/'operations-public.pem')==public_key_id(release_public):
              raise SystemExit('operations and release GA authorities must be independent')
          status={'schema':1,'kind':'psmatrix.final-external-otlp-producer-status','status':'PASS','version':'2.0.0','proof_verified':True,'live_report_sha256':live_sha,'operations_key_id':public_key_id(root/'operations-public.pem'),'release_key_id':public_key_id(release_public),'authorities_independent':True,'operations_private_key_copied_to_output':False,'final_ga_evaluator_invoked':False,'ga_eligible':False}
          atomic_write_json(root/'external-otlp-producer-status.json',status)
          markers=(b'-----BEGIN PRIVATE KEY-----',b'-----BEGIN RSA PRIVATE KEY-----',b'-----BEGIN EC PRIVATE KEY-----',b'-----BEGIN OPENSSH PRIVATE KEY-----',b'-----BEGIN ED25519 PRIVATE KEY-----')
          for path in root.rglob('*'):
              if path.is_file() and any(marker in path.read_bytes() for marker in markers):
                  raise SystemExit(f'private-key material found in external OTLP output: {path.name}')
          print('signed_external_otlp=PASS authorities_independent=true')
          print('final_ga_evaluator_invoked=false')
          print('ga_eligible=false')
          PY
          echo "PSMATRIX_OTLP_SIGNED=$output" >> "$GITHUB_ENV"

      - name: Upload final operations-signed external OTLP proof
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: psmatrix-2.0.0-final-external-otlp
          path: ${{ env.PSMATRIX_OTLP_SIGNED }}
          if-no-files-found: error
          retention-days: 30
