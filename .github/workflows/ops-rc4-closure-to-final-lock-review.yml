name: ops-rc4-closure-to-final-lock-review

on:
  workflow_run:
    workflows:
      - production-ga-windows-authority-rc4-candidate-closure-selfhosted
      - production-ga-windows-authority-final-staging-candidate-selfhosted
    types: [completed]

concurrency:
  group: ops-rc4-closure-to-final-lock-review
  cancel-in-progress: false

permissions:
  contents: read
  actions: write
  issues: write

jobs:
  advance:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'workflow_dispatch' &&
      github.event.workflow_run.actor.login == 'github-actions[bot]' &&
      github.event.workflow_run.triggering_actor.login == 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      COMPLETED_WORKFLOW: ${{ github.event.workflow_run.name }}
      COMPLETED_RUN_ID: ${{ github.event.workflow_run.id }}
      COMPLETED_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
      COMPLETED_HEAD: ${{ github.event.workflow_run.head_sha }}
      COMPLETED_BRANCH: ${{ github.event.workflow_run.head_branch }}
      COMPLETED_AT: ${{ github.event.workflow_run.updated_at }}
      RC4_CONTROL_BRANCH: release/2.0.0rc4-active-lock
      FINAL_SOURCE_BRANCH: final/2.0.0-release-candidate-anchor
      FINAL_SOURCE_COMMIT: 02cef95d40cf524ce00f9d917188343dc49e6f2c
      FINAL_LOCK_CONTROL_BRANCH: release/2.0.0-final-lock-control
      RC4_ENROLLMENT_RUN_ID: '32136341027'
      STATE_ISSUE: '262'
    steps:
      - name: Validate exact automated successful upstream artifact
        shell: bash
        run: |
          set -euo pipefail
          [[ "$COMPLETED_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$COMPLETED_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          [[ "$COMPLETED_HEAD" =~ ^[0-9a-f]{40}$ ]]
          [[ "$COMPLETED_AT" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T ]]
          python - <<'PY'
          import json, os, urllib.request
          repo=os.environ['GITHUB_REPOSITORY']
          run_id=os.environ['COMPLETED_RUN_ID']
          attempt=os.environ['COMPLETED_RUN_ATTEMPT']
          name=os.environ['COMPLETED_WORKFLOW']
          head=os.environ['COMPLETED_HEAD'].lower()
          branch=os.environ['COMPLETED_BRANCH']
          headers={
              'Accept':'application/vnd.github+json',
              'Authorization':f"Bearer {os.environ['GH_TOKEN']}",
              'X-GitHub-Api-Version':'2022-11-28',
              'User-Agent':'psmatrix-rc4-to-final-chain',
          }
          def fetch(path):
              req=urllib.request.Request(f'https://api.github.com/repos/{repo}/{path}',headers=headers)
              with urllib.request.urlopen(req,timeout=30) as r: return json.load(r)
          expected={
              'production-ga-windows-authority-rc4-candidate-closure-selfhosted':(
                  '.github/workflows/ga-windows-authority-rc4-candidate-closure-hardened-selfhosted.yml',
                  'windows-authority-rc4-candidate-closure',
                  os.environ['RC4_CONTROL_BRANCH'],
              ),
              'production-ga-windows-authority-final-staging-candidate-selfhosted':(
                  '.github/workflows/ga-windows-authority-final-staging-candidate-selfhosted.yml',
                  'windows-authority-final-unlocked-staging-candidate',
                  os.environ['FINAL_SOURCE_BRANCH'],
              ),
          }.get(name)
          if not expected:
              raise SystemExit(f'unexpected chain workflow: {name}')
          expected_path, expected_artifact, expected_branch = expected
          run=fetch(f'actions/runs/{run_id}')
          if run.get('name')!=name or run.get('path')!=expected_path:
              raise SystemExit('upstream workflow run name/path mismatch')
          if run.get('event')!='workflow_dispatch' or run.get('status')!='completed' or run.get('conclusion')!='success':
              raise SystemExit('upstream workflow run identity/status mismatch')
          if str(run.get('run_attempt'))!=attempt:
              raise SystemExit('upstream workflow run attempt mismatch')
          if run.get('head_branch')!=expected_branch or branch!=expected_branch or (run.get('head_sha') or '').lower()!=head:
              raise SystemExit('upstream workflow run branch/head mismatch')
          if (run.get('actor') or {}).get('login')!='github-actions[bot]' or (run.get('triggering_actor') or {}).get('login')!='github-actions[bot]':
              raise SystemExit('upstream workflow was not dispatched by the canonical automation chain')
          artifacts=fetch(f'actions/runs/{run_id}/artifacts?per_page=100').get('artifacts',[])
          matches=[a for a in artifacts if a.get('name')==expected_artifact and not a.get('expired')]
          if len(matches)!=1:
              raise SystemExit(f'expected exactly one live {expected_artifact} artifact; found {len(matches)}')
          print(f'upstream_artifact=PASS name={expected_artifact} artifact_id={matches[0].get("id")} automated_dispatch=true path={expected_path}')
          PY

      - name: Advance RC4 closure to final lock review once
        shell: bash
        run: |
          set -euo pipefail

          comments() {
            gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$STATE_ISSUE/comments" \
              --jq '.[] | select(.user.login == "github-actions[bot]") | .body'
          }

          state_exists() {
            local stage="$1"
            local head="$2"
            comments | grep -Eq "^RC4_CHAIN_STATE stage=${stage} run_id=[1-9][0-9]* attempt=[1-9][0-9]* control_head=${head}$"
          }

          record_state_once() {
            local stage="$1"
            local head="$2"
            if ! state_exists "$stage" "$head"; then
              gh issue comment "$STATE_ISSUE" --repo "$GITHUB_REPOSITORY" \
                --body "RC4_CHAIN_STATE stage=$stage run_id=$COMPLETED_RUN_ID attempt=$COMPLETED_RUN_ATTEMPT control_head=$head"
            fi
          }

          downstream_after_source() {
            local workflow="$1"
            local branch="$2"
            local head="$3"
            gh api --method GET \
              "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs" \
              -f branch="$branch" -f event='workflow_dispatch' -f per_page=100 \
              --jq ".workflow_runs[] | select(.head_sha == \"$head\" and .created_at >= \"$COMPLETED_AT\") | .id" \
              | head -n 1
          }

          publish_dispatch_marker() {
            local marker="$1"
            if ! comments | grep -Fxq "$marker"; then
              gh issue comment "$STATE_ISSUE" --repo "$GITHUB_REPOSITORY" --body "$marker"
            fi
          }

          case "$COMPLETED_WORKFLOW" in
            production-ga-windows-authority-rc4-candidate-closure-selfhosted)
              [[ "$COMPLETED_BRANCH" == "$RC4_CONTROL_BRANCH" ]] || { echo 'RC4 closure did not run on frozen active-lock branch.' >&2; exit 1; }
              rc4_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$RC4_CONTROL_BRANCH" --jq '.object.sha')
              [[ "$rc4_sha" == "$COMPLETED_HEAD" ]] || { echo 'RC4 active-lock branch moved after closure.' >&2; exit 1; }
              final_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$FINAL_SOURCE_BRANCH" --jq '.object.sha')
              [[ "$final_sha" == "$FINAL_SOURCE_COMMIT" ]] || { echo "Final source anchor moved: $final_sha" >&2; exit 1; }

              existing=$(downstream_after_source ga-windows-authority-final-staging-candidate-selfhosted.yml "$FINAL_SOURCE_BRANCH" "$FINAL_SOURCE_COMMIT")
              if [[ -n "$existing" ]]; then
                record_state_once closure "$COMPLETED_HEAD"
                publish_dispatch_marker "RC4_CHAIN_DISPATCH target=final_staging release_commit=$FINAL_SOURCE_COMMIT active_lock=$COMPLETED_HEAD source_run_id=$COMPLETED_RUN_ID source_attempt=$COMPLETED_RUN_ATTEMPT"
                echo "duplicate_final_staging_dispatch_suppressed=true existing_run_id=$existing"
                exit 0
              fi

              gh workflow run ga-windows-authority-final-staging-candidate-selfhosted.yml \
                --repo "$GITHUB_REPOSITORY" --ref "$FINAL_SOURCE_BRANCH" \
                -f release_commit="$FINAL_SOURCE_COMMIT"
              record_state_once closure "$COMPLETED_HEAD"
              publish_dispatch_marker "RC4_CHAIN_DISPATCH target=final_staging release_commit=$FINAL_SOURCE_COMMIT active_lock=$COMPLETED_HEAD source_run_id=$COMPLETED_RUN_ID source_attempt=$COMPLETED_RUN_ATTEMPT"
              echo 'next_stage=final_unsigned_staging'
              ;;

            production-ga-windows-authority-final-staging-candidate-selfhosted)
              [[ "$COMPLETED_BRANCH" == "$FINAL_SOURCE_BRANCH" ]] || { echo 'Final staging did not run on canonical final source anchor.' >&2; exit 1; }
              [[ "$COMPLETED_HEAD" == "$FINAL_SOURCE_COMMIT" ]] || { echo 'Final staging exact source head mismatch.' >&2; exit 1; }
              final_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$FINAL_SOURCE_BRANCH" --jq '.object.sha')
              [[ "$final_sha" == "$FINAL_SOURCE_COMMIT" ]] || { echo 'Final source anchor moved after staging.' >&2; exit 1; }
              control_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$FINAL_LOCK_CONTROL_BRANCH" --jq '.object.sha')
              [[ "$control_sha" =~ ^[0-9a-f]{40}$ ]] || { echo 'Frozen final lock-control branch cannot be resolved.' >&2; exit 1; }

              existing=$(downstream_after_source ga-windows-authority-final-release-lock-review.yml "$FINAL_LOCK_CONTROL_BRANCH" "$control_sha")
              if [[ -n "$existing" ]]; then
                record_state_once final_staging "$COMPLETED_HEAD"
                publish_dispatch_marker "RC4_CHAIN_DISPATCH target=final_lock_review final_candidate=$FINAL_SOURCE_COMMIT control_head=$control_sha staging_run_id=$COMPLETED_RUN_ID staging_attempt=$COMPLETED_RUN_ATTEMPT"
                echo "duplicate_final_lock_review_dispatch_suppressed=true existing_run_id=$existing"
                exit 0
              fi

              gh workflow run ga-windows-authority-final-release-lock-review.yml \
                --repo "$GITHUB_REPOSITORY" --ref "$FINAL_LOCK_CONTROL_BRANCH" \
                -f final_candidate_commit="$FINAL_SOURCE_COMMIT" \
                -f rc4_enrollment_run_id="$RC4_ENROLLMENT_RUN_ID" \
                -f staging_run_id="$COMPLETED_RUN_ID"
              record_state_once final_staging "$COMPLETED_HEAD"
              publish_dispatch_marker "RC4_CHAIN_DISPATCH target=final_lock_review final_candidate=$FINAL_SOURCE_COMMIT control_head=$control_sha staging_run_id=$COMPLETED_RUN_ID staging_attempt=$COMPLETED_RUN_ATTEMPT"
              echo "next_stage=final_lock_review control_head=$control_sha"
              ;;

            *)
              echo "Unexpected workflow: $COMPLETED_WORKFLOW" >&2
              exit 1
              ;;
          esac
          echo 'ga_eligible=false'
