name: production-ga-readiness-exact-head-certification-bridge-v2

on:
  pull_request:
    branches: ["main"]
    paths:
      - ".github/psmatrix-readiness-certification-trigger-v2.txt"

concurrency:
  group: production-ga-readiness-exact-head-certification-bridge-v2
  cancel-in-progress: false

permissions:
  contents: read
  statuses: write

jobs:
  certify-production-readiness-exact-head:
    runs-on: [self-hosted, Windows, X64, psmatrix-hyperv]
    timeout-minutes: 60
    env:
      PYTHONPATH: ${{ github.workspace }}\src
      EXPECTED_HEAD: 6bfedb4979d0832daf01f3f452144f7bb7f830d6
      PRODUCER_SOURCE_ANCHOR: 89372d9432433237abdf677900093b399c4d0868
      FINAL_RELEASE_COMMIT: 02cef95d40cf524ce00f9d917188343dc49e6f2c
      STATUS_CONTEXT: production-readiness/source-preflight

    steps:
      - name: Verify trusted NAVEAX certification runner
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if ($env:RUNNER_OS -ne 'Windows' -or $env:RUNNER_NAME -ne 'NAVEAX') {
            throw "Expected NAVEAX Windows runner; got $env:RUNNER_NAME / $env:RUNNER_OS"
          }
          Write-Host 'production_readiness_bridge_v2_runner=PASS'

      - name: Publish pending exact-head certification status
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          @'
          import json, os, urllib.request
          payload=json.dumps({
              'state':'pending',
              'target_url':f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
              'description':'trusted-base NAVEAX exact-head certification queued',
              'context':os.environ['STATUS_CONTEXT'],
          }).encode()
          request=urllib.request.Request(
              f"{os.environ['GITHUB_API_URL']}/repos/{os.environ['GITHUB_REPOSITORY']}/statuses/{os.environ['EXPECTED_HEAD']}",
              data=payload,method='POST',headers={
                  'Accept':'application/vnd.github+json','Authorization':f"Bearer {os.environ['GH_TOKEN']}",
                  'X-GitHub-Api-Version':'2026-03-10','Content-Type':'application/json',
                  'User-Agent':'psmatrix-readiness-certification-bridge-v2',
              })
          with urllib.request.urlopen(request,timeout=30) as response: value=json.load(response)
          if value.get('state')!='pending' or value.get('context')!=os.environ['STATUS_CONTEXT']:
              raise SystemExit('pending readiness certification status publication failed')
          print('production_readiness_bridge_v2_status=PENDING')
          '@ | python -

      - name: Check out frozen production-readiness exact head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: 6bfedb4979d0832daf01f3f452144f7bb7f830d6
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact readiness closure and producer grounding
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          @'
          import json, os, re, subprocess
          from pathlib import Path

          def git(*args):
              return subprocess.check_output(['git',*args],text=True).strip()

          head=git('rev-parse','HEAD').lower()
          expected=os.environ['EXPECTED_HEAD'].lower()
          anchor=os.environ['PRODUCER_SOURCE_ANCHOR'].lower()
          final_commit=os.environ['FINAL_RELEASE_COMMIT'].lower()
          if head!=expected or re.fullmatch(r'[0-9a-f]{40}',expected) is None:
              raise SystemExit(f'exact readiness head mismatch: {head} / {expected}')
          if git('status','--porcelain'):
              raise SystemExit('readiness certification checkout is dirty')
          for sha in (anchor,final_commit):
              subprocess.check_call(['git','cat-file','-e',f'{sha}^{{commit}}'])
          subprocess.check_call(['git','merge-base','--is-ancestor',anchor,head])

          expected_paths=sorted([
              '.github/workflows/ga-final-production-readiness-source-preflight.yml',
              '.github/workflows/ga-final-production-readiness.yml',
              'ga-packs/03-authoritative-windows/final-production-readiness-contract.json',
              'scripts/ga/assemble_final_production_readiness.py',
              'tests/test_final_production_readiness_controls.py',
          ])
          changed=sorted({line.replace('\\','/') for line in git('diff','--name-only',f'{anchor}..{head}').splitlines() if line.strip()})
          if changed!=expected_paths or len(changed)!=5:
              raise SystemExit(f'exact readiness five-path closure mismatch: {changed}')
          if any(path.startswith('src/psmatrix/') for path in changed):
              raise SystemExit('readiness layer modified runtime source')

          contract=json.loads(Path('ga-packs/03-authoritative-windows/final-production-readiness-contract.json').read_text(encoding='utf-8'))
          if contract.get('schema')!=1 or contract.get('kind')!='psmatrix.final-production-readiness-contract' or contract.get('version')!='2.0.0':
              raise SystemExit('readiness contract identity mismatch')
          if contract.get('producer_source_anchor')!=anchor or contract.get('final_release_commit')!=final_commit:
              raise SystemExit('readiness source identity mismatch')
          if (contract.get('control_source') or {}).get('runtime_source_changes_allowed') is not False:
              raise SystemExit('readiness runtime mutation boundary is open')
          if sorted((contract.get('control_source') or {}).get('changed_path_allowlist') or [])!=expected_paths:
              raise SystemExit('readiness contract allowlist differs from exact five-path closure')

          environments=contract.get('environments') or []
          if len(environments)!=12 or len({item.get('name') for item in environments if isinstance(item,dict)})!=12:
              raise SystemExit('readiness environment closure is not exact 12/12')
          receipt=contract.get('receipt_contract') or {}
          if any(receipt.get(key) is not False for key in ('secret_values_allowed','secret_hashes_allowed','secret_lengths_allowed')):
              raise SystemExit('readiness receipt permits secret-derived material')
          summary=contract.get('summary_contract') or {}
          if summary.get('required_environment_count')!=12 or summary.get('producer_source_coverage_required')!=11:
              raise SystemExit('readiness summary cardinality mismatch')

          workflow=Path('.github/workflows/ga-final-production-readiness.yml').read_text(encoding='utf-8')
          dollar=chr(36)
          for environment in environments:
              name=str(environment['name'])
              needle=f'environment: {name}'
              if workflow.count(needle)!=1:
                  raise SystemExit(f'readiness environment binding mismatch: {name}')
              producer_path=Path(str(environment.get('producer_workflow_path') or ''))
              if not producer_path.is_file():
                  raise SystemExit(f'missing producer source: {name} / {producer_path}')
              producer=producer_path.read_text(encoding='utf-8')
              if needle not in producer:
                  raise SystemExit(f'producer environment mismatch: {name} / {producer_path}')
              for secret in environment.get('required_secrets') or []:
                  reference=dollar+'{{ secrets.'+str(secret)+' }}'
                  if workflow.count(reference)!=1 or reference not in producer:
                      raise SystemExit(f'secret grounding mismatch: {name} / {secret}')
              for variable in environment.get('required_vars') or []:
                  reference=dollar+'{{ vars.'+str(variable)+' }}'
                  if workflow.count(reference)!=1 or reference not in producer:
                      raise SystemExit(f'variable grounding mismatch: {name} / {variable}')

          evaluator=json.loads(Path('ga-packs/03-authoritative-windows/final-ga-evaluator-control-contract.json').read_text(encoding='utf-8'))
          gates=evaluator.get('required_gates') or []
          if len(gates)!=11:
              raise SystemExit('evaluator producer gate closure is not exact 11/11')
          for gate in gates:
              source=(evaluator.get('evidence_sources') or {}).get(gate) or {}
              producer_path=Path(str(source.get('workflow_path') or ''))
              if not producer_path.is_file() or f"name: {source.get('workflow')}" not in producer_path.read_text(encoding='utf-8'):
                  raise SystemExit(f'evaluator producer source mismatch: {gate}')

          print(f'validated_exact_production_readiness_head={head}')
          print('production_readiness_control_changed_paths=5')
          print('runtime_source_changes=0')
          print('readiness_producer_source_crosscheck=PASS environments=12')
          print('evaluator_producer_sources_present=11')
          '@ | python -

      - name: Compile and run readiness inherited contract suites
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          python -m py_compile scripts/ga/assemble_final_production_readiness.py tests/test_final_production_readiness_controls.py
          if ($LASTEXITCODE -ne 0) { throw 'readiness compile failed' }
          python -m unittest -v tests.test_final_production_readiness_controls tests.test_final_security_vulnerability_evidence_producers tests.test_final_ga_evaluator_controls
          if ($LASTEXITCODE -ne 0) { throw 'readiness inherited contract suite failed' }
          python scripts/ga/assemble_final_production_readiness.py --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'readiness assembler parse failed' }
          Write-Host 'production_readiness_bridge_v2_contract_suite=PASS'

      - name: Scan every tracked source byte for private authority material
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          @'
          import subprocess
          from pathlib import Path
          markers={b'-----BEGIN PRIVATE KEY-----',b'-----BEGIN RSA PRIVATE KEY-----',b'-----BEGIN EC PRIVATE KEY-----',b'-----BEGIN OPENSSH PRIVATE KEY-----',b'-----BEGIN ED25519 PRIVATE KEY-----'}
          root=Path.cwd().resolve(); scanned=0; total=0
          for relative in subprocess.check_output(['git','ls-files'],text=True).splitlines():
              if not relative: continue
              path=root/relative
              if not path.is_file(): continue
              scanned+=1
              for raw in path.open('rb'):
                  total+=len(raw)
                  if raw.rstrip(b'\r\n').strip() in markers:
                      raise SystemExit(f'tracked private-key PEM material detected: {relative}')
          print(f'repository_private_authority_absence=PASS tracked_files={scanned} tracked_bytes={total} size_limit_applied=false')
          '@ | python -

      - name: Publish failed exact-head certification status
        if: ${{ failure() }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Continue'
          @'
          import json, os, urllib.request
          payload=json.dumps({'state':'failure','target_url':f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",'description':'trusted-base NAVEAX exact-head certification failed','context':os.environ['STATUS_CONTEXT']}).encode()
          request=urllib.request.Request(f"{os.environ['GITHUB_API_URL']}/repos/{os.environ['GITHUB_REPOSITORY']}/statuses/{os.environ['EXPECTED_HEAD']}",data=payload,method='POST',headers={'Accept':'application/vnd.github+json','Authorization':f"Bearer {os.environ['GH_TOKEN']}",'X-GitHub-Api-Version':'2026-03-10','Content-Type':'application/json','User-Agent':'psmatrix-readiness-certification-bridge-v2'})
          try: urllib.request.urlopen(request,timeout=30).read()
          except Exception as exc: print(f'failure status publication warning: {exc}')
          '@ | python -

      - name: Publish successful exact-head certification status
        if: ${{ success() }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          @'
          import json, os, urllib.request
          payload=json.dumps({'state':'success','target_url':f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",'description':'trusted-base NAVEAX exact-head source preflight certified','context':os.environ['STATUS_CONTEXT']}).encode()
          request=urllib.request.Request(f"{os.environ['GITHUB_API_URL']}/repos/{os.environ['GITHUB_REPOSITORY']}/statuses/{os.environ['EXPECTED_HEAD']}",data=payload,method='POST',headers={'Accept':'application/vnd.github+json','Authorization':f"Bearer {os.environ['GH_TOKEN']}",'X-GitHub-Api-Version':'2026-03-10','Content-Type':'application/json','User-Agent':'psmatrix-readiness-certification-bridge-v2'})
          with urllib.request.urlopen(request,timeout=30) as response: value=json.load(response)
          if value.get('state')!='success' or value.get('context')!=os.environ['STATUS_CONTEXT']:
              raise SystemExit('success readiness certification status publication failed')
          print('production_readiness_commit_status=SUCCESS context=production-readiness/source-preflight')
          print('readiness_workflow_executed=false')
          print('production_evidence_runs_complete=false')
          print('final_ga_evaluator_invoked=false')
          print('ga_eligible=false')
          '@ | python -
