name: production-ga-final-disaster-recovery-evidence-producer-source-preflight

on:
  workflow_dispatch:
  push:
    branches: ["final/2.0.0-disaster-recovery-evidence-producer"]
    paths:
      - ".github/workflows/ga-final-disaster-recovery-evidence-producer-source-preflight.yml"
      - ".github/workflows/ga-final-disaster-recovery.yml"
      - "ga-packs/03-authoritative-windows/final-disaster-recovery-evidence-producer-contract.json"
      - "tests/test_final_disaster_recovery_evidence_producer.py"
  pull_request:
    branches: ["final/2.0.0-operations-release-evidence-producers-anchor"]
    paths:
      - ".github/workflows/ga-final-disaster-recovery-evidence-producer-source-preflight.yml"
      - ".github/workflows/ga-final-disaster-recovery.yml"
      - "ga-packs/03-authoritative-windows/final-disaster-recovery-evidence-producer-contract.json"
      - "tests/test_final_disaster_recovery_evidence_producer.py"

concurrency:
  group: production-ga-final-disaster-recovery-evidence-producer-source-preflight-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  disaster-recovery-producer-source-preflight:
    runs-on: [self-hosted, Windows, X64, psmatrix-hyperv]
    timeout-minutes: 50
    permissions:
      contents: read
    env:
      PYTHONPATH: ${{ github.workspace }}\src
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      OPERATIONS_RELEASE_ANCHOR: e9a70816639f946e7cda02f15b515266f5753773

    steps:
      - name: Verify trusted NAVEAX source runner
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_OS -ne 'Windows' -or $env:RUNNER_NAME -ne 'NAVEAX') {
              throw "Expected NAVEAX Windows runner; got $env:RUNNER_NAME / $env:RUNNER_OS"
          }
          Write-Host 'disaster_recovery_producer_source_runner=PASS'

      - name: Check out exact disaster-recovery producer source with full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact four-path closure and producer count
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $head = (git rev-parse HEAD).Trim().ToLowerInvariant()
          if ($env:EXPECTED_HEAD -cnotmatch '^[0-9a-f]{40}$' -or $head -ne $env:EXPECTED_HEAD.ToLowerInvariant()) { throw "Exact disaster-recovery producer head mismatch: $head / $env:EXPECTED_HEAD" }
          if (-not [string]::IsNullOrWhiteSpace((git status --porcelain))) { throw 'Disaster-recovery producer source checkout is dirty.' }
          git cat-file -e "$env:OPERATIONS_RELEASE_ANCHOR^{commit}"
          if ($LASTEXITCODE -ne 0) { throw 'Operations/release producer anchor is unavailable.' }
          git merge-base --is-ancestor $env:OPERATIONS_RELEASE_ANCHOR $head
          if ($LASTEXITCODE -ne 0) { throw 'Operations/release producer anchor is not an ancestor.' }

          $contract = Get-Content 'ga-packs\03-authoritative-windows\final-disaster-recovery-evidence-producer-contract.json' -Raw | ConvertFrom-Json
          if ([int]$contract.schema -ne 1 -or [string]$contract.kind -ne 'psmatrix.final-disaster-recovery-evidence-producer-contract' -or [string]$contract.version -ne '2.0.0') { throw 'Disaster-recovery producer contract identity mismatch.' }
          if ([string]$contract.operations_release_producer_anchor -ne $env:OPERATIONS_RELEASE_ANCHOR) { throw 'Disaster-recovery producer anchor mismatch.' }
          if ([bool]$contract.control_source.runtime_source_changes_allowed) { throw 'Disaster-recovery control layer must not modify runtime source.' }
          if ([string]$contract.producer.authority -ne 'recovery' -or [string]$contract.producer.signing_environment -ne 'production-ga-recovery-signing') { throw 'Disaster-recovery authority contract mismatch.' }
          if ([string]$contract.producer.private_key_secret -ne 'PSMATRIX_GA_RECOVERY_PRIVATE_KEY' -or [string]$contract.producer.public_key_secret -ne 'PSMATRIX_GA_RECOVERY_PUBLIC_KEY' -or [bool]$contract.producer.private_key_allowed_in_campaign_job -or [bool]$contract.producer.production_state_mutation_allowed) { throw 'Disaster-recovery secret/state boundary mismatch.' }
          if ([int]$contract.producer.expected_case_count -ne 10 -or -not [bool]$contract.producer.exact_case_set_required -or -not [bool]$contract.producer.all_cases_pass_required) { throw 'Disaster-recovery exact case contract mismatch.' }

          $changed = @((git diff --name-only "$env:OPERATIONS_RELEASE_ANCHOR..$head") | ForEach-Object { $_.Trim().Replace('\','/') } | Where-Object { $_ } | Sort-Object -Unique)
          $allowed = @($contract.control_source.changed_path_allowlist | ForEach-Object { ([string]$_).Replace('\','/') } | Sort-Object -Unique)
          $delta = @(Compare-Object -ReferenceObject $allowed -DifferenceObject $changed)
          if ($delta.Count -ne 0) { throw "Disaster-recovery changed-path closure mismatch: $($delta | Out-String)" }
          if ($changed.Count -ne 4) { throw "Expected exactly four disaster-recovery control paths; observed $($changed.Count)." }
          $runtime = @($changed | Where-Object { $_ -like 'src/psmatrix/*' })
          if ($runtime.Count -ne 0) { throw "Disaster-recovery controls modified runtime source: $($runtime -join ',')" }

          $workflow = Get-Content '.github\workflows\ga-final-disaster-recovery.yml' -Raw
          $campaignJob = $workflow.Split('  sign-recovery-campaign:')[0]
          if ($campaignJob.Contains('PSMATRIX_GA_RECOVERY_PRIVATE_KEY') -or $campaignJob.Contains('PSMATRIX_GA_RECOVERY_PUBLIC_KEY')) { throw 'Unsigned recovery campaign job must not access recovery signing authority.' }
          if ($workflow.Split('secrets.PSMATRIX_GA_RECOVERY_PRIVATE_KEY').Count -ne 2) { throw 'Recovery private key must be referenced exactly once.' }

          $evaluator = Get-Content 'ga-packs\03-authoritative-windows\final-ga-evaluator-control-contract.json' -Raw | ConvertFrom-Json
          $entry = $evaluator.evidence_sources.'disaster-recovery'
          if ([string]$entry.workflow -ne [string]$contract.producer.workflow -or [string]$entry.workflow_path -ne [string]$contract.producer.workflow_path -or [string]$entry.artifact -ne [string]$contract.producer.artifact -or [string]$entry.authority -ne 'recovery') { throw 'Evaluator disaster-recovery identity mismatch.' }
          $gateNames = @($evaluator.required_gates | ForEach-Object { [string]$_ })
          $present = 0
          $missing = @()
          foreach ($gate in $gateNames) {
              $source = $evaluator.evidence_sources.$gate
              $path = [string]$source.workflow_path
              if (Test-Path -LiteralPath $path -PathType Leaf) {
                  $text = Get-Content -LiteralPath $path -Raw
                  if (-not $text.Contains("name: $([string]$source.workflow)")) { throw "Producer workflow identity mismatch: $gate / $path" }
                  $present++
              } else { $missing += $gate }
          }
          if ($present -ne 9) { throw "This recovery layer must expose exactly nine of eleven producer sources; observed $present." }
          $expectedMissing = @('security-review','vulnerability-scan')
          if (@(Compare-Object -ReferenceObject ($expectedMissing | Sort-Object) -DifferenceObject ($missing | Sort-Object)).Count -ne 0) { throw "Unexpected remaining producer gap: $($missing -join ',')" }
          Write-Host "validated_exact_disaster_recovery_producer_head=$head"
          Write-Host 'disaster_recovery_control_changed_paths=4'
          Write-Host 'runtime_source_changes=0'
          Write-Host "evaluator_producer_sources_present=$present"
          Write-Host 'evaluator_producer_sources_required=11'
          Write-Host "evaluator_producer_sources_pending=$($missing -join ',')"

      - name: Compile disaster-recovery producer tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m py_compile tests/test_final_disaster_recovery_evidence_producer.py
          if ($LASTEXITCODE -ne 0) { throw 'Disaster-recovery producer test compile failed.' }
          Write-Host 'disaster_recovery_producer_compile=PASS'

      - name: Run disaster-recovery runtime and inherited GA contracts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m unittest -v `
            tests.test_final_disaster_recovery_evidence_producer `
            tests.test_final_operations_release_evidence_producers `
            tests.test_final_deployment_evidence_producers `
            tests.test_final_ga_evaluator_controls
          if ($LASTEXITCODE -ne 0) { throw 'Disaster-recovery producer source contract suite failed.' }
          Write-Host 'disaster_recovery_producer_source_contract=PASS'

      - name: Parse recovery CLI surfaces without protected signing
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m psmatrix.cli recovery run --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Recovery run CLI parse failed.' }
          python -m psmatrix.cli recovery verify-attestation --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Recovery verify-attestation CLI parse failed.' }
          Write-Host 'disaster_recovery_producer_cli_parse=PASS'

      - name: Scan every tracked source byte for exact PEM private-authority headers
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          import subprocess
          from pathlib import Path
          markers = {
              b"-----BEGIN PRIVATE KEY-----",
              b"-----BEGIN RSA PRIVATE KEY-----",
              b"-----BEGIN EC PRIVATE KEY-----",
              b"-----BEGIN OPENSSH PRIVATE KEY-----",
              b"-----BEGIN ED25519 PRIVATE KEY-----",
          }
          root = Path.cwd().resolve()
          tracked = [line for line in subprocess.check_output(["git", "ls-files"], text=True).splitlines() if line]
          scanned = 0
          total = 0
          for relative in tracked:
              path = root / relative
              if not path.is_file():
                  continue
              scanned += 1
              with path.open("rb") as handle:
                  for raw_line in handle:
                      total += len(raw_line)
                      if raw_line.rstrip(b"\r\n").strip() in markers:
                          raise SystemExit(f"tracked private-key PEM material detected: {relative}")
          print(f"repository_private_authority_absence=PASS tracked_files={scanned} tracked_bytes={total} size_limit_applied=false")
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'Tracked-source private authority scan failed.' }

      - name: Emit disaster-recovery producer preparation summary
        shell: pwsh
        run: |
          Write-Host "validated_exact_disaster_recovery_producer_head=$env:EXPECTED_HEAD"
          Write-Host 'evaluator_producer_sources_present=9'
          Write-Host 'evaluator_producer_sources_required=11'
          Write-Host 'disaster_recovery_producer_executed=false'
          Write-Host 'recovery_authority_provisioned=UNVERIFIED_EXTERNAL'
          Write-Host 'recovery_private_key_read=false'
          Write-Host 'production_state_mutated=false'
          Write-Host 'final_ga_evaluator_invoked=false'
          Write-Host 'ga_eligible=false'
