name: production-ga-authoritative-windows

on:
  workflow_dispatch:
    inputs:
      release_commit:
        description: Full 40-character commit SHA of the release candidate/final release
        required: true
        type: string
      iterations:
        description: Certification runs per Windows PowerShell runtime; Production GA requires at least 10
        required: true
        default: "10"
        type: string
      provision:
        description: Provision/rebuild all three Hyper-V golden images before certification
        required: true
        default: false
        type: boolean

concurrency:
  group: production-ga-authoritative-windows
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  authoritative-windows:
    name: Windows PowerShell 4.0 / 5.0 / 5.1
    runs-on: [self-hosted, Windows, X64, psmatrix-hyperv]
    environment: production-ga-windows-lab
    timeout-minutes: 480
    permissions:
      contents: read
    env:
      PSMATRIX_WINDOWS_GA_ROOT: ${{ vars.PSMATRIX_WINDOWS_GA_ROOT }}

    steps:
      - name: Check out exact release revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1
        with:
          ref: ${{ inputs.release_commit }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up controller Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.2.0
        with:
          python-version: "3.13"

      - name: Verify exact checked-out commit and protected layout
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $releaseCommit = '${{ inputs.release_commit }}'
          if ($releaseCommit -notmatch '^[0-9a-fA-F]{40}$') {
            throw 'release_commit is not a full 40-character SHA.'
          }
          $iterations = 0
          if (-not [int]::TryParse('${{ inputs.iterations }}', [ref]$iterations)) {
            throw 'iterations must be an integer.'
          }
          if ($iterations -lt 10 -or $iterations -gt 100) {
            throw "Production GA iterations must be between 10 and 100; received $iterations."
          }
          $head = (git rev-parse HEAD).Trim().ToLowerInvariant()
          if ($LASTEXITCODE -ne 0 -or $head -ne $releaseCommit.ToLowerInvariant()) {
            throw "Checked out $head instead of the requested release commit."
          }
          if ([string]::IsNullOrWhiteSpace($env:PSMATRIX_WINDOWS_GA_ROOT)) {
            throw 'PSMATRIX_WINDOWS_GA_ROOT protected environment variable is missing.'
          }
          if (-not (Test-Path -LiteralPath $env:PSMATRIX_WINDOWS_GA_ROOT -PathType Container)) {
            throw 'Windows GA root is unavailable on the self-hosted Hyper-V controller.'
          }
          Write-Host "release_commit=$head"
          Write-Host "iterations=$iterations"

      - name: Materialize controller-only signing keys
        shell: pwsh
        env:
          WINDOWS_LAB_PRIVATE_KEY: ${{ secrets.PSMATRIX_WINDOWS_LAB_PRIVATE_KEY }}
          WINDOWS_LAB_PUBLIC_KEY: ${{ secrets.PSMATRIX_WINDOWS_LAB_PUBLIC_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($name in @('WINDOWS_LAB_PRIVATE_KEY','WINDOWS_LAB_PUBLIC_KEY')) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name, 'Process'))) {
              throw "$name is missing."
            }
          }
          $keyRoot = Join-Path $env:RUNNER_TEMP 'psmatrix-windows-ga-keys'
          if (Test-Path -LiteralPath $keyRoot) {
            Remove-Item -LiteralPath $keyRoot -Recurse -Force
          }
          New-Item -ItemType Directory -Path $keyRoot | Out-Null
          $identity = [System.Security.Principal.WindowsIdentity]::GetCurrent().Name
          & icacls.exe $keyRoot /inheritance:r /grant:r "${identity}:(OI)(CI)F" | Out-Null
          if ($LASTEXITCODE -ne 0) {
            throw 'Failed to restrict the controller key directory ACL.'
          }
          $utf8 = [System.Text.UTF8Encoding]::new($false)
          [System.IO.File]::WriteAllText((Join-Path $keyRoot 'windows-lab.private.pem'), $env:WINDOWS_LAB_PRIVATE_KEY.Trim() + "`n", $utf8)
          [System.IO.File]::WriteAllText((Join-Path $keyRoot 'windows-lab.public.pem'), $env:WINDOWS_LAB_PUBLIC_KEY.Trim() + "`n", $utf8)

      - name: Run release-bound authoritative Windows campaign
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $keyRoot = Join-Path $env:RUNNER_TEMP 'psmatrix-windows-ga-keys'
          $output = Join-Path $env:RUNNER_TEMP 'psmatrix-windows-ga-evidence'
          if (Test-Path -LiteralPath $output) {
            Remove-Item -LiteralPath $output -Recurse -Force
          }

          $releaseMediaRoot = Join-Path $env:PSMATRIX_WINDOWS_GA_ROOT 'media\release'
          if (-not (Test-Path -LiteralPath $releaseMediaRoot -PathType Container)) {
            throw "Protected release media root is missing: $releaseMediaRoot"
          }
          $releaseManifests = @(
            Get-ChildItem -LiteralPath $releaseMediaRoot -File -Recurse |
              Where-Object { $_.Name -match '^psmatrix-2\.0\.0(?:rc[0-9]+)?-release\.json$' }
          )
          if ($releaseManifests.Count -ne 1) {
            throw "Expected exactly one 2.0.0/2.0.0rcN release manifest in protected release media; found $($releaseManifests.Count)."
          }
          $releaseManifest = $releaseManifests[0].FullName
          $releaseDir = $releaseManifests[0].Directory.FullName
          $versionMatch = [regex]::Match($releaseManifests[0].BaseName, '^psmatrix-(2\.0\.0(?:rc[0-9]+)?)-release$')
          if (-not $versionMatch.Success) {
            throw 'Protected release manifest version could not be derived.'
          }
          $releaseVersion = $versionMatch.Groups[1].Value
          $expectedReleaseDir = [System.IO.Path]::GetFullPath((Join-Path $releaseMediaRoot $releaseVersion))
          if ([System.IO.Path]::GetFullPath($releaseDir) -ne $expectedReleaseDir) {
            throw "Protected release manifest is outside its canonical version directory: $releaseDir"
          }
          $releasePublicKey = Join-Path $releaseDir "psmatrix-$releaseVersion-release-public.pem"
          $releaseWheel = Join-Path $releaseDir "psmatrix-$releaseVersion-py3-none-any.whl"
          foreach ($path in @($releasePublicKey, $releaseWheel)) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Required protected release bundle file is missing: $path"
            }
          }
          Write-Host "release_manifest=$($releaseManifests[0].Name)"
          Write-Host "release_public_key_source=verified-protected-release-bundle"
          Write-Host "release_public_key_secret_used=false"

          # The exact release checkout is bootstrap verifier/control code only. It must verify the
          # signed protected bundle before the release wheel is installed or executed.
          $trustHome = Join-Path $env:PSMATRIX_WINDOWS_GA_ROOT 'trust-home'
          $bootstrapRoot = Join-Path $env:RUNNER_TEMP 'psmatrix-windows-ga-bootstrap'
          if (Test-Path -LiteralPath $bootstrapRoot) {
            Remove-Item -LiteralPath $bootstrapRoot -Recurse -Force
          }
          New-Item -ItemType Directory -Path $bootstrapRoot | Out-Null
          $bootstrapBinding = Join-Path $bootstrapRoot 'windows-release-binding.json'
          $checkoutSource = Join-Path $env:GITHUB_WORKSPACE 'src'
          $previousPythonPath = $env:PYTHONPATH
          Push-Location $env:RUNNER_TEMP
          try {
            $env:PYTHONPATH = $checkoutSource
            & python -m psmatrix `
              --home $trustHome `
              lab release-binding `
              --release-manifest $releaseManifest `
              --artifact-dir $releaseDir `
              --release-public-key $releasePublicKey `
              --release-commit '${{ inputs.release_commit }}' `
              --output $bootstrapBinding
            $bootstrapExit = $LASTEXITCODE
          }
          finally {
            $env:PYTHONPATH = $previousPythonPath
            Pop-Location
          }
          if ($bootstrapExit -ne 0) {
            throw "Checkout bootstrap release verification failed with exit code $bootstrapExit."
          }
          if (-not (Test-Path -LiteralPath $bootstrapBinding -PathType Leaf)) {
            throw 'Checkout bootstrap release verification did not produce a release binding.'
          }
          $bootstrap = Get-Content -LiteralPath $bootstrapBinding -Raw | ConvertFrom-Json
          if ([string]$bootstrap.release_version -ne $releaseVersion) {
            throw "Bootstrap release version $($bootstrap.release_version) does not match protected bundle version $releaseVersion."
          }
          if ([string]$bootstrap.release_commit -ne '${{ inputs.release_commit }}'.ToLowerInvariant()) {
            throw 'Bootstrap release binding did not preserve the exact requested release commit.'
          }
          Write-Host 'release_bundle_bootstrap_verified=true'

          # Build a hybrid campaign root: operational fixtures remain from the exact release
          # checkout, while every `python -m psmatrix` product command resolves from the exact
          # signed wheel installed offline with no index and no dependency resolution.
          $campaignRoot = Join-Path $env:RUNNER_TEMP 'psmatrix-authoritative-campaign'
          if (Test-Path -LiteralPath $campaignRoot) {
            Remove-Item -LiteralPath $campaignRoot -Recurse -Force
          }
          $campaignSrc = Join-Path $campaignRoot 'src'
          $campaignFixtureParent = Join-Path $campaignRoot 'fixtures'
          New-Item -ItemType Directory -Path $campaignSrc -Force | Out-Null
          New-Item -ItemType Directory -Path $campaignFixtureParent -Force | Out-Null
          $checkoutFixtures = Join-Path $env:GITHUB_WORKSPACE 'fixtures\windows-authoritative'
          if (-not (Test-Path -LiteralPath $checkoutFixtures -PathType Container)) {
            throw "Authoritative fixture root is missing from the exact checkout: $checkoutFixtures"
          }
          Copy-Item -LiteralPath $checkoutFixtures -Destination (Join-Path $campaignFixtureParent 'windows-authoritative') -Recurse -Force

          & python -m pip install `
            --disable-pip-version-check `
            --no-index `
            --no-deps `
            --target $campaignSrc `
            $releaseWheel
          if ($LASTEXITCODE -ne 0) {
            throw "Offline exact release wheel installation failed with exit code $LASTEXITCODE."
          }

          $previousPythonPath = $env:PYTHONPATH
          Push-Location $env:RUNNER_TEMP
          try {
            $env:PYTHONPATH = $campaignSrc
            $packageOrigin = (& python -c 'import pathlib, psmatrix; print(pathlib.Path(psmatrix.__file__).resolve())' 2>&1 | Out-String).Trim()
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to resolve installed PSMatrix package origin.`n$packageOrigin"
            }
            $installedVersion = (& python -c 'import importlib.metadata; print(importlib.metadata.version("psmatrix"))' 2>&1 | Out-String).Trim()
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to resolve installed PSMatrix distribution version.`n$installedVersion"
            }
          }
          finally {
            $env:PYTHONPATH = $previousPythonPath
            Pop-Location
          }
          $campaignSrcFull = [System.IO.Path]::GetFullPath($campaignSrc)
          $packageOriginFull = [System.IO.Path]::GetFullPath($packageOrigin)
          $campaignPrefix = $campaignSrcFull + [System.IO.Path]::DirectorySeparatorChar
          if (-not $packageOriginFull.StartsWith($campaignPrefix, [System.StringComparison]::OrdinalIgnoreCase)) {
            throw "PSMatrix import escaped the isolated exact-wheel target: $packageOriginFull"
          }
          $checkoutSourceFull = [System.IO.Path]::GetFullPath($checkoutSource) + [System.IO.Path]::DirectorySeparatorChar
          if ($packageOriginFull.StartsWith($checkoutSourceFull, [System.StringComparison]::OrdinalIgnoreCase)) {
            throw "PSMatrix campaign would execute checkout source instead of the verified wheel: $packageOriginFull"
          }
          if ($installedVersion -ne $releaseVersion) {
            throw "Installed wheel version $installedVersion does not match protected release version $releaseVersion."
          }
          Write-Host "controller_package_origin=$packageOriginFull"
          Write-Host "controller_package_version=$installedVersion"
          Write-Host 'controller_exact_release_wheel=true'
          Write-Host 'controller_wheel_install_mode=offline-no-index-no-deps'

          $params = @{
            SourceRoot = $campaignRoot
            ReleaseCommit = '${{ inputs.release_commit }}'
            ReleaseManifest = $releaseManifest
            ReleaseArtifactDir = $releaseDir
            ReleasePublicKey = $releasePublicKey
            LabPrivateKey = (Join-Path $keyRoot 'windows-lab.private.pem')
            LabPublicKey = (Join-Path $keyRoot 'windows-lab.public.pem')
            TrustHome = $trustHome
            ConfigRoot = (Join-Path $env:PSMATRIX_WINDOWS_GA_ROOT 'config')
            OutputDir = $output
            Iterations = [int]'${{ inputs.iterations }}'
          }
          if ('${{ inputs.provision }}' -eq 'true') {
            $params.Provision = $true
          }
          & "$env:GITHUB_WORKSPACE\scripts\ga\Invoke-PSMatrixAuthoritativeWindowsGA.ps1" @params
          if ($LASTEXITCODE -ne 0) {
            throw "Authoritative Windows operator exited with code $LASTEXITCODE."
          }

      - name: Remove controller authority keys
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $keyRoot = Join-Path $env:RUNNER_TEMP 'psmatrix-windows-ga-keys'
          if (Test-Path -LiteralPath $keyRoot) {
            Get-ChildItem -LiteralPath $keyRoot -File -ErrorAction SilentlyContinue | ForEach-Object {
              try {
                $length = [int64]$_.Length
                if ($length -gt 0) {
                  $zero = New-Object byte[] $length
                  $stream = [System.IO.File]::Open($_.FullName, 'Open', 'Write', 'None')
                  try {
                    $stream.Write($zero, 0, $zero.Length)
                    $stream.Flush()
                  }
                  finally {
                    $stream.Dispose()
                  }
                }
              }
              catch {}
            }
            Remove-Item -LiteralPath $keyRoot -Recurse -Force -ErrorAction SilentlyContinue
          }

      - name: Upload authoritative Windows evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: production-ga-authoritative-windows
          path: ${{ runner.temp }}\psmatrix-windows-ga-evidence
          if-no-files-found: error
          retention-days: 30