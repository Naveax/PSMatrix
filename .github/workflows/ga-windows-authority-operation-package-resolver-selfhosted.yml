name: production-ga-windows-authority-operation-package-resolver-selfhosted

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/ga-windows-authority-operation-package-resolver-selfhosted.yml"
  workflow_dispatch:

concurrency:
  group: production-ga-windows-authority-operation-package-resolver-selfhosted
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  resolve:
    name: Resolve current RC3 operation package without mutation
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository && github.actor == 'Naveax')
    runs-on: [self-hosted, Windows, X64, psmatrix-hyperv]
    timeout-minutes: 10
    environment: production-ga-windows-lab
    env:
      RELEASE_COMMIT: 34e87c60885001f8dd11744b8bf194a59e51bd1f

    steps:
      - name: Verify trusted runner assignment
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_OS -ne 'Windows' -or $env:RUNNER_NAME -ne 'NAVEAX') {
              throw "Expected trusted NAVEAX Windows runner; got $env:RUNNER_NAME / $env:RUNNER_OS"
          }
          Write-Host 'resolver_runner_assignment=PASS'

      - name: Check out exact resolver controls
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Resolve uniquely current operation package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version 2.0

          function Get-Sha256 {
              param([Parameter(Mandatory = $true)][string]$Path)
              return (Get-FileHash -LiteralPath $Path -Algorithm SHA256 -ErrorAction Stop).Hash.ToLowerInvariant()
          }

          $gaRootSource = 'runner-environment'
          $gaRootValue = [string]$env:PSMATRIX_WINDOWS_GA_ROOT
          if ([string]::IsNullOrWhiteSpace($gaRootValue)) {
              if ([string]::IsNullOrWhiteSpace($env:ProgramData)) {
                  throw 'ProgramData is unavailable; canonical GA layout root cannot be resolved.'
              }
              $gaRootSource = 'canonical-layout-default'
              $gaRootValue = Join-Path $env:ProgramData 'PSMatrix\ProductionGA'
          }
          if (-not [System.IO.Path]::IsPathRooted($gaRootValue)) {
              throw 'Resolved Windows GA root must be absolute.'
          }
          $gaRoot = [System.IO.Path]::GetFullPath($gaRootValue)
          if (-not (Test-Path -LiteralPath $gaRoot -PathType Container)) {
              throw "Resolved Windows GA root does not exist (source=$gaRootSource)."
          }
          Write-Host "ga_root_source=$gaRootSource"

          $mediaPath = Join-Path $gaRoot 'config\windows-lab-media.json'
          $selectionPath = Join-Path $gaRoot 'config\windows-authority-media-selection.json'
          $materializationPath = Join-Path $gaRoot 'windows-authority-provisioning-manifest-materialization.json'
          $canonicalPath = Join-Path $gaRoot 'windows-authority-media-inventory.canonical.json'
          foreach ($path in @($mediaPath, $selectionPath, $materializationPath, $canonicalPath)) {
              if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
                  throw "A required current RC3 binding input is missing (source=$gaRootSource)."
              }
          }

          $media = Get-Content -LiteralPath $mediaPath -Raw | ConvertFrom-Json
          $selection = Get-Content -LiteralPath $selectionPath -Raw | ConvertFrom-Json
          $materialization = Get-Content -LiteralPath $materializationPath -Raw | ConvertFrom-Json
          $canonical = Get-Content -LiteralPath $canonicalPath -Raw | ConvertFrom-Json

          if ([string]$media.kind -ne 'psmatrix.windows-lab-media' -or
              [string]$media.release_version -ne '2.0.0rc3' -or
              [string]$media.release_commit -ne $env:RELEASE_COMMIT -or
              [bool]$media.complete -ne $true -or
              [bool]$media.ready_for_hyper_v_provisioning -ne $true -or
              [bool]$media.authoritative -or [bool]$media.ga_eligible) {
              throw 'Current Windows lab media manifest is not the expected non-authoritative RC3 provisioning manifest.'
          }
          if ([string]$selection.kind -ne 'psmatrix.windows-authority-media-selection-materialization' -or
              [string]$selection.release_version -ne '2.0.0rc3' -or
              [bool]$selection.complete -ne $true -or
              [bool]$selection.authoritative -or [bool]$selection.ga_eligible) {
              throw 'Current reviewed media selection is invalid.'
          }
          if ([string]$materialization.kind -ne 'psmatrix.windows-authority-provisioning-manifest-materialization' -or
              [string]$materialization.status -ne 'PASS' -or
              [string]$materialization.release_commit -ne $env:RELEASE_COMMIT -or
              [string]$materialization.product_loader_validation -ne 'PASS' -or
              [string]$materialization.operation_package_handoff_validation -ne 'PASS' -or
              [bool]$materialization.authoritative -or [bool]$materialization.ga_eligible) {
              throw 'Current provisioning-manifest materialization report is invalid.'
          }
          if ([string]$canonical.canonicalization.release_authority_status -ne 'READY' -or
              [string]$canonical.canonicalization.release_version -ne '2.0.0rc3' -or
              [bool]$canonical.authoritative -or [bool]$canonical.ga_eligible) {
              throw 'Current canonical RC3 inventory is invalid.'
          }

          $profilePath = [System.IO.Path]::GetFullPath([string]$materialization.profile_path)
          $gaPrefix = $gaRoot.TrimEnd('\') + '\'
          if (-not $profilePath.StartsWith($gaPrefix, [System.StringComparison]::OrdinalIgnoreCase) -or
              -not (Test-Path -LiteralPath $profilePath -PathType Leaf)) {
              throw 'Provisioning profile is missing or escapes the protected GA root.'
          }

          $current = [ordered]@{
              provisioning_manifest_sha256 = Get-Sha256 -Path $mediaPath
              selection_sha256 = Get-Sha256 -Path $selectionPath
              profile_sha256 = Get-Sha256 -Path $profilePath
              materialization_report_sha256 = Get-Sha256 -Path $materializationPath
              canonical_inventory_sha256 = Get-Sha256 -Path $canonicalPath
          }

          $operationRoot = Join-Path $gaRoot 'operation\2.0.0rc3'
          $evidenceRoot = Join-Path $env:RUNNER_TEMP 'psmatrix-operation-package-resolution'
          if (Test-Path -LiteralPath $evidenceRoot) {
              Remove-Item -LiteralPath $evidenceRoot -Recurse -Force
          }
          New-Item -ItemType Directory -Path $evidenceRoot -Force | Out-Null
          $resultPath = Join-Path $evidenceRoot 'operation-package-resolution.json'

          $eligible = @()
          $scanned = 0
          if (Test-Path -LiteralPath $operationRoot -PathType Container) {
              foreach ($directory in @(Get-ChildItem -LiteralPath $operationRoot -Directory -ErrorAction Stop | Sort-Object Name)) {
                  if ($directory.Name -notmatch '^run-([0-9]+)-attempt-([0-9]+)$') {
                      continue
                  }
                  $scanned += 1
                  $runId = [int64]$Matches[1]
                  $runAttempt = [int]$Matches[2]
                  $metadataPath = Join-Path $directory.FullName 'psmatrix-2.0.0rc3-windows-authoritative-operation-package.json'
                  if (-not (Test-Path -LiteralPath $metadataPath -PathType Leaf)) {
                      continue
                  }

                  try {
                      $metadata = Get-Content -LiteralPath $metadataPath -Raw | ConvertFrom-Json
                      if ([string]$metadata.kind -ne 'psmatrix.windows-authoritative-operation-package' -or
                          [string]$metadata.status -ne 'READY_FOR_WINDOWS_HOST' -or
                          [string]$metadata.release_version -ne '2.0.0rc3' -or
                          [string]$metadata.release_commit -ne $env:RELEASE_COMMIT -or
                          [bool]$metadata.deterministic_zip -ne $true -or
                          [string]$metadata.private_key_scan -ne 'PASS' -or
                          [bool]$metadata.stale_rc2_operation_package_used -or
                          [bool]$metadata.authoritative_campaign_executed -or
                          [bool]$metadata.authoritative -or [bool]$metadata.ga_eligible) {
                          continue
                      }

                      $provisioning = $metadata.provisioning_manifest
                      if ([string]$provisioning.kind -ne 'psmatrix.windows-lab-media' -or
                          [string]$provisioning.sha256 -ne $current.provisioning_manifest_sha256 -or
                          [string]$provisioning.selection_sha256 -ne $current.selection_sha256 -or
                          [string]$provisioning.profile_sha256 -ne $current.profile_sha256 -or
                          [string]$provisioning.materialization_report_sha256 -ne $current.materialization_report_sha256 -or
                          [string]$provisioning.canonical_inventory_sha256 -ne $current.canonical_inventory_sha256 -or
                          [string]$provisioning.product_loader_validation -ne 'PASS' -or
                          [string]$provisioning.operation_package_handoff_validation -ne 'PASS') {
                          continue
                      }

                      $releaseBinding = $metadata.release_binding
                      if ([bool]$releaseBinding.valid -ne $true -or
                          [string]$releaseBinding.windows_lab_media_sha256 -ne $current.provisioning_manifest_sha256 -or
                          [string]$releaseBinding.windows_authority_media_selection_sha256 -ne $current.selection_sha256 -or
                          [string]$releaseBinding.provisioning_profile_sha256 -ne $current.profile_sha256 -or
                          [string]$releaseBinding.provisioning_materialization_report_sha256 -ne $current.materialization_report_sha256 -or
                          [string]$releaseBinding.canonical_inventory_sha256 -ne $current.canonical_inventory_sha256) {
                          continue
                      }

                      $freshBindingPath = Join-Path $evidenceRoot ('binding-run-{0}-attempt-{1}.json' -f $runId, $runAttempt)
                      & "$env:GITHUB_WORKSPACE\scripts\ga\Test-PSMatrixWindowsAuthorityOperationPackageBinding.ps1" `
                          -SourceRoot $env:GITHUB_WORKSPACE `
                          -GaRoot $gaRoot `
                          -CanonicalInventoryPath $canonicalPath `
                          -OperationPackageMetadataPath $metadataPath `
                          -OutputPath $freshBindingPath | Out-Null
                      $fresh = Get-Content -LiteralPath $freshBindingPath -Raw | ConvertFrom-Json
                      if ([string]$fresh.status -ne 'PASS' -or
                          [bool]$fresh.ready_for_release_artifact_recovery -ne $true -or
                          [bool]$fresh.operation_package.release_binding_valid -ne $true -or
                          [bool]$fresh.operation_package.release_manifest_matches_canonical -ne $true -or
                          [bool]$fresh.operation_package.zip_sha256_matches_metadata -ne $true -or
                          [bool]$fresh.operation_package.zip_size_matches_metadata -ne $true -or
                          [bool]$fresh.operation_package.embedded_release_artifacts_match_binding -ne $true -or
                          [bool]$fresh.authoritative -or [bool]$fresh.ga_eligible) {
                          continue
                      }

                      $eligible += [pscustomobject][ordered]@{
                          run_id = $runId
                          run_attempt = $runAttempt
                          operation_zip_sha256 = [string]$metadata.artifact.sha256
                          release_binding_sha256 = [string]$metadata.release_binding.binding_sha256
                          provisioning_manifest_sha256 = [string]$metadata.provisioning_manifest.sha256
                      }
                  }
                  catch {
                      continue
                  }
              }
          }

          $status = if ($eligible.Count -eq 1) { 'PASS' } elseif ($eligible.Count -eq 0) { 'NO_MATCH' } else { 'AMBIGUOUS' }
          $sanitized = [ordered]@{
              schema = 1
              kind = 'psmatrix.windows-authority-operation-package-resolution'
              status = $status
              ga_root_source = $gaRootSource
              release_version = '2.0.0rc3'
              release_commit = $env:RELEASE_COMMIT
              scanned_run_directories = $scanned
              eligible_count = $eligible.Count
              current_provisioning_manifest_sha256 = $current.provisioning_manifest_sha256
              candidates = @($eligible)
              reads_private_key_contents = $false
              opens_secret_bundles = $false
              downloads_files = $false
              writes_ga_root = $false
              creates_virtual_machines = $false
              creates_checkpoints = $false
              authoritative = $false
              ga_eligible = $false
          }
          [System.IO.File]::WriteAllText(
              $resultPath,
              (($sanitized | ConvertTo-Json -Depth 8) + [Environment]::NewLine),
              [System.Text.UTF8Encoding]::new($false)
          )

          Write-Host "operation_package_resolution=$status"
          Write-Host "operation_package_ga_root_source=$gaRootSource"
          Write-Host "operation_package_scanned_runs=$scanned"
          Write-Host "operation_package_eligible_count=$($eligible.Count)"
          foreach ($candidate in $eligible) {
              Write-Host "eligible_operation_run_id=$($candidate.run_id) attempt=$($candidate.run_attempt) zip_sha256=$($candidate.operation_zip_sha256)"
          }
          if ($eligible.Count -ne 1) {
              throw "Expected exactly one current RC3 operation package; found $($eligible.Count)."
          }
          Write-Host "operation_run_id=$($eligible[0].run_id)"
          Write-Host "operation_run_attempt=$($eligible[0].run_attempt)"
          Write-Host "operation_provisioning_manifest_sha256=$($eligible[0].provisioning_manifest_sha256)"

      - name: Upload sanitized resolver evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-authority-rc3-operation-package-resolution
          path: ${{ runner.temp }}/psmatrix-operation-package-resolution/operation-package-resolution.json
          if-no-files-found: warn
          retention-days: 14
