name: production-ga-final-execution-control-source-preflight

on:
  workflow_dispatch:
  push:
    branches: ["final/2.0.0-execution-control-integration-v2"]
    paths:
      - ".github/workflows/ga-final-execution-control-source-preflight.yml"
      - "ga-packs/03-authoritative-windows/final-execution-control-contract.json"
      - "scripts/ga/validate_final_execution_control.py"
      - "tests/test_final_execution_control_contract.py"
  pull_request:
    branches: ["final/2.0.0-production-readiness-controls-v2"]
    paths:
      - ".github/workflows/ga-final-execution-control-source-preflight.yml"
      - "ga-packs/03-authoritative-windows/final-execution-control-contract.json"
      - "scripts/ga/validate_final_execution_control.py"
      - "tests/test_final_execution_control_contract.py"

concurrency:
  group: production-ga-final-execution-control-source-preflight-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  final-execution-control-source-preflight:
    runs-on: [self-hosted, Windows, X64, psmatrix-hyperv]
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      PYTHONPATH: ${{ github.workspace }}\src
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      READINESS_SOURCE_HEAD: 0edec50fe20c68b61b87d1d253cff1feefafd8b1
      PRODUCER_SOURCE_ANCHOR: 89372d9432433237abdf677900093b399c4d0868
      FINAL_RELEASE_COMMIT: 02cef95d40cf524ce00f9d917188343dc49e6f2c

    steps:
      - name: Verify trusted NAVEAX source runner
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_OS -ne 'Windows' -or $env:RUNNER_NAME -ne 'NAVEAX') { throw "Expected NAVEAX Windows runner; got $env:RUNNER_NAME / $env:RUNNER_OS" }
          Write-Host 'final_execution_control_source_runner=PASS'

      - name: Check out exact execution-control source with full history
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact four-path control closure and ancestry
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $head = (git rev-parse HEAD).Trim().ToLowerInvariant()
          if ($env:EXPECTED_HEAD -cnotmatch '^[0-9a-f]{40}$' -or $head -ne $env:EXPECTED_HEAD.ToLowerInvariant()) { throw "Exact execution-control head mismatch: $head / $env:EXPECTED_HEAD" }
          if (-not [string]::IsNullOrWhiteSpace((git status --porcelain))) { throw 'Execution-control source checkout is dirty.' }
          foreach ($sha in @($env:READINESS_SOURCE_HEAD,$env:PRODUCER_SOURCE_ANCHOR,$env:FINAL_RELEASE_COMMIT)) {
              git cat-file -e "$sha^{commit}"
              if ($LASTEXITCODE -ne 0) { throw "Frozen source commit is unavailable: $sha" }
          }
          git merge-base --is-ancestor $env:READINESS_SOURCE_HEAD $head
          if ($LASTEXITCODE -ne 0) { throw 'Readiness source head is not an ancestor of execution-control head.' }
          git merge-base --is-ancestor $env:PRODUCER_SOURCE_ANCHOR $head
          if ($LASTEXITCODE -ne 0) { throw 'Eleven-producer source anchor is not an ancestor of execution-control head.' }
          $contract = Get-Content 'ga-packs\03-authoritative-windows\final-execution-control-contract.json' -Raw | ConvertFrom-Json
          if ([int]$contract.schema -ne 1 -or [string]$contract.kind -ne 'psmatrix.final-execution-control-contract' -or [string]$contract.version -ne '2.0.0') { throw 'Execution-control contract identity mismatch.' }
          if ([string]$contract.readiness_source_head -ne $env:READINESS_SOURCE_HEAD -or [string]$contract.producer_source_anchor -ne $env:PRODUCER_SOURCE_ANCHOR -or [string]$contract.final_release_commit -ne $env:FINAL_RELEASE_COMMIT) { throw 'Execution-control frozen source identity mismatch.' }
          if ([bool]$contract.control_source.runtime_source_changes_allowed) { throw 'Execution-control layer must not modify runtime source.' }
          $changed = @((git diff --name-only "$env:READINESS_SOURCE_HEAD..$head") | ForEach-Object { $_.Trim().Replace('\','/') } | Where-Object { $_ } | Sort-Object -Unique)
          $allowed = @($contract.control_source.changed_path_allowlist | ForEach-Object { ([string]$_).Replace('\','/') } | Sort-Object -Unique)
          if (@(Compare-Object -ReferenceObject $allowed -DifferenceObject $changed).Count -ne 0) { throw "Execution-control changed-path closure mismatch. changed=$($changed -join ',')" }
          if ($changed.Count -ne 4) { throw "Expected exactly four execution-control paths; observed $($changed.Count)." }
          if (@($changed | Where-Object { $_ -like 'src/psmatrix/*' }).Count -ne 0) { throw 'Execution-control layer modified runtime source.' }
          Write-Host "validated_exact_execution_control_head=$head"
          Write-Host 'execution_control_changed_paths=4'
          Write-Host 'runtime_source_changes=0'

      - name: Compile execution-control source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m py_compile scripts/ga/validate_final_execution_control.py tests/test_final_execution_control_contract.py
          if ($LASTEXITCODE -ne 0) { throw 'Execution-control Python compile failed.' }
          Write-Host 'final_execution_control_compile=PASS'

      - name: Validate exact execution-control mapping
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python scripts/ga/validate_final_execution_control.py --repo-root . --output "$env:RUNNER_TEMP\final-execution-control-validation.json"
          if ($LASTEXITCODE -ne 0) { throw 'Final execution-control validator failed.' }
          Write-Host 'final_execution_control_validator=PASS'

      - name: Run execution-control and inherited final contract suites
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m unittest -v tests.test_final_execution_control_contract tests.test_final_production_readiness_controls tests.test_final_security_vulnerability_evidence_producers tests.test_final_ga_evaluator_controls
          if ($LASTEXITCODE -ne 0) { throw 'Final execution-control contract suite failed.' }
          Write-Host 'final_execution_control_contract_suite=PASS'

      - name: Scan tracked source for private authority material
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          import subprocess
          from pathlib import Path
          markers = {b"-----BEGIN PRIVATE KEY-----",b"-----BEGIN RSA PRIVATE KEY-----",b"-----BEGIN EC PRIVATE KEY-----",b"-----BEGIN OPENSSH PRIVATE KEY-----",b"-----BEGIN ED25519 PRIVATE KEY-----"}
          root = Path.cwd().resolve()
          tracked = [line for line in subprocess.check_output(["git", "ls-files"], text=True).splitlines() if line]
          scanned = 0
          total = 0
          for relative in tracked:
              path = root / relative
              if not path.is_file(): continue
              scanned += 1
              with path.open("rb") as handle:
                  for raw_line in handle:
                      total += len(raw_line)
                      if raw_line.rstrip(b"\r\n").strip() in markers:
                          raise SystemExit(f"tracked private-key PEM material detected: {relative}")
          print(f"repository_private_authority_absence=PASS tracked_files={scanned} tracked_bytes={total} size_limit_applied=false")
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'Tracked-source private authority scan failed.' }

      - name: Emit execution-control source preparation summary
        shell: pwsh
        run: |
          Write-Host "validated_exact_execution_control_head=$env:EXPECTED_HEAD"
          Write-Host 'required_gates=11'
          Write-Host 'required_environments=12'
          Write-Host 'required_authority_roles=8'
          Write-Host 'execution_stages=15'
          Write-Host 'auxiliary_workflows=2'
          Write-Host 'readiness_source_preflight_observed_success=false'
          Write-Host 'production_readiness_executed=false'
          Write-Host 'production_evidence_runs_complete=false'
          Write-Host 'production_evaluator_ready=false'
          Write-Host 'final_ga_evaluator_invoked=false'
          Write-Host 'final_ga_attestation_verified=false'
          Write-Host 'ga_eligible=false'
