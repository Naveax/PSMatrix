name: production-ga-windows-authority-rc4-staging-candidate-selfhosted

on:
  workflow_dispatch:
    inputs:
      release_commit:
        description: Exact reviewed PSMatrix 2.0.0rc4 candidate commit
        required: true
        type: string

concurrency:
  group: production-ga-windows-authority-rc4-staging-candidate-selfhosted
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  stage-rc4-candidate:
    name: Build deterministic unsigned RC4 staging candidate on NAVEAX
    runs-on: [self-hosted, Windows, X64, psmatrix-hyperv]
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      RELEASE_COMMIT: ${{ inputs.release_commit }}

    steps:
      - name: Initialize isolated RC4 staging runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:RUNNER_TEMP)) { throw 'RUNNER_TEMP is unavailable.' }
          if ($env:RELEASE_COMMIT -cnotmatch '^[0-9a-f]{40}$') { throw 'release_commit must contain exactly 40 lowercase hexadecimal characters.' }
          $stage = Join-Path $env:RUNNER_TEMP 'psmatrix-windows-authority-rc4-staging-candidate'
          $venv = Join-Path $env:RUNNER_TEMP 'psmatrix-windows-authority-rc4-build-venv'
          "PSMATRIX_RC4_STAGE=$stage" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PSMATRIX_RC4_VENV=$venv" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Check out exact RC4 candidate source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ inputs.release_commit }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Verify trusted runner and exact clean candidate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_OS -ne 'Windows' -or $env:RUNNER_NAME -ne 'NAVEAX') {
              throw "Expected NAVEAX Windows runner; got $env:RUNNER_NAME / $env:RUNNER_OS"
          }
          $actual = (git rev-parse HEAD).Trim().ToLowerInvariant()
          if ($LASTEXITCODE -ne 0 -or $actual -ne $env:RELEASE_COMMIT) {
              throw "Exact RC4 candidate checkout mismatch: $actual"
          }
          if (-not [string]::IsNullOrWhiteSpace((git status --porcelain))) {
              throw 'RC4 candidate checkout is not clean.'
          }
          $projectVersion = python -c "import tomllib, pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text(encoding='utf-8'))['project']['version'])"
          $packageVersion = python -c "import sys; sys.path.insert(0, 'src'); import psmatrix; print(psmatrix.__version__)"
          if ($projectVersion.Trim() -ne '2.0.0rc4' -or $packageVersion.Trim() -ne '2.0.0rc4') {
              throw "RC4 version identity mismatch: project=$projectVersion package=$packageVersion"
          }
          if (Test-Path -LiteralPath $env:PSMATRIX_RC4_VENV) { Remove-Item -LiteralPath $env:PSMATRIX_RC4_VENV -Recurse -Force }
          python -m venv $env:PSMATRIX_RC4_VENV
          if ($LASTEXITCODE -ne 0) { throw 'Isolated RC4 Python venv creation failed.' }
          $python = Join-Path $env:PSMATRIX_RC4_VENV 'Scripts\python.exe'
          if (-not (Test-Path -LiteralPath $python -PathType Leaf)) { throw 'Isolated RC4 Python executable is missing.' }
          "PSMATRIX_RC4_PYTHON=$python" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Lock non-secret build backend
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & $env:PSMATRIX_RC4_PYTHON -m pip install --disable-pip-version-check --no-input "pip==26.1.2" "setuptools==83.0.0"
          if ($LASTEXITCODE -ne 0) { throw 'Locked RC4 build backend installation failed.' }

      - name: Deterministically build unsigned RC4 staging candidate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (Test-Path -LiteralPath $env:PSMATRIX_RC4_STAGE) { Remove-Item -LiteralPath $env:PSMATRIX_RC4_STAGE -Recurse -Force }
          & $env:PSMATRIX_RC4_PYTHON `
            (Join-Path $env:GITHUB_WORKSPACE 'scripts\ga\build_windows_authority_release_candidate.py') `
            --expected-head $env:RELEASE_COMMIT `
            --output-root $env:PSMATRIX_RC4_STAGE
          if ($LASTEXITCODE -ne 0) { throw 'Deterministic RC4 staging candidate build failed.' }

      - name: Enforce pre-lock RC4 staging boundary
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $reportPath = Join-Path $env:PSMATRIX_RC4_STAGE 'psmatrix-2.0.0rc4-windows-authority-staging.json'
          if (-not (Test-Path -LiteralPath $reportPath -PathType Leaf)) { throw 'RC4 staging report is missing.' }
          $report = Get-Content -LiteralPath $reportPath -Raw | ConvertFrom-Json
          if ([string]$report.kind -ne 'psmatrix.windows-authority-release-candidate-staging') { throw 'RC4 staging report kind mismatch.' }
          if ([string]$report.status -ne 'READY_FOR_PROTECTED_SIGNING') { throw 'RC4 staging report status mismatch.' }
          if ([string]$report.version -ne '2.0.0rc4' -or [string]$report.release_commit -ne $env:RELEASE_COMMIT) { throw 'RC4 staging report identity mismatch.' }
          if (@($report.artifacts).Count -ne 6) { throw "Expected exactly six RC4 release artifacts; found $(@($report.artifacts).Count)." }
          foreach ($field in @('private_key_read','signed_release_manifest_written','downloads_files','extracts_existing_operation_package','authoritative','ga_eligible')) {
              if ([bool]$report.$field) { throw "Unsafe RC4 pre-lock staging field is true: $field" }
          }
          foreach ($entry in $report.reproducibility.PSObject.Properties) {
              if ([bool]$entry.Value.reproducible -ne $true) { throw "RC4 reproducibility failed: $($entry.Name)" }
          }
          foreach ($entry in $report.verification.PSObject.Properties) {
              if ([bool]$entry.Value.valid -ne $true) { throw "RC4 package verification failed: $($entry.Name)" }
          }
          $privateMarkers = @('-----BEGIN PRIVATE KEY-----','-----BEGIN RSA PRIVATE KEY-----','-----BEGIN EC PRIVATE KEY-----','-----BEGIN OPENSSH PRIVATE KEY-----')
          foreach ($file in Get-ChildItem -LiteralPath $env:PSMATRIX_RC4_STAGE -Recurse -File) {
              if ($file.Length -gt 1048576) { continue }
              $text = [System.Text.Encoding]::UTF8.GetString([System.IO.File]::ReadAllBytes($file.FullName))
              foreach ($marker in $privateMarkers) {
                  if ($text.Contains($marker)) { throw "Private-key material found in RC4 staging output: $($file.Name)" }
              }
          }
          Write-Host 'rc4_unsigned_prelock_staging=PASS'
          Write-Host 'release_lock_written=false'
          Write-Host 'release_artifacts_signed=false'

      - name: Upload unsigned RC4 staging candidate for review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-authority-rc4-unlocked-staging-candidate
          path: ${{ env.PSMATRIX_RC4_STAGE }}
          if-no-files-found: error
          retention-days: 30

      - name: Remove isolated RC4 build environment
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          if (Test-Path -LiteralPath $env:PSMATRIX_RC4_VENV) { Remove-Item -LiteralPath $env:PSMATRIX_RC4_VENV -Recurse -Force -ErrorAction SilentlyContinue }
