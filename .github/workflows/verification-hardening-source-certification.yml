name: verification-hardening-source-certification

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/ga/**'
      - 'tests/_verification_hardening_source_certification_base.py'
      - 'tests/test_final_repository_private_material_scan_certification.py'
      - 'tests/test_powershell_source_parse_*.py'
      - 'tests/test_repository_private_material_*.py'
      - 'tests/test_repository_workflow_action_policy.py'
      - 'tests/test_verification_hardening_*.py'
      - '.github/workflows/ga-repository-private-material-scan.yml'
      - '.github/workflows/powershell-source-parse-diagnostic.yml'
      - '.github/workflows/verification-hardening-source-certification.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/ga/**'
      - 'tests/_verification_hardening_source_certification_base.py'
      - 'tests/test_final_repository_private_material_scan_certification.py'
      - 'tests/test_powershell_source_parse_*.py'
      - 'tests/test_repository_private_material_*.py'
      - 'tests/test_repository_workflow_action_policy.py'
      - 'tests/test_verification_hardening_*.py'
      - '.github/workflows/ga-repository-private-material-scan.yml'
      - '.github/workflows/powershell-source-parse-diagnostic.yml'
      - '.github/workflows/verification-hardening-source-certification.yml'

concurrency:
  group: verification-hardening-source-certification-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  certify-maintenance-hardening:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact revision with publication ancestry
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify hardening workflow action lock
        run: >-
          python scripts/ga/verify_verification_hardening_action_lock.py
          --root .

      - name: Verify hardening workflow privilege policy
        run: >-
          python scripts/ga/verify_verification_hardening_workflow_policy.py
          --root .

      - name: Verify hardening checkout policy
        run: >-
          python scripts/ga/verify_verification_hardening_checkout_policy.py
          --root .

      - name: Verify hardening event-head policy
        run: >-
          python scripts/ga/verify_verification_hardening_event_head_policy.py
          --root .

      - name: Verify repository-wide workflow action policy
        run: >-
          python scripts/ga/verify_repository_workflow_action_policy.py
          --root .

      - name: Run verification maintenance contract tests
        run: >-
          python -m unittest -v
          tests.test_verification_hardening_maintenance
          tests.test_verification_hardening_event_head_policy

      - name: Resolve exact maintenance base and candidate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import re
          import subprocess

          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip().lower()

          head = git('rev-parse', 'HEAD')
          expected = os.environ['GITHUB_SHA'].lower()
          if head != expected or re.fullmatch(r'[0-9a-f]{40}', head) is None:
              raise SystemExit('checked-out maintenance candidate differs from exact workflow/event HEAD')
          event = json.load(open(os.environ['GITHUB_EVENT_PATH'], encoding='utf-8'))
          name = os.environ['GITHUB_EVENT_NAME']
          if name == 'pull_request':
              pull = event.get('pull_request') or {}
              base_ref = str((pull.get('base') or {}).get('ref') or '')
              if base_ref != 'main' or os.environ.get('GITHUB_BASE_REF') != 'main':
                  raise SystemExit('verification maintenance pull request must target current main')
              base = git('rev-parse', 'origin/main')
              first_parent = git('rev-parse', 'HEAD^1')
              merge_base = git('merge-base', 'origin/main', 'HEAD')
              if first_parent != base or merge_base != base:
                  raise SystemExit('pull-request maintenance base does not equal current origin/main merge parent')
          elif name == 'push':
              base = str(event.get('before') or '').lower()
              if base == '0' * 40:
                  base = git('rev-parse', 'HEAD^')
          else:
              raise SystemExit(f'unsupported verification-maintenance event: {name}')
          if re.fullmatch(r'[0-9a-f]{40}', base) is None:
              raise SystemExit('maintenance base is not an exact lowercase 40-hex commit')
          completed = subprocess.run(['git','merge-base','--is-ancestor',base,head], check=False)
          if completed.returncode != 0:
              raise SystemExit('maintenance base is not an ancestor of exact candidate HEAD')
          if base == head:
              raise SystemExit('maintenance base and candidate must differ')
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as stream:
              stream.write(f'PSMATRIX_VERIFICATION_MAINTENANCE_BASE={base}\n')
          print(f'verification_maintenance_range=PASS base={base} candidate={head}')
          PY

      - name: Certify immutable historical repository workflow action-pin refresh
        run: >-
          python scripts/ga/verify_repository_workflow_pin_refresh.py
          --root .
          --baseline 3ffc6b6d7cd58d64224f780aa819b50f50f72491
          --candidate 3b06770cb925add391f4552e5f1cbd0ed6aa96b5
          --require-candidate-ancestor-of-head
          --allow-historical-candidate-additions
          --expected-files 76
          --expected-replacements 167
          --output "$RUNNER_TEMP/repository-workflow-pin-refresh.json"

      - name: Scan exact tracked tree for private material
        run: >-
          python scripts/ga/scan_repository_private_material.py
          --root .
          --expected-head "$GITHUB_SHA"
          --output "$RUNNER_TEMP/repository-private-material-scan.json"

      - name: Certify current-base verification maintenance
        run: >-
          python scripts/ga/certify_verification_hardening_maintenance.py
          --root .
          --base "$PSMATRIX_VERIFICATION_MAINTENANCE_BASE"
          --candidate "$GITHUB_SHA"
          --historical-workflow-pin-refresh "$RUNNER_TEMP/repository-workflow-pin-refresh.json"
          --private-scan "$RUNNER_TEMP/repository-private-material-scan.json"
          --output "$RUNNER_TEMP/verification-hardening-maintenance-certification.json"

      - name: Upload exact-head certification receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: psmatrix-2.0.0-verification-hardening-source-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/repository-workflow-pin-refresh.json
            ${{ runner.temp }}/repository-private-material-scan.json
            ${{ runner.temp }}/verification-hardening-maintenance-certification.json
          if-no-files-found: warn
          retention-days: 30
