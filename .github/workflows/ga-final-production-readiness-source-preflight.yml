name: production-ga-final-production-readiness-source-preflight

on:
  push:
    branches: ["final/2.0.0-production-readiness-controls-v2"]
  pull_request:
    branches: ["final/2.0.0-security-vulnerability-evidence-producers-anchor"]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  registration-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      statuses: write
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Publish diagnostic registration status
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import urllib.request
          head = os.environ['EXPECTED_HEAD']
          if len(head) != 40:
              raise SystemExit('invalid exact head')
          payload = json.dumps({
              'state': 'success',
              'target_url': f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
              'description': 'Diagnostic workflow registration succeeded',
              'context': 'production-readiness/registration-diagnostic',
          }).encode('utf-8')
          request = urllib.request.Request(
              f"{os.environ['GITHUB_API_URL']}/repos/{os.environ['GITHUB_REPOSITORY']}/statuses/{head}",
              data=payload,
              method='POST',
              headers={
                  'Accept':'application/vnd.github+json',
                  'Authorization':f"Bearer {os.environ['GH_TOKEN']}",
                  'X-GitHub-Api-Version':'2026-03-10',
                  'Content-Type':'application/json',
                  'User-Agent':'psmatrix-readiness-registration-diagnostic',
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              result=json.load(response)
          if result.get('state')!='success':
              raise SystemExit('diagnostic commit status was not accepted')
          print(f"production_readiness_registration_diagnostic=PASS run_id={os.environ['GITHUB_RUN_ID']}")
          PY
