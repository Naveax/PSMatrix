name: ga-rc3-execution-attempt-once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ga-rc3-execution-attempt-once.yml"

permissions:
  contents: read
  actions: write

jobs:
  orchestrate:
    name: Attempt protected RC3 signing through Hyper-V provisioning
    runs-on: [self-hosted, Windows, X64, psmatrix-hyperv]
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_COMMIT: 34e87c60885001f8dd11744b8bf194a59e51bd1f
      STAGING_RUN_ID: "31189374564"
      STAGING_CONTROL_HEAD: af4cef4a959941d6e35dc0b6ae88b183f35eadbb

    steps:
      - name: Dispatch conditional production chain
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version 2.0
          if ($env:RUNNER_OS -ne 'Windows' -or $env:RUNNER_NAME -ne 'NAVEAX') {
              throw "Expected NAVEAX Windows runner; got $env:RUNNER_NAME / $env:RUNNER_OS"
          }
          $gaRoot = 'C:\ProgramData\PSMatrix\ProductionGA'
          if (-not (Test-Path -LiteralPath $gaRoot -PathType Container)) {
              throw 'Canonical GA root is missing.'
          }
          if ([string]::IsNullOrWhiteSpace($env:GH_TOKEN)) {
              throw 'GITHUB_TOKEN is unavailable.'
          }

          $headers = @{
              Accept = 'application/vnd.github+json'
              Authorization = "Bearer $env:GH_TOKEN"
              'X-GitHub-Api-Version' = '2026-03-10'
              'User-Agent' = 'psmatrix-rc3-execution-orchestrator'
          }
          $base = 'https://api.github.com/repos/Naveax/PSMatrix'

          function Invoke-GhJson {
              param(
                  [Parameter(Mandatory=$true)][ValidateSet('GET','POST')][string]$Method,
                  [Parameter(Mandatory=$true)][string]$Path,
                  [hashtable]$Body
              )
              $params = @{
                  Method = $Method
                  Uri = "$base/$Path"
                  Headers = $headers
                  TimeoutSec = 30
              }
              if ($null -ne $Body) {
                  $params.ContentType = 'application/json'
                  $params.Body = ($Body | ConvertTo-Json -Depth 12 -Compress)
              }
              return Invoke-RestMethod @params
          }

          function Dispatch-And-Wait {
              param(
                  [Parameter(Mandatory=$true)][string]$Workflow,
                  [Parameter(Mandatory=$true)][hashtable]$Inputs,
                  [int]$TimeoutSeconds = 180
              )
              Write-Host "dispatch_workflow=$Workflow"
              $response = Invoke-GhJson -Method POST -Path "actions/workflows/$Workflow/dispatches" -Body @{
                  ref = 'main'
                  inputs = $Inputs
              }
              $runId = [int64]$response.workflow_run_id
              if ($runId -le 0) { throw "Dispatch response did not contain workflow_run_id for $Workflow" }
              Write-Host "dispatched_run_id=$runId"
              $deadline = (Get-Date).AddSeconds($TimeoutSeconds)
              do {
                  Start-Sleep -Seconds 2
                  $run = Invoke-GhJson -Method GET -Path "actions/runs/$runId" -Body $null
                  Write-Host "run=$runId status=$($run.status) conclusion=$($run.conclusion)"
                  if ([string]$run.status -eq 'completed') {
                      return $run
                  }
              } while ((Get-Date) -lt $deadline)
              throw "Timed out waiting for workflow $Workflow run $runId"
          }

          $state = [ordered]@{
              signing = 'NOT_STARTED'
              intake = 'NOT_STARTED'
              media_readiness = 'NOT_STARTED'
              provisioning_manifest = 'NOT_STARTED'
              operation_package = 'NOT_STARTED'
              hyperv_provision = 'NOT_STARTED'
          }

          $signing = Dispatch-And-Wait -Workflow 'ga-windows-authority-release-sign-from-staging.yml' -Inputs @{
              release_commit = $env:RELEASE_COMMIT
              staging_run_id = $env:STAGING_RUN_ID
              staging_control_head = $env:STAGING_CONTROL_HEAD
          }
          $state.signing = [string]$signing.conclusion
          Write-Host "chain_signing_run_id=$($signing.id)"
          if ([string]$signing.conclusion -ne 'success') {
              $jobs = Invoke-GhJson -Method GET -Path "actions/runs/$($signing.id)/jobs?per_page=100" -Body $null
              $jobCount = @($jobs.jobs).Count
              $stepCount = 0
              foreach ($job in @($jobs.jobs)) { $stepCount += @($job.steps).Count }
              Write-Host "chain_stop=protected_signing_failed jobs=$jobCount steps=$stepCount"
              Write-Host ($state | ConvertTo-Json -Compress)
              exit 10
          }

          $intake = Dispatch-And-Wait -Workflow 'ga-windows-authority-release-intake-selfhosted.yml' -Inputs @{
              release_commit = $env:RELEASE_COMMIT
              signing_run_id = [string]$signing.id
              signing_control_head = [string]$signing.head_sha
          }
          $state.intake = [string]$intake.conclusion
          if ([string]$intake.conclusion -ne 'success') {
              Write-Host 'chain_stop=protected_release_intake_failed'
              Write-Host ($state | ConvertTo-Json -Compress)
              exit 11
          }

          $media = Dispatch-And-Wait -Workflow 'ga-windows-authority-media-readiness-selfhosted.yml' -Inputs @{
              release_commit = $env:RELEASE_COMMIT
              inspect_iso_images = 'true'
          }
          $state.media_readiness = [string]$media.conclusion
          if ([string]$media.conclusion -ne 'success') {
              Write-Host 'chain_stop=media_readiness_failed'
              Write-Host ($state | ConvertTo-Json -Compress)
              exit 12
          }

          $manifest = Dispatch-And-Wait -Workflow 'ga-windows-authority-provisioning-manifest-selfhosted.yml' -Inputs @{
              release_commit = $env:RELEASE_COMMIT
          }
          $state.provisioning_manifest = [string]$manifest.conclusion
          if ([string]$manifest.conclusion -ne 'success') {
              Write-Host 'chain_stop=provisioning_manifest_failed_or_operator_input_missing'
              Write-Host ($state | ConvertTo-Json -Compress)
              exit 13
          }

          $operation = Dispatch-And-Wait -Workflow 'ga-windows-authority-operation-package-selfhosted.yml' -Inputs @{
              release_commit = $env:RELEASE_COMMIT
          }
          $state.operation_package = [string]$operation.conclusion
          if ([string]$operation.conclusion -ne 'success') {
              Write-Host 'chain_stop=operation_package_failed'
              Write-Host ($state | ConvertTo-Json -Compress)
              exit 14
          }

          $provision = Dispatch-And-Wait -Workflow 'ga-windows-authority-provision-selfhosted.yml' -Inputs @{
              release_commit = $env:RELEASE_COMMIT
              operation_run_id = [string]$operation.id
              operation_run_attempt = [string]$operation.run_attempt
              provision_timeout_seconds = '7200'
          } -TimeoutSeconds 900
          $state.hyperv_provision = [string]$provision.conclusion
          Write-Host "chain_operation_run_id=$($operation.id)"
          Write-Host "chain_operation_run_attempt=$($operation.run_attempt)"
          Write-Host "chain_provision_run_id=$($provision.id)"
          Write-Host ($state | ConvertTo-Json -Compress)
          if ([string]$provision.conclusion -ne 'success') { exit 15 }
          Write-Host 'rc3_steps_3_through_8=PASS'
