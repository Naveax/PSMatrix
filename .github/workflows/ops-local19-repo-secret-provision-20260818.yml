name: ops-local19-repo-secret-provision-20260818

on:
  push:
    branches:
      - ops/local19-secure-bootstrap-20260817
    paths:
      - .github/workflows/ops-local19-repo-secret-provision-20260818.yml

concurrency:
  group: ops-local19-repo-secret-provision-20260818
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  provision:
    runs-on: [self-hosted, Windows, X64, psmatrix-hyperv]
    timeout-minutes: 20
    env:
      SOURCE_SHA: 8498fef23788c5e3ee37ace736215a03f11118e8
      PROVISIONING_ROOT: C:\ProgramData\PSMatrix\ProductionGA\provisioning
      GH_TOKEN: ${{ secrets.PSMATRIX_TEMP_ADMIN_TOKEN }}
    steps:
      - name: Check out exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify temporary operator credential
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:GH_TOKEN)) { throw 'PSMATRIX_TEMP_ADMIN_TOKEN is missing.' }
          $gh = (Get-Command gh -ErrorAction Stop).Source
          $login = (& $gh api user --jq '.login').Trim()
          if ($LASTEXITCODE -ne 0 -or -not $login) { throw 'GitHub token authentication failed.' }
          $isAdmin = (& $gh api repos/Naveax/PSMatrix --jq '.permissions.admin').Trim()
          if ($LASTEXITCODE -ne 0 -or $isAdmin -ne 'true') { throw 'Token lacks repository admin permission.' }
          Write-Host "gh_operator_login=$login"
          Write-Host 'gh_operator_repo_admin=true'
          Write-Host 'credential_value_logged=false'

      - name: Provision and receipt-verify exact local 19 checks
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'

          $root = [IO.Path]::GetFullPath($env:PROVISIONING_ROOT)
          $summaryPath = Join-Path $root 'local-provisioning-summary.json'
          if (-not (Test-Path -LiteralPath $summaryPath -PathType Leaf)) { throw 'local provisioning workspace summary missing' }

          $prepared = Get-Content -LiteralPath $summaryPath -Raw | ConvertFrom-Json
          if ($prepared.status -ne 'PASS' -or [int]$prepared.locally_prepared_check_count -ne 19) {
            throw 'local provisioning workspace is not exact PASS 19/41'
          }

          $python = (Get-Command python -ErrorAction Stop).Source
          $gh = (Get-Command gh -ErrorAction Stop).Source
          $localMap = Join-Path $root 'local-19-reposecret.material-map.json'
          $preAudit = Join-Path $root 'local-19-reposecret-pre-audit.json'
          $selectedMap = Join-Path $root 'local-19-reposecret-selected.material-map.json'
          $postAudit = Join-Path $root 'local-19-reposecret-post-audit.json'
          $receipt = Join-Path $root 'local-19-reposecret-receipt.json'

          & $python scripts/ga/compose_partial_production_ga_material_map.py `
            --fragment ([string]$prepared.fragments.signing_authorities) `
            --fragment ([string]$prepared.fragments.full_matrix) `
            --output $localMap
          if ($LASTEXITCODE -ne 0) { throw 'local 19 material-map composition failed' }

          $map = Get-Content -LiteralPath $localMap -Raw | ConvertFrom-Json -AsHashtable -Depth 30
          if ([int]$map.check_count -ne 19 -or $map.partial -ne $true) { throw 'local map is not exact partial 19/41' }

          & $python scripts/ga/audit_production_ga_environment_inventory.py `
            --repository Naveax/PSMatrix `
            --gh $gh `
            --output $preAudit
          $preRc = $LASTEXITCODE
          if ($preRc -notin @(0,2)) { throw "pre-provision inventory audit failed: $preRc" }

          $before = Get-Content -LiteralPath $preAudit -Raw | ConvertFrom-Json
          if ([int]$before.required_check_count -ne 41) { throw 'pre-audit contract cardinality mismatch' }

          & $python scripts/ga/select_missing_production_ga_material.py `
            --material-map $localMap `
            --inventory-audit $preAudit `
            --output $selectedMap
          if ($LASTEXITCODE -ne 0) { throw 'missing local material selection failed' }

          $selected = Get-Content -LiteralPath $selectedMap -Raw | ConvertFrom-Json -AsHashtable -Depth 30
          $selectedCount = [int]$selected.check_count
          $selectedEnvironments = @($selected.environments.Keys | Sort-Object)

          if ($selectedCount -gt 0) {
            & .\scripts\ga\Invoke-ProductionGAEnvironmentProvisioning.ps1 `
              -MaterialMap $selectedMap `
              -Repository Naveax/PSMatrix `
              -Environment $selectedEnvironments `
              -AllowPartialEnvironment `
              -GhPath $gh
            if ($LASTEXITCODE -ne 0) { throw 'live local 19 provisioning mutation failed' }
          }

          & $python scripts/ga/audit_production_ga_environment_inventory.py `
            --repository Naveax/PSMatrix `
            --gh $gh `
            --output $postAudit
          $postRc = $LASTEXITCODE
          if ($postRc -notin @(0,2)) { throw "post-provision inventory audit failed: $postRc" }

          $after = Get-Content -LiteralPath $postAudit -Raw | ConvertFrom-Json

          if ($selectedCount -gt 0) {
            & $python scripts/ga/verify_production_ga_provisioning_receipt.py `
              --material-map $selectedMap `
              --inventory-audit $postAudit `
              --output $receipt
            if ($LASTEXITCODE -ne 0) { throw 'local 19 provisioning receipt verification failed' }
            $receiptValue = Get-Content -LiteralPath $receipt -Raw | ConvertFrom-Json
            if ($receiptValue.status -ne 'PASS' -or [int]$receiptValue.verified_check_count -ne $selectedCount) {
              throw 'receipt did not verify all selected local checks'
            }
          }

          $localMissingAfter = 0
          $rows = @{}
          foreach ($row in @($after.environments)) { $rows[[string]$row.environment] = $row }
          foreach ($environment in @($map.environments.Keys)) {
            $row = $rows[$environment]
            foreach ($name in @($map.environments[$environment].secrets.Keys)) {
              if ($name -in @($row.missing_secrets)) { $localMissingAfter++ }
            }
            foreach ($name in @($map.environments[$environment].vars.Keys)) {
              if ($name -in @($row.missing_vars)) { $localMissingAfter++ }
            }
          }
          if ($localMissingAfter -ne 0) { throw "local 19 provisioning incomplete: missing=$localMissingAfter" }

          Write-Host 'production_ga_local19_reposecret_provisioning=PASS'
          Write-Host "selected_checks=$selectedCount"
          Write-Host 'local_checks_present_after=19/19'
          Write-Host "global_present_after=$([int]$after.present_check_count)/41"
          Write-Host "global_missing_after=$([int]$after.missing_check_count)"
          Write-Host 'provisioning_receipt_verified=true'
          Write-Host 'private_material_uploaded_as_artifact=false'
          Write-Host 'credential_value_logged=false'
          Write-Host 'production_readiness_claimed=false'
          Write-Host 'ga_eligible=false'
