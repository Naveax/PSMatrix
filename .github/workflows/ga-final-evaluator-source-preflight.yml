name: production-ga-final-evaluator-source-preflight

on:
  workflow_dispatch:
  push:
    branches: ["final/2.0.0-ga-evaluator-controls"]
    paths:
      - ".github/workflows/ga-final-evaluator-source-preflight.yml"
      - ".github/workflows/ga-final-evaluator.yml"
      - "ga-packs/03-authoritative-windows/final-ga-evaluator-control-contract.json"
      - "scripts/ga/assemble_final_ga_evidence.py"
      - "tests/test_final_ga_evaluator_controls.py"
  pull_request:
    branches: ["final/2.0.0-windows-evidence-rebind-controls-anchor"]
    paths:
      - ".github/workflows/ga-final-evaluator-source-preflight.yml"
      - ".github/workflows/ga-final-evaluator.yml"
      - "ga-packs/03-authoritative-windows/final-ga-evaluator-control-contract.json"
      - "scripts/ga/assemble_final_ga_evidence.py"
      - "tests/test_final_ga_evaluator_controls.py"

concurrency:
  group: production-ga-final-evaluator-source-preflight-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  final-ga-evaluator-source-preflight:
    runs-on: [self-hosted, Windows, X64, psmatrix-hyperv]
    timeout-minutes: 40
    permissions:
      contents: read
    env:
      PYTHONPATH: ${{ github.workspace }}\src
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      BASE_CONTROL_HEAD: cb36beeb0de86bc248cf6420384f58641fece6b5
      FINAL_RELEASE_COMMIT: 02cef95d40cf524ce00f9d917188343dc49e6f2c

    steps:
      - name: Verify trusted NAVEAX source runner
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_OS -ne 'Windows' -or $env:RUNNER_NAME -ne 'NAVEAX') {
              throw "Expected NAVEAX Windows runner; got $env:RUNNER_NAME / $env:RUNNER_OS"
          }
          Write-Host 'final_ga_evaluator_runner=PASS'

      - name: Check out exact evaluator control source with full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact five-path evaluator control closure and producer gap
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $head = (git rev-parse HEAD).Trim().ToLowerInvariant()
          if ($env:EXPECTED_HEAD -cnotmatch '^[0-9a-f]{40}$' -or $head -ne $env:EXPECTED_HEAD.ToLowerInvariant()) { throw "Exact evaluator control head mismatch: $head / $env:EXPECTED_HEAD" }
          if (-not [string]::IsNullOrWhiteSpace((git status --porcelain))) { throw 'Evaluator source checkout is dirty.' }
          git cat-file -e "$env:BASE_CONTROL_HEAD^{commit}"
          if ($LASTEXITCODE -ne 0) { throw 'Frozen evaluator base control head is unavailable.' }
          git cat-file -e "$env:FINAL_RELEASE_COMMIT^{commit}"
          if ($LASTEXITCODE -ne 0) { throw 'Frozen final release commit is unavailable.' }
          git merge-base --is-ancestor $env:BASE_CONTROL_HEAD $head
          if ($LASTEXITCODE -ne 0) { throw 'Windows rebind control anchor is not an ancestor of final GA evaluator controls.' }

          $contract = Get-Content 'ga-packs\03-authoritative-windows\final-ga-evaluator-control-contract.json' -Raw | ConvertFrom-Json
          if ([int]$contract.schema -ne 1 -or [string]$contract.kind -ne 'psmatrix.final-ga-evaluator-control-contract') { throw 'Final GA evaluator contract identity mismatch.' }
          if ([string]$contract.version -ne '2.0.0' -or [string]$contract.final_release_commit -ne $env:FINAL_RELEASE_COMMIT) { throw 'Final GA evaluator frozen release identity mismatch.' }
          $runtimeGates = @(python -c "from psmatrix.ga import _REQUIRED_GATES; print('\n'.join(_REQUIRED_GATES))")
          $contractGates = @($contract.required_gates | ForEach-Object { [string]$_ })
          if ($runtimeGates.Count -ne 11 -or $contractGates.Count -ne 11) { throw 'Final GA evaluator must contain exactly eleven required gates.' }
          for ($i = 0; $i -lt 11; $i++) {
              if ($runtimeGates[$i] -ne $contractGates[$i]) { throw "Final GA gate order mismatch at index ${i}: $($runtimeGates[$i]) / $($contractGates[$i])" }
          }
          $sourceGateNames = @($contract.evidence_sources.PSObject.Properties.Name)
          for ($i = 0; $i -lt 11; $i++) {
              if ($sourceGateNames[$i] -ne $contractGates[$i]) { throw "Final GA evidence-source order mismatch at index $i." }
          }
          if ([bool]$contract.control_source.runtime_source_changes_allowed) { throw 'Final GA evaluator control layer must not permit runtime source changes.' }

          $changed = @((git diff --name-only "$env:BASE_CONTROL_HEAD..$head") | ForEach-Object { $_.Trim().Replace('\','/') } | Where-Object { $_ } | Sort-Object -Unique)
          $allowed = @($contract.control_source.changed_path_allowlist | ForEach-Object { ([string]$_).Replace('\','/') } | Sort-Object -Unique)
          $delta = @(Compare-Object -ReferenceObject $allowed -DifferenceObject $changed)
          if ($delta.Count -ne 0) { throw "Final GA evaluator changed-path closure mismatch: $($delta | Out-String)" }
          if ($changed.Count -ne 5) { throw "Expected exactly five GA evaluator control changed paths; observed $($changed.Count)." }
          $runtime = @($changed | Where-Object { $_ -like 'src/psmatrix/*' })
          if ($runtime.Count -ne 0) { throw "GA evaluator controls modified runtime source: $($runtime -join ',')" }

          $present = 0
          $missing = @()
          foreach ($gate in $contractGates) {
              $entry = $contract.evidence_sources.$gate
              $path = [string]$entry.workflow_path
              if (Test-Path -LiteralPath $path -PathType Leaf) {
                  $text = Get-Content -LiteralPath $path -Raw
                  if (-not $text.Contains("name: $([string]$entry.workflow)")) { throw "Existing producer source has wrong workflow identity: $gate / $path" }
                  $present++
              } else {
                  $missing += $gate
              }
          }
          if ($present -ne 2) { throw "This preparation layer expects exactly two producer workflow sources present; observed $present." }
          if ($missing.Count -ne 9) { throw "This preparation layer expects exactly nine producer sources pending; observed $($missing.Count)." }
          Write-Host "validated_exact_ga_evaluator_head=$head"
          Write-Host 'ga_evaluator_control_changed_paths=5'
          Write-Host 'runtime_source_changes=0'
          Write-Host 'required_gates=11'
          Write-Host "producer_workflow_sources_present=$present"
          Write-Host 'producer_workflow_sources_required=11'
          Write-Host "producer_workflow_sources_pending=$($missing -join ',')"
          Write-Host 'production_evaluator_ready=false'

      - name: Compile final GA evaluator controls
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m py_compile `
            scripts/ga/assemble_final_ga_evidence.py `
            tests/test_final_ga_evaluator_controls.py
          if ($LASTEXITCODE -ne 0) { throw 'Final GA evaluator control compile failed.' }
          Write-Host 'final_ga_evaluator_compile=PASS'

      - name: Run final GA evaluator source contracts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m unittest -v `
            tests.test_final_ga_evaluator_controls `
            tests.test_windows_authority_final_windows_evidence_rebind `
            tests.test_windows_authority_final_release_lock_signing
          if ($LASTEXITCODE -ne 0) { throw 'Final GA evaluator source contract suite failed.' }
          Write-Host 'final_ga_evaluator_source_contract=PASS'

      - name: Parse production GA CLI commands without executing production evidence
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m psmatrix.cli ga evaluate --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'GA evaluate CLI parse failed.' }
          python -m psmatrix.cli ga sign --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'GA sign CLI parse failed.' }
          python -m psmatrix.cli ga verify --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'GA verify CLI parse failed.' }
          Write-Host 'final_ga_cli_parse=PASS'

      - name: Scan every tracked source byte for exact PEM private-authority headers
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          import subprocess
          from pathlib import Path
          markers = {
              b"-----BEGIN PRIVATE KEY-----",
              b"-----BEGIN RSA PRIVATE KEY-----",
              b"-----BEGIN EC PRIVATE KEY-----",
              b"-----BEGIN OPENSSH PRIVATE KEY-----",
              b"-----BEGIN ED25519 PRIVATE KEY-----",
          }
          root = Path.cwd().resolve()
          tracked = [line for line in subprocess.check_output(["git", "ls-files"], text=True).splitlines() if line]
          scanned = 0
          total = 0
          for relative in tracked:
              path = root / relative
              if not path.is_file():
                  continue
              scanned += 1
              with path.open("rb") as handle:
                  for raw_line in handle:
                      total += len(raw_line)
                      if raw_line.rstrip(b"\r\n").strip() in markers:
                          raise SystemExit(f"tracked private-key PEM material detected: {relative}")
          print(f"repository_private_authority_absence=PASS tracked_files={scanned} tracked_bytes={total} size_limit_applied=false")
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'Tracked-source private authority scan failed.' }

      - name: Emit final GA evaluator preparation summary
        shell: pwsh
        run: |
          Write-Host "validated_exact_ga_evaluator_head=$env:EXPECTED_HEAD"
          Write-Host 'required_gates=11'
          Write-Host 'producer_workflow_sources_present=2'
          Write-Host 'producer_workflow_sources_required=11'
          Write-Host 'production_evaluator_ready=false'
          Write-Host 'production_evaluator_executed=false'
          Write-Host 'ga_root_private_key_read=false'
          Write-Host 'final_ga_attestation_written=false'
          Write-Host 'final_ga_attestation_verified=false'
          Write-Host 'ga_eligible=false'
