name: ops-rc4-post-intake-canonical-chain

on:
  workflow_run:
    workflows:
      - production-ga-windows-authority-rc4-media-readiness-selfhosted
      - production-ga-windows-authority-rc4-provisioning-manifest-selfhosted
      - production-ga-windows-authority-rc4-operation-package-selfhosted
      - production-ga-windows-authority-rc4-provision-selfhosted
      - production-ga-windows-authority-rc4-image-identity-measurement-selfhosted
      - production-ga-windows-authority-rc4-certification-campaign-selfhosted
    types: [completed]
  workflow_dispatch:
    inputs:
      recover_completed_run_id:
        description: Canonical bot-dispatched RC4 stage run to recover after workflow_run suppression
        required: false
        type: string
      recover_failed_provisioning_manifest_run_id:
        description: Failed canonical bot/bot RC4 provisioning-manifest run to safely redispatch after external host state is repaired
        required: false
        type: string
      recover_failed_provision_run_id:
        description: Failed canonical bot/bot RC4 Hyper-V provisioning run to safely redispatch only when mutation never started
        required: false
        type: string

concurrency:
  group: ops-rc4-post-intake-canonical-chain
  cancel-in-progress: false

permissions:
  contents: read
  actions: write
  issues: write

jobs:
  advance:
    if: >-
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'workflow_dispatch' &&
        github.event.workflow_run.head_branch == 'release/2.0.0rc4-active-lock' &&
        github.event.workflow_run.actor.login == 'github-actions[bot]' &&
        github.event.workflow_run.triggering_actor.login == 'github-actions[bot]'
      ) || (
        github.event_name == 'workflow_dispatch' &&
        github.ref_name == 'main' &&
        github.actor == 'Naveax' &&
        github.triggering_actor == 'Naveax' &&
        (
          inputs.recover_completed_run_id != '' ||
          inputs.recover_failed_provisioning_manifest_run_id != '' ||
          inputs.recover_failed_provision_run_id != ''
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      RECOVERY_MODE: ${{ github.event_name == 'workflow_dispatch' }}
      COMPLETED_WORKFLOW: ${{ github.event.workflow_run.name }}
      COMPLETED_RUN_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.recover_completed_run_id || github.event.workflow_run.id }}
      FAILED_PROVISIONING_RUN_ID: ${{ inputs.recover_failed_provisioning_manifest_run_id }}
      FAILED_HYPERV_PROVISION_RUN_ID: ${{ inputs.recover_failed_provision_run_id }}
      COMPLETED_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
      COMPLETED_RUN_HEAD: ${{ github.event.workflow_run.head_sha }}
      CONTROL_HEAD: ${{ github.event.workflow_run.head_sha }}
      RELEASE_COMMIT: 0b4e77d5e5cf142e2cdb47f5cc4b8dd81353ae63
      CONTROL_BRANCH: release/2.0.0rc4-active-lock
      STATE_ISSUE: '262'
    steps:
      - name: Resolve explicit canonical-stage recovery
        if: env.RECOVERY_MODE == 'true'
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_ACTOR" == 'Naveax' && "$GITHUB_TRIGGERING_ACTOR" == 'Naveax' ]] || { echo 'RC4 stage recovery must be explicitly dispatched by Naveax.' >&2; exit 1; }
          [[ "$GITHUB_REF_NAME" == 'main' ]] || { echo 'RC4 stage recovery must execute from main.' >&2; exit 1; }
          recovery_count=0
          for recovery_value in "$COMPLETED_RUN_ID" "$FAILED_PROVISIONING_RUN_ID" "$FAILED_HYPERV_PROVISION_RUN_ID"; do
            [[ -n "$recovery_value" ]] && recovery_count=$((recovery_count + 1))
          done
          [[ "$recovery_count" -eq 1 ]] || { echo 'Exactly one RC4 recovery input must be supplied. RC4 recovery inputs are mutually exclusive.' >&2; exit 1; }

          if [[ -n "$FAILED_PROVISIONING_RUN_ID" ]]; then
            [[ -z "$COMPLETED_RUN_ID" ]] || { echo 'RC4 recovery inputs are mutually exclusive.' >&2; exit 1; }
            FAILED_RUN_ID="$FAILED_PROVISIONING_RUN_ID"
            [[ "$FAILED_RUN_ID" =~ ^[1-9][0-9]*$ ]] || { echo 'Failed provisioning-manifest run ID is invalid.' >&2; exit 1; }

            failed_run=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$FAILED_RUN_ID")
            [[ "$(jq -r '.name' <<<"$failed_run")" == 'production-ga-windows-authority-rc4-provisioning-manifest-selfhosted' ]] || { echo 'Failed recovery only supports provisioning-manifest.' >&2; exit 1; }
            [[ "$(jq -r '.path' <<<"$failed_run")" == '.github/workflows/ga-windows-authority-rc4-provisioning-manifest-selfhosted.yml' ]] || { echo 'Failed provisioning-manifest workflow path mismatch.' >&2; exit 1; }
            [[ "$(jq -r '.event' <<<"$failed_run")" == 'workflow_dispatch' && "$(jq -r '.status' <<<"$failed_run")" == 'completed' && "$(jq -r '.conclusion' <<<"$failed_run")" == 'failure' ]] || { echo 'Recovered provisioning-manifest run is not completed/failure.' >&2; exit 1; }
            [[ "$(jq -r '.actor.login' <<<"$failed_run")" == 'github-actions[bot]' && "$(jq -r '.triggering_actor.login' <<<"$failed_run")" == 'github-actions[bot]' ]] || { echo 'Failed provisioning-manifest run is not canonical bot/bot provenance.' >&2; exit 1; }
            failed_attempt=$(jq -r '.run_attempt' <<<"$failed_run")
            failed_head=$(jq -r '.head_sha' <<<"$failed_run")
            failed_branch=$(jq -r '.head_branch' <<<"$failed_run")
            [[ "$failed_attempt" =~ ^[1-9][0-9]*$ && "$failed_head" =~ ^[0-9a-f]{40}$ ]] || { echo 'Failed provisioning-manifest attempt/head is invalid.' >&2; exit 1; }
            [[ "$failed_branch" == "$CONTROL_BRANCH" ]] || { echo 'Failed provisioning-manifest branch mismatch.' >&2; exit 1; }
            failed_control=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$CONTROL_BRANCH" --jq '.object.sha')
            [[ "$failed_control" == "$failed_head" ]] || { echo 'Frozen RC4 control moved before failed provisioning-manifest recovery.' >&2; exit 1; }

            evidence="$RUNNER_TEMP/rc4-failed-provisioning-manifest-$FAILED_RUN_ID-$failed_attempt"
            rm -rf "$evidence"
            mkdir -p "$evidence"
            gh run download "$FAILED_RUN_ID" --repo "$GITHUB_REPOSITORY" --name windows-authority-rc4-provisioning-manifest-status --dir "$evidence"
            failure_file=$(find "$evidence" -type f -name 'provisioning-manifest-failure.json' -print -quit)
            [[ -n "$failure_file" && -f "$failure_file" ]] || { echo 'Failed provisioning-manifest evidence is missing.' >&2; exit 1; }
            [[ "$(jq -r '.schema' "$failure_file")" == '1' && "$(jq -r '.kind' "$failure_file")" == 'psmatrix.windows-authority-rc4-provisioning-manifest-workflow-status' && "$(jq -r '.status' "$failure_file")" == 'FAIL' ]] || { echo 'Failed provisioning-manifest evidence identity mismatch.' >&2; exit 1; }
            [[ "$(jq -r '.release_commit' "$failure_file")" == "$RELEASE_COMMIT" && "$(jq -r '.control_head' "$failure_file")" == "$failed_control" ]] || { echo 'Failed provisioning-manifest release/control binding mismatch.' >&2; exit 1; }
            for field in complete ready_for_hyper_v_provisioning actual_os_identity_measured creates_virtual_machines creates_checkpoints authoritative ga_eligible; do
              [[ "$(jq -r --arg field "$field" '.[$field]' "$failure_file")" == 'false' ]] || { echo "Failed provisioning-manifest evidence crossed fail-closed boundary: $field" >&2; exit 1; }
            done
            echo "rc4_failed_provisioning_manifest_recovery_guard=PASS failed_run_id=$FAILED_RUN_ID attempt=$failed_attempt control_head=$failed_control"

            runs=$(gh api --method GET \
              "repos/$GITHUB_REPOSITORY/actions/workflows/ga-windows-authority-rc4-provisioning-manifest-selfhosted.yml/runs" \
              -f branch="$CONTROL_BRANCH" \
              -f event='workflow_dispatch' \
              -f per_page=100)
            existing=$(jq -r --arg head "$failed_control" --argjson failed "$FAILED_RUN_ID" '
              .workflow_runs[]
              | select(.head_sha == $head and .id > $failed)
              | select(.status == "queued" or .status == "in_progress" or .status == "waiting" or (.status == "completed" and .conclusion == "success"))
              | .id
            ' <<<"$runs" | head -n 1)
            if [[ -n "$existing" ]]; then
              echo "rc4_failed_provisioning_manifest_recovery_duplicate_suppressed=true failed_run_id=$FAILED_RUN_ID existing_run_id=$existing"
              exit 0
            fi
            newer_failed=$(jq -r --arg head "$failed_control" --argjson failed "$FAILED_RUN_ID" '
              .workflow_runs[]
              | select(.head_sha == $head and .id > $failed and .status == "completed" and .conclusion == "failure")
              | .id
            ' <<<"$runs" | head -n 1)
            [[ -z "$newer_failed" ]] || { echo "A newer failed provisioning-manifest run exists; recover that exact run instead: $newer_failed" >&2; exit 1; }
            baseline=$(jq -r --arg head "$failed_control" '[.workflow_runs[] | select(.head_sha == $head) | .id] | max // 0' <<<"$runs")
            [[ "$baseline" =~ ^[0-9]+$ ]] || { echo 'Provisioning-manifest recovery baseline is invalid.' >&2; exit 1; }

            gh workflow run ga-windows-authority-rc4-provisioning-manifest-selfhosted.yml \
              --repo "$GITHUB_REPOSITORY" --ref "$CONTROL_BRANCH" \
              -f release_commit="$RELEASE_COMMIT" \
              -f control_head="$failed_control"

            child=''
            for _ in {1..10}; do
              sleep 2
              runs=$(gh api --method GET \
                "repos/$GITHUB_REPOSITORY/actions/workflows/ga-windows-authority-rc4-provisioning-manifest-selfhosted.yml/runs" \
                -f branch="$CONTROL_BRANCH" \
                -f event='workflow_dispatch' \
                -f per_page=100)
              child=$(jq -r --arg head "$failed_control" --argjson baseline "$baseline" '
                .workflow_runs[]
                | select(.head_sha == $head and .id > $baseline)
                | .id
              ' <<<"$runs" | head -n 1)
              [[ -n "$child" ]] && break
            done
            [[ -n "$child" ]] || { echo 'Failed provisioning-manifest recovery dispatch did not materialize a child run.' >&2; exit 1; }
            gh issue comment "$STATE_ISSUE" --repo "$GITHUB_REPOSITORY" \
              --body "RC4_CHAIN_RECOVERY_DISPATCH stage=provisioning_manifest failed_run_id=$FAILED_RUN_ID child_run_id=$child control_head=$failed_control authoritative=false ga_eligible=false"
            echo "rc4_failed_provisioning_manifest_recovery_dispatch=PASS failed_run_id=$FAILED_RUN_ID child_run_id=$child control_head=$failed_control"
            exit 0
          fi

          if [[ -n "$FAILED_HYPERV_PROVISION_RUN_ID" ]]; then
            FAILED_RUN_ID="$FAILED_HYPERV_PROVISION_RUN_ID"
            [[ "$FAILED_RUN_ID" =~ ^[1-9][0-9]*$ ]] || { echo 'Failed Hyper-V provisioning run ID is invalid.' >&2; exit 1; }

            failed_run=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$FAILED_RUN_ID")
            [[ "$(jq -r '.name' <<<"$failed_run")" == 'production-ga-windows-authority-rc4-provision-selfhosted' ]] || { echo 'Failed recovery only supports RC4 Hyper-V provisioning.' >&2; exit 1; }
            [[ "$(jq -r '.path' <<<"$failed_run")" == '.github/workflows/ga-windows-authority-rc4-provision-selfhosted.yml' ]] || { echo 'Failed Hyper-V provisioning workflow path mismatch.' >&2; exit 1; }
            [[ "$(jq -r '.event' <<<"$failed_run")" == 'workflow_dispatch' && "$(jq -r '.status' <<<"$failed_run")" == 'completed' && "$(jq -r '.conclusion' <<<"$failed_run")" == 'failure' ]] || { echo 'Recovered Hyper-V provisioning run is not completed/failure.' >&2; exit 1; }
            [[ "$(jq -r '.actor.login' <<<"$failed_run")" == 'github-actions[bot]' && "$(jq -r '.triggering_actor.login' <<<"$failed_run")" == 'github-actions[bot]' ]] || { echo 'Failed Hyper-V provisioning run is not canonical bot/bot provenance.' >&2; exit 1; }

            failed_attempt=$(jq -r '.run_attempt' <<<"$failed_run")
            failed_head=$(jq -r '.head_sha' <<<"$failed_run")
            failed_branch=$(jq -r '.head_branch' <<<"$failed_run")
            [[ "$failed_attempt" =~ ^[1-9][0-9]*$ && "$failed_head" =~ ^[0-9a-f]{40}$ ]] || { echo 'Failed Hyper-V provisioning attempt/head is invalid.' >&2; exit 1; }

            evidence="$RUNNER_TEMP/rc4-failed-hyperv-provision-$FAILED_RUN_ID-$failed_attempt"
            rm -rf "$evidence"
            mkdir -p "$evidence"
            gh run download "$FAILED_RUN_ID" --repo "$GITHUB_REPOSITORY" --name windows-authority-rc4-hyperv-provisioning-status --dir "$evidence"
            failure_file=$(find "$evidence" -type f -name 'hyperv-provisioning-failure.json' -print -quit)
            [[ -n "$failure_file" && -f "$failure_file" ]] || { echo 'Failed Hyper-V provisioning evidence is missing.' >&2; exit 1; }
            [[ "$(jq -r '.schema' "$failure_file")" == '1' && "$(jq -r '.kind' "$failure_file")" == 'psmatrix.windows-authority-hyperv-provisioning-status' && "$(jq -r '.status' "$failure_file")" == 'FAIL' ]] || { echo 'Failed Hyper-V provisioning evidence identity mismatch.' >&2; exit 1; }
            [[ "$(jq -r '.release_commit' "$failure_file")" == "$RELEASE_COMMIT" ]] || { echo 'Failed Hyper-V provisioning release commit mismatch.' >&2; exit 1; }
            [[ "$(jq -r '.authoritative' "$failure_file")" == 'false' && "$(jq -r '.ga_eligible' "$failure_file")" == 'false' ]] || { echo 'Failed Hyper-V provisioning crossed forbidden authority/GA boundary.' >&2; exit 1; }
            mutation_started=$(jq -r 'if has("mutation_started") then .mutation_started else true end' "$failure_file")
            [[ "$mutation_started" == 'false' ]] || { echo 'Failed Hyper-V provisioning mutation_started=true or missing; automated retry is forbidden.' >&2; exit 1; }

            failed_control=$(jq -r '.control_head // ""' "$failure_file")
            operation_run_id=$(jq -r '.operation_run_id // ""' "$failure_file")
            operation_run_attempt=$(jq -r '.operation_run_attempt // ""' "$failure_file")
            [[ "$failed_control" =~ ^[0-9a-f]{40}$ ]] || { echo 'Failed Hyper-V provisioning control head is invalid.' >&2; exit 1; }
            [[ "$operation_run_id" =~ ^[1-9][0-9]*$ && "$operation_run_attempt" =~ ^[1-9][0-9]*$ ]] || { echo 'Failed Hyper-V provisioning operation provenance is invalid.' >&2; exit 1; }

            frozen_control=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$CONTROL_BRANCH" --jq '.object.sha')
            [[ "$frozen_control" == "$failed_control" ]] || { echo 'Frozen RC4 control moved before failed Hyper-V provisioning recovery.' >&2; exit 1; }
            if [[ "$failed_branch" == "$CONTROL_BRANCH" ]]; then
              [[ "$failed_head" == "$failed_control" ]] || { echo 'Failed frozen-branch Hyper-V provisioning head mismatch.' >&2; exit 1; }
            elif [[ "$failed_branch" == 'main' ]]; then
              [[ "$(jq -r '.workflow_code_recovery // false' "$failure_file")" == 'true' && "$(jq -r '.workflow_code_head // ""' "$failure_file")" == "$failed_head" ]] || { echo 'Failed repaired Hyper-V provisioning workflow-code provenance mismatch.' >&2; exit 1; }
            else
              echo "Failed Hyper-V provisioning branch is not canonical: $failed_branch" >&2
              exit 1
            fi

            workflow_text=$(gh api "repos/$GITHUB_REPOSITORY/contents/.github/workflows/ga-windows-authority-rc4-provision-selfhosted.yml?ref=$GITHUB_SHA" --jq '.content' | tr -d '\n' | base64 -d)
            grep -Fq 'repair_from_main:' <<<"$workflow_text" || { echo 'Current-main Hyper-V provisioning workflow lacks repaired-main mode.' >&2; exit 1; }
            grep -Fq 'hyperv_storage_capacity_preflight=PASS' <<<"$workflow_text" || { echo 'Current-main Hyper-V provisioning workflow lacks storage-capacity preflight.' >&2; exit 1; }

            runs=$(gh api --method GET \
              "repos/$GITHUB_REPOSITORY/actions/workflows/ga-windows-authority-rc4-provision-selfhosted.yml/runs" \
              -f branch='main' \
              -f event='workflow_dispatch' \
              -f per_page=100)
            existing=$(jq -r --arg head "$GITHUB_SHA" --argjson failed "$FAILED_RUN_ID" '
              .workflow_runs[]
              | select(.head_sha == $head and .id > $failed)
              | select(.status == "queued" or .status == "in_progress" or .status == "waiting" or (.status == "completed" and .conclusion == "success"))
              | .id
            ' <<<"$runs" | head -n 1)
            if [[ -n "$existing" ]]; then
              echo "rc4_failed_provision_recovery_duplicate_suppressed=true failed_run_id=$FAILED_RUN_ID existing_run_id=$existing reason=repaired_provision_run"
              exit 0
            fi
            newer_failed=$(jq -r --arg head "$GITHUB_SHA" --argjson failed "$FAILED_RUN_ID" '
              .workflow_runs[]
              | select(.head_sha == $head and .id > $failed and .status == "completed" and .conclusion == "failure")
              | .id
            ' <<<"$runs" | head -n 1)
            [[ -z "$newer_failed" ]] || { echo "A newer failed repaired Hyper-V provisioning run exists; recover that exact run instead: $newer_failed" >&2; exit 1; }
            baseline=$(jq -r --arg head "$GITHUB_SHA" '[.workflow_runs[] | select(.head_sha == $head) | .id] | max // 0' <<<"$runs")
            [[ "$baseline" =~ ^[0-9]+$ ]] || { echo 'Hyper-V provisioning recovery baseline is invalid.' >&2; exit 1; }

            gh workflow run ga-windows-authority-rc4-provision-selfhosted.yml \
              --repo "$GITHUB_REPOSITORY" --ref main \
              -f release_commit="$RELEASE_COMMIT" \
              -f control_head="$failed_control" \
              -f operation_run_id="$operation_run_id" \
              -f operation_run_attempt="$operation_run_attempt" \
              -f provision_timeout_seconds=7200 \
              -f repair_from_main=true

            child=''
            for _ in {1..10}; do
              sleep 2
              runs=$(gh api --method GET \
                "repos/$GITHUB_REPOSITORY/actions/workflows/ga-windows-authority-rc4-provision-selfhosted.yml/runs" \
                -f branch='main' \
                -f event='workflow_dispatch' \
                -f per_page=100)
              child=$(jq -r --arg head "$GITHUB_SHA" --argjson baseline "$baseline" '
                .workflow_runs[]
                | select(.head_sha == $head and .id > $baseline)
                | .id
              ' <<<"$runs" | head -n 1)
              [[ -n "$child" ]] && break
            done
            [[ -n "$child" ]] || { echo 'Failed Hyper-V provisioning recovery dispatch did not materialize a child run.' >&2; exit 1; }
            gh issue comment "$STATE_ISSUE" --repo "$GITHUB_REPOSITORY" \
              --body "RC4_CHAIN_RECOVERY_DISPATCH stage=provisioning failed_run_id=$FAILED_RUN_ID child_run_id=$child control_head=$failed_control authoritative=false ga_eligible=false"
            echo "rc4_failed_provision_recovery_dispatch=PASS failed_run_id=$FAILED_RUN_ID child_run_id=$child control_head=$failed_control"
            exit 0
          fi

          [[ "$COMPLETED_RUN_ID" =~ ^[1-9][0-9]*$ ]] || { echo 'RC4 stage recovery run ID is invalid.' >&2; exit 1; }
          run=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$COMPLETED_RUN_ID")
          name=$(jq -r '.name' <<<"$run")
          case "$name" in
            production-ga-windows-authority-rc4-media-readiness-selfhosted|production-ga-windows-authority-rc4-provisioning-manifest-selfhosted|production-ga-windows-authority-rc4-operation-package-selfhosted|production-ga-windows-authority-rc4-provision-selfhosted|production-ga-windows-authority-rc4-image-identity-measurement-selfhosted|production-ga-windows-authority-rc4-certification-campaign-selfhosted) ;;
            *) echo "Recovered workflow is not a canonical RC4 post-intake stage: $name" >&2; exit 1 ;;
          esac
          [[ "$(jq -r '.event' <<<"$run")" == 'workflow_dispatch' && "$(jq -r '.status' <<<"$run")" == 'completed' && "$(jq -r '.conclusion' <<<"$run")" == 'success' ]] || { echo 'Recovered RC4 stage run is not completed/success.' >&2; exit 1; }
          [[ "$(jq -r '.actor.login' <<<"$run")" == 'github-actions[bot]' && "$(jq -r '.triggering_actor.login' <<<"$run")" == 'github-actions[bot]' ]] || { echo 'Recovered RC4 stage is not canonical bot/bot provenance.' >&2; exit 1; }
          attempt=$(jq -r '.run_attempt' <<<"$run")
          head=$(jq -r '.head_sha' <<<"$run")
          run_branch=$(jq -r '.head_branch' <<<"$run")
          [[ "$attempt" =~ ^[1-9][0-9]*$ && "$head" =~ ^[0-9a-f]{40}$ ]] || { echo 'Recovered RC4 stage attempt/head is invalid.' >&2; exit 1; }

          repaired_media=false
          repaired_provision=false
          control="$head"
          if [[ "$name" == 'production-ga-windows-authority-rc4-media-readiness-selfhosted' && "$run_branch" == 'main' ]]; then
            workflow_text=$(gh api "repos/$GITHUB_REPOSITORY/contents/.github/workflows/ga-windows-authority-rc4-media-readiness-selfhosted.yml?ref=$head" --jq '.content' | tr -d '\n' | base64 -d)
            inventory_text=$(gh api "repos/$GITHUB_REPOSITORY/contents/scripts/ga/Get-PSMatrixWindowsAuthorityMediaInventory.ps1?ref=$head" --jq '.content' | tr -d '\n' | base64 -d)
            grep -Fq 'repair_from_main:' <<<"$workflow_text" || { echo 'Recovered media workflow lacks repaired-main mode.' >&2; exit 1; }
            grep -Fq 'function Get-DismWimField' <<<"$inventory_text" || { echo 'Recovered media inventory lacks DISM metadata repair.' >&2; exit 1; }

            evidence="$RUNNER_TEMP/rc4-repaired-media-$COMPLETED_RUN_ID-$attempt"
            rm -rf "$evidence"
            mkdir -p "$evidence"
            gh run download "$COMPLETED_RUN_ID" --repo "$GITHUB_REPOSITORY" --name windows-authority-rc4-media-readiness --dir "$evidence"
            status_file=$(find "$evidence" -type f -name 'media-readiness-status.json' -print -quit)
            [[ -n "$status_file" && -f "$status_file" ]] || { echo 'Repaired media-readiness status artifact is missing.' >&2; exit 1; }
            [[ "$(jq -r '.kind' "$status_file")" == 'psmatrix.windows-authority-rc4-media-readiness-workflow-status' ]] || { echo 'Repaired media-readiness status kind mismatch.' >&2; exit 1; }
            [[ "$(jq -r '.release_commit' "$status_file")" == "$RELEASE_COMMIT" ]] || { echo 'Repaired media-readiness release commit mismatch.' >&2; exit 1; }
            [[ "$(jq -r '.workflow_code_recovery' "$status_file")" == 'true' && "$(jq -r '.workflow_code_head' "$status_file")" == "$head" ]] || { echo 'Repaired media workflow-code provenance mismatch.' >&2; exit 1; }
            [[ "$(jq -r '.authoritative' "$status_file")" == 'false' && "$(jq -r '.ga_eligible' "$status_file")" == 'false' ]] || { echo 'Repaired media artifact crossed forbidden authority/GA boundary.' >&2; exit 1; }
            control=$(jq -r '.control_head' "$status_file")
            [[ "$control" =~ ^[0-9a-f]{40}$ ]] || { echo 'Repaired media control head is invalid.' >&2; exit 1; }
            repaired_media=true
          elif [[ "$name" == 'production-ga-windows-authority-rc4-provision-selfhosted' && "$run_branch" == 'main' ]]; then
            workflow_text=$(gh api "repos/$GITHUB_REPOSITORY/contents/.github/workflows/ga-windows-authority-rc4-provision-selfhosted.yml?ref=$head" --jq '.content' | tr -d '\n' | base64 -d)
            grep -Fq 'repair_from_main:' <<<"$workflow_text" || { echo 'Recovered Hyper-V provisioning workflow lacks repaired-main mode.' >&2; exit 1; }
            grep -Fq 'hyperv_storage_capacity_preflight=PASS' <<<"$workflow_text" || { echo 'Recovered Hyper-V provisioning workflow lacks storage-capacity preflight.' >&2; exit 1; }

            evidence="$RUNNER_TEMP/rc4-repaired-provision-$COMPLETED_RUN_ID-$attempt"
            rm -rf "$evidence"
            mkdir -p "$evidence"
            gh run download "$COMPLETED_RUN_ID" --repo "$GITHUB_REPOSITORY" --name windows-authority-rc4-hyperv-provisioning-status --dir "$evidence"
            status_file=$(find "$evidence" -type f -name 'hyperv-provisioning-status.json' -print -quit)
            [[ -n "$status_file" && -f "$status_file" ]] || { echo 'Repaired Hyper-V provisioning status artifact is missing.' >&2; exit 1; }
            [[ "$(jq -r '.kind' "$status_file")" == 'psmatrix.windows-authority-hyperv-provisioning-status' && "$(jq -r '.status' "$status_file")" == 'VM_SET_PROVISIONED_OS_MEASUREMENT_PENDING' ]] || { echo 'Repaired Hyper-V provisioning status identity mismatch.' >&2; exit 1; }
            [[ "$(jq -r '.release_commit' "$status_file")" == "$RELEASE_COMMIT" ]] || { echo 'Repaired Hyper-V provisioning release commit mismatch.' >&2; exit 1; }
            [[ "$(jq -r '.workflow_code_recovery' "$status_file")" == 'true' && "$(jq -r '.workflow_code_head' "$status_file")" == "$head" ]] || { echo 'Repaired Hyper-V provisioning workflow-code provenance mismatch.' >&2; exit 1; }
            [[ "$(jq -r '.mutation_started' "$status_file")" == 'true' ]] || { echo 'Successful repaired Hyper-V provisioning did not cross the recorded mutation boundary.' >&2; exit 1; }
            [[ "$(jq -r '.authoritative' "$status_file")" == 'false' && "$(jq -r '.ga_eligible' "$status_file")" == 'false' ]] || { echo 'Repaired Hyper-V provisioning artifact crossed forbidden authority/GA boundary.' >&2; exit 1; }
            control=$(jq -r '.control_head // ""' "$status_file")
            [[ "$control" =~ ^[0-9a-f]{40}$ ]] || { echo 'Repaired Hyper-V provisioning control head is invalid.' >&2; exit 1; }
            repaired_provision=true
          else
            [[ "$run_branch" == "$CONTROL_BRANCH" ]] || { echo 'Recovered RC4 stage branch mismatch.' >&2; exit 1; }
          fi

          branch_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$CONTROL_BRANCH" --jq '.object.sha')
          [[ "$branch_sha" == "$control" ]] || { echo 'Frozen RC4 control moved before stage recovery.' >&2; exit 1; }
          echo "COMPLETED_WORKFLOW=$name" >> "$GITHUB_ENV"
          echo "COMPLETED_RUN_ATTEMPT=$attempt" >> "$GITHUB_ENV"
          echo "COMPLETED_RUN_HEAD=$head" >> "$GITHUB_ENV"
          echo "CONTROL_HEAD=$control" >> "$GITHUB_ENV"
          echo "REPAIRED_MEDIA_MODE=$repaired_media" >> "$GITHUB_ENV"
          echo "REPAIRED_PROVISION_MODE=$repaired_provision" >> "$GITHUB_ENV"
          if [[ "$repaired_media" == 'true' ]]; then
            echo "repaired_rc4_media_stage_recovery=PASS run_id=$COMPLETED_RUN_ID attempt=$attempt workflow_code_head=$head control_head=$control"
          elif [[ "$repaired_provision" == 'true' ]]; then
            echo "repaired_rc4_provision_stage_recovery=PASS run_id=$COMPLETED_RUN_ID attempt=$attempt workflow_code_head=$head control_head=$control reason=repaired_provision_run"
          else
            echo "rc4_stage_workflow_run_recovery=PASS workflow=$name run_id=$COMPLETED_RUN_ID attempt=$attempt head=$head"
          fi

      - name: Validate automated canonical chain event identity
        if: env.FAILED_PROVISIONING_RUN_ID == '' && env.FAILED_HYPERV_PROVISION_RUN_ID == ''
        shell: bash
        run: |
          set -euo pipefail
          [[ "$COMPLETED_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$COMPLETED_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          [[ "$COMPLETED_RUN_HEAD" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CONTROL_HEAD" =~ ^[0-9a-f]{40}$ ]]
          branch_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$CONTROL_BRANCH" --jq '.object.sha')
          [[ "$branch_sha" == "$CONTROL_HEAD" ]] || { echo "Frozen RC4 control branch moved: $branch_sha != $CONTROL_HEAD" >&2; exit 1; }
          case "$COMPLETED_WORKFLOW" in
            production-ga-windows-authority-rc4-media-readiness-selfhosted) expected_path='.github/workflows/ga-windows-authority-rc4-media-readiness-selfhosted.yml' ;;
            production-ga-windows-authority-rc4-provisioning-manifest-selfhosted) expected_path='.github/workflows/ga-windows-authority-rc4-provisioning-manifest-selfhosted.yml' ;;
            production-ga-windows-authority-rc4-operation-package-selfhosted) expected_path='.github/workflows/ga-windows-authority-rc4-operation-package-selfhosted.yml' ;;
            production-ga-windows-authority-rc4-provision-selfhosted) expected_path='.github/workflows/ga-windows-authority-rc4-provision-selfhosted.yml' ;;
            production-ga-windows-authority-rc4-image-identity-measurement-selfhosted) expected_path='.github/workflows/ga-windows-authority-rc4-image-identity-measurement-selfhosted.yml' ;;
            production-ga-windows-authority-rc4-certification-campaign-selfhosted) expected_path='.github/workflows/ga-windows-authority-rc4-certification-campaign-selfhosted.yml' ;;
            *) echo "Unexpected RC4 canonical stage: $COMPLETED_WORKFLOW" >&2; exit 1 ;;
          esac
          run=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$COMPLETED_RUN_ID")
          [[ "$(jq -r '.name' <<<"$run")" == "$COMPLETED_WORKFLOW" ]] || { echo 'RC4 canonical stage workflow name mismatch.' >&2; exit 1; }
          [[ "$(jq -r '.path' <<<"$run")" == "$expected_path" ]] || { echo "RC4 canonical stage workflow path mismatch: $(jq -r '.path' <<<"$run") != $expected_path" >&2; exit 1; }
          [[ "$(jq -r '.event' <<<"$run")" == 'workflow_dispatch' ]] || { echo 'RC4 canonical stage event mismatch.' >&2; exit 1; }
          [[ "$(jq -r '.status' <<<"$run")" == 'completed' && "$(jq -r '.conclusion' <<<"$run")" == 'success' ]] || { echo 'RC4 canonical stage is not completed/success.' >&2; exit 1; }
          [[ "$(jq -r '.run_attempt' <<<"$run")" == "$COMPLETED_RUN_ATTEMPT" ]] || { echo 'RC4 canonical stage attempt mismatch.' >&2; exit 1; }
          if [[ "${REPAIRED_MEDIA_MODE:-false}" == 'true' ]]; then
            [[ "$COMPLETED_WORKFLOW" == 'production-ga-windows-authority-rc4-media-readiness-selfhosted' ]] || { echo 'Repaired-media mode is only valid for media readiness.' >&2; exit 1; }
            [[ "$(jq -r '.head_branch' <<<"$run")" == 'main' && "$(jq -r '.head_sha' <<<"$run")" == "$COMPLETED_RUN_HEAD" ]] || { echo 'Repaired RC4 media workflow-code provenance mismatch.' >&2; exit 1; }
          elif [[ "${REPAIRED_PROVISION_MODE:-false}" == 'true' ]]; then
            [[ "$COMPLETED_WORKFLOW" == 'production-ga-windows-authority-rc4-provision-selfhosted' ]] || { echo 'Repaired-provision mode is only valid for Hyper-V provisioning.' >&2; exit 1; }
            [[ "$(jq -r '.head_branch' <<<"$run")" == 'main' && "$(jq -r '.head_sha' <<<"$run")" == "$COMPLETED_RUN_HEAD" ]] || { echo 'Repaired RC4 Hyper-V provisioning workflow-code provenance mismatch.' >&2; exit 1; }
          else
            [[ "$(jq -r '.head_branch' <<<"$run")" == "$CONTROL_BRANCH" && "$(jq -r '.head_sha' <<<"$run")" == "$CONTROL_HEAD" ]] || { echo 'RC4 canonical stage control provenance mismatch.' >&2; exit 1; }
          fi
          [[ "$(jq -r '.actor.login' <<<"$run")" == 'github-actions[bot]' && "$(jq -r '.triggering_actor.login' <<<"$run")" == 'github-actions[bot]' ]] || { echo 'RC4 canonical stage was not dispatched by the canonical automation chain.' >&2; exit 1; }
          echo "rc4_chain_event=PASS workflow=$COMPLETED_WORKFLOW run=$COMPLETED_RUN_ID attempt=$COMPLETED_RUN_ATTEMPT automated_dispatch=true path=$expected_path"

      - name: Advance exact canonical RC4 stage once
        if: env.FAILED_PROVISIONING_RUN_ID == '' && env.FAILED_HYPERV_PROVISION_RUN_ID == ''
        shell: bash
        run: |
          set -euo pipefail

          comments() {
            gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$STATE_ISSUE/comments" \
              --jq '.[] | select(.user.login == "github-actions[bot]") | .body'
          }

          stage_exists() {
            local stage="$1"
            comments | grep -Eq "^RC4_CHAIN_STATE stage=${stage} run_id=[1-9][0-9]* attempt=[1-9][0-9]* control_head=${CONTROL_HEAD}$"
          }

          record_state_once() {
            local stage="$1"
            if ! stage_exists "$stage"; then
              gh issue comment "$STATE_ISSUE" --repo "$GITHUB_REPOSITORY" \
                --body "RC4_CHAIN_STATE stage=$stage run_id=$COMPLETED_RUN_ID attempt=$COMPLETED_RUN_ATTEMPT control_head=$CONTROL_HEAD"
            fi
          }

          get_state() {
            local stage="$1"
            comments \
              | grep -E "^RC4_CHAIN_STATE stage=${stage} run_id=[1-9][0-9]* attempt=[1-9][0-9]* control_head=${CONTROL_HEAD}$" \
              | tail -n 1
          }

          parse_id() {
            sed -E 's/.* run_id=([1-9][0-9]*).*/\1/'
          }

          parse_attempt() {
            sed -E 's/.* attempt=([1-9][0-9]*).*/\1/'
          }

          downstream_run() {
            local workflow="$1"
            gh api --method GET \
              "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs" \
              -f branch="$CONTROL_BRANCH" \
              -f event='workflow_dispatch' \
              -f per_page=100 \
              --jq ".workflow_runs[] | select(.head_sha == \"$CONTROL_HEAD\") | .id" \
              | head -n 1
          }

          suppress_or_repair() {
            local stage="$1"
            local workflow="$2"
            if stage_exists "$stage"; then
              echo "rc4_chain_duplicate_suppressed=true stage=$stage reason=ledger"
              return 0
            fi
            local existing
            existing=$(downstream_run "$workflow")
            if [[ -n "$existing" ]]; then
              record_state_once "$stage"
              echo "rc4_chain_duplicate_suppressed=true stage=$stage reason=downstream_run existing_run_id=$existing"
              return 0
            fi
            return 1
          }

          case "$COMPLETED_WORKFLOW" in
            production-ga-windows-authority-rc4-media-readiness-selfhosted)
              if stage_exists media_readiness; then
                echo 'rc4_chain_duplicate_suppressed=true stage=media_readiness reason=successful_ledger'
                exit 0
              fi
              if stage_exists media_readiness_blocked; then
                echo 'rc4_chain_previous_blocked_state_supersedable=true'
              fi

              evidence="$RUNNER_TEMP/rc4-media-readiness-$COMPLETED_RUN_ID-$COMPLETED_RUN_ATTEMPT"
              rm -rf "$evidence"
              mkdir -p "$evidence"
              gh run download "$COMPLETED_RUN_ID" \
                --repo "$GITHUB_REPOSITORY" \
                --name windows-authority-rc4-media-readiness \
                --dir "$evidence"
              status_file=$(find "$evidence" -type f -name 'media-readiness-status.json' -print -quit)
              [[ -n "$status_file" && -f "$status_file" ]] || { echo 'Canonical RC4 media-readiness status artifact is missing.' >&2; exit 1; }

              status=$(jq -r '.status // ""' "$status_file")
              ready=$(jq -r '.ready_for_provisioning_manifest_materialization // false' "$status_file")
              release_commit=$(jq -r '.release_commit // ""' "$status_file")
              control_head=$(jq -r '.control_head // ""' "$status_file")
              authoritative=$(jq -r 'if has("authoritative") then .authoritative else true end' "$status_file")
              ga_eligible=$(jq -r 'if has("ga_eligible") then .ga_eligible else true end' "$status_file")

              [[ "$release_commit" == "$RELEASE_COMMIT" ]] || { echo 'RC4 media-readiness release_commit mismatch.' >&2; exit 1; }
              [[ "$control_head" == "$CONTROL_HEAD" ]] || { echo 'RC4 media-readiness control_head mismatch.' >&2; exit 1; }
              [[ "$authoritative" == 'false' && "$ga_eligible" == 'false' ]] || { echo 'RC4 media-readiness artifact crossed forbidden authority/GA boundary.' >&2; exit 1; }

              if [[ "$status" != 'READY_FOR_PROVISIONING_MANIFEST_MATERIALIZATION' || "$ready" != 'true' ]]; then
                record_state_once media_readiness_blocked
                gh issue comment "$STATE_ISSUE" --repo "$GITHUB_REPOSITORY" \
                  --body "RC4_CHAIN_BLOCKED stage=media_readiness status=$status run_id=$COMPLETED_RUN_ID attempt=$COMPLETED_RUN_ATTEMPT control_head=$CONTROL_HEAD next=operator_or_external_media_action"
                echo "rc4_media_readiness_boundary_preserved=true status=$status"
                echo 'rc4_chain_advanced=false'
                echo 'ga_eligible=false'
                exit 0
              fi

              if suppress_or_repair media_readiness ga-windows-authority-rc4-provisioning-manifest-selfhosted.yml; then exit 0; fi
              gh workflow run ga-windows-authority-rc4-provisioning-manifest-selfhosted.yml \
                --repo "$GITHUB_REPOSITORY" --ref "$CONTROL_BRANCH" \
                -f release_commit="$RELEASE_COMMIT" \
                -f control_head="$CONTROL_HEAD"
              record_state_once media_readiness
              echo 'next_stage=rc4_provisioning_manifest'
              ;;

            production-ga-windows-authority-rc4-provisioning-manifest-selfhosted)
              if suppress_or_repair provisioning_manifest ga-windows-authority-rc4-operation-package-selfhosted.yml; then exit 0; fi
              gh workflow run ga-windows-authority-rc4-operation-package-selfhosted.yml \
                --repo "$GITHUB_REPOSITORY" --ref "$CONTROL_BRANCH" \
                -f release_commit="$RELEASE_COMMIT" \
                -f control_head="$CONTROL_HEAD"
              record_state_once provisioning_manifest
              echo 'next_stage=rc4_operation_package'
              ;;

            production-ga-windows-authority-rc4-operation-package-selfhosted)
              if suppress_or_repair operation ga-windows-authority-rc4-provision-selfhosted.yml; then exit 0; fi
              gh workflow run ga-windows-authority-rc4-provision-selfhosted.yml \
                --repo "$GITHUB_REPOSITORY" --ref "$CONTROL_BRANCH" \
                -f release_commit="$RELEASE_COMMIT" \
                -f control_head="$CONTROL_HEAD" \
                -f operation_run_id="$COMPLETED_RUN_ID" \
                -f operation_run_attempt="$COMPLETED_RUN_ATTEMPT" \
                -f provision_timeout_seconds=7200
              record_state_once operation
              echo 'next_stage=rc4_hyperv_provision'
              ;;

            production-ga-windows-authority-rc4-provision-selfhosted)
              if suppress_or_repair provisioning ga-windows-authority-rc4-image-identity-measurement-selfhosted.yml; then exit 0; fi
              gh workflow run ga-windows-authority-rc4-image-identity-measurement-selfhosted.yml \
                --repo "$GITHUB_REPOSITORY" --ref "$CONTROL_BRANCH" \
                -f release_commit="$RELEASE_COMMIT" \
                -f control_head="$CONTROL_HEAD" \
                -f provisioning_run_id="$COMPLETED_RUN_ID" \
                -f provisioning_run_attempt="$COMPLETED_RUN_ATTEMPT" \
                -f measurement_timeout_seconds=1800
              record_state_once provisioning
              echo 'next_stage=rc4_image_identity_measurement'
              ;;

            production-ga-windows-authority-rc4-image-identity-measurement-selfhosted)
              if suppress_or_repair measurement ga-windows-authority-rc4-certification-campaign-selfhosted.yml; then exit 0; fi
              gh workflow run ga-windows-authority-rc4-certification-campaign-selfhosted.yml \
                --repo "$GITHUB_REPOSITORY" --ref "$CONTROL_BRANCH" \
                -f release_commit="$RELEASE_COMMIT" \
                -f control_head="$CONTROL_HEAD" \
                -f measurement_run_id="$COMPLETED_RUN_ID" \
                -f measurement_run_attempt="$COMPLETED_RUN_ATTEMPT" \
                -f iterations=10 \
                -f campaign_timeout_seconds=1800
              record_state_once measurement
              echo 'next_stage=rc4_certification_campaign'
              ;;

            production-ga-windows-authority-rc4-certification-campaign-selfhosted)
              if suppress_or_repair campaign ga-windows-authority-rc4-candidate-closure-hardened-selfhosted.yml; then exit 0; fi
              operation=$(get_state operation)
              provisioning=$(get_state provisioning)
              measurement=$(get_state measurement)
              [[ -n "$operation" && -n "$provisioning" && -n "$measurement" ]] || { echo 'RC4 chain provenance ledger is incomplete.' >&2; exit 1; }
              operation_id=$(printf '%s\n' "$operation" | parse_id)
              operation_attempt=$(printf '%s\n' "$operation" | parse_attempt)
              provisioning_id=$(printf '%s\n' "$provisioning" | parse_id)
              provisioning_attempt=$(printf '%s\n' "$provisioning" | parse_attempt)
              measurement_id=$(printf '%s\n' "$measurement" | parse_id)
              measurement_attempt=$(printf '%s\n' "$measurement" | parse_attempt)
              for value in "$operation_id" "$operation_attempt" "$provisioning_id" "$provisioning_attempt" "$measurement_id" "$measurement_attempt"; do
                [[ "$value" =~ ^[1-9][0-9]*$ ]] || { echo 'Recovered RC4 provenance value is invalid.' >&2; exit 1; }
              done
              gh workflow run ga-windows-authority-rc4-candidate-closure-hardened-selfhosted.yml \
                --repo "$GITHUB_REPOSITORY" --ref "$CONTROL_BRANCH" \
                -f release_commit="$RELEASE_COMMIT" \
                -f control_head="$CONTROL_HEAD" \
                -f operation_run_id="$operation_id" \
                -f operation_run_attempt="$operation_attempt" \
                -f provisioning_run_id="$provisioning_id" \
                -f provisioning_run_attempt="$provisioning_attempt" \
                -f measurement_run_id="$measurement_id" \
                -f measurement_run_attempt="$measurement_attempt" \
                -f campaign_run_id="$COMPLETED_RUN_ID" \
                -f campaign_run_attempt="$COMPLETED_RUN_ATTEMPT"
              record_state_once campaign
              echo 'next_stage=rc4_hardened_candidate_closure'
              ;;

            *)
              echo "Unexpected successful workflow in RC4 chain: $COMPLETED_WORKFLOW" >&2
              exit 1
              ;;
          esac

          echo 'rc4_chain_advanced=true'
          echo 'ga_eligible=false'
