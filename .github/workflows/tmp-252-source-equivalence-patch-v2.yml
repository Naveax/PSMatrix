name: tmp-252-source-equivalence-patch-v2

on:
  push:
    branches: ["codex/250-hermetic-ci-frozen-source-equivalence"]
    paths: [".github/workflows/tmp-252-source-equivalence-patch-v2.yml"]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TARGET_BRANCH: codex/250-hermetic-ci-frozen-source-equivalence
    steps:
      - name: Native checkout all branch objects
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init repo && cd repo
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          basic="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $basic" fetch --no-tags --prune origin "+refs/heads/*:refs/remotes/origin/*"
          git checkout -B "$TARGET_BRANCH" "origin/$TARGET_BRANCH"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD:.github/workflows/ci.yml)" = "$(git rev-parse origin/main:.github/workflows/ci.yml)"

      - name: Patch controls
        working-directory: repo
        run: |
          set -euo pipefail
          git show origin/codex/249-native-selfhosted-checkout:.github/workflows/ci.yml > .github/workflows/ci.yml
          python - <<'PY'
          from pathlib import Path

          def rx(path, old, new, count=1):
              p=Path(path); text=p.read_text(encoding='utf-8'); n=text.count(old)
              if n != count: raise SystemExit(f'{path}: expected {count} matches, found {n}: {old[:80]!r}')
              p.write_text(text.replace(old,new),encoding='utf-8')

          rx('.github/workflows/ci.yml',
             "                  & git fetch --no-tags --prune --depth=1 origin $eventRef\n                  if ($LASTEXITCODE -ne 0) {\n                      throw \"Exact event-ref fetch failed: $LASTEXITCODE\"\n                  }\n",
             "                  & git fetch --no-tags --prune origin '+refs/heads/*:refs/remotes/origin/*'\n                  if ($LASTEXITCODE -ne 0) {\n                      throw \"Frozen branch-object fetch failed: $LASTEXITCODE\"\n                  }\n                  & git fetch --no-tags origin $eventRef\n                  if ($LASTEXITCODE -ne 0) {\n                      throw \"Exact event-ref fetch failed: $LASTEXITCODE\"\n                  }\n",2)
          rx('.github/workflows/ci.yml',
             "          Write-Host 'ci_checkout_policy=native-git-exact-event-ref-no-codeload-action'\n",
             "          Write-Host 'ci_checkout_policy=native-git-exact-event-ref-all-heads-no-codeload-action'\n")

          rx('scripts/ga/rebind_windows_authority_final_release.py',
             '    windows = value.get("windows_authority") if isinstance(value.get("windows_authority"), dict) else {}\n',
             '    equivalence = value.get("source_equivalence") if isinstance(value.get("source_equivalence"), dict) else {}\n    if equivalence.get("comparison_mode") != "independent-frozen-anchors":\n        raise RuntimeError("Final rebind source-equivalence mode mismatch")\n    if equivalence.get("frozen_release_anchors_must_exist") is not True:\n        raise RuntimeError("Final rebind must require both frozen release anchors")\n    if equivalence.get("rc4_must_be_ancestor_of_final") is not False:\n        raise RuntimeError("Final rebind must not claim ancestry between independent frozen release anchors")\n    if equivalence.get("normalized_init_must_match") is not True or equivalence.get("normalized_pyproject_must_match") is not True:\n        raise RuntimeError("Final rebind normalized source-equivalence requirements are incomplete")\n    windows = value.get("windows_authority") if isinstance(value.get("windows_authority"), dict) else {}\n')
          rx('scripts/ga/rebind_windows_authority_final_release.py',
             '    ancestor = subprocess.run(\n        ["git", "-C", str(final_source), "merge-base", "--is-ancestor", rc4_commit, final_commit],\n        stdout=subprocess.PIPE,\n        stderr=subprocess.PIPE,\n        text=True,\n        check=False,\n    )\n    if ancestor.returncode != 0:\n        raise RuntimeError("Frozen RC4 release commit is not an ancestor of the final release commit")\n\n',
             '    equivalence = contract["source_equivalence"]\n    if equivalence.get("comparison_mode") != "independent-frozen-anchors":\n        raise RuntimeError("Frozen release source-equivalence mode is not independent-frozen-anchors")\n    if equivalence.get("frozen_release_anchors_must_exist") is not True or equivalence.get("rc4_must_be_ancestor_of_final") is not False:\n        raise RuntimeError("Frozen release anchor topology contract mismatch")\n    for label, commit in (("RC4", rc4_commit), ("final", final_commit)):\n        try:\n            _git(final_source, "cat-file", "-e", f"{commit}^{{commit}}")\n        except RuntimeError as exc:\n            raise RuntimeError(f"Frozen {label} release commit is unavailable in the source object store: {commit}") from exc\n\n')
          rx('scripts/ga/rebind_windows_authority_final_release.py',
             '        "rc4_is_ancestor_of_final": True,\n        "runtime_changed_paths": runtime_changed,\n',
             '        "comparison_mode": "independent-frozen-anchors",\n        "frozen_release_anchors_available": True,\n        "rc4_is_ancestor_of_final": False,\n        "runtime_changed_paths": runtime_changed,\n')

          rx('tests/test_windows_authority_final_windows_evidence_rebind.py',
             '        self.assertTrue(equivalence["rc4_must_be_ancestor_of_final"])\n        self.assertEqual(equivalence["runtime_changed_paths"], ["src/psmatrix/__init__.py"])\n        self.assertEqual(equivalence["authoritative_fixture_changed_paths"], [])\n        self.assertTrue(equivalence["normalized_init_must_match"])\n',
             '        self.assertEqual(equivalence["comparison_mode"], "independent-frozen-anchors")\n        self.assertTrue(equivalence["frozen_release_anchors_must_exist"])\n        self.assertFalse(equivalence["rc4_must_be_ancestor_of_final"])\n        self.assertEqual(equivalence["runtime_changed_paths"], ["src/psmatrix/__init__.py"])\n        self.assertEqual(equivalence["authoritative_fixture_changed_paths"], [])\n        self.assertTrue(equivalence["normalized_init_must_match"])\n        self.assertTrue(equivalence["normalized_pyproject_must_match"])\n')
          rx('tests/test_windows_authority_final_windows_evidence_rebind.py',
             '        self.assertTrue(result["rc4_is_ancestor_of_final"])\n        self.assertEqual(result["runtime_changed_paths"], ["src/psmatrix/__init__.py"])\n',
             '        self.assertEqual(result["comparison_mode"], "independent-frozen-anchors")\n        self.assertTrue(result["frozen_release_anchors_available"])\n        self.assertFalse(result["rc4_is_ancestor_of_final"])\n        self.assertEqual(result["runtime_changed_paths"], ["src/psmatrix/__init__.py"])\n')

          rx('.github/workflows/ga-windows-authority-final-windows-evidence-rebind-source-preflight.yml',
             "          git merge-base --is-ancestor $env:RC4_RELEASE_COMMIT $env:FINAL_RELEASE_COMMIT\n          if ($LASTEXITCODE -ne 0) { throw 'RC4 release source is not an ancestor of final source.' }\n\n          $contract = Get-Content 'ga-packs\\03-authoritative-windows\\final-windows-evidence-rebind-control-contract.json' -Raw | ConvertFrom-Json\n",
             "          $contract = Get-Content 'ga-packs\\03-authoritative-windows\\final-windows-evidence-rebind-control-contract.json' -Raw | ConvertFrom-Json\n          if ([string]$contract.source_equivalence.comparison_mode -ne 'independent-frozen-anchors' -or [bool]$contract.source_equivalence.frozen_release_anchors_must_exist -ne $true -or [bool]$contract.source_equivalence.rc4_must_be_ancestor_of_final -ne $false) { throw 'Final Windows rebind frozen-source topology contract mismatch.' }\n")
          rx('.github/workflows/ga-windows-authority-final-windows-evidence-rebind-source-preflight.yml',
             "          Write-Host 'authoritative_fixture_changes=0'\n",
             "          Write-Host 'authoritative_fixture_changes=0'\n          Write-Host 'rc4_final_source_equivalence=PASS comparison_mode=independent-frozen-anchors'\n")

          rx('.github/workflows/ga-windows-authority-final-windows-evidence-rebind.yml',
             '      - name: Verify active final lock, exact source lineage, and RC4 control ancestry\n',
             '      - name: Verify active release locks and frozen source equivalence\n')
          rx('.github/workflows/ga-windows-authority-final-windows-evidence-rebind.yml',
             "          git -C $finalSource merge-base --is-ancestor $env:RC4_RELEASE_COMMIT $env:FINAL_RELEASE_COMMIT\n          if ($LASTEXITCODE -ne 0) { throw 'RC4 release source is not an ancestor of final release source.' }\n          Write-Host 'active_release_locks=PASS'\n          Write-Host 'rc4_final_source_lineage=PASS'\n",
             "          $rebindContract = Get-Content (Join-Path $control 'ga-packs\\03-authoritative-windows\\final-windows-evidence-rebind-control-contract.json') -Raw | ConvertFrom-Json\n          if ([string]$rebindContract.source_equivalence.comparison_mode -ne 'independent-frozen-anchors' -or [bool]$rebindContract.source_equivalence.frozen_release_anchors_must_exist -ne $true -or [bool]$rebindContract.source_equivalence.rc4_must_be_ancestor_of_final -ne $false) { throw 'Final Windows rebind frozen-source topology contract mismatch.' }\n          foreach ($sha in @($env:RC4_RELEASE_COMMIT,$env:FINAL_RELEASE_COMMIT)) { git -C $finalSource cat-file -e \"$sha^{commit}\"; if ($LASTEXITCODE -ne 0) { throw \"Frozen release source commit is unavailable: $sha\" } }\n          $runtimeChanges = @((git -C $finalSource diff --name-only \"$env:RC4_RELEASE_COMMIT..$env:FINAL_RELEASE_COMMIT\" -- src/psmatrix) | ForEach-Object { $_.Trim().Replace('\\','/') } | Where-Object { $_ })\n          if ($runtimeChanges.Count -ne 1 -or $runtimeChanges[0] -ne 'src/psmatrix/__init__.py') { throw \"RC4/final runtime-source equivalence changed: $($runtimeChanges -join ',')\" }\n          $fixtureChanges = @((git -C $finalSource diff --name-only \"$env:RC4_RELEASE_COMMIT..$env:FINAL_RELEASE_COMMIT\" -- fixtures/windows-authoritative) | Where-Object { $_ })\n          if ($fixtureChanges.Count -ne 0) { throw \"Authoritative Windows fixtures changed between RC4 and final: $($fixtureChanges -join ',')\" }\n          Write-Host 'active_release_locks=PASS'\n          Write-Host 'rc4_final_source_equivalence=PASS comparison_mode=independent-frozen-anchors'\n")
          PY

      - name: Validate and push
        working-directory: repo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python -m py_compile scripts/ga/rebind_windows_authority_final_release.py tests/test_windows_authority_final_windows_evidence_rebind.py
          PYTHONPATH=src python -m unittest -v tests.test_windows_authority_final_windows_evidence_rebind
          git diff --check
          ! git grep -n "RC4 release source is not an ancestor of final" -- .github scripts tests
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/ci.yml .github/workflows/ga-windows-authority-final-windows-evidence-rebind-source-preflight.yml .github/workflows/ga-windows-authority-final-windows-evidence-rebind.yml scripts/ga/rebind_windows_authority_final_release.py tests/test_windows_authority_final_windows_evidence_rebind.py
          git commit -m "ci: harden frozen source equivalence checkout"
          basic="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $basic" push origin "HEAD:refs/heads/$TARGET_BRANCH"
