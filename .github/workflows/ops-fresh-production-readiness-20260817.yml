name: ops-fresh-production-readiness-20260817

on:
  push:
    branches:
      - ops/fresh-production-readiness-20260817
    paths:
      - .github/workflows/ops-fresh-production-readiness-20260817.yml

concurrency:
  group: ops-fresh-production-readiness-20260817
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TARGET_REF: final/2.0.0-production-control-plane-publication-anchor
      TARGET_SHA: 3ffc6b6d7cd58d64224f780aa819b50f50f72491
      TARGET_WORKFLOW: ga-final-production-readiness.yml
    steps:
      - name: Dispatch fresh readiness run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import datetime as dt
          import json
          import os
          import time
          import urllib.parse
          import urllib.request

          api = os.environ['GITHUB_API_URL']
          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          target_ref = os.environ['TARGET_REF']
          target_sha = os.environ['TARGET_SHA'].lower()
          workflow = os.environ['TARGET_WORKFLOW']
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {token}',
              'X-GitHub-Api-Version': '2026-03-10',
              'Content-Type': 'application/json',
              'User-Agent': 'psmatrix-fresh-readiness-operator',
          }

          ref_url = f'{api}/repos/{repo}/git/ref/heads/{urllib.parse.quote(target_ref, safe="/")}'
          req = urllib.request.Request(ref_url, headers=headers)
          with urllib.request.urlopen(req, timeout=30) as response:
              ref = json.load(response)
          actual = ((ref.get('object') or {}).get('sha') or '').lower()
          if actual != target_sha:
              raise SystemExit(f'frozen target mismatch: {actual}')

          started = dt.datetime.now(dt.timezone.utc)
          dispatch_url = f'{api}/repos/{repo}/actions/workflows/{workflow}/dispatches'
          payload = json.dumps({'ref': target_ref}).encode()
          req = urllib.request.Request(dispatch_url, data=payload, method='POST', headers=headers)
          run_id = None
          run_url = None
          with urllib.request.urlopen(req, timeout=30) as response:
              status = response.status
              body = response.read()
          if status == 200 and body:
              value = json.loads(body.decode())
              run_id = value.get('workflow_run_id')
              run_url = value.get('html_url')
          elif status != 204:
              raise SystemExit(f'unexpected dispatch status={status}')

          if run_id is None:
              runs_url = f'{api}/repos/{repo}/actions/workflows/{workflow}/runs?event=workflow_dispatch&per_page=20'
              for _ in range(30):
                  req = urllib.request.Request(runs_url, headers=headers)
                  with urllib.request.urlopen(req, timeout=30) as response:
                      listing = json.load(response)
                  candidates = []
                  for item in listing.get('workflow_runs', []):
                      if item.get('event') != 'workflow_dispatch':
                          continue
                      if (item.get('head_sha') or '').lower() != target_sha:
                          continue
                      if item.get('head_branch') != target_ref:
                          continue
                      created = dt.datetime.fromisoformat(item['created_at'].replace('Z', '+00:00'))
                      if created < started - dt.timedelta(seconds=5):
                          continue
                      candidates.append(item)
                  if candidates:
                      candidates.sort(key=lambda item: int(item['id']), reverse=True)
                      run_id = int(candidates[0]['id'])
                      run_url = candidates[0]['html_url']
                      break
                  time.sleep(2)

          if run_id is None:
              raise SystemExit('fresh readiness run not observable')
          print(f'fresh_production_readiness_run_id={run_id}')
          print(f'fresh_production_readiness_run_url={run_url}')
          print('secret_mutation=false')
          print('ga_eligible=false')
          PY
