name: ops-public-auth-live-probe-to-gates

on:
  workflow_run:
    workflows: [production-ga-final-public-auth-live-probe]
    types: [completed]

concurrency:
  group: ops-public-auth-live-probe-to-gates
  cancel-in-progress: false

permissions:
  contents: read
  actions: write
  issues: write

jobs:
  dispatch-proofs:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'workflow_dispatch' &&
      github.event.workflow_run.head_branch == 'release/2.0.0-final-active-lock' &&
      github.event.workflow_run.actor.login == 'github-actions[bot]' &&
      github.event.workflow_run.triggering_actor.login == 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      LIVE_PROBE_RUN_ID: ${{ github.event.workflow_run.id }}
      LIVE_PROBE_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
      CONTROL_HEAD: ${{ github.event.workflow_run.head_sha }}
      FINAL_ACTIVE_BRANCH: release/2.0.0-final-active-lock
      STATE_ISSUE: '262'
    steps:
      - name: Validate exact automated shared live-probe artifact identity
        shell: bash
        run: |
          set -euo pipefail
          [[ "$LIVE_PROBE_RUN_ID" =~ ^[1-9][0-9]*$ && "$LIVE_PROBE_ATTEMPT" =~ ^[1-9][0-9]*$ && "$CONTROL_HEAD" =~ ^[0-9a-f]{40}$ ]]
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$FINAL_ACTIVE_BRANCH" --jq '.object.sha')
          [[ "$current" == "$CONTROL_HEAD" ]] || { echo 'Final active control moved after public-auth live probe.' >&2; exit 1; }
          run=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$LIVE_PROBE_RUN_ID")
          [[ "$(jq -r '.name' <<<"$run")" == 'production-ga-final-public-auth-live-probe' ]] || { echo 'Public-auth live probe workflow name mismatch.' >&2; exit 1; }
          [[ "$(jq -r '.path' <<<"$run")" == '.github/workflows/ga-final-public-auth-live-probe.yml' ]] || { echo 'Public-auth live probe workflow path mismatch.' >&2; exit 1; }
          [[ "$(jq -r '.event' <<<"$run")" == 'workflow_dispatch' ]] || { echo 'Public-auth live probe event mismatch.' >&2; exit 1; }
          [[ "$(jq -r '.status' <<<"$run")" == 'completed' && "$(jq -r '.conclusion' <<<"$run")" == 'success' ]] || { echo 'Public-auth live probe is not completed/success.' >&2; exit 1; }
          [[ "$(jq -r '.head_branch' <<<"$run")" == "$FINAL_ACTIVE_BRANCH" && "$(jq -r '.head_sha' <<<"$run")" == "$CONTROL_HEAD" ]] || { echo 'Public-auth live probe control provenance mismatch.' >&2; exit 1; }
          [[ "$(jq -r '.run_attempt' <<<"$run")" == "$LIVE_PROBE_ATTEMPT" ]] || { echo 'Public-auth live probe attempt mismatch.' >&2; exit 1; }
          [[ "$(jq -r '.actor.login' <<<"$run")" == 'github-actions[bot]' && "$(jq -r '.triggering_actor.login' <<<"$run")" == 'github-actions[bot]' ]] || { echo 'Public-auth live probe was not dispatched by the gated external-evidence automation.' >&2; exit 1; }
          artifact_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$LIVE_PROBE_RUN_ID/artifacts?per_page=100" \
            --jq '[.artifacts[] | select(.name == "psmatrix-2.0.0-final-public-auth-live-report" and (.expired|not))] | if length == 1 then .[0].id else error("expected exactly one live public-auth report artifact") end')
          [[ "$artifact_id" =~ ^[1-9][0-9]*$ ]] || { echo 'Public-auth live artifact ID invalid.' >&2; exit 1; }
          echo "public_auth_live_artifact_identity=PASS artifact_id=$artifact_id automated_dispatch=true"

      - name: Download exact shared live-probe artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: psmatrix-2.0.0-final-public-auth-live-report
          path: live-probe
          repository: Naveax/PSMatrix
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Recover and validate protected signing provenance from live report
        shell: bash
        run: |
          set -euo pipefail
          report='live-probe/public-auth-live-report.json'
          [[ -f "$report" && ! -L "$report" ]] || { echo 'Exact public-auth live report file is missing or unsafe.' >&2; exit 1; }
          release_signing_run_id=$(jq -er '
            if .kind == "psmatrix.public-auth-live-report" and .status == "PASS" and
               .secrets_in_report == false and .private_keys_in_report == false and
               (.release_signing_run_id | type == "string") and
               (.release_signing_run_id | test("^[1-9][0-9]*$"))
            then .release_signing_run_id
            else error("public-auth live report provenance/boundary mismatch") end
          ' "$report")
          [[ "$release_signing_run_id" =~ ^[1-9][0-9]*$ ]] || { echo 'Recovered release signing run ID is invalid.' >&2; exit 1; }
          [[ "$release_signing_run_id" != "$LIVE_PROBE_RUN_ID" ]] || { echo 'Live probe and release-signing run IDs must be distinct.' >&2; exit 1; }

          signing=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$release_signing_run_id")
          [[ "$(jq -r '.name' <<<"$signing")" == 'production-ga-windows-authority-final-release-sign-from-lock' ]] || { echo 'Recovered run is not the canonical protected final signing workflow.' >&2; exit 1; }
          [[ "$(jq -r '.path' <<<"$signing")" == '.github/workflows/ga-windows-authority-final-release-sign-from-lock.yml' ]] || { echo 'Recovered protected signing workflow path mismatch.' >&2; exit 1; }
          [[ "$(jq -r '.event' <<<"$signing")" == 'workflow_dispatch' ]] || { echo 'Recovered protected signing run event mismatch.' >&2; exit 1; }
          [[ "$(jq -r '.status' <<<"$signing")" == 'completed' && "$(jq -r '.conclusion' <<<"$signing")" == 'success' ]] || { echo 'Recovered protected signing run is not successful.' >&2; exit 1; }
          [[ "$(jq -r '.head_branch' <<<"$signing")" == "$FINAL_ACTIVE_BRANCH" && "$(jq -r '.head_sha' <<<"$signing")" == "$CONTROL_HEAD" ]] || { echo 'Recovered protected signing run does not share the exact final active control.' >&2; exit 1; }
          [[ "$(jq -r '.actor.login' <<<"$signing")" == 'github-actions[bot]' && "$(jq -r '.triggering_actor.login' <<<"$signing")" == 'github-actions[bot]' ]] || { echo 'Recovered protected signing run was not dispatched by reviewed-lock merge automation.' >&2; exit 1; }

          release_artifact_count=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$release_signing_run_id/artifacts?per_page=100" \
            --jq '[.artifacts[] | select(.name == "psmatrix-2.0.0-protected-release" and (.expired|not))] | length')
          [[ "$release_artifact_count" == '1' ]] || { echo "Expected exactly one live protected release artifact; found $release_artifact_count." >&2; exit 1; }

          echo "RELEASE_SIGNING_RUN_ID=$release_signing_run_id" >> "$GITHUB_ENV"
          marker="RC4_CHAIN_STATE stage=public_auth_live_probe run_id=$LIVE_PROBE_RUN_ID attempt=$LIVE_PROBE_ATTEMPT control_head=$CONTROL_HEAD"
          if ! gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$STATE_ISSUE/comments" --jq '.[] | select(.user.login == "github-actions[bot]") | .body' | grep -Fxq "$marker"; then
            gh issue comment "$STATE_ISSUE" --repo "$GITHUB_REPOSITORY" --body "$marker"
          fi
          echo "public_auth_live_probe=PASS release_signing_run_id=$release_signing_run_id"

      - name: Dispatch signed OAuth and mTLS evaluator gates once
        shell: bash
        run: |
          set -euo pipefail

          existing_count() {
            local workflow="$1"
            gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs?branch=$FINAL_ACTIVE_BRANCH&event=workflow_dispatch&per_page=100" \
              --jq ".workflow_runs | map(select(.head_sha == \"$CONTROL_HEAD\")) | length"
          }

          assert_final_head() {
            local current
            current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$FINAL_ACTIVE_BRANCH" --jq '.object.sha')
            [[ "$current" == "$CONTROL_HEAD" ]] || { echo "Final active control moved before public-auth gate dispatch: $current != $CONTROL_HEAD" >&2; return 1; }
          }

          dispatched=0
          suppressed=0

          if [[ "$(existing_count ga-final-public-oauth.yml)" -eq 0 ]]; then
            assert_final_head
            gh workflow run ga-final-public-oauth.yml \
              --repo "$GITHUB_REPOSITORY" --ref "$FINAL_ACTIVE_BRANCH" \
              -f live_probe_run_id="$LIVE_PROBE_RUN_ID" \
              -f release_signing_run_id="$RELEASE_SIGNING_RUN_ID"
            dispatched=$((dispatched+1))
          else
            echo 'public_oauth_duplicate_suppressed=true'
            suppressed=$((suppressed+1))
          fi

          if [[ "$(existing_count ga-final-public-mtls.yml)" -eq 0 ]]; then
            assert_final_head
            gh workflow run ga-final-public-mtls.yml \
              --repo "$GITHUB_REPOSITORY" --ref "$FINAL_ACTIVE_BRANCH" \
              -f live_probe_run_id="$LIVE_PROBE_RUN_ID" \
              -f release_signing_run_id="$RELEASE_SIGNING_RUN_ID"
            dispatched=$((dispatched+1))
          else
            echo 'public_mtls_duplicate_suppressed=true'
            suppressed=$((suppressed+1))
          fi

          echo "public_oauth_and_mtls_gate_dispatch=PASS dispatched=$dispatched suppressed=$suppressed"
          echo 'ga_eligible=false'
