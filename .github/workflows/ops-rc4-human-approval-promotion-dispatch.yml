name: ops-rc4-human-approval-promotion-dispatch

on:
  issue_comment:
    types: [created]

concurrency:
  group: ops-rc4-human-approval-promotion-dispatch
  cancel-in-progress: false

permissions:
  contents: read
  actions: write
  issues: write

jobs:
  dispatch:
    if: >-
      github.event.issue.number == 260 &&
      github.event.comment.user.login == 'Naveax' &&
      github.event.comment.author_association == 'OWNER' &&
      github.event.comment.body == 'RC4 HUMAN REVIEW APPROVED: 0b4e77d5e5cf142e2cdb47f5cc4b8dd81353ae63'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      CANDIDATE_COMMIT: 0b4e77d5e5cf142e2cdb47f5cc4b8dd81353ae63
      REVIEW_BRANCH: release/2.0.0rc4-authority-rotation
      REVIEW_RUN_ID: '32137455148'
      REVIEW_RUN_ATTEMPT: '1'
      REVIEWED_DRAFT_SHA256: a2a97763f679b18562e19ec99f066374b097a50c44a3bea4d1208328e9b339d9
      REVIEWED_PUBLIC_KEY_SHA256: ece4d7087449cb42cde9183b0b1e2b82db610d4ffffd726e6737d2ba09578a08
      REVIEW_ISSUE: '260'
      PROMOTION_WORKFLOW: ga-windows-authority-rc4-release-lock-promotion.yml
    steps:
      - name: Validate exact human approval event
        shell: bash
        run: |
          set -euo pipefail
          test "${{ github.event.issue.number }}" = '260'
          test "${{ github.event.comment.user.login }}" = 'Naveax'
          test "${{ github.event.comment.author_association }}" = 'OWNER'
          test "${{ github.event.comment.body }}" = "RC4 HUMAN REVIEW APPROVED: $CANDIDATE_COMMIT"
          echo 'rc4_human_approval_event=PASS'

      - name: Check out current promotion controls
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Fail closed if RC4 lock is already active
        shell: bash
        run: |
          set -euo pipefail
          test ! -f ga-packs/03-authoritative-windows/rc4-release-lock.json || {
            echo 'An active RC4 release lock already exists; refusing duplicate promotion dispatch.' >&2
            exit 1
          }
          test -f ".github/workflows/$PROMOTION_WORKFLOW"
          echo 'rc4_pre_dispatch_boundary=PASS'

      - name: Suppress or fail closed on an already-dispatched approval target
        id: dedup
        shell: bash
        run: |
          set -euo pipefail
          marker="RC4_PROMOTION_DISPATCHED candidate=$CANDIDATE_COMMIT review_run=$REVIEW_RUN_ID review_attempt=$REVIEW_RUN_ATTEMPT draft_sha256=$REVIEWED_DRAFT_SHA256 public_key_sha256=$REVIEWED_PUBLIC_KEY_SHA256"
          comments=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$REVIEW_ISSUE/comments" --slurp | jq 'add')

          if jq -r '.[] | select(.user.login == "github-actions[bot]") | .body' <<<"$comments" | grep -Fxq "$marker"; then
            echo 'already_dispatched=true' >> "$GITHUB_OUTPUT"
            echo 'duplicate_rc4_promotion_dispatch_suppressed=true source=ledger'
            exit 0
          fi

          approval="RC4 HUMAN REVIEW APPROVED: $CANDIDATE_COMMIT"
          approval_at=$(jq -r --arg approval "$approval" '[.[] | select(.user.login == "Naveax" and .author_association == "OWNER" and .body == $approval) | .created_at] | sort | .[0] // empty' <<<"$comments")
          [[ "$approval_at" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T ]] || {
            echo 'Canonical human approval timestamp cannot be resolved.' >&2
            exit 1
          }

          existing=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$PROMOTION_WORKFLOW/runs?branch=main&event=workflow_dispatch&per_page=100" \
            --jq ".workflow_runs[] | select(.created_at >= \"$approval_at\") | .id" \
            | head -n 1)

          if [[ -n "$existing" ]]; then
            echo "A post-approval RC4 promotion run already exists without the canonical ledger marker: run_id=$existing" >&2
            echo 'Refusing a second promotion dispatch; inspect and repair provenance instead.' >&2
            exit 1
          fi

          echo 'already_dispatched=false' >> "$GITHUB_OUTPUT"
          echo 'rc4_promotion_dispatch_budget=AVAILABLE'

      - name: Revalidate exact automated review run, artifact, and human-bound digests
        if: steps.dedup.outputs.already_dispatched != 'true'
        shell: bash
        run: |
          set -euo pipefail
          [[ "$REVIEW_RUN_ID" =~ ^[1-9][0-9]*$ && "$REVIEW_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          python - <<'PY'
          import json, os, urllib.request
          repo = os.environ['GITHUB_REPOSITORY']
          run_id = os.environ['REVIEW_RUN_ID']
          attempt = os.environ['REVIEW_RUN_ATTEMPT']
          candidate = os.environ['CANDIDATE_COMMIT']
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'psmatrix-rc4-human-approval-dispatch',
          }
          def fetch(path):
              req = urllib.request.Request(f'https://api.github.com/repos/{repo}/{path}', headers=headers)
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.load(r)
          run = fetch(f'actions/runs/{run_id}')
          if run.get('name') != 'production-ga-windows-authority-rc4-release-lock-review':
              raise SystemExit('review workflow name mismatch')
          if run.get('path') != '.github/workflows/ga-windows-authority-rc4-release-lock-review.yml':
              raise SystemExit(f'review workflow path mismatch: {run.get("path")!r}')
          if run.get('event') != 'workflow_dispatch':
              raise SystemExit('review run event mismatch')
          if run.get('status') != 'completed' or run.get('conclusion') != 'success':
              raise SystemExit('review run is not completed successfully')
          if run.get('head_branch') != os.environ['REVIEW_BRANCH'] or (run.get('head_sha') or '').lower() != candidate:
              raise SystemExit('review run branch/candidate SHA mismatch')
          if str(run.get('run_attempt')) != attempt:
              raise SystemExit(f'review run attempt mismatch: actual={run.get("run_attempt")} bound={attempt}')
          if (run.get('actor') or {}).get('login') != 'github-actions[bot]' or (run.get('triggering_actor') or {}).get('login') != 'github-actions[bot]':
              raise SystemExit('review run was not created by the canonical automation chain')
          artifacts = fetch(f'actions/runs/{run_id}/artifacts?per_page=100').get('artifacts', [])
          matches = [a for a in artifacts if a.get('name') == 'psmatrix-2.0.0rc4-release-lock-review' and not a.get('expired')]
          if len(matches) != 1:
              raise SystemExit(f'expected exactly one live review artifact; found {len(matches)}')
          print(f'rc4_review_provenance=PASS run_id={run_id} attempt={attempt} artifact_id={matches[0].get("id")} automated_dispatch=true')
          PY

          review_dir="$RUNNER_TEMP/rc4-review-binding-revalidate"
          rm -rf "$review_dir"
          mkdir -p "$review_dir"
          gh run download "$REVIEW_RUN_ID" --repo "$GITHUB_REPOSITORY" --name 'psmatrix-2.0.0rc4-release-lock-review' --dir "$review_dir"
          REVIEW_DIR="$review_dir" python - <<'PY'
          import hashlib, os
          from pathlib import Path
          root=Path(os.environ['REVIEW_DIR']).resolve()
          draft=root/'rc4-release-lock.review-draft.json'
          public=root/'release-assets/2.0.0rc4/psmatrix-2.0.0rc4-release-public.pem'
          for p in (draft, public):
              if not p.is_file() or p.is_symlink():
                  raise SystemExit(f'bound RC4 review artifact file missing/unsafe: {p}')
          digest=lambda p: hashlib.sha256(p.read_bytes()).hexdigest()
          actual_draft=digest(draft)
          actual_public=digest(public)
          if actual_draft != os.environ['REVIEWED_DRAFT_SHA256']:
              raise SystemExit(f'bound RC4 review draft digest mismatch: actual={actual_draft}')
          if actual_public != os.environ['REVIEWED_PUBLIC_KEY_SHA256']:
              raise SystemExit(f'bound RC4 public-key digest mismatch: actual={actual_public}')
          print('rc4_human_review_artifact_binding=PASS draft=true public=true')
          PY

      - name: Dispatch canonical RC4 lock promotion
        if: steps.dedup.outputs.already_dispatched != 'true'
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run "$PROMOTION_WORKFLOW" \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f candidate_commit="$CANDIDATE_COMMIT" \
            -f review_run_id="$REVIEW_RUN_ID" \
            -f reviewed_draft_sha256="$REVIEWED_DRAFT_SHA256" \
            -f reviewed_public_key_sha256="$REVIEWED_PUBLIC_KEY_SHA256"
          marker="RC4_PROMOTION_DISPATCHED candidate=$CANDIDATE_COMMIT review_run=$REVIEW_RUN_ID review_attempt=$REVIEW_RUN_ATTEMPT draft_sha256=$REVIEWED_DRAFT_SHA256 public_key_sha256=$REVIEWED_PUBLIC_KEY_SHA256"
          gh issue comment "$REVIEW_ISSUE" --repo "$GITHUB_REPOSITORY" --body "$marker"
          echo 'rc4_lock_promotion_dispatched=true'
          echo 'human_review_bound=true'
          echo 'repository_lock_committed=false'
          echo 'release_artifacts_signed=false'
          echo 'ga_eligible=false'
